name: Hardened artifact upload
description: Retry transient GitHub artifact-service failures without changing artifact semantics.
inputs:
  name:
    required: true
  path:
    required: true
  if-no-files-found:
    required: false
    default: warn
  retention-days:
    required: false
    default: '14'
  compression-level:
    required: false
    default: '6'
runs:
  using: composite
  steps:
    - name: Upload artifact attempt 1
      id: upload1
      continue-on-error: true
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
    - name: Wait before artifact retry
      if: ${{ steps.upload1.outcome == 'failure' }}
      shell: bash
      run: sleep 8
    - name: Upload artifact attempt 2
      id: upload2
      if: ${{ steps.upload1.outcome == 'failure' }}
      continue-on-error: true
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: true
    - name: Wait before final artifact retry
      if: ${{ steps.upload1.outcome == 'failure' && steps.upload2.outcome == 'failure' }}
      shell: bash
      run: sleep 20
    - name: Upload artifact attempt 3
      id: upload3
      if: ${{ steps.upload1.outcome == 'failure' && steps.upload2.outcome == 'failure' }}
      continue-on-error: true
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: true
    - name: Enforce artifact delivery
      if: ${{ steps.upload1.outcome == 'failure' && steps.upload2.outcome == 'failure' && steps.upload3.outcome == 'failure' }}
      shell: bash
      run: |
        echo "::error::Artifact service failed after three attempts. Durable results-repository persistence, if already completed, remains authoritative."
        exit 1
