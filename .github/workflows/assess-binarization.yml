name: HTH normalize binarization assess
run-name: Assess foreground and background separability
on:
  workflow_dispatch:
    inputs:
      runner_target: {description: "Execution runner target", required: true, default: github-hosted, type: choice, options: [github-hosted, self-hosted-linux, self-hosted-windows, hth, rhel8, e7k, e9k, 192t, 96t, 32t]}
      artifact_retention_days: {description: "Days to retain compact evidence", required: true, default: 14, type: number}
jobs:
  assess:
    uses: ./.github/workflows/_core-restoration-evidence.yml
    with: {domain: binarization, stage: assess, runner_target: "${{ inputs.runner_target }}", artifact_retention_days: "${{ fromJSON(format('{0}', inputs.artifact_retention_days)) }}"}
    secrets: inherit
