name: _HTH reusable core (internal)

# Internal reusable workflow. It has no push, pull_request, schedule, or
# workflow_dispatch trigger and therefore cannot be run directly.
on:
  workflow_call:
    inputs:
      mode:
        description: "Execution mode: production, test, calibration, or report"
        required: true
        type: string
      source_repository:
        description: "Source repository owning immutable source Releases"
        required: false
        type: string
        default: ""
      source_release_tag:
        description: "Immutable GitHub Release tag containing DOCX masters"
        required: false
        type: string
        default: "HTH-SOURCE-0001"
      results_repository:
        description: "Results repository"
        required: true
        type: string
      test_file:
        description: "DOCX filename used by test and calibration modes"
        required: false
        type: string
        default: ""
      image_limit:
        description: "Maximum images processed across the selected source; zero processes all images"
        required: false
        type: string
        default: "0"
      output_directory:
        description: "Pipeline output directory"
        required: false
        type: string
        default: ""
      publish_results:
        description: "Commit generated results to the results repository"
        required: false
        type: boolean
        default: false
      upload_full_artifact:
        description: "Upload the complete generated build"
        required: false
        type: boolean
        default: true
      artifact_retention_days:
        description: "Temporary artifact retention period"
        required: false
        type: number
        default: 7
      runner:
        description: "Execution runner"
        required: false
        type: string
        default: "github-hosted"
      specific_runner:
        description: "Specific self-hosted runner; any keeps the selected runner class"
        required: false
        type: string
        default: "any"
      custom_runner_label:
        description: "Custom self-hosted runner label used when specific_runner is custom"
        required: false
        type: string
        default: ""
      report_type:
        description: "Report to regenerate when mode is report"
        required: false
        type: string
        default: "detector-calibration-manifest"
      report_algorithm:
        description: "Detector used by execution-optimizer report, or all for the accumulated summary"
        required: false
        type: string
        default: "all"
      report_golden_set:
        description: "Golden Set used to select compatible detector calibrations"
        required: false
        type: string
        default: "config/golden_set.json"
      geometry_fail_on:
        description: "Geometry validation failure policy"
        required: false
        type: string
        default: "never"
      document_detector:
        description: "Document detector selection policy; preferred resolves the Rank #1 Approved calibration"
        required: false
        type: string
        default: "preferred"
    secrets:
      HTH_RESULTS_TOKEN:
        required: false
      HTH_SOURCE_TOKEN:
        required: false

permissions:
  contents: read

# Apply the branch convention to every git process, including actions/checkout's
# internal git init before any shell step can run.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  run-hth:
    if: ${{ inputs.mode != 'report' }}
    name: ${{ inputs.mode == 'production' && 'Preprocess complete collection' || inputs.mode == 'calibration' && 'Calibrate physical geometry' || 'Test one DOCX master' }}
    runs-on: >-
      ${{    inputs.specific_runner == 'custom' && inputs.custom_runner_label != '' && fromJSON(format('["self-hosted","{0}"]', inputs.custom_runner_label))
          || inputs.runner == 'self-hosted-windows' && fromJSON('["self-hosted","Windows","X64"]')
          || inputs.runner == 'self-hosted-hth'     && fromJSON('["self-hosted","Linux","X64","hth"]')
          || inputs.runner == 'self-hosted-rhel8'   && fromJSON('["self-hosted","Linux","X64","rhel8"]')
          || inputs.runner == 'self-hosted-e7k'     && fromJSON('["self-hosted","Linux","X64","e7k"]')
          || inputs.runner == 'self-hosted-e9k'     && fromJSON('["self-hosted","Linux","X64","e9k"]')
          || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.mode == 'production' && 120 || 30 }}

    env:
      HTH_MODE: ${{ inputs.mode }}
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_RELEASE_TAG: ${{ inputs.source_release_tag }}
      RESULTS_REPOSITORY: ${{ inputs.results_repository }}
      OUTPUT_DIRECTORY: ${{ inputs.output_directory }}
      IMAGE_LIMIT: ${{ inputs.image_limit }}

    steps:
      ############################################################
      # CHECKOUTS
      ############################################################

      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      # Record the start time immediately before the actual HTH processing step.
      - name: Record pipeline start
        id: pipeline_start
        shell: bash
        run: |
          echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Configure Git defaults
        shell: bash
        run: git config --global init.defaultBranch main

      - name: Set up canonical HTH Python runtime
        uses: ./hth-pipeline/.github/actions/setup-hth-python
        with:
          pipeline-path: hth-pipeline
          runner-label: ${{ env.HTH_RUNNER_LABEL }}
          diagnostics: "false"

      - name: Download immutable source release
        id: source_release
        shell: bash
        env:
          HTH_SOURCE_TOKEN: ${{ secrets.HTH_SOURCE_TOKEN || github.token }}
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          rm -rf source-repo
          python -m hth.source_release \
            --repository "$SOURCE_REPOSITORY" \
            --tag "$SOURCE_RELEASE_TAG" \
            --destination source-repo

      - name: Checkout results repository
        if: ${{ inputs.publish_results || inputs.document_detector == 'preferred' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.results_repository }}
          path: results-repo
          ref: main
          token: ${{ secrets.HTH_RESULTS_TOKEN }}
          fetch-depth: 1
          # Preprocess needs publication surfaces plus the same reusable model /
          # intelligence caches used by regression and optimizer.  Keep the
          # working tree shallow and materialize only paths this job reads or
          # updates; tracked paths outside the sparse tree remain untouched.
          sparse-checkout: |
            /README.md
            /BUILD-INFO.yaml
            /indexes/calibration-index.json
            /calibration-index.json
            /indexes/parameter-provenance-index.json
            /parameter-provenance-index.json
            /indexes/runtime-index.json
            /runtime-index.json
            /indexes/parallelism-index.json
            /parallelism-index.json
            /indexes/optimizer-index.json
            /optimizer-index.json
            /indexes/optimizer-predictions.json
            /optimizer-predictions.json
            /indexes/multidetector-index.json
            /multidetector-index.json
            /indexes/orli-evidence-index.json
            /orli-evidence-index.json
            /models/
            /learned-evidence/
            /source-documents/
            /metadata/
            /reports/
            /analysis/
            /ocr/
            /transcriptions/
            /translations/
            /indexes/
            /docs/
            /test/
          sparse-checkout-cone-mode: false
          show-progress: false
          persist-credentials: true

      ############################################################
      # SOURCE SELECTION AND VALIDATION
      ############################################################

      - name: Inventory source DOCX masters
        if: ${{ inputs.mode == 'production' }}
        id: inventory
        shell: bash
        run: |
          set -euo pipefail

          echo "Source DOCX files:"
          find source-repo/images \
            -maxdepth 1 \
            -type f \
            -name '*.docx' \
            -printf '%f\n' |
            sort -V

          DOCX_COUNT="$(
            find source-repo/images \
              -maxdepth 1 \
              -type f \
              -name '*.docx' |
            wc -l
          )"
          DOCX_COUNT="$(echo "$DOCX_COUNT" | tr -d '[:space:]')"

          echo
          echo "DOCX count: $DOCX_COUNT"
          echo "docx_count=$DOCX_COUNT" >> "$GITHUB_OUTPUT"

          echo
          echo "Source checkout size:"
          du -sh source-repo

          if [[ "$DOCX_COUNT" -eq 0 ]]; then
            echo "::error::No DOCX files found beneath source-repo/images"
            exit 1
          fi

      - name: Select test source
        if: ${{ inputs.mode != 'production' }}
        id: source
        shell: bash
        env:
          REQUESTED_TEST_FILE: ${{ inputs.test_file }}
        run: |
          set -euo pipefail

          if [[ -z "$REQUESTED_TEST_FILE" ]]; then
            echo "::error::test_file is required for $HTH_MODE mode"
            exit 1
          fi

          INPUT_PATH="source-repo/images/$REQUESTED_TEST_FILE"

          if [[ ! -f "$INPUT_PATH" ]]; then
            echo "::error::DOCX does not exist: $INPUT_PATH"
            echo "Available DOCX files:"
            find source-repo/images -maxdepth 1 -type f -name '*.docx' \
              -printf '%f\n' | sort -V
            exit 1
          fi

          echo "input_path=$INPUT_PATH" >> "$GITHUB_OUTPUT"
          echo "test_file=$REQUESTED_TEST_FILE" >> "$GITHUB_OUTPUT"

      ############################################################
      # BUILD IDENTITY
      ############################################################

      - name: Capture build identity
        id: build
        shell: bash
        run: |
          set -euo pipefail

          PIPELINE_COMMIT="$(git -C hth-pipeline rev-parse HEAD)"
          SOURCE_COMMIT="${{ steps.source_release.outputs.source_commit }}"
          SOURCE_RELEASE_MANIFEST_SHA256="${{ steps.source_release.outputs.manifest_sha256 }}"
          PIPELINE_SHORT_COMMIT="${PIPELINE_COMMIT:0:8}"
          if [[ "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{8,}$ ]]; then
            SOURCE_SHORT_COMMIT="${SOURCE_COMMIT:0:8}"
          else
            SOURCE_SHORT_COMMIT="${SOURCE_RELEASE_TAG}"
          fi
          PROCESSED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "pipeline_commit=$PIPELINE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_release_tag=$SOURCE_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_release_manifest_sha256=$SOURCE_RELEASE_MANIFEST_SHA256" >> "$GITHUB_OUTPUT"
          echo "pipeline_short_commit=$PIPELINE_SHORT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_short_commit=$SOURCE_SHORT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "processed_at=$PROCESSED_AT" >> "$GITHUB_OUTPUT"

          {
            echo "## Publication Manifest"
            echo
            if [[ "$HTH_MODE" == "production" ]]; then
              echo "**Mode:** production collection preprocessing"
            elif [[ "$HTH_MODE" == "calibration" ]]; then
              echo "**Mode:** physical-geometry calibration"
            else
              echo "**Mode:** preprocessing test"
            fi
            echo
            echo "### Build provenance"
            echo
            echo "- Mode: \`$HTH_MODE\`"
            echo "- Source repository: \`$SOURCE_REPOSITORY\`"
            echo "- Source release: \`$SOURCE_RELEASE_TAG\`"
            echo "- Source release manifest SHA-256: \`$SOURCE_RELEASE_MANIFEST_SHA256\`"
            echo "- Recorded source commit: \`$SOURCE_COMMIT\`"
            if [[ "$HTH_MODE" != "production" ]]; then
              echo "- Source file: \`${{ steps.source.outputs.test_file }}\`"
              if [[ "$IMAGE_LIMIT" -gt 0 ]]; then
                echo "- Image limit: \`$IMAGE_LIMIT\`"
              fi
            fi
            echo "- Pipeline repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Pipeline commit: \`$PIPELINE_COMMIT\`"
            echo "- Results repository: \`$RESULTS_REPOSITORY\`"
            echo "- Workflow run: \`${GITHUB_RUN_ID}\`"
            echo "- Processed at: \`$PROCESSED_AT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve Rank #1 approved document detector
        id: preferred_document_detector
        if: ${{ inputs.document_detector == 'preferred' }}
        shell: bash
        run: |
          set -euo pipefail
          calibration_index="results-repo/indexes/calibration-index.json"
          if [[ ! -f "$calibration_index" && -f results-repo/calibration-index.json ]]; then
            calibration_index="results-repo/calibration-index.json"
            echo "Using legacy root calibration index during indexes/ migration."
          fi
          if [[ ! -f "$calibration_index" ]]; then
            echo "::error::Preferred document inference requires results-repo/indexes/calibration-index.json (or the legacy root calibration-index.json during migration)"
            exit 1
          fi
          cd hth-pipeline
          python -m hth.resolve_document_detector \
            --index "../$calibration_index" \
            --golden-set-id HTH-0001 \
            --catalog config/document-detectors.json \
            --output "$RUNNER_TEMP/preferred-document-detector.json" \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      ############################################################
      # PYTHON ENVIRONMENT
      ############################################################

      - name: Set up canonical HTH managed runtime
        uses: ./hth-pipeline/.github/actions/setup-hth-managed-runtime
        with:
          pipeline-path: hth-pipeline
          need-doc-ufcn: ${{ steps.preferred_document_detector.outputs.needs_doc_ufcn || 'false' }}

      ############################################################
      # STAGE_PREPROCESS
      ############################################################

      - name: STAGE_PREPROCESS
        id: stage_preprocess_start
        shell: bash
        run: |
          python hth-pipeline/hth/stage_timing.py start \
            --stage "STAGE_PREPROCESS"

      - name: Run preprocessor
        id: run_preprocessor
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$HTH_MODE" == "production" ]]; then
            INPUT_PATH="source-repo/images"
          else
            INPUT_PATH="${{ steps.source.outputs.input_path }}"
          fi

          LIMIT_ARGS=()
          if [[ "$IMAGE_LIMIT" -gt 0 ]]; then
            LIMIT_ARGS+=(--limit "$IMAGE_LIMIT")
          fi

          python hth-pipeline/hth/preprocess.py \
            --input "$INPUT_PATH" \
            --output "$OUTPUT_DIRECTORY" \
            --config hth-pipeline/config/preprocess.json \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-commit "${{ steps.build.outputs.source_commit }}" \
            --pipeline-repository "${{ github.repository }}" \
            --pipeline-commit "${{ steps.build.outputs.pipeline_commit }}" \
            --derive \
            --contact-sheets \
            --overwrite \
            "${LIMIT_ARGS[@]}"


      - name: Complete STAGE_PREPROCESS
        if: ${{ always() && steps.stage_preprocess_start.outcome != 'skipped' }}
        shell: bash
        run: |
          python hth-pipeline/hth/stage_timing.py finish \
            --stage "STAGE_PREPROCESS" \
            --start-epoch "${{ steps.stage_preprocess_start.outputs.epoch }}" \
            --started-at "${{ steps.stage_preprocess_start.outputs.started_at }}" \
            --status "${{ steps.run_preprocessor.outcome }}" \
            --timings-file "$RUNNER_TEMP/hth-stage-timings.jsonl"

      ############################################################
      # STAGE_DETECT_CURRENT
      ############################################################

      - name: STAGE_DETECT_CURRENT
        id: stage_detect_current_start
        shell: bash
        run: |
          python hth-pipeline/hth/stage_timing.py start \
            --stage "STAGE_DETECT_CURRENT"

      - name: Run physical page analysis
        id: run_physical_page_analysis
        shell: bash
        run: |
          set -euo pipefail

          python hth-pipeline/hth/analyze_pages.py \
            --manifest "$OUTPUT_DIRECTORY/metadata/image_manifest.json" \
            --image-root "$OUTPUT_DIRECTORY" \
            --config hth-pipeline/config/analyze_pages.json \
            --output "$OUTPUT_DIRECTORY/page-analysis" \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-commit "${{ steps.build.outputs.source_commit }}" \
            --pipeline-repository "${{ github.repository }}" \
            --pipeline-commit "${{ steps.build.outputs.pipeline_commit }}" \
            --annotated-previews \
            --overwrite


      - name: Complete STAGE_DETECT_CURRENT
        if: ${{ always() && steps.stage_detect_current_start.outcome != 'skipped' }}
        shell: bash
        run: |
          python hth-pipeline/hth/stage_timing.py finish \
            --stage "STAGE_DETECT_CURRENT" \
            --start-epoch "${{ steps.stage_detect_current_start.outputs.epoch }}" \
            --started-at "${{ steps.stage_detect_current_start.outputs.started_at }}" \
            --status "${{ steps.run_physical_page_analysis.outcome }}" \
            --timings-file "$RUNNER_TEMP/hth-stage-timings.jsonl"

      - name: Run approved detector over production collection
        if: ${{ (inputs.mode == 'production' || inputs.mode == 'test') && inputs.document_detector == 'preferred' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d results-repo/.git ]]; then
            lifecycle_root="results-repo"
            echo "Using persisted detector/model cache from results repository."
          else
            lifecycle_root="$OUTPUT_DIRECTORY/detector-runtime"
            echo "Results repository is unavailable; using run-local detector/model cache."
          fi

          python hth-pipeline/hth/run_document_detector.py \
            --manifest "$OUTPUT_DIRECTORY/metadata/image_manifest.json" \
            --analysis "$OUTPUT_DIRECTORY/page-analysis/page-analysis.json" \
            --image-root "$OUTPUT_DIRECTORY" \
            --output "$OUTPUT_DIRECTORY/page-analysis/page-analysis-with-detector.json" \
            --selection "$RUNNER_TEMP/preferred-document-detector.json" \
            --lifecycle-root "$lifecycle_root" \
            --overwrite
          mv "$OUTPUT_DIRECTORY/page-analysis/page-analysis-with-detector.json" \
             "$OUTPUT_DIRECTORY/page-analysis/page-analysis.json"

      ############################################################
      # STAGE_DETECT_CANDIDATES
      ############################################################

      - name: STAGE_DETECT_CANDIDATES
        id: stage_detect_candidates_start
        if: ${{ inputs.mode == 'calibration' }}
        shell: bash
        run: |
          python hth-pipeline/hth/stage_timing.py start \
            --stage "STAGE_DETECT_CANDIDATES"

      - name: Generate geometry candidates
        id: generate_geometry_candidates
        if: ${{ inputs.mode == 'calibration' }}
        shell: bash
        run: |
          set -euo pipefail

          python hth-pipeline/hth/detect_geometry_candidates.py \
            --manifest "$OUTPUT_DIRECTORY/metadata/image_manifest.json" \
            --analysis "$OUTPUT_DIRECTORY/page-analysis/page-analysis.json" \
            --image-root "$OUTPUT_DIRECTORY" \
            --output "$OUTPUT_DIRECTORY/page-analysis/page-analysis-with-candidates.json" \
            --overwrite

          mv \
            "$OUTPUT_DIRECTORY/page-analysis/page-analysis-with-candidates.json" \
            "$OUTPUT_DIRECTORY/page-analysis/page-analysis.json"


      - name: Complete STAGE_DETECT_CANDIDATES
        if: ${{ always() && steps.stage_detect_candidates_start.outcome != 'skipped' }}
        shell: bash
        run: |
          python hth-pipeline/hth/stage_timing.py finish \
            --stage "STAGE_DETECT_CANDIDATES" \
            --start-epoch "${{ steps.stage_detect_candidates_start.outputs.epoch }}" \
            --started-at "${{ steps.stage_detect_candidates_start.outputs.started_at }}" \
            --status "${{ steps.generate_geometry_candidates.outcome }}" \
            --timings-file "$RUNNER_TEMP/hth-stage-timings.jsonl"

      ############################################################
      # STAGE_VALIDATE_GEOMETRY
      ############################################################

      - name: STAGE_VALIDATE_GEOMETRY
        id: stage_validate_geometry_start
        if: ${{ inputs.mode != 'production' }}
        shell: bash
        run: |
          python hth-pipeline/hth/stage_timing.py start \
            --stage "STAGE_VALIDATE_GEOMETRY"

      - name: Validate physical geometry
        id: validate_physical_geometry
        if: ${{ inputs.mode != 'production' }}
        shell: bash
        run: |
          set -euo pipefail

          python hth-pipeline/hth/validate_physical_geometry.py \
            --reference hth-pipeline/config/golden_set.json \
            --analysis "$OUTPUT_DIRECTORY/page-analysis/page-analysis.json" \
            --output "$OUTPUT_DIRECTORY/page-analysis/physical-geometry-report.json" \
            --fail-on "${{ inputs.geometry_fail_on }}"


      - name: Complete STAGE_VALIDATE_GEOMETRY
        if: ${{ always() && steps.stage_validate_geometry_start.outcome != 'skipped' }}
        shell: bash
        run: |
          python hth-pipeline/hth/stage_timing.py finish \
            --stage "STAGE_VALIDATE_GEOMETRY" \
            --start-epoch "${{ steps.stage_validate_geometry_start.outputs.epoch }}" \
            --started-at "${{ steps.stage_validate_geometry_start.outputs.started_at }}" \
            --status "${{ steps.validate_physical_geometry.outcome }}" \
            --timings-file "$RUNNER_TEMP/hth-stage-timings.jsonl"

      ############################################################
      # STAGE_VALIDATE_OUTPUTS
      ############################################################

      - name: STAGE_VALIDATE_OUTPUTS
        id: stage_validate_outputs_start
        shell: bash
        run: |
          python hth-pipeline/hth/stage_timing.py start \
            --stage "STAGE_VALIDATE_OUTPUTS"

      - name: Verify production build
        if: ${{ inputs.mode == 'production' }}
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "$OUTPUT_DIRECTORY/summary.json"
            "$OUTPUT_DIRECTORY/metadata/image_manifest.json"
            "$OUTPUT_DIRECTORY/metadata/image_manifest.csv"
            "$OUTPUT_DIRECTORY/metadata/exact_duplicates.json"
            "$OUTPUT_DIRECTORY/metadata/page_map_template.csv"
            "$OUTPUT_DIRECTORY/page-analysis/page-analysis.json"
            "$OUTPUT_DIRECTORY/page-analysis/page-analysis.csv"
            "$OUTPUT_DIRECTORY/page-analysis/review-queue.csv"
            "$OUTPUT_DIRECTORY/page-analysis/analysis-summary.json"
          )

          for file in "${required_files[@]}"; do
            test -f "$file"
            echo "Verified: $file"
          done

          python - "$OUTPUT_DIRECTORY/summary.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          summary_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          summary = json.loads(summary_path.read_text(encoding="utf-8"))

          collection_id = str(summary.get("collection_id", "")).strip()
          docx_count = int(summary.get("source_docx_count", 0))
          image_count = int(summary.get("image_count", 0))
          first_image = int(summary.get("first_image", 0))
          last_image = int(summary.get("last_image", 0))

          if not collection_id:
              raise SystemExit("summary.json has no collection_id")
          if docx_count < 1:
              raise SystemExit("No DOCX masters were processed")
          if image_count < 1:
              raise SystemExit("No images were extracted")
          if first_image != 1:
              raise SystemExit(f"Expected first_image 1; found {first_image}")
          if last_image != image_count:
              raise SystemExit(
                  "last_image does not match image_count: "
                  f"{last_image} != {image_count}"
              )

          manifest_path = summary_path.parent / "metadata" / "image_manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          records = manifest.get("records", [])

          if len(records) != image_count:
              raise SystemExit(
                  "Manifest record count does not match summary: "
                  f"{len(records)} != {image_count}"
              )

          ordinals = [int(record["global_ordinal"]) for record in records]
          expected = list(range(1, image_count + 1))
          if ordinals != expected:
              raise SystemExit("Manifest global ordinals are not continuous")

          print(
              f"Verified collection {collection_id}: "
              f"{docx_count} DOCX masters, {image_count} images"
          )

          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"collection_id={collection_id}\n")
              output.write(f"docx_count={docx_count}\n")
              output.write(f"image_count={image_count}\n")
              output.write(f"first_image={first_image}\n")
              output.write(f"last_image={last_image}\n")
          PY

      - name: Verify test or calibration outputs
        if: ${{ inputs.mode != 'production' }}
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "$OUTPUT_DIRECTORY/summary.json"
            "$OUTPUT_DIRECTORY/metadata/image_manifest.json"
            "$OUTPUT_DIRECTORY/metadata/image_manifest.csv"
            "$OUTPUT_DIRECTORY/metadata/exact_duplicates.json"
            "$OUTPUT_DIRECTORY/page-analysis/page-analysis.json"
            "$OUTPUT_DIRECTORY/page-analysis/page-analysis.csv"
            "$OUTPUT_DIRECTORY/page-analysis/review-queue.csv"
            "$OUTPUT_DIRECTORY/page-analysis/analysis-summary.json"
            "$OUTPUT_DIRECTORY/page-analysis/physical-geometry-report.json"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required output: $file"
              exit 1
            fi
            echo "Verified: $file"
          done

          test -d "$OUTPUT_DIRECTORY/page-analysis/annotated-previews"

          PREVIEW_COUNT="$(
            find "$OUTPUT_DIRECTORY/page-analysis/annotated-previews" \
              -maxdepth 1 \
              -type f \
              -name '*_page-analysis.jpg' |
            wc -l
          )"
          PREVIEW_COUNT="$(echo "$PREVIEW_COUNT" | tr -d '[:space:]')"

          python - "$OUTPUT_DIRECTORY/summary.json" "$PREVIEW_COUNT" <<'PY'
          import json
          import sys
          from pathlib import Path

          summary = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          preview_count = int(sys.argv[2])
          docx_count = summary.get("source_docx_count", 0)
          image_count = summary.get("image_count", 0)

          if docx_count != 1:
              raise SystemExit(f"Expected 1 DOCX; found {docx_count}")
          if image_count < 1:
              raise SystemExit("Build produced no images")
          if preview_count != image_count:
              raise SystemExit(
                  f"Expected {image_count} annotated previews; "
                  f"found {preview_count}"
              )

          print(
              f"Verified {docx_count} DOCX, {image_count} images, "
              f"and {preview_count} previews"
          )
          PY


      - name: Complete STAGE_VALIDATE_OUTPUTS
        if: ${{ always() && steps.stage_validate_outputs_start.outcome != 'skipped' }}
        shell: bash
        run: |
          python hth-pipeline/hth/stage_timing.py finish \
            --stage "STAGE_VALIDATE_OUTPUTS" \
            --start-epoch "${{ steps.stage_validate_outputs_start.outputs.epoch }}" \
            --started-at "${{ steps.stage_validate_outputs_start.outputs.started_at }}" \
            --status "${{ job.status }}" \
            --timings-file "$RUNNER_TEMP/hth-stage-timings.jsonl"

      ############################################################
      # STAGE_PUBLISH_PRODUCTION
      ############################################################

      - name: STAGE_PUBLISH_PRODUCTION
        id: stage_publish_production_start
        if: ${{ inputs.mode == 'production' && inputs.publish_results }}
        shell: bash
        run: |
          python hth-pipeline/hth/stage_timing.py start \
            --stage "STAGE_PUBLISH_PRODUCTION"

      - name: Prepare production publication
        id: prepare_production_publication
        if: ${{ inputs.mode == 'production' && inputs.publish_results }}
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.build.outputs.source_commit }}
          SOURCE_RELEASE_TAG: ${{ steps.build.outputs.source_release_tag }}
          SOURCE_RELEASE_MANIFEST_SHA256: ${{ steps.build.outputs.source_release_manifest_sha256 }}
          PIPELINE_COMMIT: ${{ steps.build.outputs.pipeline_commit }}
          PROCESSED_AT: ${{ steps.build.outputs.processed_at }}
          COLLECTION_ID: ${{ steps.verify.outputs.collection_id }}
          DOCX_COUNT: ${{ steps.verify.outputs.docx_count }}
          IMAGE_COUNT: ${{ steps.verify.outputs.image_count }}
          FIRST_IMAGE: ${{ steps.verify.outputs.first_image }}
          LAST_IMAGE: ${{ steps.verify.outputs.last_image }}
        run: |
          set -euo pipefail

          rm -rf results-repo/metadata
          mkdir -p results-repo/metadata
          cp -a "$OUTPUT_DIRECTORY/metadata/." results-repo/metadata/

          mkdir -p results-repo/reports
          cp "$OUTPUT_DIRECTORY/summary.json" \
            results-repo/reports/preprocess-summary.json

          mkdir -p results-repo/analysis
          cp -a "$OUTPUT_DIRECTORY/page-analysis/." results-repo/analysis/

          mkdir -p \
            results-repo/ocr \
            results-repo/transcriptions \
            results-repo/translations \
            results-repo/indexes \
            results-repo/docs

          touch \
            results-repo/ocr/.gitkeep \
            results-repo/transcriptions/.gitkeep \
            results-repo/translations/.gitkeep \
            results-repo/indexes/.gitkeep \
            results-repo/docs/.gitkeep

          python <<'PY'
          import json
          import os
          from pathlib import Path

          def quote(value: object) -> str:
              return json.dumps(str(value), ensure_ascii=False)

          build_info = f"""\
          schema_version: 1
          build_type: production
          status: successful

          collection:
            id: {quote(os.environ["COLLECTION_ID"])}
            source_repository: {quote(os.environ["SOURCE_REPOSITORY"])}
            source_release: {quote(os.environ["SOURCE_RELEASE_TAG"])}
            source_release_manifest_sha256: {quote(os.environ["SOURCE_RELEASE_MANIFEST_SHA256"])}
            source_commit: {quote(os.environ["SOURCE_COMMIT"])}
            source_path: "images/"

          pipeline:
            repository: {quote(os.environ["GITHUB_REPOSITORY"])}
            commit: {quote(os.environ["PIPELINE_COMMIT"])}
            workflow: {quote(os.environ["GITHUB_WORKFLOW"])}
            workflow_file: ".github/workflows/preprocess.yml"
            workflow_run_id: {quote(os.environ["GITHUB_RUN_ID"])}
            workflow_run_number: {int(os.environ["GITHUB_RUN_NUMBER"])}

          results:
            repository: {quote(os.environ["RESULTS_REPOSITORY"])}
            branch: "main"
            full_resolution_images_published: false

          build:
            processed_at_utc: {quote(os.environ["PROCESSED_AT"])}
            python_version: "3.12"
            source_docx_count: {int(os.environ["DOCX_COUNT"])}
            image_count: {int(os.environ["IMAGE_COUNT"])}
            first_image: {int(os.environ["FIRST_IMAGE"])}
            last_image: {int(os.environ["LAST_IMAGE"])}
            derived_images_created: true
            contact_sheets_created: true
            errors: 0
          """

          Path("results-repo/BUILD-INFO.yaml").write_text(
              build_info,
              encoding="utf-8",
          )
          PY

          if [[ ! -f results-repo/README.md ]]; then
            cat > results-repo/README.md <<'EOF'
          # San Antonio Baptism Records — Processed Publication

          This repository contains processing metadata and research work
          products generated from the corresponding HTH source collection.

          The immutable DOCX masters are preserved as verified GitHub Release
          assets in the source repository and are not duplicated here.

          See `BUILD-INFO.yaml` for the exact source commit, pipeline commit,
          workflow run, and processing counts used to create the current
          production publication.

          ## Structure

          - `metadata/` — image manifests, hashes, page mapping, and duplicates
          - `reports/` — preprocessing and quality-control summaries
          - `analysis/` — page-analysis and review reports
          - `ocr/` — machine-generated OCR
          - `transcriptions/` — reviewed source-language transcriptions
          - `translations/` — reviewed translations
          - `indexes/` — names, dates, places, and searchable indexes
          - `docs/` — collection citations, research notes, and other human-facing documentation
          - `test/` — impounded CI-test results and test-build history

          Generated by the Hidden Texas History Research Framework.
          EOF
          fi


      - name: Publish production publication
        id: publish_production_publication
        if: ${{ inputs.mode == 'production' && inputs.publish_results }}
        shell: bash
        run: |
          set -euo pipefail
          source hth-pipeline/tools/hardened-persistence.sh

          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config \
            user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publication_payload="$RUNNER_TEMP/hth-production-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar"
          tar -C results-repo -cf "$publication_payload" \
            metadata analysis ocr transcriptions translations indexes \
            docs BUILD-INFO.yaml README.md \
            reports/preprocess-summary.json

          apply_production_publication() {
            # These are the production writer's owned paths. Remove them before
            # restoring the run snapshot so deletions are persisted as well as
            # additions, while every unrelated results-repo path remains intact.
            rm -rf \
              results-repo/metadata results-repo/analysis \
              results-repo/ocr results-repo/transcriptions results-repo/translations \
              results-repo/indexes results-repo/docs \
              results-repo/BUILD-INFO.yaml results-repo/README.md \
              results-repo/reports/preprocess-summary.json
            tar -C results-repo -xf "$publication_payload"
            hth_results_remove_legacy_indexes results-repo

            hth_results_stage results-repo \
              metadata analysis ocr transcriptions translations indexes \
              docs BUILD-INFO.yaml README.md \
              reports/preprocess-summary.json
          }

          hth_hardened_persist \
            results-repo main \
            "Publish HTH production build from source ${{ steps.build.outputs.source_short_commit }}" \
            apply_production_publication \
            "Production publication"

          RESULTS_COMMIT="$HTH_PERSIST_COMMIT"
          changed="$HTH_PERSIST_CHANGED"
          echo "results_commit=$RESULTS_COMMIT" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "### Publication repository validation"
            echo
            echo "- Cross-repository checkout: successful"
            if [[ "$changed" == "true" ]]; then
              echo "- Production publication: successful"
            else
              echo "- Production publication was already current"
            fi
            echo "- Publication commit: \`$RESULTS_COMMIT\`"
            echo "- Existing \`test/\` and calibration intelligence were preserved"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Complete STAGE_PUBLISH_PRODUCTION
        if: ${{ always() && steps.stage_publish_production_start.outcome != 'skipped' }}
        shell: bash
        run: |
          python hth-pipeline/hth/stage_timing.py finish \
            --stage "STAGE_PUBLISH_PRODUCTION" \
            --start-epoch "${{ steps.stage_publish_production_start.outputs.epoch }}" \
            --started-at "${{ steps.stage_publish_production_start.outputs.started_at }}" \
            --status "${{ steps.publish_production_publication.outcome }}" \
            --timings-file "$RUNNER_TEMP/hth-stage-timings.jsonl"

      # Pipeline Health complements the Publication Manifest above.
      - name: Write HTH production pipeline health
        if: ${{ always() && steps.prepare_production_publication.outcome != 'skipped' }}
        shell: bash
        env:
          HTH_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          HTH_SOURCE_COMMIT: ${{ steps.build.outputs.source_commit }}
          PIPELINE_START_EPOCH: ${{ steps.pipeline_start.outputs.epoch }}
        run: |
          set -u

          end_epoch=$(date +%s)
          if [[ "${PIPELINE_START_EPOCH:-}" =~ ^[0-9]+$ ]]; then
            elapsed=$((end_epoch - PIPELINE_START_EPOCH))
          else
            elapsed=0
          fi

          python hth-pipeline/hth/write_run_summary.py \
            --pipeline-name "Preprocess Pipeline — Production" \
            --status "${{ job.status }}" \
            --elapsed-seconds "$elapsed" \
            --pipeline-started-at "${{ steps.pipeline_start.outputs.started_at }}" \
            --stage-timings-jsonl "$RUNNER_TEMP/hth-stage-timings.jsonl" \
            --summary-json "$OUTPUT_DIRECTORY/summary.json" \
            --analysis-summary-json "$OUTPUT_DIRECTORY/page-analysis/analysis-summary.json" \
            --page-analysis-json "$OUTPUT_DIRECTORY/page-analysis/page-analysis.json" \
            --output "results-repo/metadata" \
            --output "results-repo/reports/preprocess-summary.json" \
            --output "results-repo/analysis" \
            --output "results-repo/BUILD-INFO.yaml"

      ############################################################
      # STAGE_PUBLISH_TEST
      ############################################################

      - name: STAGE_PUBLISH_TEST
        id: stage_publish_test_start
        if: ${{ inputs.mode == 'test' && inputs.publish_results }}
        shell: bash
        run: |
          python hth-pipeline/hth/stage_timing.py start \
            --stage "STAGE_PUBLISH_TEST"

      - name: Prepare test publication
        id: prepare_test_publication
        if: ${{ inputs.mode == 'test' && inputs.publish_results }}
        shell: bash
        run: |
          set -euo pipefail

          LATEST="results-repo/test/latest"
          HISTORY="results-repo/test/history/run-${GITHUB_RUN_NUMBER}"

          rm -rf "$LATEST"
          mkdir -p \
            "$LATEST/raw" \
            "$LATEST/metadata" \
            "$LATEST/analysis" \
            "$HISTORY"

          cp -a "$OUTPUT_DIRECTORY/raw/." "$LATEST/raw/"
          cp hth-pipeline/config/golden_set.json \
            "$LATEST/reference_collection.json"
          cp "$OUTPUT_DIRECTORY/summary.json" "$LATEST/summary.json"
          cp -a "$OUTPUT_DIRECTORY/metadata/." "$LATEST/metadata/"
          cp "$OUTPUT_DIRECTORY/page-analysis/page-analysis.json" \
            "$LATEST/analysis/"
          cp "$OUTPUT_DIRECTORY/page-analysis/page-analysis.csv" \
            "$LATEST/analysis/"
          cp "$OUTPUT_DIRECTORY/page-analysis/review-queue.csv" \
            "$LATEST/analysis/"
          cp "$OUTPUT_DIRECTORY/page-analysis/analysis-summary.json" \
            "$LATEST/analysis/"
          cp "$OUTPUT_DIRECTORY/page-analysis/physical-geometry-report.json" \
            "$LATEST/analysis/"

          cat > "$LATEST/BUILD-INFO.yaml" <<EOF
          schema_version: 1
          build_type: test
          status: successful

          source:
            repository: $SOURCE_REPOSITORY
            release: ${{ steps.build.outputs.source_release_tag }}
            release_manifest_sha256: ${{ steps.build.outputs.source_release_manifest_sha256 }}
            commit: ${{ steps.build.outputs.source_commit }}
            file: ${{ steps.source.outputs.test_file }}

          pipeline:
            repository: ${{ github.repository }}
            commit: ${{ steps.build.outputs.pipeline_commit }}
            workflow: ${{ github.workflow }}
            workflow_run_id: ${{ github.run_id }}
            workflow_run_number: ${{ github.run_number }}

          build:
            processed_at_utc: ${{ steps.build.outputs.processed_at }}
            output_location: test/latest
          EOF

          cp "$LATEST/BUILD-INFO.yaml" "$HISTORY/BUILD-INFO.yaml"
          cp "$LATEST/summary.json" "$HISTORY/summary.json"
          cp "$LATEST/analysis/analysis-summary.json" \
            "$HISTORY/analysis-summary.json"
          cp "$LATEST/analysis/physical-geometry-report.json" \
            "$HISTORY/physical-geometry-report.json"


      - name: Publish test publication
        id: publish_test_publication
        if: ${{ inputs.mode == 'test' && inputs.publish_results }}
        shell: bash
        run: |
          set -euo pipefail
          source hth-pipeline/tools/hardened-persistence.sh

          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config \
            user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publication_payload="$RUNNER_TEMP/hth-test-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar"
          tar -C results-repo -cf "$publication_payload" \
            test/latest "test/history/run-${GITHUB_RUN_NUMBER}"
          publish_latest=1

          apply_test_publication() {
            publish_latest=1
            latest_info="results-repo/test/latest/BUILD-INFO.yaml"
            if [[ -f "$latest_info" ]]; then
              remote_run_number="$(
                awk -F': *' '/^[[:space:]]*workflow_run_number:/ {print $2; exit}' "$latest_info" \
                  | tr -d '\r' \
                  || true
              )"
              if [[ "$remote_run_number" =~ ^[0-9]+$ ]] \
                 && (( remote_run_number > GITHUB_RUN_NUMBER )); then
                echo "Remote test/latest is newer (run ${remote_run_number}); preserving it while publishing run ${GITHUB_RUN_NUMBER} history."
                publish_latest=0
              fi
            fi

            rm -rf "results-repo/test/history/run-${GITHUB_RUN_NUMBER}"
            if (( publish_latest == 1 )); then
              rm -rf results-repo/test/latest
              tar -C results-repo -xf "$publication_payload"
            else
              temp_payload="$RUNNER_TEMP/hth-test-payload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${HTH_PERSIST_ATTEMPTS}"
              rm -rf "$temp_payload"
              mkdir -p "$temp_payload"
              tar -C "$temp_payload" -xf "$publication_payload"
              mkdir -p results-repo/test/history
              cp -a \
                "$temp_payload/test/history/run-${GITHUB_RUN_NUMBER}" \
                results-repo/test/history/
            fi

            hth_results_remove_legacy_indexes results-repo

            hth_results_stage results-repo \
              test/latest "test/history/run-${GITHUB_RUN_NUMBER}"
          }

          hth_hardened_persist \
            results-repo main \
            "Record preprocessing test run ${GITHUB_RUN_NUMBER}" \
            apply_test_publication \
            "Test publication"

          RESULTS_COMMIT="$HTH_PERSIST_COMMIT"
          {
            echo
            echo "### Publication repository validation"
            echo
            echo "- Cross-repository checkout: successful"
            if [[ "$HTH_PERSIST_CHANGED" == "true" ]]; then
              echo "- Test publication: successful"
            else
              echo "- Test publication was already current"
            fi
            echo "- Publication commit: \`$RESULTS_COMMIT\`"
            echo "- Published history: \`test/history/run-${GITHUB_RUN_NUMBER}/\`"
            if (( publish_latest == 1 )); then
              echo "- Published under: \`test/latest/\`"
            else
              echo "- Existing newer \`test/latest/\` preserved"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Complete STAGE_PUBLISH_TEST
        if: ${{ always() && steps.stage_publish_test_start.outcome != 'skipped' }}
        shell: bash
        run: |
          python hth-pipeline/hth/stage_timing.py finish \
            --stage "STAGE_PUBLISH_TEST" \
            --start-epoch "${{ steps.stage_publish_test_start.outputs.epoch }}" \
            --started-at "${{ steps.stage_publish_test_start.outputs.started_at }}" \
            --status "${{ steps.publish_test_publication.outcome }}" \
            --timings-file "$RUNNER_TEMP/hth-stage-timings.jsonl"

      # Pipeline Health complements the Publication Manifest above.
      - name: Write HTH test pipeline health
        if: ${{ always() && steps.prepare_test_publication.outcome != 'skipped' }}
        shell: bash
        env:
          HTH_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          HTH_SOURCE_COMMIT: ${{ steps.build.outputs.source_commit }}
          PIPELINE_START_EPOCH: ${{ steps.pipeline_start.outputs.epoch }}
        run: |
          set -u

          end_epoch=$(date +%s)
          if [[ "${PIPELINE_START_EPOCH:-}" =~ ^[0-9]+$ ]]; then
            elapsed=$((end_epoch - PIPELINE_START_EPOCH))
          else
            elapsed=0
          fi

          python hth-pipeline/hth/write_run_summary.py \
            --pipeline-name "Preprocess Pipeline — Test" \
            --status "${{ job.status }}" \
            --elapsed-seconds "$elapsed" \
            --pipeline-started-at "${{ steps.pipeline_start.outputs.started_at }}" \
            --stage-timings-jsonl "$RUNNER_TEMP/hth-stage-timings.jsonl" \
            --summary-json "$OUTPUT_DIRECTORY/summary.json" \
            --analysis-summary-json "$OUTPUT_DIRECTORY/page-analysis/analysis-summary.json" \
            --page-analysis-json "$OUTPUT_DIRECTORY/page-analysis/page-analysis.json" \
            --output "results-repo/test/latest/raw" \
            --output "results-repo/test/latest/metadata" \
            --output "results-repo/test/latest/analysis" \
            --output "results-repo/test/latest/summary.json" \
            --output "results-repo/test/latest/BUILD-INFO.yaml"

      ############################################################
      # JOB SUMMARY AND ARTIFACTS
      ############################################################

      - name: Add processing result to job summary
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "### Processing result"
            echo
            if [[ -f "$OUTPUT_DIRECTORY/summary.json" ]]; then
              echo '```json'
              cat "$OUTPUT_DIRECTORY/summary.json"
              echo
              echo '```'
            else
              echo "No preprocessing summary was generated."
            fi

            if [[ -d "$OUTPUT_DIRECTORY" ]]; then
              echo
              echo "Complete generated build size:"
              echo
              echo '```text'
              du -sh "$OUTPUT_DIRECTORY"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated build artifact
        if: ${{ success() && inputs.upload_full_artifact }}
        uses: ./hth-pipeline/.github/actions/hardened-upload-artifact
        with:
          name: hth-${{ inputs.mode }}-${{ github.run_number }}-${{ steps.build.outputs.source_short_commit }}
          path: ${{ env.OUTPUT_DIRECTORY }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
          compression-level: ${{ inputs.mode == 'production' && 0 || 6 }}

  generate-report:
    if: ${{ inputs.mode == 'report' }}
    name: Generate HTH report
    runs-on: >-
      ${{    inputs.specific_runner == 'custom' && inputs.custom_runner_label != '' && fromJSON(format('["self-hosted","{0}"]', inputs.custom_runner_label))
          || inputs.runner == 'self-hosted-windows' && fromJSON('["self-hosted","Windows","X64"]')
          || inputs.runner == 'self-hosted-hth'     && fromJSON('["self-hosted","Linux","X64","hth"]')
          || inputs.runner == 'self-hosted-rhel8'   && fromJSON('["self-hosted","Linux","X64","rhel8"]')
          || inputs.runner == 'self-hosted-e7k'     && fromJSON('["self-hosted","Linux","X64","e7k"]')
          || inputs.runner == 'self-hosted-e9k'     && fromJSON('["self-hosted","Linux","X64","e9k"]')
          || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      RESULTS_REPOSITORY: ${{ inputs.results_repository }}
      PYTHONNOUSERSITE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout results repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.results_repository }}
          path: results-repo
          ref: main
          token: ${{ secrets.HTH_RESULTS_TOKEN }}
          # Legacy optimizer summaries predate immutable per-run history. Keep a
          # bounded results history so Report Writer can migrate those published
          # profiles into canonical evidence while modern runs use durable records.
          fetch-depth: 100
          persist-credentials: true

      - name: Set up canonical HTH Python runtime
        uses: ./hth-pipeline/.github/actions/setup-hth-python
        with:
          pipeline-path: hth-pipeline
          runner-label: ${{ env.HTH_RUNNER_LABEL }}
          diagnostics: "false"

      - name: Generate selected report
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          HTH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          RESULTS_COMMIT="$(git -C results-repo rev-parse HEAD)"
          mkdir -p generated-report

          if [[ "${{ inputs.report_type }}" == "detector-calibration-manifest" ]]; then
            python -m hth.report_generator detector-calibration-manifest \
              --results-root results-repo \
              --golden-set "hth-pipeline/${{ inputs.report_golden_set }}" \
              --output generated-report/detector-calibration-manifest.md \
              --pipeline-repository "${{ github.repository }}" \
              --results-repository "$RESULTS_REPOSITORY" \
              --results-commit "$RESULTS_COMMIT" \
              --run-url "$HTH_RUN_URL"
          elif [[ "${{ inputs.report_type }}" == "execution-optimizer" ]]; then
            python -m hth.report_generator execution-optimizer \
              --results-root results-repo \
              --detector "${{ inputs.report_algorithm }}" \
              --output-dir "generated-report/execution-optimizer/${{ inputs.report_algorithm }}"
          else
            echo "::error::Unsupported report type: ${{ inputs.report_type }}"
            exit 1
          fi

      - name: Publish regenerated report
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          HTH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HTH_RESULTS_TOKEN: ${{ secrets.HTH_RESULTS_TOKEN }}
        run: |
          set -euo pipefail
          source hth-pipeline/tools/hardened-persistence.sh
          [[ -n "${HTH_RESULTS_TOKEN:-}" ]] || {
            echo "::error::HTH_RESULTS_TOKEN is required to publish generated reports"
            exit 1
          }

          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C results-repo remote set-url origin \
            "https://x-access-token:${HTH_RESULTS_TOKEN}@github.com/${RESULTS_REPOSITORY}.git"

          regenerate_and_stage() {
            local results_commit
            results_commit="$(git -C results-repo rev-parse HEAD)"
            rm -rf generated-report
            mkdir -p generated-report

            if [[ "${{ inputs.report_type }}" == "detector-calibration-manifest" ]]; then
              python -m hth.report_generator detector-calibration-manifest \
                --results-root results-repo \
                --golden-set "hth-pipeline/${{ inputs.report_golden_set }}" \
                --output generated-report/detector-calibration-manifest.md \
                --pipeline-repository "${{ github.repository }}" \
                --results-repository "$RESULTS_REPOSITORY" \
                --results-commit "$results_commit" \
                --run-url "$HTH_RUN_URL"
              mkdir -p results-repo/reports
              cp generated-report/detector-calibration-manifest.md results-repo/reports/detector-calibration-manifest.md
              hth_results_stage results-repo reports/detector-calibration-manifest.md
            else
              python -m hth.report_generator execution-optimizer \
                --results-root results-repo \
                --detector "${{ inputs.report_algorithm }}" \
                --output-dir "generated-report/execution-optimizer/${{ inputs.report_algorithm }}"
              rm -rf "results-repo/execution-optimizer/${{ inputs.report_algorithm }}"
              mkdir -p "results-repo/execution-optimizer/${{ inputs.report_algorithm }}"
              cp -a "generated-report/execution-optimizer/${{ inputs.report_algorithm }}/." \
                "results-repo/execution-optimizer/${{ inputs.report_algorithm }}/"
              hth_results_stage results-repo "execution-optimizer/${{ inputs.report_algorithm }}"
            fi
          }

          hth_hardened_persist \
            results-repo main \
            "Regenerate ${{ inputs.report_type }} report" \
            regenerate_and_stage \
            "Report publication"

      - name: Publish regenerated report summary
        shell: bash
        env:
          RESULTS_REPOSITORY: ${{ inputs.results_repository }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.report_type }}" == "detector-calibration-manifest" ]]; then
            python hth-pipeline/hth/write_action_summary.py generated-report/detector-calibration-manifest.md "$GITHUB_STEP_SUMMARY"
          else
            # Pin optimizer profile images to the exact results commit that was
            # just published. raw.githubusercontent.com branch refs can lag the
            # push briefly; the first branch-URL fetch may therefore cache the
            # previous SVG beside an otherwise current report summary.
            RESULTS_COMMIT="$(git -C results-repo rev-parse HEAD)"
            python -c 'import re, sys; from pathlib import Path; destination, source, repository, detector, results_commit = sys.argv[1:]; text = Path(source).read_text(encoding="utf-8"); base = f"https://raw.githubusercontent.com/{repository}/{results_commit}/execution-optimizer/{detector}/"; text = re.sub(r"\(([^)]+\.svg)\)", lambda m: f"({base}{m.group(1)})", text); Path(destination).open("a", encoding="utf-8").write(text + ("" if text.endswith("\n") else "\n"))' \
              "$GITHUB_STEP_SUMMARY" \
              "generated-report/execution-optimizer/${{ inputs.report_algorithm }}/summary.md" \
              "$RESULTS_REPOSITORY" \
              "${{ inputs.report_algorithm }}" \
              "$RESULTS_COMMIT"
          fi

      - name: Assemble report research artifact
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf report-research-artifact
          mkdir -p report-research-artifact/generated-report
          mkdir -p report-research-artifact/intelligence
          mkdir -p report-research-artifact/golden-set

          cp -a generated-report/. report-research-artifact/generated-report/
          GOLDEN_SOURCE="hth-pipeline/${{ inputs.report_golden_set }}"
          cp "$GOLDEN_SOURCE" report-research-artifact/golden-set/selected-golden-set.json
          GOLDEN_ID="$(python -c 'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8")); print(p.get("collection_id") or p.get("id") or "unknown")' "$GOLDEN_SOURCE")"
          FREEZE_SOURCE="hth-pipeline/config/golden_sets/${GOLDEN_ID}.freeze.json"
          if [[ -f "$FREEZE_SOURCE" ]]; then
            cp "$FREEZE_SOURCE" "report-research-artifact/golden-set/${GOLDEN_ID}.freeze.json"
          fi

          # Persisted research intelligence: calibration identity/quality, runtime,
          # parallelism, optimizer, provenance, scheduling, and source metadata.
          # Detector regression/debug/verbose trees are deliberately excluded.
          shopt -s nullglob
          for index in results-repo/*-index.json; do
            cp "$index" report-research-artifact/intelligence/
          done
          for file in results-repo/indexes/optimizer-predictions.json; do
            [[ -f "$file" ]] && cp "$file" report-research-artifact/intelligence/
          done
          for directory in reports execution-optimizer source-documents; do
            if [[ -d "results-repo/$directory" ]]; then
              cp -a "results-repo/$directory" "report-research-artifact/intelligence/$directory"
            fi
          done

          cat > report-research-artifact/README.md <<'EOF'
          # HTH report research artifact

          This artifact accompanies the GitHub Actions report summary. It contains the
          generated report, the frozen Golden Set identity/provenance, and persisted
          calibration/execution intelligence needed to research detector calibration,
          runtime, parallelism, optimizer, scheduling, and source provenance.

          Individual detector regression/debug/verbose logging is intentionally excluded;
          that evidence remains part of detector-specific research artifacts.
          EOF

      - name: Upload report research artifact
        if: ${{ success() }}
        uses: ./hth-pipeline/.github/actions/hardened-upload-artifact
        with:
          name: hth-report-${{ inputs.report_type }}-${{ github.run_number }}
          path: report-research-artifact
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
          compression-level: 6
