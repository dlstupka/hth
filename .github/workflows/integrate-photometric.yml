name: HTH normalize photometric integration

run-name: Build the validated photometric collection for downstream HTR

on:
  workflow_dispatch:
    inputs:
      # BEGIN GENERATED RUNNER TARGET INPUT
      runner_target:
        description: "Execution runner target"
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted-linux
          - self-hosted-windows
          - hth
          - rhel8
          - e7k
          - e9k
          - 192t
          - 96t
          - 32t
      # END GENERATED RUNNER TARGET INPUT
      review_artifact_retention_days:
        description: Days to retain the compact review artifact
        required: true
        default: 14
        type: number
      canonical_build_policy:
        description: Canonical Build Evidence policy
        required: true
        default: auto
        type: choice
        options:
          - auto
          - audit
          - force-verify
          - rebuild
  workflow_call:
    inputs:
      runner_target: {required: true, type: string}
      review_artifact_retention_days: {required: true, type: number}
      canonical_build_policy: {required: true, type: string}
    secrets:
      HTH_RESULTS_TOKEN: {required: true}
      HTH_SOURCE_TOKEN: {required: false}

permissions:
  contents: read

concurrency:
  group: integrate-photometric-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  RESULTS_REPOSITORY: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results

jobs:
  integrate-photometric:
    name: Produce the validated illumination-normalized collection
    # BEGIN GENERATED RUNNER TARGET ROUTING
    runs-on: >-
      ${{ inputs.runner_target == 'self-hosted-linux' && fromJSON('["self-hosted","Linux","X64"]')
        || inputs.runner_target == 'self-hosted-windows' && fromJSON('["self-hosted","Windows","X64"]')
        || inputs.runner_target == 'hth' && fromJSON('["self-hosted","Linux","X64","hth"]')
        || inputs.runner_target == 'rhel8' && fromJSON('["self-hosted","Linux","X64","rhel8"]')
        || inputs.runner_target == 'e7k' && fromJSON('["self-hosted","Linux","X64","e7k"]')
        || inputs.runner_target == 'e9k' && fromJSON('["self-hosted","Linux","X64","e9k"]')
        || inputs.runner_target == '192t' && fromJSON('["self-hosted","Linux","X64","192t"]')
        || inputs.runner_target == '96t' && fromJSON('["self-hosted","Linux","X64","96t"]')
        || inputs.runner_target == '32t' && fromJSON('["self-hosted","Linux","X64","32t"]')
        || 'ubuntu-latest' }}
    # END GENERATED RUNNER TARGET ROUTING
    timeout-minutes: 120
    env:
      # BEGIN GENERATED RUNNER SETUP LABEL
      HTH_SELECTED_RUNNER_LABEL: >-
        ${{ inputs.runner_target == 'self-hosted-linux' && 'linux'
          || inputs.runner_target == 'self-hosted-windows' && 'windows'
          || inputs.runner_target == 'hth' && 'hth'
          || inputs.runner_target == 'rhel8' && 'rhel8'
          || inputs.runner_target == 'e7k' && 'e7k'
          || inputs.runner_target == 'e9k' && 'e9k'
          || inputs.runner_target == '192t' && '192t'
          || inputs.runner_target == '96t' && '96t'
          || inputs.runner_target == '32t' && '32t'
          || 'github-hosted' }}
      # END GENERATED RUNNER SETUP LABEL
    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical normalization and photometric evidence
        uses: actions/checkout@v6
        with:
          repository: ${{ env.RESULTS_REPOSITORY }}
          path: results-repo
          ref: main
          token: ${{ secrets.HTH_RESULTS_TOKEN || github.token }}
          fetch-depth: 1
          sparse-checkout: |
            /metadata/canonical-build-evidence.json
            /metadata/image_manifest.json
            /normalization/canonical-build-evidence.json
            /normalization/normalization-manifest.json
            /normalization/photometric/
            /normalization/photometric-methods/
            /normalization/photometric-method-policy.json
            /normalization/photometric-validation/
            /normalization/photometric-integration-policy.json
            /normalization/photometric-integration/
          sparse-checkout-cone-mode: false
          persist-credentials: true

      - name: Set up canonical HTH Python runtime
        uses: ./hth-pipeline/.github/actions/setup-hth-python
        with:
          pipeline-path: hth-pipeline
          runner-label: ${{ env.HTH_SELECTED_RUNNER_LABEL }}

      - name: Validate evidence and prepare complete production plan
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.integrate_photometric prepare \
            --normalization-manifest results-repo/normalization/normalization-manifest.json \
            --photometric-assessment results-repo/normalization/photometric/assessment.json \
            --method-assessment results-repo/normalization/photometric-methods/assessment.json \
            --method-policy results-repo/normalization/photometric-method-policy.json \
            --validation results-repo/normalization/photometric-validation/validation.json \
            --integration-policy results-repo/normalization/photometric-integration-policy.json \
            --output "$RUNNER_TEMP/photometric-integration-plan.json"

      - name: Resolve immutable source provenance
        id: provenance
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          import os
          from pathlib import Path
          from hth.canonical_build_evidence import NORMALIZATION_SCOPE, load_evidence_store, validate_published_results

          results = Path("results-repo")
          store = load_evidence_store(results / "normalization/canonical-build-evidence.json", scope=NORMALIZATION_SCOPE)
          identity = str(store.get("authoritative_identity") or "")
          record = (store.get("records") or {}).get(identity)
          if not identity or not isinstance(record, dict):
              raise SystemExit("Canonical normalization evidence has no authoritative record")
          validate_published_results(record, results)
          preprocess_store = json.loads((results / "metadata/canonical-build-evidence.json").read_text(encoding="utf-8"))
          preprocess = (preprocess_store.get("records") or {}).get(preprocess_store.get("authoritative_identity"))
          if not isinstance(preprocess, dict):
              raise SystemExit("Canonical preprocess evidence has no authoritative record")
          source = (preprocess.get("effective_inputs") or {}).get("source") or {}
          if not source.get("repository") or not source.get("release") or len(str(source.get("release_manifest_sha256") or "")) != 64:
              raise SystemExit("Canonical preprocess evidence has incomplete source provenance")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"source_repository={source['repository']}\n")
              handle.write(f"source_release={source['release']}\n")
              handle.write(f"source_manifest_sha256={source['release_manifest_sha256']}\n")
          PY

      - name: Assemble photometric effective-input contract
        id: cbe_inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/photometric-effective-inputs"
          mkdir -p "$RUNNER_TEMP/photometric-effective-inputs"
          cp results-repo/normalization/normalization-manifest.json "$RUNNER_TEMP/photometric-effective-inputs/"
          cp results-repo/normalization/photometric/assessment.json "$RUNNER_TEMP/photometric-effective-inputs/photometric-assessment.json"
          cp results-repo/normalization/photometric-methods/assessment.json "$RUNNER_TEMP/photometric-effective-inputs/method-assessment.json"
          cp results-repo/normalization/photometric-method-policy.json "$RUNNER_TEMP/photometric-effective-inputs/"
          cp results-repo/normalization/photometric-validation/validation.json "$RUNNER_TEMP/photometric-effective-inputs/photometric-validation.json"
          cp results-repo/normalization/photometric-integration-policy.json "$RUNNER_TEMP/photometric-effective-inputs/"
          python <<'PY'
          import json
          import os
          from pathlib import Path
          policy = json.loads(Path("results-repo/normalization/photometric-integration-policy.json").read_text(encoding="utf-8"))
          identity = str(policy.get("policy_identity") or "")
          if len(identity) != 64:
              raise SystemExit("Photometric integration policy has no valid identity")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"policy_identity={identity}\n")
          PY

      - name: Evaluate photometric Canonical Build Evidence
        id: cbe_plan
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.canonical_build_evidence prepare \
            --scope hth-photometric-integration \
            --policy "${{ inputs.canonical_build_policy }}" \
            --contract-version 1 \
            --mode complete-production \
            --operation reconstruct-proven-canonical-normalized-pages \
            --operation apply-validated-background-field-correction \
            --operation preserve-ineligible-pages-and-continue \
            --operation package-immutable-lossless-collection \
            --repository-root hth-pipeline \
            --source-root "$RUNNER_TEMP/photometric-effective-inputs" \
            --source-repository "$RESULTS_REPOSITORY" \
            --source-release "${{ steps.cbe_inputs.outputs.policy_identity }}" \
            --source-manifest-sha256 "${{ steps.cbe_inputs.outputs.policy_identity }}" \
            --source-commit "${{ steps.cbe_inputs.outputs.policy_identity }}" \
            --config hth-pipeline/config/photometric-assessment.json \
            --config hth-pipeline/config/photometric-method-assessment.json \
            --config hth-pipeline/config/photometric-method-validation.json \
            --implementation hth-pipeline/hth/integrate_photometric.py \
            --implementation hth-pipeline/hth/assess_photometric.py \
            --implementation hth-pipeline/hth/assess_photometric_methods.py \
            --implementation hth-pipeline/hth/validate_photometric_method.py \
            --runtime-contract hth-pipeline/requirements.txt \
            --runtime-package numpy \
            --runtime-package opencv-python-headless \
            --results-root results-repo \
            --evidence results-repo/normalization/photometric-integration/canonical-build-evidence.json \
            --plan "$RUNNER_TEMP/photometric-cbe-plan.json" \
            --pipeline-repository "$GITHUB_REPOSITORY" \
            --pipeline-commit "$GITHUB_SHA" \
            --results-repository "$RESULTS_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --runner-name "$RUNNER_NAME" \
            --runner-environment "${{ runner.environment }}" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Audit reusable immutable photometric release
        if: steps.cbe_plan.outputs.decision != 'execute'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HTH_RESULTS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          readarray -t release_fields < <(python <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path("results-repo/normalization/photometric-integration/release.json").read_text(encoding="utf-8"))
          for key in ("tag", "asset", "asset_sha256", "photometric_result_identity"):
              value = str(record.get(key) or "")
              if not value:
                  raise SystemExit(f"Persisted release record has no {key}")
              print(value)
          PY
          )
          tag="${release_fields[0]}"
          asset="${release_fields[1]}"
          expected="${release_fields[2]}"
          result_identity="${release_fields[3]}"
          remote_digest="$(gh api "repos/$RESULTS_REPOSITORY/releases/tags/$tag" --jq ".assets[] | select(.name == \"$asset\") | .digest")"
          test "$remote_digest" = "sha256:$expected" || {
            echo "Persisted release asset digest does not match Canonical Build Evidence" >&2
            exit 1
          }
          release_url="${GITHUB_SERVER_URL}/${RESULTS_REPOSITORY}/releases/tag/${tag}"
          {
            echo ""
            echo "## Reusable photometric result"
            echo ""
            echo "- Photometric result: [\`$result_identity\`]($release_url)"
            echo "- Release activity: \`AUDITED\`"
            echo "- Release: $release_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download immutable source release
        id: source_release
        if: steps.cbe_plan.outputs.decision == 'execute'
        shell: bash
        env:
          HTH_SOURCE_TOKEN: ${{ secrets.HTH_SOURCE_TOKEN || github.token }}
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          rm -rf source-repo
          python -m hth.source_release \
            --repository "${{ steps.provenance.outputs.source_repository }}" \
            --tag "${{ steps.provenance.outputs.source_release }}" \
            --destination source-repo \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify immutable source release
        if: steps.cbe_plan.outputs.decision == 'execute'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.source_release.outputs.manifest_sha256 }}" == "${{ steps.provenance.outputs.source_manifest_sha256 }}" ]]

      - name: Reconstruct and prove all canonical normalized pages
        if: steps.cbe_plan.outputs.decision == 'execute'
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/photometric-integration-materialized"
          python -m hth.assess_orientation_deskew materialize \
            --source-root source-repo/images \
            --canonical-image-manifest results-repo/metadata/image_manifest.json \
            --normalization-manifest results-repo/normalization/normalization-manifest.json \
            --sample-plan "$RUNNER_TEMP/photometric-integration-plan.json" \
            --output "$RUNNER_TEMP/photometric-integration-materialized"

      - name: Integrate validated photometric correction
        id: integration
        if: steps.cbe_plan.outputs.decision == 'execute'
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          rm -rf photometric-integrated-collection
          python -m hth.integrate_photometric integrate \
            --image-root "$RUNNER_TEMP/photometric-integration-materialized/normalized" \
            --normalization-manifest results-repo/normalization/normalization-manifest.json \
            --photometric-assessment results-repo/normalization/photometric/assessment.json \
            --method-assessment results-repo/normalization/photometric-methods/assessment.json \
            --method-policy results-repo/normalization/photometric-method-policy.json \
            --validation results-repo/normalization/photometric-validation/validation.json \
            --integration-policy results-repo/normalization/photometric-integration-policy.json \
            --plan "$RUNNER_TEMP/photometric-integration-plan.json" \
            --output photometric-integrated-collection \
            --review-every 25 \
            --github-summary "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/photometric-integration-plan.json" photometric-integrated-collection/integration-plan.json
          cp "$RUNNER_TEMP/photometric-integration-materialized/materialization-evidence.json" photometric-integrated-collection/materialization-evidence.json
          python <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path("photometric-integrated-collection/photometric-normalization-manifest.json").read_text(encoding="utf-8"))
          identity = str(manifest.get("photometric_result_identity") or "")
          if len(identity) != 64:
              raise SystemExit("Photometric integration produced no valid result identity")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"result_identity={identity}\n")
              handle.write(f"base_normalization_identity={manifest['base_normalization_result_identity']}\n")
              handle.write(f"release_tag=HTH-PHOTOMETRIC-{identity}\n")
          PY

      - name: Package immutable photometric collection
        id: package
        if: steps.cbe_plan.outputs.decision == 'execute'
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          RESULT_IDENTITY: ${{ steps.integration.outputs.result_identity }}
          RELEASE_TAG: ${{ steps.integration.outputs.release_tag }}
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/hth-photometric-${{ steps.integration.outputs.result_identity }}.zip"
          rm -f "$asset"
          python -m hth.integrate_photometric package \
            --collection photometric-integrated-collection \
            --asset "$asset" \
            --tag "$RELEASE_TAG" \
            --output-record photometric-integrated-collection/release.json
          python <<'PY'
          import json
          import os
          from pathlib import Path
          record = json.loads(Path("photometric-integrated-collection/release.json").read_text(encoding="utf-8"))
          asset = Path(os.environ["RUNNER_TEMP"]) / record["asset"]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"asset={asset}\n")
              handle.write(f"asset_sha256={record['asset_sha256']}\n")
          PY

      - name: Stage photometric Canonical Build Evidence metadata
        if: steps.cbe_plan.outputs.decision == 'execute'
        shell: bash
        run: |
          set -euo pipefail
          # This policy is CBE metadata, not part of the immutable release asset.
          # Stage it only after packaging so CBE adoption cannot change the bytes
          # associated with an existing semantic photometric result identity.
          cp results-repo/normalization/photometric-integration-policy.json photometric-integrated-collection/applied-integration-policy.json

      - name: Finalize photometric Canonical Build Evidence
        id: cbe_result
        if: steps.cbe_plan.outputs.decision == 'execute'
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.canonical_build_evidence finalize \
            --plan "$RUNNER_TEMP/photometric-cbe-plan.json" \
            --output-root photometric-integrated-collection \
            --evidence-store results-repo/normalization/photometric-integration/canonical-build-evidence.json \
            --evidence-output photometric-integrated-collection/canonical-build-evidence.json \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Publish or reuse immutable results release
        id: release
        if: steps.cbe_plan.outputs.decision == 'execute'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HTH_RESULTS_TOKEN }}
          RELEASE_TAG: ${{ steps.integration.outputs.release_tag }}
          RELEASE_ASSET: ${{ steps.package.outputs.asset }}
          RESULT_IDENTITY: ${{ steps.integration.outputs.result_identity }}
          ASSET_SHA256: ${{ steps.package.outputs.asset_sha256 }}
          ASSET_NAME: hth-photometric-${{ steps.integration.outputs.result_identity }}.zip
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$RESULTS_REPOSITORY" >/dev/null 2>&1; then
            remote_digest="$(gh api "repos/$RESULTS_REPOSITORY/releases/tags/$RELEASE_TAG" --jq ".assets[] | select(.name == \"$ASSET_NAME\") | .digest")"
            test "$remote_digest" = "sha256:$ASSET_SHA256" || {
              echo "Existing release asset does not match the deterministic rebuilt collection" >&2
              exit 1
            }
            echo "release_activity=REUSED" >> "$GITHUB_OUTPUT"
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
              --repo "$RESULTS_REPOSITORY" \
              --target main \
              --title "HTH photometric normalized collection $RESULT_IDENTITY" \
              --notes "Canonical HTH-0001 illumination/background-normalized collection. Photometric result identity: $RESULT_IDENTITY. No contrast or tonal-range normalization is included."
            echo "release_activity=CREATED" >> "$GITHUB_OUTPUT"
          fi
          echo "release_url=${GITHUB_SERVER_URL}/${RESULTS_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish compact canonical photometric evidence
        id: publish
        if: steps.cbe_plan.outputs.decision == 'execute'
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          source hth-pipeline/tools/hardened-persistence.sh
          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          payload="$RUNNER_TEMP/hth-photometric-integration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$payload"
          mkdir -p "$payload"
          cp photometric-integrated-collection/{photometric-normalization-manifest.json,photometric-normalization-manifest.csv,summary.md,integration-plan.json,materialization-evidence.json,release.json} "$payload/"
          cp photometric-integrated-collection/applied-integration-policy.json "$payload/"
          cbe_incoming="$RUNNER_TEMP/photometric-cbe-incoming.json"
          cp photometric-integrated-collection/canonical-build-evidence.json "$cbe_incoming"

          apply_photometric_integration() {
            python -m hth.canonical_build_evidence merge \
              --scope hth-photometric-integration \
              --base results-repo/normalization/photometric-integration/canonical-build-evidence.json \
              --incoming "$cbe_incoming" \
              --output "$payload/canonical-build-evidence.json"
            rm -rf results-repo/normalization/photometric-integration
            mkdir -p results-repo/normalization/photometric-integration
            cp "$payload"/* results-repo/normalization/photometric-integration/
            hth_results_stage results-repo normalization/photometric-integration
          }
          hth_hardened_persist results-repo main \
            "Publish photometric integration ${{ steps.integration.outputs.result_identity }}" \
            apply_photometric_integration \
            "Photometric integration publication"
          echo "results_commit=$HTH_PERSIST_COMMIT" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "## Durable photometric result"
            echo ""
            echo "- Base normalization result: [\`${{ steps.integration.outputs.base_normalization_identity }}\`](${GITHUB_SERVER_URL}/${RESULTS_REPOSITORY}/blob/$HTH_PERSIST_COMMIT/normalization/normalization-manifest.json)"
            echo "- Photometric result: [\`${{ steps.integration.outputs.result_identity }}\`](${{ steps.release.outputs.release_url }})"
            echo "- Release activity: \`${{ steps.release.outputs.release_activity }}\`"
            echo "- Release: ${{ steps.release.outputs.release_url }}"
            echo "- Results commit: [\`$HTH_PERSIST_COMMIT\`](${GITHUB_SERVER_URL}/${RESULTS_REPOSITORY}/commit/$HTH_PERSIST_COMMIT)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compact photometric review
        if: steps.cbe_plan.outputs.decision == 'execute'
        uses: ./hth-pipeline/.github/actions/hardened-upload-artifact
        with:
          name: hth-photometric-integration-review-${{ github.run_number }}
          path: |
            photometric-integrated-collection/contact-sheets
            photometric-integrated-collection/index.html
            photometric-integrated-collection/photometric-normalization-manifest.json
            photometric-integrated-collection/photometric-normalization-manifest.csv
            photometric-integrated-collection/summary.md
            photometric-integrated-collection/release.json
          if-no-files-found: error
          retention-days: ${{ inputs.review_artifact_retention_days }}
          compression-level: 6
