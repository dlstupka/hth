name: HTH normalize photometric method validation

run-name: Validate the selected photometric method against every held-out HTH-0001 page

on:
  workflow_dispatch:
    inputs:
      results_repository: {description: "Canonical collection results repository", required: true, default: "dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results", type: string}
      # BEGIN GENERATED RUNNER TARGET INPUT
      runner_target:
        description: "Execution runner target"
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted-linux
          - self-hosted-windows
          - hth
          - rhel8
          - e7k
          - e9k
          - 192vcpu
          - 96vcpu
          - 32vcpu
      # END GENERATED RUNNER TARGET INPUT
      artifact_retention_days:
        description: Days to retain the held-out validation artifact
        required: true
        default: 14
        type: number
  workflow_call:
    inputs:
      results_repository: {required: true, type: string}
      runner_target: {required: true, type: string}
      artifact_retention_days: {required: true, type: number}
      canonical_build_policy: {required: false, type: string, default: auto}
    secrets:
      HTH_RESULTS_TOKEN: {required: true}
      HTH_SOURCE_TOKEN: {required: false}

permissions:
  contents: read

concurrency:
  group: validate-photometric-method-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  RESULTS_REPOSITORY: ${{ inputs.results_repository }}
  VALIDATION_CONFIG: hth-pipeline/config/photometric-method-validation.json

jobs:
  validate-photometric-method:
    name: Audit the selected method across the complete held-out population
    # BEGIN GENERATED RUNNER TARGET ROUTING
    runs-on: >-
      ${{ inputs.runner_target == 'self-hosted-linux' && fromJSON('["self-hosted","Linux","X64"]')
        || inputs.runner_target == 'self-hosted-windows' && fromJSON('["self-hosted","Windows","X64"]')
        || inputs.runner_target == 'hth' && fromJSON('["self-hosted","Linux","X64","hth"]')
        || inputs.runner_target == 'rhel8' && fromJSON('["self-hosted","Linux","X64","rhel8"]')
        || inputs.runner_target == 'e7k' && fromJSON('["self-hosted","Linux","X64","e7k"]')
        || inputs.runner_target == 'e9k' && fromJSON('["self-hosted","Linux","X64","e9k"]')
        || inputs.runner_target == '192vcpu' && fromJSON('["self-hosted","Linux","X64","192vcpu"]')
        || inputs.runner_target == '96vcpu' && fromJSON('["self-hosted","Linux","X64","96vcpu"]')
        || inputs.runner_target == '32vcpu' && fromJSON('["self-hosted","Linux","X64","32vcpu"]')
        || 'ubuntu-latest' }}
    # END GENERATED RUNNER TARGET ROUTING
    timeout-minutes: 60
    env:
      # BEGIN GENERATED RUNNER SETUP LABEL
      HTH_SELECTED_RUNNER_LABEL: >-
        ${{ inputs.runner_target == 'self-hosted-linux' && 'linux'
          || inputs.runner_target == 'self-hosted-windows' && 'windows'
          || inputs.runner_target == 'hth' && 'hth'
          || inputs.runner_target == 'rhel8' && 'rhel8'
          || inputs.runner_target == 'e7k' && 'e7k'
          || inputs.runner_target == 'e9k' && 'e9k'
          || inputs.runner_target == '192vcpu' && '192vcpu'
          || inputs.runner_target == '96vcpu' && '96vcpu'
          || inputs.runner_target == '32vcpu' && '32vcpu'
          || 'github-hosted' }}
      # END GENERATED RUNNER SETUP LABEL
    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical photometric evidence
        uses: ./hth-pipeline/.github/actions/checkout-results
        with:
          repository: ${{ env.RESULTS_REPOSITORY }}
          path: results-repo
          ref: main
          token: ${{ secrets.HTH_RESULTS_TOKEN || github.token }}
          fetch-depth: 1
          sparse-checkout: |
            /metadata/canonical-build-evidence.json
            /metadata/image_manifest.json
            /normalization/canonical-build-evidence.json
            /normalization/normalization-manifest.json
            /normalization/photometric/
            /normalization/photometric-methods/
            /normalization/photometric-method-policy.json
            /normalization/photometric-validation/
            /normalization/photometric-integration-policy.json
          sparse-checkout-cone-mode: false
          persist-credentials: true

      - name: Set up canonical HTH Python runtime
        uses: ./hth-pipeline/.github/actions/setup-hth-python
        with:
          pipeline-path: hth-pipeline
          runner-label: ${{ env.HTH_SELECTED_RUNNER_LABEL }}

      - name: Validate canonical normalization and resolve source provenance
        id: provenance
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          import os
          from pathlib import Path
          from hth.canonical_build_evidence import NORMALIZATION_SCOPE, load_evidence_store, validate_published_results

          results = Path("results-repo")
          store = load_evidence_store(results / "normalization/canonical-build-evidence.json", scope=NORMALIZATION_SCOPE)
          identity = str(store.get("authoritative_identity") or "")
          record = (store.get("records") or {}).get(identity)
          if not identity or not isinstance(record, dict):
              raise SystemExit("Canonical normalization evidence has no authoritative record")
          validate_published_results(record, results)
          manifest = json.loads((results / "normalization/normalization-manifest.json").read_text(encoding="utf-8"))
          result_identity = str(manifest.get("canonical_result_identity") or "")
          if len(result_identity) != 64:
              raise SystemExit("Canonical normalization manifest has no result identity")
          method_assessment = json.loads(
              (results / "normalization/photometric-methods/assessment.json").read_text(encoding="utf-8")
          )
          method_assessment_identity = str(method_assessment.get("assessment_identity") or "")
          if len(method_assessment_identity) != 64:
              raise SystemExit("Photometric method assessment has no canonical identity")
          preprocess_store = json.loads((results / "metadata/canonical-build-evidence.json").read_text(encoding="utf-8"))
          preprocess = (preprocess_store.get("records") or {}).get(preprocess_store.get("authoritative_identity"))
          if not isinstance(preprocess, dict):
              raise SystemExit("Canonical preprocess evidence has no authoritative record")
          source = (preprocess.get("effective_inputs") or {}).get("source") or {}
          if not source.get("repository") or not source.get("release") or len(str(source.get("release_manifest_sha256") or "")) != 64:
              raise SystemExit("Canonical preprocess evidence has incomplete source provenance")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"normalization_effective_identity={identity}\n")
              handle.write(f"normalization_result_identity={record['canonical_result']['identity']}\n")
              handle.write(f"method_assessment_identity={method_assessment_identity}\n")
              handle.write(f"source_repository={source['repository']}\n")
              handle.write(f"source_release={source['release']}\n")
              handle.write(f"source_manifest_sha256={source['release_manifest_sha256']}\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## Canonical input\n\n")
              handle.write(f"- Normalized-pixel result: `{result_identity}`\n")
          PY

      - name: Select complete held-out population
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.validate_photometric_method prepare \
            --normalization-manifest results-repo/normalization/normalization-manifest.json \
            --photometric-assessment results-repo/normalization/photometric/assessment.json \
            --method-assessment results-repo/normalization/photometric-methods/assessment.json \
            --method-policy results-repo/normalization/photometric-method-policy.json \
            --config "$VALIDATION_CONFIG" \
            --output "$RUNNER_TEMP/photometric-validation-plan.json"

      - name: Assemble photometric validation effective-input contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/photometric-validation-effective-inputs"
          rm -rf "$source_root"
          mkdir -p "$source_root"
          cp results-repo/normalization/normalization-manifest.json "$source_root/"
          cp results-repo/metadata/image_manifest.json "$source_root/"
          cp results-repo/normalization/photometric/assessment.json "$source_root/photometric-assessment.json"
          cp results-repo/normalization/photometric-methods/assessment.json "$source_root/photometric-method-assessment.json"
          cp results-repo/normalization/photometric-method-policy.json "$source_root/"
          cp "$RUNNER_TEMP/photometric-validation-plan.json" "$source_root/sample-plan.json"
          echo "source_root=$source_root" >> "$GITHUB_OUTPUT"
          echo "results_ref=$(git -C results-repo rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Evaluate photometric validation Canonical Build Evidence
        id: cbe
        shell: bash
        env: {PYTHONPATH: hth-pipeline}
        run: |
          set -euo pipefail
          python -m hth.canonical_build_evidence prepare \
            --scope hth-photometric-validation --policy "${{ inputs.canonical_build_policy || 'auto' }}" --contract-version 1 \
            --mode diagnostic-evidence --operation complete-held-out-photometric-validation \
            --repository-root hth-pipeline --source-root "${{ steps.contract.outputs.source_root }}" \
            --source-input ".=${{ steps.contract.outputs.source_root }}" \
            --source-repository "$RESULTS_REPOSITORY" \
            --source-release "${{ steps.provenance.outputs.method_assessment_identity }}" \
            --source-manifest-sha256 "${{ steps.provenance.outputs.method_assessment_identity }}" \
            --source-commit "${{ steps.provenance.outputs.normalization_result_identity }}" \
            --config "$VALIDATION_CONFIG" \
            --implementation hth-pipeline/hth/validate_photometric_method.py \
            --implementation hth-pipeline/hth/assess_orientation_deskew.py \
            --runtime-contract hth-pipeline/requirements.txt \
            --runtime-contract hth-pipeline/.github/actions/setup-hth-python/action.yml \
            --runtime-package numpy --runtime-package opencv-python-headless \
            --results-root results-repo \
            --evidence results-repo/normalization/photometric-validation/canonical-build-evidence.json \
            --plan "$RUNNER_TEMP/photometric-validation-cbe-plan.json" \
            --pipeline-repository "$GITHUB_REPOSITORY" --pipeline-commit "$GITHUB_SHA" \
            --results-repository "$RESULTS_REPOSITORY" --results-ref "${{ steps.contract.outputs.results_ref }}" \
            --workflow-run-id "$GITHUB_RUN_ID" --runner-name "$RUNNER_NAME" \
            --runner-environment "${{ runner.environment }}" --runner-os "$RUNNER_OS" --runner-arch "$RUNNER_ARCH" \
            --github-output "$GITHUB_OUTPUT" --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Download immutable source release
        id: source_release
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env:
          HTH_SOURCE_TOKEN: ${{ secrets.HTH_SOURCE_TOKEN || github.token }}
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          rm -rf source-repo
          python -m hth.source_release \
            --repository "${{ steps.provenance.outputs.source_repository }}" \
            --tag "${{ steps.provenance.outputs.source_release }}" \
            --destination source-repo \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify immutable source release
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.source_release.outputs.manifest_sha256 }}" == "${{ steps.provenance.outputs.source_manifest_sha256 }}" ]]

      - name: Reconstruct and prove every held-out normalized page
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/photometric-validation-materialized"
          python -m hth.assess_orientation_deskew materialize \
            --source-root source-repo/images \
            --canonical-image-manifest results-repo/metadata/image_manifest.json \
            --normalization-manifest results-repo/normalization/normalization-manifest.json \
            --sample-plan "$RUNNER_TEMP/photometric-validation-plan.json" \
            --output "$RUNNER_TEMP/photometric-validation-materialized"

      - name: Validate selected method and protected routing
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          rm -rf photometric-method-validation
          python -m hth.validate_photometric_method evaluate \
            --image-root "$RUNNER_TEMP/photometric-validation-materialized/normalized" \
            --normalization-manifest results-repo/normalization/normalization-manifest.json \
            --photometric-assessment results-repo/normalization/photometric/assessment.json \
            --method-assessment results-repo/normalization/photometric-methods/assessment.json \
            --method-policy results-repo/normalization/photometric-method-policy.json \
            --sample-plan "$RUNNER_TEMP/photometric-validation-plan.json" \
            --config "$VALIDATION_CONFIG" \
            --output photometric-method-validation \
            --github-summary "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/photometric-validation-plan.json" photometric-method-validation/sample-plan.json
          cp "$RUNNER_TEMP/photometric-validation-materialized/materialization-evidence.json" photometric-method-validation/materialization-evidence.json

      - name: Prepare photometric integration decision
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.validate_photometric_method recommend \
            --validation photometric-method-validation/validation.json \
            --output photometric-method-validation/photometric-integration-policy.json \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Finalize photometric validation Canonical Build Evidence
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env: {PYTHONPATH: hth-pipeline}
        run: |
          set -euo pipefail
          python -m hth.canonical_build_evidence finalize \
            --plan "$RUNNER_TEMP/photometric-validation-cbe-plan.json" \
            --output-root photometric-method-validation \
            --evidence-store results-repo/normalization/photometric-validation/canonical-build-evidence.json \
            --evidence-output photometric-method-validation/canonical-build-evidence.json \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Preserve compact held-out validation evidence
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env: {PYTHONPATH: hth-pipeline}
        run: |
          set -euo pipefail
          source hth-pipeline/tools/hardened-persistence.sh
          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          payload="$RUNNER_TEMP/hth-photometric-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$payload"
          mkdir -p "$payload"
          cp photometric-method-validation/{validation.json,validation.csv,sample-plan.json,materialization-evidence.json,photometric-integration-policy.json} "$payload/"
          cp photometric-method-validation/canonical-build-evidence.json "$RUNNER_TEMP/photometric-validation-cbe-incoming.json"

          apply_photometric_validation() {
            python -m hth.canonical_build_evidence merge \
              --scope hth-photometric-validation \
              --base results-repo/normalization/photometric-validation/canonical-build-evidence.json \
              --incoming "$RUNNER_TEMP/photometric-validation-cbe-incoming.json" \
              --output "$payload/canonical-build-evidence.json"
            mkdir -p results-repo/normalization/photometric-validation
            cp "$payload"/* results-repo/normalization/photometric-validation/
            cp "$payload/photometric-integration-policy.json" results-repo/normalization/photometric-integration-policy.json
            hth_results_stage results-repo normalization/photometric-validation normalization/photometric-integration-policy.json
          }
          hth_hardened_persist results-repo main \
            "Publish photometric method validation ${{ github.run_id }}" \
            apply_photometric_validation \
            "Photometric method validation publication"

      - name: Upload held-out photometric validation
        if: steps.cbe.outputs.decision == 'execute'
        uses: ./hth-pipeline/.github/actions/hardened-upload-artifact
        with:
          name: hth-photometric-method-validation-${{ github.run_number }}
          path: photometric-method-validation
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
          compression-level: 6
