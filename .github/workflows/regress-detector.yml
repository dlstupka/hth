name: HTH detector regression

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.algorithm == 'all-without-exhaustive'
      && 'Regress detectors without exhaustive calibration'
      || github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
      && 'Regress detectors against Golden Set'
      || 'Smoke test detectors against Golden Set' }}

on:
  push:
    branches:
      - main
    paths:
      - "hth/**"
      - "config/detectors/**"
      - "config/golden_set.json"
      - "requirements.txt"
      - ".github/workflows/regress-detector.yml"
      - ".github/workflows/_core-hth.yml"
  pull_request:
    branches:
      - main
    paths:
      - "hth/**"
      - "config/detectors/**"
      - "config/golden_set.json"
      - "requirements.txt"
      - ".github/workflows/regress-detector.yml"
      - ".github/workflows/_core-hth.yml"
  workflow_dispatch:
    inputs:
      algorithm:
        description: Detector algorithm to regress
        required: true
        default: all-without-exhaustive
        type: choice
        options:
          - all-without-exhaustive
          - all
          - adaptive_multi_scale_radial_edge
          - adaptive_radial_edge
          - amsre_bfq_spbv_pbg
          - amsre_doc_ufcn_fusion
          - border_energy
          - border_fusion_quad
          - components
          - consensus_quad
          - contour
          - contour_components
          - contour_grabcut
          - contour_projection
          - contour_quad
          - convex_hull
          - cross_edge_contour
          - dhsegment_page_mask
          - distance_transform
          - distance_transform_rect
          - doc_ufcn_page_mask
          - docextractor_page_mask
          - edge_contour
          - eynollah_page_mask
          - grabcut
          - grabcut_contour
          - gradient_vote
          - hough
          - joint_rectangle_vote
          - kraken_page_mask
          - learned_page_mask
          - lsd
          - mask_rcnn_page_mask
          - msre_bfq_spbv_pbg
          - multi_scale_radial_edge
          - orli_page_mask
          - page_background
          - pagenet_page_mask
          - polar_boundary_vote
          - projective_gradient_vote
          - radial_edge
          - radon_boundary
          - ransac
          - scantailor_page_frame
          - segment_supported_polar_vote
          - signed_polar_boundary_vote
          - star_convex
          - text_flow
          - whitespace_frame
      mode:
        description: Regression mode
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
      model_variant:
        description: "Manual model variant; default selects each detector's current registered model (N/A for detectors without variants)"
        required: true
        default: default
        type: choice
        options:
          - default
          - rcnn_hjdataset_current
          - rcnn_hjdataset_older
      strategy:
        description: Regression search strategy
        required: true
        default: exhaustive
        type: choice
        options:
          - exhaustive
          - exhaustive-with-zombies
          - adaptive
          - non-dormant
          - low+
          - moderate+
          - important+
          - critical
          - binary-refine
      golden_set:
        description: "Override Golden Set configuration; blank selects it from the release tag"
        required: false
        default: ""
        type: string
      results_repository:
        description: Repository containing preprocessed images
        required: true
        default: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results
        type: string
      image_root:
        description: Image directory inside the results repository
        required: true
        default: test/latest/raw
        type: string
      golden_release_repository:
        description: Source repository containing the immutable Golden Set image bundle
        required: false
        default: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898
        type: string
      golden_release_tag:
        description: Immutable Golden Set release tag
        required: true
        default: HTH-GOLDEN-0001
        type: choice
        options:
          - HTH-GOLDEN-0001
          - HTH-GOLDEN-0002
      golden_release_freeze:
        description: "Override freeze manifest; blank selects it from the release tag"
        required: false
        default: ""
        type: string
      execution_shape:
        description: Execution shape; preferred uses optimizer intelligence and falls back to auto
        required: true
        default: preferred
        type: choice
        options:
          - preferred
          - auto
          - manual
      manual_execution_shape:
        description: Manual execution shape, e.g. 8p/48t; used only when Execution shape is manual
        required: false
        default: ""
        type: string
      sharding:
        description: "Sharding: auto uses one shard per active pipeline for single-detector runs; a positive integer explicitly assigns that many shards per active pipeline"
        required: true
        default: auto
        type: string
      runner:
        description: Execution runner
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted-hth
          - self-hosted-windows
          - self-hosted-rhel8
          - self-hosted-e7k
          - self-hosted-e9k
      specific_runner:
        description: "Specific self-hosted runner; any keeps the selected runner class"
        required: true
        default: any
        type: choice
        options:
          - any
          - custom
      custom_runner_label:
        description: "Custom self-hosted runner label; used only when Specific self-hosted runner is custom"
        required: false
        default: ""
        type: string
      clean_runner:
        description: "Advanced — Wipe runner workspace and rebuild from scratch"
        required: true
        default: false
        type: boolean
      limit:
        description: "Advanced — parameter-set limit/budget; blank uses the strategy default"
        required: false
        default: ""
        type: string
      max_dimension:
        description: "Advanced — maximum analysis image dimension"
        required: true
        default: "1800"
        type: string
      shard_target_minutes:
        description: "Advanced — target shard wall time for auto planning"
        required: true
        default: "30"
        type: string
      shard_lease_minutes:
        description: "Advanced — shard lease recovery interval"
        required: true
        default: "5"
        type: string
      detector_loading_strategy:
        description: "Advanced — detector loading strategy for non-fanned-out all runs"
        required: true
        default: lpt
        type: choice
        options:
          - lpt
          - fifo
          - ranked
      pipeline_stagger_minutes:
        description: "Advanced — minutes between local detector-pipeline starts"
        required: false
        default: "0"
        type: string
      top:
        description: "Advanced — ranked result count"
        required: true
        default: "20"
        type: string
      debug_level:
        description: "Advanced — debug image detail for manual builds"
        required: true
        default: none
        type: choice
        options:
          - none
          - basic
          - verbose
permissions:
  contents: read
  actions: write

# Apply the branch convention to every git process, including actions/checkout's
# internal git init before any shell step can run.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'workflow_dispatch'
      && format('manual-{0}', github.run_id)
      || 'automatic'
    }}
  cancel-in-progress: false

jobs:
  dispatch-missing-exhaustive:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.algorithm == 'all-without-exhaustive' }}
    name: Dispatch detectors without exhaustive regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Clean reusable results checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d results-repo/.git ]]; then
            git -C results-repo reset --hard
            git -C results-repo clean -ffd
          elif [[ -e results-repo ]]; then
            rm -rf results-repo
          fi

      - name: Checkout results repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.results_repository }}
          path: results-repo
          fetch-depth: 1
          sparse-checkout: |
            indexes/calibration-index.json
            calibration-index.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
          token: ${{ secrets.HTH_RESULTS_TOKEN }}

      - name: Dispatch missing exhaustive detector regressions
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m hth.regression_dispatch \
            --mode all-without-exhaustive \
            --detector-dir hth-pipeline/config/detectors \
            --calibration-index "$(test -f results-repo/indexes/calibration-index.json && printf '%s' results-repo/indexes/calibration-index.json || printf '%s' results-repo/calibration-index.json)" \
            --golden-set "hth-pipeline/${{ inputs.golden_set }}" \
            --repository "$GITHUB_REPOSITORY" \
            --ref "${{ github.ref_name }}" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --results-repository "${{ inputs.results_repository }}" \
            --image-root "${{ inputs.image_root }}" \
            --golden-release-repository "${{ inputs.golden_release_repository }}" \
            --golden-release-tag "${{ inputs.golden_release_tag }}" \
            --golden-release-freeze "${{ inputs.golden_release_freeze }}" \
            --execution-shape "${{ inputs.execution_shape }}" \
            --manual-execution-shape "${{ inputs.manual_execution_shape }}" \
            --runner "${{ inputs.runner }}" \
            --specific-runner "${{ inputs.specific_runner }}" \
            --custom-runner-label "${{ inputs.custom_runner_label }}" \
            --max-dimension "${{ inputs.max_dimension }}" \
            --sharding "${{ inputs.sharding }}" \
            --shard-target-minutes "${{ inputs.shard_target_minutes }}" \
            --shard-lease-minutes "${{ inputs.shard_lease_minutes }}" \
            --detector-loading-strategy "${{ inputs.detector_loading_strategy }}" \
            --pipeline-stagger-minutes "${{ inputs.pipeline_stagger_minutes }}" \
            --top "${{ inputs.top }}" \
            --debug-level "${{ inputs.debug_level }}"

  resolve-execution-dispatch:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.algorithm != 'all-without-exhaustive' }}
    name: Resolve regression runner and preferred shape
    runs-on: ubuntu-latest
    outputs:
      runs_on: ${{ steps.resolve.outputs.runs_on }}
      runner_label: ${{ steps.resolve.outputs.runner_label }}
      runner_name: ${{ steps.resolve.outputs.runner_name }}
      runner_labels: ${{ steps.resolve.outputs.runner_labels }}
      runner_budget: ${{ steps.resolve.outputs.runner_budget }}
      github_hosted: ${{ steps.resolve.outputs.github_hosted }}
      exact: ${{ steps.resolve.outputs.exact }}
      source: ${{ steps.resolve.outputs.source }}
      pipelines: ${{ steps.resolve.outputs.pipelines }}
      threads_per_pipeline: ${{ steps.resolve.outputs.threads_per_pipeline }}
    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Clean reusable results checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d results-repo/.git ]]; then
            git -C results-repo reset --hard
            git -C results-repo clean -ffd
          elif [[ -e results-repo ]]; then
            rm -rf results-repo
          fi

      - name: Checkout results repository
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event_name == 'workflow_dispatch' && inputs.results_repository || 'dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results' }}
          path: results-repo
          fetch-depth: 1
          sparse-checkout: |
            indexes/parallelism-index.json
            execution-optimizer/*/summary.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
          token: ${{ github.event_name != 'pull_request' && secrets.HTH_RESULTS_TOKEN || github.token }}

      - name: Resolve preferred dispatch target
        id: resolve
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.regression_shape dispatch-resolve \
            --shape-mode "${{ github.event_name == 'workflow_dispatch' && inputs.execution_shape || 'auto' }}" \
            --regression-mode "${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'smoke' }}" \
            --strategy "${{ github.event_name == 'workflow_dispatch' && inputs.strategy || 'exhaustive' }}" \
            --limit "${{ github.event_name == 'workflow_dispatch' && inputs.limit || '' }}" \
            --detector "${{ github.event_name == 'workflow_dispatch' && inputs.algorithm || 'all' }}" \
            --parallelism-index results-repo/indexes/parallelism-index.json \
            --detector-config-root hth-pipeline/config/detectors \
            --golden-set "hth-pipeline/${{ github.event_name == 'workflow_dispatch' && inputs.golden_set || 'config/golden_set.json' }}" \
            --max-dimension "${{ github.event_name == 'workflow_dispatch' && inputs.max_dimension || '1800' }}" \
            --requested-runner "${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'github-hosted' }}" \
            --specific-runner "${{ github.event_name == 'workflow_dispatch' && inputs.specific_runner || 'any' }}" \
            --custom-runner-label "${{ github.event_name == 'workflow_dispatch' && inputs.custom_runner_label || '' }}" \
            --github-output "$GITHUB_OUTPUT"

  regress:
    needs: resolve-execution-dispatch
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.algorithm != 'all-without-exhaustive' }}
    strategy:
      fail-fast: false
      matrix:
        # GitHub schedules machines; HTH schedules detector concurrency inside
        # one self-hosted machine. Keep `all` as one aggregate job.
        detector: ${{ fromJSON(format('["{0}"]', github.event_name == 'workflow_dispatch' && inputs.algorithm || 'all')) }}
    name: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
          && format('Regress {0} against Golden Set', matrix.detector)
          || format('Smoke test {0} against Golden Set', matrix.detector) }}
    runs-on: ${{ fromJSON(needs.resolve-execution-dispatch.outputs.runs_on) }}
    # Automatic and manually dispatched smoke tests retain a 120-minute guard.
    # GitHub-hosted full regressions are limited to 6 hours by GitHub Actions.
    # Self-hosted full regressions may run for up to 5 days (7200 minutes),
    # while still protecting an outside runner from a permanently stalled job.
    timeout-minutes: >-
      ${{ github.event_name != 'workflow_dispatch' && 120
          || inputs.mode == 'smoke' && 120
          || needs.resolve-execution-dispatch.outputs.github_hosted == '1' && 360
          || 7200 }}

    env:
      DETECTOR_ALGORITHM: ${{ matrix.detector }}
      GOLDEN_SET: ${{ github.event_name == 'workflow_dispatch' && inputs.golden_set || (github.event_name == 'workflow_dispatch' && inputs.golden_release_tag == 'HTH-GOLDEN-0002' && 'config/golden_sets/HTH-GOLDEN-0002.golden-set.json' || 'config/golden_set.json') }}
      RESULTS_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.results_repository || 'dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results' }}
      IMAGE_ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.image_root || 'test/latest/raw' }}
      GOLDEN_RELEASE_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.golden_release_repository || 'dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898' }}
      GOLDEN_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.golden_release_tag || 'HTH-GOLDEN-0001' }}
      GOLDEN_RELEASE_FREEZE: ${{ github.event_name == 'workflow_dispatch' && inputs.golden_release_freeze || (github.event_name == 'workflow_dispatch' && inputs.golden_release_tag == 'HTH-GOLDEN-0002' && 'config/golden_sets/HTH-GOLDEN-0002.freeze.json' || 'config/golden_sets/HTH-0001.freeze.json') }}
      REGRESSION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'smoke' }}
      STRATEGY: ${{ github.event_name == 'workflow_dispatch' && inputs.strategy || 'exhaustive' }}
      LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '' }}
      MAX_DIMENSION: ${{ github.event_name == 'workflow_dispatch' && inputs.max_dimension || '1800' }}
      TOP_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.top || '10' }}
      EXECUTION_SHAPE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_shape || 'auto' }}
      MANUAL_EXECUTION_SHAPE: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_execution_shape || '' }}
      THREADS: auto
      SHARDING: ${{ github.event_name == 'workflow_dispatch' && inputs.sharding || 'auto' }}
      SHARD_TARGET_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.shard_target_minutes || '30' }}
      SHARD_LEASE_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.shard_lease_minutes || '5' }}
      DETECTOR_PIPELINES: ${{ matrix.detector == 'all' && needs.resolve-execution-dispatch.outputs.github_hosted != '1' && 'auto' || '4' }}
      DETECTOR_LOADING_STRATEGY: ${{ github.event_name == 'workflow_dispatch' && inputs.detector_loading_strategy || 'lpt' }}
      PIPELINE_STAGGER_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.pipeline_stagger_minutes || '0' }}
      DEBUG_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_level || 'none' }}
      HTH_MODEL_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.model_variant || 'default' }}
      PYTHONNOUSERSITE: "1"
      PYTHONUNBUFFERED: "1"
      HTH_RUNNER_LABELS: ${{ needs.resolve-execution-dispatch.outputs.runner_labels }}
      HTH_RUNNER_LABEL: ${{ needs.resolve-execution-dispatch.outputs.runner_label }}
      HTH_DISPATCH_RUNNER_NAME: ${{ needs.resolve-execution-dispatch.outputs.runner_name }}
      HTH_DISPATCH_RUNNER_BUDGET: ${{ needs.resolve-execution-dispatch.outputs.runner_budget }}
      HTH_PRE_RESOLVED_EXECUTION_SHAPE: ${{ needs.resolve-execution-dispatch.outputs.exact }}
      HTH_PRE_RESOLVED_SOURCE: ${{ needs.resolve-execution-dispatch.outputs.source }}
      HTH_PRE_RESOLVED_PIPELINES: ${{ needs.resolve-execution-dispatch.outputs.pipelines }}
      HTH_PRE_RESOLVED_THREADS: ${{ needs.resolve-execution-dispatch.outputs.threads_per_pipeline }}

    steps:
      - name: Wipe runner workspace
        if: ${{ runner.environment == 'self-hosted' && inputs.clean_runner }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Wiping self-hosted runner workspace: $GITHUB_WORKSPACE"
          # Preserve the workspace directory itself because the runner owns it,
          # but remove every checked-out repo, reusable runtime, artifact, cache,
          # dotfile, and other HTH state beneath it. Subsequent checkout/setup
          # steps rebuild the job from scratch.
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          echo "Removing reusable HTH runtime: /tmp/.ar/.hth-runtime"
          rm -rf "/tmp/.ar/.hth-runtime"
          echo "Runner workspace and reusable HTH runtime wiped; continuing with fresh checkouts."

      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Clean reusable results checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d results-repo/.git ]]; then
            git -C results-repo reset --hard
            git -C results-repo clean -ffd
          elif [[ -e results-repo ]]; then
            rm -rf results-repo
          fi

      - name: Checkout results repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.RESULTS_REPOSITORY }}
          path: results-repo
          fetch-depth: 1
          sparse-checkout: |
            indexes/calibration-index.json
            calibration-index.json
            indexes/parameter-provenance-index.json
            parameter-provenance-index.json
            indexes/runtime-index.json
            runtime-index.json
            indexes/parallelism-index.json
            parallelism-index.json
            execution-optimizer/*/summary.md
            indexes/multidetector-index.json
            multidetector-index.json
            indexes/optimizer-predictions.json
            optimizer-predictions.json
            indexes/orli-evidence-index.json
            orli-evidence-index.json
            source-documents
            learned-evidence/orli_page_mask
            ${{ env.GOLDEN_RELEASE_TAG == '' && env.IMAGE_ROOT || '' }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
          token: ${{ github.event_name != 'pull_request' && secrets.HTH_RESULTS_TOKEN || github.token }}

      - name: Materialize immutable Golden Set images
        if: ${{ env.GOLDEN_RELEASE_TAG != '' }}
        id: golden_images
        shell: bash
        env:
          HTH_SOURCE_TOKEN: ${{ secrets.HTH_SOURCE_TOKEN || github.token }}
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          if [[ -z "$GOLDEN_RELEASE_REPOSITORY" || -z "$GOLDEN_RELEASE_FREEZE" ]]; then
            echo "::error::golden_release_repository and golden_release_freeze are required with golden_release_tag"
            exit 1
          fi
          python -m hth.golden_set_release \
            --repository "$GOLDEN_RELEASE_REPOSITORY" \
            --tag "$GOLDEN_RELEASE_TAG" \
            --freeze "hth-pipeline/$GOLDEN_RELEASE_FREEZE" \
            --destination "$RUNNER_TEMP/golden-set-images" \
            --github-output "$GITHUB_OUTPUT"
          echo "IMAGE_ROOT=$RUNNER_TEMP/golden-set-images/raw" >> "$GITHUB_ENV"

      - name: Set up canonical HTH Python runtime
        uses: ./hth-pipeline/.github/actions/setup-hth-python
        with:
          pipeline-path: hth-pipeline
          runner-label: ${{ env.HTH_RUNNER_LABEL }}

      - name: Set up canonical HTH managed runtime
        uses: ./hth-pipeline/.github/actions/setup-hth-managed-runtime
        with:
          pipeline-path: hth-pipeline
          need-dhsegment: ${{ matrix.detector == 'dhsegment_page_mask' || matrix.detector == 'all' }}
          need-eynollah: ${{ matrix.detector == 'eynollah_page_mask' || matrix.detector == 'all' }}
          need-docextractor: ${{ matrix.detector == 'docextractor_page_mask' || matrix.detector == 'all' }}
          need-doc-ufcn: ${{ matrix.detector == 'doc_ufcn_page_mask' || matrix.detector == 'amsre_doc_ufcn_fusion' || matrix.detector == 'all' }}
          need-mask-rcnn: ${{ matrix.detector == 'mask_rcnn_page_mask' || matrix.detector == 'all' }}
          need-kraken: ${{ matrix.detector == 'kraken_page_mask' || matrix.detector == 'all' }}
          need-orli: ${{ matrix.detector == 'orli_page_mask' || matrix.detector == 'all' }}
          verify-abi: "true"
          show-toolchain: "true"
          benchmark-opencv: "true"

      - name: Resolve regression execution shape
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          echo "Execution shape request: ${EXECUTION_SHAPE_MODE:-auto}"
          shape_args=()
          if [[ -n "${HTH_PRE_RESOLVED_PIPELINES:-}" && -n "${HTH_PRE_RESOLVED_THREADS:-}" ]]; then
            shape_args+=(--pre-resolved-pipelines "$HTH_PRE_RESOLVED_PIPELINES")
            shape_args+=(--pre-resolved-threads "$HTH_PRE_RESOLVED_THREADS")
            shape_args+=(--pre-resolved-source "${HTH_PRE_RESOLVED_SOURCE:-preferred-dispatch}")
          fi
          python -m hth.regression_shape workflow-resolve \
            --shape-mode "${EXECUTION_SHAPE_MODE:-auto}" \
            --regression-mode "$REGRESSION_MODE" \
            --strategy "$STRATEGY" \
            --limit "${LIMIT:-}" \
            --detector "$DETECTOR_ALGORITHM" \
            --manual-shape "${MANUAL_EXECUTION_SHAPE:-}" \
            --parallelism-index results-repo/indexes/parallelism-index.json \
            --predictions-index results-repo/indexes/optimizer-predictions.json \
            --multidetector-index results-repo/indexes/multidetector-index.json \
            --detector-config-root hth-pipeline/config/detectors \
            --golden-set "hth-pipeline/$GOLDEN_SET" \
            --max-dimension "$MAX_DIMENSION" \
            --runner-name "${HTH_RUNNER_NAME:-${RUNNER_NAME:-unknown}}" \
            --runner-label "${HTH_RUNNER_LABEL:-unknown}" \
            --runner-budget "${HTH_DISPATCH_RUNNER_BUDGET:-16}" \
            "${shape_args[@]}" \
            --github-env "$GITHUB_ENV"

      - name: Reset regression output workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf regression-output
          rm -f regression-summary.md

      - name: Run detector regressions
        id: regression
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          bash hth-pipeline/tools/run-detector-regressions.sh

      - name: Persist calibration intelligence
        id: persistence
        if: ${{ steps.regression.outcome == 'success' && github.event_name != 'pull_request' }}
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          HTH_RESULTS_TOKEN: ${{ secrets.HTH_RESULTS_TOKEN }}
        run: |
          set -euo pipefail
          source hth-pipeline/tools/hardened-persistence.sh

          if [[ -z "${HTH_RESULTS_TOKEN:-}" ]]; then
            echo "::error::HTH_RESULTS_TOKEN is required to persist calibration intelligence"
            exit 1
          fi

          publish_args=()
          while IFS= read -r run_dir; do
            [[ -n "$run_dir" ]] || continue
            publish_args+=(--run-dir "$run_dir")
          done < "${{ steps.regression.outputs.run_dirs_file }}"

          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C results-repo remote set-url origin \
            "https://x-access-token:${HTH_RESULTS_TOKEN}@github.com/${RESULTS_REPOSITORY}.git"

          apply_calibration_intelligence() {
            hth_results_clean_owned results-repo \
              indexes/calibration-index.json indexes/parameter-provenance-index.json indexes/runtime-index.json \
              indexes/parallelism-index.json indexes/multidetector-index.json indexes/optimizer-predictions.json \
              source-documents/
            if [[ -d results-repo/learned-evidence/orli_page_mask ]]; then
              python -m hth.regression.learned_evidence rebuild-orli-index --results-root results-repo
            fi


            python -m hth.calibration_store publish \
              "${publish_args[@]}" \
              --results-root results-repo \
              --mode "$REGRESSION_MODE" \
              --source-fallback "$RESULTS_REPOSITORY" \
              --workflow "${{ github.workflow }}" \
              --event "${{ github.event_name }}" \
              --repository "${{ github.repository }}" \
              --run-id "${{ github.run_id }}" \
              --run-number "${{ github.run_number }}" \
              --run-attempt "${{ github.run_attempt }}" \
              --ref "${{ github.ref }}" \
              --sha "${{ github.sha }}" \
              --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            if [[ -f regression-output/multidetector-execution.json ]]; then
              python -m hth.multidetector_store publish \
                --metadata regression-output/multidetector-execution.json \
                --results-root results-repo
            fi

            hth_results_remove_legacy_indexes results-repo

            hth_results_stage results-repo \
              indexes/calibration-index.json indexes/parameter-provenance-index.json indexes/runtime-index.json \
              indexes/parallelism-index.json indexes/multidetector-index.json source-documents/
            if [[ -f results-repo/indexes/optimizer-predictions.json ]]; then
              hth_results_stage results-repo indexes/optimizer-predictions.json
            fi
            if [[ -d results-repo/learned-evidence/orli_page_mask ]]; then
              hth_results_stage results-repo learned-evidence/orli_page_mask indexes/orli-evidence-index.json
            fi

            if git -C results-repo diff --cached --name-only | grep -E '(^|/)models/' >/dev/null; then
              echo "::error::Calibration persistence attempted to stage a model payload."
              git -C results-repo diff --cached --name-only
              return 1
            fi
          }

          hth_hardened_persist \
            results-repo main \
            "Update calibration intelligence from HTH run ${{ github.run_number }}" \
            apply_calibration_intelligence \
            "Calibration intelligence"

          echo "results_commit=$HTH_PERSIST_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Write Regression Manifest
        if: ${{ always() && steps.regression.outputs.run_dirs_file != '' }}
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          HTH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          summary_args=()
          while IFS= read -r run_dir; do
            [[ -n "$run_dir" ]] || continue
            summary_args+=(--run-dir "$run_dir")
          done < "${{ steps.regression.outputs.run_dirs_file }}"

          python hth-pipeline/hth/write_regression_summary.py \
            "${summary_args[@]}" \
            --pipeline-repository "${{ github.repository }}" \
            --results-repository "$RESULTS_REPOSITORY" \
            --results-commit "${{ steps.persistence.outputs.results_commit }}" \
            --calibration-index results-repo/indexes/calibration-index.json \
            --runtime-index results-repo/indexes/runtime-index.json \
            --multidetector-index results-repo/indexes/multidetector-index.json \
            --output regression-summary.md

          python hth-pipeline/hth/write_action_summary.py regression-summary.md "$GITHUB_STEP_SUMMARY"

      - name: Upload regression run
        if: ${{ always() }}
        uses: ./hth-pipeline/.github/actions/hardened-upload-artifact
        with:
          name: detector-regression-${{ github.run_id }}-${{ matrix.detector }}
          path: |
            regression-output/
            regression-summary.md
          if-no-files-found: warn
          retention-days: 14
          durable-persistence-confirmed: ${{ steps.persistence.outcome == 'success' }}
