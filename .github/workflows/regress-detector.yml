name: HTH detector regression

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.algorithm == 'all-without-exhaustive'
      && 'Regress detectors without exhaustive calibration'
      || github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
      && 'Regress detectors against Golden Set'
      || 'Smoke test detectors against Golden Set' }}

on:
  push:
    branches:
      - main
    paths:
      - "hth/**"
      - "config/detectors/**"
      - "config/golden_set.json"
      - "requirements.txt"
      - ".github/workflows/regress-detector.yml"
  pull_request:
    branches:
      - main
    paths:
      - "hth/**"
      - "config/detectors/**"
      - "config/golden_set.json"
      - "requirements.txt"
      - ".github/workflows/regress-detector.yml"
  workflow_dispatch:
    inputs:
      algorithm:
        description: Detector algorithm to regress
        required: true
        default: all-without-exhaustive
        type: choice
        options:
          - all-without-exhaustive
          - all
          - contour
          - contour_quad
          - contour_components
          - contour_projection
          - contour_grabcut
          - grabcut_contour
          - consensus_quad
          - edge_contour
          - cross_edge_contour
          - gradient_vote
          - radial_edge
          - adaptive_radial_edge
          - border_energy
          - components
          - ransac
          - grabcut
          - hough
          - lsd
      mode:
        description: Regression mode
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
      strategy:
        description: Regression search strategy
        required: true
        default: exhaustive
        type: choice
        options:
          - exhaustive
          - non-dormant
          - low+
          - moderate+
          - important+
          - critical
          - binary-refine
      golden_set:
        description: Golden Set configuration
        required: true
        default: config/golden_set.json
        type: string
      results_repository:
        description: Repository containing preprocessed images
        required: true
        default: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results
        type: string
      image_root:
        description: Image directory inside the results repository
        required: true
        default: test/latest/raw
        type: string
      execution_shape:
        description: Execution shape; preferred uses optimizer intelligence and falls back to auto
        required: true
        default: preferred
        type: choice
        options:
          - preferred
          - auto
          - manual
      manual_execution_shape:
        description: Manual execution shape, e.g. 8p/48t; used only when Execution shape is manual
        required: false
        default: ""
        type: string
      runner:
        description: Execution runner
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted-hth
          - self-hosted-windows
          - self-hosted-rhel8
          - self-hosted-e7k
          - self-hosted-e9k
      specific_runner:
        description: "Specific self-hosted runner; any keeps the selected runner class"
        required: true
        default: any
        type: choice
        options:
          - any
          - custom
      custom_runner_label:
        description: "Custom self-hosted runner label; used only when Specific self-hosted runner is custom"
        required: false
        default: ""
        type: string
      limit:
        description: "Advanced — exhaustive parameter-set limit; blank means no limit"
        required: false
        default: ""
        type: string
      max_dimension:
        description: "Advanced — maximum analysis image dimension"
        required: true
        default: "1800"
        type: string
      shards:
        description: "Advanced — shard count override for auto shape; blank uses wall-clock planning"
        required: false
        default: ""
        type: string
      shard_target_minutes:
        description: "Advanced — target shard wall time for auto planning"
        required: true
        default: "30"
        type: string
      shard_lease_minutes:
        description: "Advanced — shard lease recovery interval"
        required: true
        default: "5"
        type: string
      detector_loading_strategy:
        description: "Advanced — detector loading strategy for non-fanned-out all runs"
        required: true
        default: lpt
        type: choice
        options:
          - lpt
          - fifo
          - ranked
      pipeline_stagger_minutes:
        description: "Advanced — minutes between local detector-pipeline starts"
        required: false
        default: "0"
        type: string
      top:
        description: "Advanced — ranked result count"
        required: true
        default: "20"
        type: string
      debug_level:
        description: "Advanced — debug image detail for manual builds"
        required: true
        default: none
        type: choice
        options:
          - none
          - basic
          - verbose
permissions:
  contents: read
  actions: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'workflow_dispatch'
      && format('{0}-{1}-{2}-{3}', inputs.runner, inputs.specific_runner, inputs.custom_runner_label, inputs.algorithm)
      || 'automatic'
    }}
  cancel-in-progress: false

jobs:
  dispatch-missing-exhaustive:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.algorithm == 'all-without-exhaustive' }}
    name: Dispatch detectors without exhaustive regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout results repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.results_repository }}
          path: results-repo
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.HTH_RESULTS_TOKEN }}

      - name: Dispatch missing exhaustive detector regressions
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m hth.regression_dispatch \
            --mode all-without-exhaustive \
            --detector-dir hth-pipeline/config/detectors \
            --calibration-index results-repo/calibration-index.json \
            --golden-set "hth-pipeline/${{ inputs.golden_set }}" \
            --repository "$GITHUB_REPOSITORY" \
            --ref "${{ github.ref_name }}" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --results-repository "${{ inputs.results_repository }}" \
            --image-root "${{ inputs.image_root }}" \
            --execution-shape "${{ inputs.execution_shape }}" \
            --manual-execution-shape "${{ inputs.manual_execution_shape }}" \
            --runner "${{ inputs.runner }}" \
            --specific-runner "${{ inputs.specific_runner }}" \
            --custom-runner-label "${{ inputs.custom_runner_label }}" \
            --max-dimension "${{ inputs.max_dimension }}" \
            --shards "${{ inputs.shards }}" \
            --shard-target-minutes "${{ inputs.shard_target_minutes }}" \
            --shard-lease-minutes "${{ inputs.shard_lease_minutes }}" \
            --detector-loading-strategy "${{ inputs.detector_loading_strategy }}" \
            --pipeline-stagger-minutes "${{ inputs.pipeline_stagger_minutes }}" \
            --top "${{ inputs.top }}" \
            --debug-level "${{ inputs.debug_level }}"

  regress:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.algorithm != 'all-without-exhaustive' }}
    strategy:
      fail-fast: false
      matrix:
        detector: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.algorithm == 'all' && (inputs.specific_runner == 'custom' || inputs.runner != 'github-hosted') && '["contour","contour_quad","contour_components","contour_projection","contour_grabcut","grabcut_contour","consensus_quad","edge_contour","cross_edge_contour","gradient_vote","radial_edge","adaptive_radial_edge","border_energy","components","ransac","grabcut","hough","lsd"]' || format('["{0}"]', github.event_name == 'workflow_dispatch' && inputs.algorithm || 'all')) }}
    name: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
          && format('Regress {0} against Golden Set', matrix.detector)
          || format('Smoke test {0} against Golden Set', matrix.detector) }}
    runs-on: >-
      ${{    github.event_name == 'workflow_dispatch' && inputs.specific_runner == 'custom' && inputs.custom_runner_label != '' && fromJSON(format('["self-hosted","{0}"]', inputs.custom_runner_label))
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-windows' && fromJSON('["self-hosted","Windows","X64"]')
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-hth'     && fromJSON('["self-hosted","Linux","X64","hth"]')
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-rhel8'   && fromJSON('["self-hosted","Linux","X64","rhel8"]')
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-e7k'     && fromJSON('["self-hosted","Linux","X64","e7k"]')
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-e9k'     && fromJSON('["self-hosted","Linux","X64","e9k"]')
          || 'ubuntu-latest'}}
    # Automatic and manually dispatched smoke tests retain a 30-minute guard.
    # GitHub-hosted full regressions are limited to 6 hours by GitHub Actions.
    # Self-hosted full regressions may run for up to 5 days (7200 minutes),
    # while still protecting an outside runner from a permanently stalled job.
    timeout-minutes: >-
      ${{ github.event_name != 'workflow_dispatch' && 30
          || inputs.mode == 'smoke' && 30
          || inputs.runner == 'github-hosted' && inputs.specific_runner != 'custom' && 360
          || 7200 }}

    env:
      DETECTOR_ALGORITHM: ${{ matrix.detector }}
      GOLDEN_SET: ${{ github.event_name == 'workflow_dispatch' && inputs.golden_set || 'config/golden_set.json' }}
      RESULTS_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.results_repository || 'dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results' }}
      IMAGE_ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.image_root || 'test/latest/raw' }}
      REGRESSION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'smoke' }}
      STRATEGY: ${{ github.event_name == 'workflow_dispatch' && inputs.strategy || 'exhaustive' }}
      LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '' }}
      MAX_DIMENSION: ${{ github.event_name == 'workflow_dispatch' && inputs.max_dimension || '1800' }}
      TOP_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.top || '10' }}
      EXECUTION_SHAPE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_shape || 'auto' }}
      MANUAL_EXECUTION_SHAPE: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_execution_shape || '' }}
      THREADS: auto
      SHARDS: ${{ github.event_name == 'workflow_dispatch' && inputs.shards || '' }}
      SHARD_TARGET_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.shard_target_minutes || '30' }}
      SHARD_LEASE_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.shard_lease_minutes || '5' }}
      DETECTOR_PIPELINES: '4'
      DETECTOR_LOADING_STRATEGY: ${{ github.event_name == 'workflow_dispatch' && inputs.detector_loading_strategy || 'lpt' }}
      PIPELINE_STAGGER_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.pipeline_stagger_minutes || '0' }}
      DEBUG_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_level || 'none' }}
      PYTHONNOUSERSITE: "1"
      PYTHONUNBUFFERED: "1"
      HTH_RUNNER_LABELS: >-
        ${{  github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-hth' && 'self-hosted,linux,x64,hth'
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-rhel8' && 'self-hosted,linux,x64,rhel8'
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-e7k' && 'self-hosted,linux,x64,e7k'
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-e9k' && 'self-hosted,linux,x64,e9k'
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-windows' && 'self-hosted,windows,x64'
          || 'ubuntu-latest' }}
      HTH_RUNNER_LABEL: >-
        ${{  github.event_name == 'workflow_dispatch' && inputs.specific_runner == 'custom' && inputs.custom_runner_label != '' && inputs.custom_runner_label
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-hth' && 'hth'
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-rhel8' && 'rhel8'
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-e7k' && 'e7k'
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-e9k' && 'e9k'
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-windows' && 'windows'
          || 'github-hosted' }}

    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout results repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.RESULTS_REPOSITORY }}
          path: results-repo
          fetch-depth: 1
          persist-credentials: false
          token: ${{ github.event_name != 'pull_request' && secrets.HTH_RESULTS_TOKEN || github.token }}

      - name: Runner diagnostics
        shell: bash
        run: |
          set -euo pipefail

          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "runner.environment=${{ runner.environment }}"
          echo "runner.name=${{ runner.name }}"

          # Export runtime metadata for later reporting.
          echo "HTH_EXECUTION_ENVIRONMENT=${{ runner.environment }}" >> "$GITHUB_ENV"
          echo "HTH_RUNNER_NAME=${{ runner.name }}" >> "$GITHUB_ENV"
          echo "HTH_RUNNER_LABEL=${HTH_RUNNER_LABEL}" >> "$GITHUB_ENV"
          
      - name: Set up Python — GitHub-hosted Linux
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hth-pipeline/requirements.txt

      - name: Verify Python — self-hosted Linux
        if: ${{ runner.os == 'Linux' && runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "python: $(command -v python)"
          python --version
          python -m pip --version

          python - <<'PY'
          import sys

          if sys.version_info[:2] != (3, 12):
              raise SystemExit(
                  f"Expected Python 3.12, got {sys.version} "
                  f"from {sys.executable}"
              )

          print(f"Python executable: {sys.executable}")
          PY
          
      - name: Use repaired Python tool cache — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pythonVersion = "3.12.10"
          $pythonRoot = Join-Path `
            $env:RUNNER_TOOL_CACHE `
            "Python\$pythonVersion\x64"
          $pythonExe = Join-Path $pythonRoot "python.exe"
          $completeMarker = "$pythonRoot.complete"
          $scriptsDir = Join-Path $pythonRoot "Scripts"

          if (-not (Test-Path -LiteralPath $completeMarker)) {
            throw "Python tool-cache marker is missing: $completeMarker"
          }

          if (-not (Test-Path -LiteralPath $pythonExe)) {
            throw "Python executable is missing: $pythonExe"
          }

          # Make this interpreter canonical for this step and all later steps.
          $env:PATH = "$pythonRoot;$scriptsDir;$env:PATH"
          $pythonRoot | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append
          $scriptsDir | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

          $actualVersion = & $pythonExe -c `
            "import sys; print('.'.join(map(str, sys.version_info[:3])))"

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to execute $pythonExe"
          }

          if ($actualVersion.Trim() -ne $pythonVersion) {
            throw "Expected Python $pythonVersion; found $actualVersion"
          }

          & $pythonExe -m pip --version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "pip is missing; bootstrapping with ensurepip"
            & $pythonExe -m ensurepip --upgrade
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to bootstrap pip"
            }
          }

          Write-Host "Using Python: $pythonExe"
          & $pythonExe --version
          & $pythonExe -m pip --version

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail

          bootstrap_python="$(command -v python)"
          venv_dir="$RUNNER_TEMP/hth-python-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "Bootstrap Python: $bootstrap_python"
          "$bootstrap_python" --version
          "$bootstrap_python" -m pip --version

          rm -rf "$venv_dir"
          "$bootstrap_python" -m venv "$venv_dir"

          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            venv_bin="$venv_dir/Scripts"
            venv_python="$venv_bin/python.exe"
            github_path_entry="$(cygpath -w "$venv_bin")"
          else
            venv_bin="$venv_dir/bin"
            venv_python="$venv_bin/python"
            github_path_entry="$venv_bin"
          fi

          if [[ ! -x "$venv_python" ]]; then
            echo "::error::Virtual-environment Python is missing: $venv_python"
            exit 1
          fi

          echo "$github_path_entry" >> "$GITHUB_PATH"
          echo "HTH_VENV=$venv_dir" >> "$GITHUB_ENV"
          echo "HTH_BOOTSTRAP_PYTHON=$bootstrap_python" >> "$GITHUB_ENV"

          "$venv_python" -m pip install --upgrade pip

          "$venv_python" - <<'PY'
          import site
          import sys

          print(f"Venv executable : {sys.executable}")
          print(f"sys.prefix      : {sys.prefix}")
          print(f"sys.base_prefix : {sys.base_prefix}")
          print(f"User site       : {site.USER_SITE}")
          print(f"User site active: {site.ENABLE_USER_SITE}")

          if sys.prefix == sys.base_prefix:
              raise SystemExit("Virtual environment is not active")
          if site.ENABLE_USER_SITE:
              raise SystemExit("User site-packages unexpectedly enabled")
          PY

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "Active Python: $(command -v python)"
          python --version
          python -m pip --version
          python -m pip install --requirement hth-pipeline/requirements.txt
          python -m pip check

      - name: Verify Python dependency ABI
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import sys
          import cv2
          import numpy
          import skimage

          print(f"Python       : {sys.executable}")
          print(f"NumPy        : {numpy.__version__} ({numpy.__file__})")
          print(f"scikit-image : {skimage.__version__} ({skimage.__file__})")
          print(f"OpenCV       : {cv2.__version__} ({cv2.__file__})")
          PY

      - name: Show toolchain environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Toolchain Environment"
          echo "====================="
          echo "Runner name      : ${RUNNER_NAME:-unknown}"
          echo "Runner OS        : ${RUNNER_OS:-unknown}"
          echo "Runner arch      : ${RUNNER_ARCH:-unknown}"
          echo "Runner toolcache : ${RUNNER_TOOL_CACHE:-unknown}"
          echo "SHELL            : ${SHELL:-unset}"
          echo "MSYSTEM          : ${MSYSTEM:-unset}"
          echo "OSTYPE           : ${OSTYPE:-unset}"
          echo

          echo "Shell resolution"
          echo "----------------"
          echo "bash executable  : $(command -v bash)"
          echo "sh executable    : $(command -v sh)"
          type -a bash || true
          type -a sh || true
          bash --version | head -n 1
          echo

          echo "Tool resolution"
          echo "---------------"
          echo "git executable   : $(command -v git)"
          type -a git || true
          git --version
          echo "bootstrap Python : ${HTH_BOOTSTRAP_PYTHON:-unknown}"
          echo "virtual env      : ${HTH_VENV:-unknown}"
          echo "active Python    : $(command -v python)"
          type -a python || true
          python --version
          python -m pip --version
          
          python - <<'PY'
          import os
          import platform
          import sys
          import cv2
          import numpy

          print(f"OpenCV file      : {cv2.__file__}")
          print(f"NumPy file       : {numpy.__file__}")
          print(f"sys.executable   : {sys.executable}")
          print(f"sys.version      : {sys.version.splitlines()[0]}")
          print(f"platform         : {platform.platform()}")
          print(f"process arch     : {platform.machine()}")
          print(f"PYTHONPATH       : {os.environ.get('PYTHONPATH', 'unset')}")
          PY

          echo
          echo "Filesystem"
          echo "----------------------"
          pwd

          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            echo "Native Windows cwd : $(pwd -W)"
            echo "POSIX -> Windows   : $(cygpath -w .)"
            echo "Workspace -> POSIX : $(cygpath -u "${GITHUB_WORKSPACE:-.}")"

            echo
            echo "Windows executable resolution"
            echo "-----------------------------"
            where.exe bash || true
            where.exe sh || true
            where.exe git || true
            where.exe python || true
            where.exe py || true

            echo
            echo "Git Bash path translation"
            echo "-------------------------"
            echo "cygpath executable : $(command -v cygpath)"
            echo "POSIX root         : /"
            echo "Windows root       : $(cygpath -w /)"
          else
            echo "Native POSIX filesystem; MSYS path translation not applicable."
            echo "Workspace          : ${GITHUB_WORKSPACE:-unset}"
          fi

          echo
          echo "PATH entries"
          echo "------------"
          tr ':' '\n' <<< "$PATH"

      - name: Show OpenCV build
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          python - <<'EOF'
          import cv2

          print(f"OpenCV version: {cv2.__version__}")
          print()

          wanted = (
              "CPU/HW",
              "Baseline:",
              "Dispatched code generation:",
              "Parallel framework",
              "Intel IPP",
              "OpenCL",
              "AVX",
              "SSE",
              "TBB",
              "OpenMP",
          )

          for line in cv2.getBuildInformation().splitlines():
              if any(token in line for token in wanted):
                  print(line)
          EOF
 
      - name: Benchmark OpenCV
        shell: bash
        run: |
          python - <<'EOF'
          import os
          import time
          import cv2
          import numpy as np

          image = np.random.default_rng(12345).integers(
              0, 256, size=(3000, 3000), dtype=np.uint8
          )

          # Warm-up
          for _ in range(5):
              cv2.GaussianBlur(image, (9, 9), 0)

          started = time.perf_counter()
          for _ in range(100):
              cv2.GaussianBlur(image, (9, 9), 0)
          elapsed = time.perf_counter() - started

          average = elapsed / 100
          print(f"GaussianBlur 100 iterations: {elapsed:.3f} seconds")
          print(f"Average per iteration: {average:.6f} seconds")

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as stream:
                  stream.write(f"HTH_OPENCV_BENCHMARK_SECONDS={elapsed:.9f}\n")
                  stream.write(f"HTH_OPENCV_BENCHMARK_AVERAGE_SECONDS={average:.9f}\n")
          EOF
          
      - name: Resolve regression execution shape
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail

          shape_mode="${EXECUTION_SHAPE_MODE:-auto}"
          shape_source="auto"
          runner_budget="$(python - <<'PYBUDGET'
          import os
          print(max(1, os.cpu_count() or 1) * 2)
          PYBUDGET
          )"

          use_exact_shape() {
            local pipelines="$1"
            local threads="$2"
            local source="$3"
            local allocated=$((pipelines * threads))
            if (( allocated > runner_budget )); then
              echo "::error::Execution shape ${pipelines}p/${threads}t allocates ${allocated} threads against detected runner budget ${runner_budget}"
              exit 1
            fi
            echo "THREADS=$threads" >> "$GITHUB_ENV"
            echo "DETECTOR_PIPELINES=$pipelines" >> "$GITHUB_ENV"
            echo "SHARDS=$pipelines" >> "$GITHUB_ENV"
            echo "HTH_EXACT_EXECUTION_SHAPE=1" >> "$GITHUB_ENV"
            echo "HTH_EXACT_EXECUTION_SHAPE_SOURCE=$source" >> "$GITHUB_ENV"
            echo "HTH_EXECUTION_THREAD_BUDGET=$runner_budget" >> "$GITHUB_ENV"
            echo "HTH_ALLOW_THREAD_OVERSUBSCRIPTION=false" >> "$GITHUB_ENV"
            echo "Resolved execution shape: ${pipelines}p/${threads}t (${source}; ${allocated}/${runner_budget} threads)"
          }

          case "$shape_mode" in
            preferred)
              if [[ "$REGRESSION_MODE" != "full" || "$STRATEGY" != "exhaustive" || -n "${LIMIT:-}" ]]; then
                echo "Preferred shape requires full exhaustive regression without a parameter-set limit; falling back to auto."
                echo "HTH_EXACT_EXECUTION_SHAPE_SOURCE=auto-fallback-incompatible-workload" >> "$GITHUB_ENV"
              elif [[ "$DETECTOR_ALGORITHM" == "all" ]]; then
                echo "Preferred per-detector shapes require fan-out; this run is not fanned out, so falling back to auto."
                echo "HTH_EXACT_EXECUTION_SHAPE_SOURCE=auto-fallback-all" >> "$GITHUB_ENV"
              else
                detector_config="hth-pipeline/config/detectors/${DETECTOR_ALGORITHM}.json"
                if read -r pipelines threads shape_source < <(
                  python -m hth.regression_shape preferred \
                    --parallelism-index results-repo/parallelism-index.json \
                    --detector-config "$detector_config" \
                    --golden-set "hth-pipeline/$GOLDEN_SET" \
                    --max-dimension "$MAX_DIMENSION" \
                    --runner-name "${HTH_RUNNER_NAME:-${RUNNER_NAME:-unknown}}" \
                    --runner-label "${HTH_RUNNER_LABEL:-unknown}"
                ); then
                  use_exact_shape "$pipelines" "$threads" "preferred-${shape_source}"
                else
                  echo "No compatible measured preferred shape collected for ${DETECTOR_ALGORITHM} on this runner profile; attempting detector-specific vCPU shape prediction."
                  prediction_file="$RUNNER_TEMP/hth-shape-prediction-${DETECTOR_ALGORITHM}.json"
                  if read -r pipelines threads shape_source < <(
                    python -m hth.regression_shape predicted \
                      --parallelism-index results-repo/parallelism-index.json \
                      --predictions-index results-repo/optimizer-predictions.json \
                      --prediction-out "$prediction_file" \
                      --detector-config "$detector_config" \
                      --golden-set "hth-pipeline/$GOLDEN_SET" \
                      --max-dimension "$MAX_DIMENSION" \
                      --runner-name "${HTH_RUNNER_NAME:-${RUNNER_NAME:-unknown}}" \
                      --runner-label "${HTH_RUNNER_LABEL:-unknown}"
                  ); then
                    use_exact_shape "$pipelines" "$threads" "$shape_source"
                    echo "HTH_SHAPE_PREDICTION_FILE=$prediction_file" >> "$GITHUB_ENV"
                    echo "Predicted execution shape will be persisted and checked against future optimizer evidence."
                  else
                    echo "No compatible optimizer history exists for a responsible shape prediction; falling back to auto."
                    echo "HTH_EXACT_EXECUTION_SHAPE_SOURCE=auto-fallback-no-shape-history" >> "$GITHUB_ENV"
                  fi
                fi
              fi
              ;;
            manual)
              if [[ -z "${MANUAL_EXECUTION_SHAPE:-}" ]]; then
                echo "::error::Manual execution shape is required when Execution shape is manual (example: 8p/48t)"
                exit 1
              fi
              read -r pipelines threads shape_source < <(python -m hth.regression_shape manual "$MANUAL_EXECUTION_SHAPE")
              use_exact_shape "$pipelines" "$threads" "$shape_source"
              ;;
            auto)
              echo "Execution shape: auto planner"
              ;;
            *)
              echo "::error::Unknown execution shape mode: $shape_mode"
              exit 1
              ;;
          esac

      - name: Run detector regressions
        id: regression
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          bash hth-pipeline/tools/run-detector-regressions.sh

      - name: Persist calibration intelligence
        id: persistence
        if: ${{ steps.regression.outcome == 'success' && github.event_name != 'pull_request' }}
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          HTH_RESULTS_TOKEN: ${{ secrets.HTH_RESULTS_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${HTH_RESULTS_TOKEN:-}" ]]; then
            echo "::error::HTH_RESULTS_TOKEN is required to persist calibration intelligence"
            exit 1
          fi

          publish_args=()
          while IFS= read -r run_dir; do
            [[ -n "$run_dir" ]] || continue
            publish_args+=(--run-dir "$run_dir")
          done < "${{ steps.regression.outputs.run_dirs_file }}"

          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C results-repo remote set-url origin \
            "https://x-access-token:${HTH_RESULTS_TOKEN}@github.com/${RESULTS_REPOSITORY}.git"

          published=0
          max_publish_attempts=5
          for attempt in $(seq 1 "$max_publish_attempts"); do
            if (( attempt > 1 )); then
              retry_delay=$((5 * (attempt - 1)))
              echo "Publish collision detected; waiting ${retry_delay}s for calibration intelligence to free up before retrying..."
              sleep "$retry_delay"
            fi

            git -C results-repo fetch origin main
            git -C results-repo reset --hard origin/main
            git -C results-repo clean -fd -- calibration-index.json runtime-index.json parallelism-index.json optimizer-predictions.json source-documents/

            if [[ -n "${HTH_SHAPE_PREDICTION_FILE:-}" && -f "${HTH_SHAPE_PREDICTION_FILE}" ]]; then
              python -m hth.regression_shape record-prediction \
                --prediction-file "${HTH_SHAPE_PREDICTION_FILE}" \
                --predictions-index results-repo/optimizer-predictions.json
            fi

            python -m hth.calibration_store publish \
              "${publish_args[@]}" \
              --results-root results-repo \
              --mode "$REGRESSION_MODE" \
              --source-fallback "$RESULTS_REPOSITORY" \
              --workflow "${{ github.workflow }}" \
              --event "${{ github.event_name }}" \
              --repository "${{ github.repository }}" \
              --run-id "${{ github.run_id }}" \
              --run-number "${{ github.run_number }}" \
              --run-attempt "${{ github.run_attempt }}" \
              --ref "${{ github.ref }}" \
              --sha "${{ github.sha }}" \
              --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            git -C results-repo add calibration-index.json runtime-index.json parallelism-index.json optimizer-predictions.json source-documents/

            if git -C results-repo diff --cached --quiet; then
              echo "Calibration intelligence store already current."
              published=1
              break
            fi

            git -C results-repo commit -m \
              "Update calibration intelligence from HTH run ${{ github.run_number }}"
            if git -C results-repo push origin HEAD:main; then
              published=1
              break
            fi
          done

          if (( published == 0 )); then
            echo "::error::Unable to publish calibration intelligence after ${max_publish_attempts} attempts"
            exit 1
          fi

          RESULTS_COMMIT="$(git -C results-repo rev-parse HEAD)"
          echo "results_commit=$RESULTS_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Write Regression Manifest
        if: ${{ always() && steps.regression.outcome == 'success' }}
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          HTH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          summary_args=()
          while IFS= read -r run_dir; do
            [[ -n "$run_dir" ]] || continue
            summary_args+=(--run-dir "$run_dir")
          done < "${{ steps.regression.outputs.run_dirs_file }}"

          python hth-pipeline/hth/write_regression_summary.py \
            "${summary_args[@]}" \
            --pipeline-repository "${{ github.repository }}" \
            --results-repository "$RESULTS_REPOSITORY" \
            --results-commit "${{ steps.persistence.outputs.results_commit }}" \
            --calibration-index results-repo/calibration-index.json \
            --output regression-summary.md

          cat regression-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload regression run
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: detector-regression-${{ github.run_id }}-${{ matrix.detector }}
          path: |
            regression-output/
            regression-summary.md
          if-no-files-found: warn
          retention-days: 14
