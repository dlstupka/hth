name: HTH detector regression

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.algorithm == 'all-without-exhaustive'
      && 'Regress detectors without exhaustive calibration'
      || github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
      && 'Regress detectors against Golden Set'
      || 'Smoke test detectors against Golden Set' }}

on:
  push:
    branches:
      - main
    paths:
      - "hth/**"
      - "config/detectors/**"
      - "config/golden_set.json"
      - "requirements.txt"
      - ".github/workflows/regress-detector.yml"
      - ".github/workflows/_core-hth.yml"
  pull_request:
    branches:
      - main
    paths:
      - "hth/**"
      - "config/detectors/**"
      - "config/golden_set.json"
      - "requirements.txt"
      - ".github/workflows/regress-detector.yml"
      - ".github/workflows/_core-hth.yml"
  workflow_dispatch:
    inputs:
      algorithm:
        description: Detector algorithm to regress
        required: true
        default: all-without-exhaustive
        type: choice
        options:
          - all-without-exhaustive
          - all
          - adaptive_multi_scale_radial_edge
          - adaptive_radial_edge
          - amsre_bfq_spbv_pbg
          - amsre_doc_ufcn_fusion
          - border_energy
          - border_fusion_quad
          - components
          - consensus_quad
          - contour
          - contour_components
          - contour_grabcut
          - contour_projection
          - contour_quad
          - convex_hull
          - cross_edge_contour
          - dhsegment_page_mask
          - distance_transform
          - distance_transform_rect
          - doc_ufcn_page_mask
          - docextractor_page_mask
          - edge_contour
          - eynollah_page_mask
          - grabcut
          - grabcut_contour
          - gradient_vote
          - hough
          - joint_rectangle_vote
          - kraken_page_mask
          - learned_page_mask
          - lsd
          - mask_rcnn_page_mask
          - msre_bfq_spbv_pbg
          - multi_scale_radial_edge
          - orli_page_mask
          - page_background
          - pagenet_page_mask
          - polar_boundary_vote
          - projective_gradient_vote
          - radial_edge
          - radon_boundary
          - ransac
          - scantailor_page_frame
          - segment_supported_polar_vote
          - signed_polar_boundary_vote
          - star_convex
          - text_flow
          - whitespace_frame
      mode:
        description: Regression mode
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
      model_variant:
        description: "Manual model variant; default selects each detector's current registered model (N/A for detectors without variants)"
        required: true
        default: default
        type: choice
        options:
          - default
          - rcnn_hjdataset_current
          - rcnn_hjdataset_older
      strategy:
        description: Regression search strategy
        required: true
        default: exhaustive
        type: choice
        options:
          - exhaustive
          - exhaustive-with-zombies
          - non-dormant
          - low+
          - moderate+
          - important+
          - critical
          - binary-refine
      golden_set:
        description: Golden Set configuration
        required: true
        default: config/golden_set.json
        type: string
      results_repository:
        description: Repository containing preprocessed images
        required: true
        default: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results
        type: string
      image_root:
        description: Image directory inside the results repository
        required: true
        default: test/latest/raw
        type: string
      execution_shape:
        description: Execution shape; preferred uses optimizer intelligence and falls back to auto
        required: true
        default: preferred
        type: choice
        options:
          - preferred
          - auto
          - manual
      manual_execution_shape:
        description: Manual execution shape, e.g. 8p/48t; used only when Execution shape is manual
        required: false
        default: ""
        type: string
      sharding:
        description: "Sharding: auto uses one shard per active pipeline for single-detector runs; a positive integer explicitly assigns that many shards per active pipeline"
        required: true
        default: auto
        type: string
      runner:
        description: Execution runner
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted-hth
          - self-hosted-windows
          - self-hosted-rhel8
          - self-hosted-e7k
          - self-hosted-e9k
      specific_runner:
        description: "Specific self-hosted runner; any keeps the selected runner class"
        required: true
        default: any
        type: choice
        options:
          - any
          - custom
      custom_runner_label:
        description: "Custom self-hosted runner label; used only when Specific self-hosted runner is custom"
        required: false
        default: ""
        type: string
      clean_runner:
        description: "Advanced — Wipe runner workspace and rebuild from scratch"
        required: true
        default: false
        type: boolean
      limit:
        description: "Advanced — exhaustive parameter-set limit; blank means no limit"
        required: false
        default: ""
        type: string
      max_dimension:
        description: "Advanced — maximum analysis image dimension"
        required: true
        default: "1800"
        type: string
      shard_target_minutes:
        description: "Advanced — target shard wall time for auto planning"
        required: true
        default: "30"
        type: string
      shard_lease_minutes:
        description: "Advanced — shard lease recovery interval"
        required: true
        default: "5"
        type: string
      detector_loading_strategy:
        description: "Advanced — detector loading strategy for non-fanned-out all runs"
        required: true
        default: lpt
        type: choice
        options:
          - lpt
          - fifo
          - ranked
      pipeline_stagger_minutes:
        description: "Advanced — minutes between local detector-pipeline starts"
        required: false
        default: "0"
        type: string
      top:
        description: "Advanced — ranked result count"
        required: true
        default: "20"
        type: string
      debug_level:
        description: "Advanced — debug image detail for manual builds"
        required: true
        default: none
        type: choice
        options:
          - none
          - basic
          - verbose
permissions:
  contents: read
  actions: write

# Apply the branch convention to every git process, including actions/checkout's
# internal git init before any shell step can run.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'workflow_dispatch'
      && format('manual-{0}', github.run_id)
      || 'automatic'
    }}
  cancel-in-progress: false

jobs:
  dispatch-missing-exhaustive:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.algorithm == 'all-without-exhaustive' }}
    name: Dispatch detectors without exhaustive regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Clean reusable results checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d results-repo/.git ]]; then
            git -C results-repo reset --hard
            git -C results-repo clean -ffd
          elif [[ -e results-repo ]]; then
            rm -rf results-repo
          fi

      - name: Checkout results repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.results_repository }}
          path: results-repo
          fetch-depth: 1
          sparse-checkout: |
            indexes/calibration-index.json
            calibration-index.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
          token: ${{ secrets.HTH_RESULTS_TOKEN }}

      - name: Dispatch missing exhaustive detector regressions
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m hth.regression_dispatch \
            --mode all-without-exhaustive \
            --detector-dir hth-pipeline/config/detectors \
            --calibration-index "$(test -f results-repo/indexes/calibration-index.json && printf '%s' results-repo/indexes/calibration-index.json || printf '%s' results-repo/calibration-index.json)" \
            --golden-set "hth-pipeline/${{ inputs.golden_set }}" \
            --repository "$GITHUB_REPOSITORY" \
            --ref "${{ github.ref_name }}" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --results-repository "${{ inputs.results_repository }}" \
            --image-root "${{ inputs.image_root }}" \
            --execution-shape "${{ inputs.execution_shape }}" \
            --manual-execution-shape "${{ inputs.manual_execution_shape }}" \
            --runner "${{ inputs.runner }}" \
            --specific-runner "${{ inputs.specific_runner }}" \
            --custom-runner-label "${{ inputs.custom_runner_label }}" \
            --max-dimension "${{ inputs.max_dimension }}" \
            --sharding "${{ inputs.sharding }}" \
            --shard-target-minutes "${{ inputs.shard_target_minutes }}" \
            --shard-lease-minutes "${{ inputs.shard_lease_minutes }}" \
            --detector-loading-strategy "${{ inputs.detector_loading_strategy }}" \
            --pipeline-stagger-minutes "${{ inputs.pipeline_stagger_minutes }}" \
            --top "${{ inputs.top }}" \
            --debug-level "${{ inputs.debug_level }}"

  resolve-execution-dispatch:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.algorithm != 'all-without-exhaustive' }}
    name: Resolve regression runner and preferred shape
    runs-on: ubuntu-latest
    outputs:
      runs_on: ${{ steps.resolve.outputs.runs_on }}
      runner_label: ${{ steps.resolve.outputs.runner_label }}
      runner_name: ${{ steps.resolve.outputs.runner_name }}
      runner_labels: ${{ steps.resolve.outputs.runner_labels }}
      runner_budget: ${{ steps.resolve.outputs.runner_budget }}
      github_hosted: ${{ steps.resolve.outputs.github_hosted }}
      exact: ${{ steps.resolve.outputs.exact }}
      source: ${{ steps.resolve.outputs.source }}
      pipelines: ${{ steps.resolve.outputs.pipelines }}
      threads_per_pipeline: ${{ steps.resolve.outputs.threads_per_pipeline }}
    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Clean reusable results checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d results-repo/.git ]]; then
            git -C results-repo reset --hard
            git -C results-repo clean -ffd
          elif [[ -e results-repo ]]; then
            rm -rf results-repo
          fi

      - name: Checkout results repository
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event_name == 'workflow_dispatch' && inputs.results_repository || 'dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results' }}
          path: results-repo
          fetch-depth: 1
          sparse-checkout: |
            indexes/parallelism-index.json
            execution-optimizer/*/summary.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
          token: ${{ github.event_name != 'pull_request' && secrets.HTH_RESULTS_TOKEN || github.token }}

      - name: Resolve preferred dispatch target
        id: resolve
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.regression_shape dispatch-resolve \
            --shape-mode "${{ github.event_name == 'workflow_dispatch' && inputs.execution_shape || 'auto' }}" \
            --regression-mode "${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'smoke' }}" \
            --strategy "${{ github.event_name == 'workflow_dispatch' && inputs.strategy || 'exhaustive' }}" \
            --limit "${{ github.event_name == 'workflow_dispatch' && inputs.limit || '' }}" \
            --detector "${{ github.event_name == 'workflow_dispatch' && inputs.algorithm || 'all' }}" \
            --parallelism-index results-repo/indexes/parallelism-index.json \
            --detector-config-root hth-pipeline/config/detectors \
            --golden-set "hth-pipeline/${{ github.event_name == 'workflow_dispatch' && inputs.golden_set || 'config/golden_set.json' }}" \
            --max-dimension "${{ github.event_name == 'workflow_dispatch' && inputs.max_dimension || '1800' }}" \
            --requested-runner "${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'github-hosted' }}" \
            --specific-runner "${{ github.event_name == 'workflow_dispatch' && inputs.specific_runner || 'any' }}" \
            --custom-runner-label "${{ github.event_name == 'workflow_dispatch' && inputs.custom_runner_label || '' }}" \
            --github-output "$GITHUB_OUTPUT"

  regress:
    needs: resolve-execution-dispatch
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.algorithm != 'all-without-exhaustive' }}
    strategy:
      fail-fast: false
      matrix:
        # GitHub schedules machines; HTH schedules detector concurrency inside
        # one self-hosted machine. Keep `all` as one aggregate job.
        detector: ${{ fromJSON(format('["{0}"]', github.event_name == 'workflow_dispatch' && inputs.algorithm || 'all')) }}
    name: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
          && format('Regress {0} against Golden Set', matrix.detector)
          || format('Smoke test {0} against Golden Set', matrix.detector) }}
    runs-on: ${{ fromJSON(needs.resolve-execution-dispatch.outputs.runs_on) }}
    # Automatic and manually dispatched smoke tests retain a 60-minute guard.
    # GitHub-hosted full regressions are limited to 6 hours by GitHub Actions.
    # Self-hosted full regressions may run for up to 5 days (7200 minutes),
    # while still protecting an outside runner from a permanently stalled job.
    timeout-minutes: >-
      ${{ github.event_name != 'workflow_dispatch' && 60
          || inputs.mode == 'smoke' && 60
          || needs.resolve-execution-dispatch.outputs.github_hosted == '1' && 360
          || 7200 }}

    env:
      DETECTOR_ALGORITHM: ${{ matrix.detector }}
      GOLDEN_SET: ${{ github.event_name == 'workflow_dispatch' && inputs.golden_set || 'config/golden_set.json' }}
      RESULTS_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.results_repository || 'dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results' }}
      IMAGE_ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.image_root || 'test/latest/raw' }}
      REGRESSION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'smoke' }}
      STRATEGY: ${{ github.event_name == 'workflow_dispatch' && inputs.strategy || 'exhaustive' }}
      LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '' }}
      MAX_DIMENSION: ${{ github.event_name == 'workflow_dispatch' && inputs.max_dimension || '1800' }}
      TOP_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.top || '10' }}
      EXECUTION_SHAPE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_shape || 'auto' }}
      MANUAL_EXECUTION_SHAPE: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_execution_shape || '' }}
      THREADS: auto
      SHARDING: ${{ github.event_name == 'workflow_dispatch' && inputs.sharding || 'auto' }}
      SHARD_TARGET_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.shard_target_minutes || '30' }}
      SHARD_LEASE_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.shard_lease_minutes || '5' }}
      DETECTOR_PIPELINES: ${{ matrix.detector == 'all' && needs.resolve-execution-dispatch.outputs.github_hosted != '1' && 'auto' || '4' }}
      DETECTOR_LOADING_STRATEGY: ${{ github.event_name == 'workflow_dispatch' && inputs.detector_loading_strategy || 'lpt' }}
      PIPELINE_STAGGER_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.pipeline_stagger_minutes || '0' }}
      DEBUG_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_level || 'none' }}
      HTH_MODEL_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.model_variant || 'default' }}
      PYTHONNOUSERSITE: "1"
      PYTHONUNBUFFERED: "1"
      HTH_RUNNER_LABELS: ${{ needs.resolve-execution-dispatch.outputs.runner_labels }}
      HTH_RUNNER_LABEL: ${{ needs.resolve-execution-dispatch.outputs.runner_label }}
      HTH_DISPATCH_RUNNER_NAME: ${{ needs.resolve-execution-dispatch.outputs.runner_name }}
      HTH_DISPATCH_RUNNER_BUDGET: ${{ needs.resolve-execution-dispatch.outputs.runner_budget }}
      HTH_PRE_RESOLVED_EXECUTION_SHAPE: ${{ needs.resolve-execution-dispatch.outputs.exact }}
      HTH_PRE_RESOLVED_SOURCE: ${{ needs.resolve-execution-dispatch.outputs.source }}
      HTH_PRE_RESOLVED_PIPELINES: ${{ needs.resolve-execution-dispatch.outputs.pipelines }}
      HTH_PRE_RESOLVED_THREADS: ${{ needs.resolve-execution-dispatch.outputs.threads_per_pipeline }}

    steps:
      - name: Wipe runner workspace
        if: ${{ runner.environment == 'self-hosted' && inputs.clean_runner }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Wiping self-hosted runner workspace: $GITHUB_WORKSPACE"
          # Preserve the workspace directory itself because the runner owns it,
          # but remove every checked-out repo, reusable runtime, artifact, cache,
          # dotfile, and other HTH state beneath it. Subsequent checkout/setup
          # steps rebuild the job from scratch.
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          echo "Removing reusable HTH runtime: /tmp/.ar/.hth-runtime"
          rm -rf "/tmp/.ar/.hth-runtime"
          echo "Runner workspace and reusable HTH runtime wiped; continuing with fresh checkouts."

      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Clean reusable results checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d results-repo/.git ]]; then
            git -C results-repo reset --hard
            git -C results-repo clean -ffd
          elif [[ -e results-repo ]]; then
            rm -rf results-repo
          fi

      - name: Checkout results repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.RESULTS_REPOSITORY }}
          path: results-repo
          fetch-depth: 1
          sparse-checkout: |
            indexes/calibration-index.json
            calibration-index.json
            indexes/parameter-provenance-index.json
            parameter-provenance-index.json
            indexes/runtime-index.json
            runtime-index.json
            indexes/parallelism-index.json
            parallelism-index.json
            execution-optimizer/*/summary.md
            indexes/multidetector-index.json
            multidetector-index.json
            indexes/optimizer-predictions.json
            optimizer-predictions.json
            indexes/orli-evidence-index.json
            orli-evidence-index.json
            source-documents
            learned-evidence/orli_page_mask
            ${{ env.IMAGE_ROOT }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
          token: ${{ github.event_name != 'pull_request' && secrets.HTH_RESULTS_TOKEN || github.token }}

      - name: Runner diagnostics
        shell: bash
        run: |
          set -euo pipefail

          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "runner.environment=${{ runner.environment }}"
          echo "runner.name=${{ runner.name }}"

          # Export runtime metadata for later reporting.
          echo "HTH_EXECUTION_ENVIRONMENT=${{ runner.environment }}" >> "$GITHUB_ENV"
          echo "HTH_RUNNER_NAME=${{ runner.name }}" >> "$GITHUB_ENV"
          echo "HTH_RUNNER_LABEL=${HTH_RUNNER_LABEL}" >> "$GITHUB_ENV"
          
      - name: Set up Python — GitHub-hosted Linux
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hth-pipeline/requirements.txt

      - name: Use repaired Python tool cache — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pythonVersion = "3.12.10"
          $pythonRoot = Join-Path `
            $env:RUNNER_TOOL_CACHE `
            "Python\$pythonVersion\x64"
          $pythonExe = Join-Path $pythonRoot "python.exe"
          $completeMarker = "$pythonRoot.complete"
          $scriptsDir = Join-Path $pythonRoot "Scripts"

          if (-not (Test-Path -LiteralPath $completeMarker)) {
            throw "Python tool-cache marker is missing: $completeMarker"
          }

          if (-not (Test-Path -LiteralPath $pythonExe)) {
            throw "Python executable is missing: $pythonExe"
          }

          # Make this interpreter canonical for this step and all later steps.
          $env:PATH = "$pythonRoot;$scriptsDir;$env:PATH"
          $pythonRoot | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append
          $scriptsDir | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

          $actualVersion = & $pythonExe -c `
            "import sys; print('.'.join(map(str, sys.version_info[:3])))"

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to execute $pythonExe"
          }

          if ($actualVersion.Trim() -ne $pythonVersion) {
            throw "Expected Python $pythonVersion; found $actualVersion"
          }

          & $pythonExe -m pip --version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "pip is missing; bootstrapping with ensurepip"
            & $pythonExe -m ensurepip --upgrade
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to bootstrap pip"
            }
          }

          Write-Host "Using Python: $pythonExe"
          & $pythonExe --version
          & $pythonExe -m pip --version

      - name: Verify / Create reusable Python environment
        shell: bash
        run: |
          set -euo pipefail

          bootstrap_python="$(command -v python)"
          echo "Bootstrap Python: $bootstrap_python"
          "$bootstrap_python" --version
          if ! "$bootstrap_python" -m pip --version; then
            echo "Bootstrap pip is missing; repairing with ensurepip."
            "$bootstrap_python" -m ensurepip --upgrade
            "$bootstrap_python" -m pip --version
          fi
          "$bootstrap_python" - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 12):
              raise SystemExit(
                  f"Expected bootstrap Python 3.12, got {sys.version} "
                  f"from {sys.executable}"
              )
          print(f"Bootstrap Python executable: {sys.executable}")
          PY

          if [[ "${{ runner.environment }}" == "self-hosted" ]]; then
            runtime_root="/tmp/.ar/.hth-runtime"
            venv_dir="$runtime_root/python-3.12-${RUNNER_OS:-unknown}-${RUNNER_ARCH:-unknown}"

          else
            venv_dir="$RUNNER_TEMP/hth-python-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            rm -rf "$venv_dir"
          fi

          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            venv_bin="$venv_dir/Scripts"
            venv_python="$venv_bin/python.exe"
            github_path_entry="$(cygpath -w "$venv_bin")"
          else
            venv_bin="$venv_dir/bin"
            venv_python="$venv_bin/python"
            github_path_entry="$venv_bin"
          fi

          reuse=0
          if [[ -x "$venv_python" ]]; then
            if "$venv_python" - <<'PY'
          import site
          import sys
          if sys.version_info[:2] != (3, 12):
              raise SystemExit(1)
          if sys.prefix == sys.base_prefix:
              raise SystemExit(1)
          if site.ENABLE_USER_SITE:
              raise SystemExit(1)
          PY
            then
              reuse=1
            else
              echo "Existing reusable environment failed verification; rebuilding."
              rm -rf "$venv_dir"
            fi
          fi

          if (( reuse == 0 )); then
            echo "Creating Python environment: $venv_dir"
            mkdir -p "$(dirname "$venv_dir")"
            "$bootstrap_python" -m venv "$venv_dir"
          else
            echo "Reusing verified Python environment: $venv_dir"
          fi

          if [[ ! -x "$venv_python" ]]; then
            echo "::error::Virtual-environment Python is missing: $venv_python"
            exit 1
          fi

          echo "$github_path_entry" >> "$GITHUB_PATH"
          echo "HTH_VENV=$venv_dir" >> "$GITHUB_ENV"
          echo "HTH_BOOTSTRAP_PYTHON=$bootstrap_python" >> "$GITHUB_ENV"
          echo "HTH_VENV_REUSED=$reuse" >> "$GITHUB_ENV"
          echo "PIP_DISABLE_PIP_VERSION_CHECK=1" >> "$GITHUB_ENV"

          "$venv_python" - <<'PY'
          import site
          import sys
          print(f"Venv executable : {sys.executable}")
          print(f"sys.prefix      : {sys.prefix}")
          print(f"sys.base_prefix : {sys.base_prefix}")
          print(f"User site       : {site.USER_SITE}")
          print(f"User site active: {site.ENABLE_USER_SITE}")
          if sys.version_info[:2] != (3, 12):
              raise SystemExit(f"Expected Python 3.12, got {sys.version}")
          if sys.prefix == sys.base_prefix:
              raise SystemExit("Virtual environment is not active")
          if site.ENABLE_USER_SITE:
              raise SystemExit("User site-packages unexpectedly enabled")
          PY

      - name: Verify / Install complete managed runtime
        shell: bash
        env:
          HTH_NEED_DHSEGMENT: ${{ matrix.detector == 'dhsegment_page_mask' || matrix.detector == 'all' }}
          HTH_NEED_EYNOLLAH: ${{ matrix.detector == 'eynollah_page_mask' || matrix.detector == 'all' }}
          HTH_NEED_DOCEXTRACTOR: ${{ matrix.detector == 'docextractor_page_mask' || matrix.detector == 'all' }}
          HTH_NEED_DOC_UFCN: ${{ matrix.detector == 'doc_ufcn_page_mask' || matrix.detector == 'amsre_doc_ufcn_fusion' || matrix.detector == 'all' }}
          HTH_NEED_MASK_RCNN: ${{ matrix.detector == 'mask_rcnn_page_mask' || matrix.detector == 'all' }}
          HTH_NEED_KRAKEN: ${{ matrix.detector == 'kraken_page_mask' || matrix.detector == 'all' }}
          HTH_NEED_ORLI: ${{ matrix.detector == 'orli_page_mask' || matrix.detector == 'all' }}
        run: |
          set -euo pipefail
          bash hth-pipeline/tools/ensure-managed-runtime.sh
      - name: Verify Mask R-CNN historical-document runtime
        if: ${{ matrix.detector == 'mask_rcnn_page_mask' || matrix.detector == 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import torch, torchvision, detectron2
          from detectron2.engine import DefaultPredictor
          print(f"Mask R-CNN runtime verified — Detectron2; PyTorch {torch.__version__}; Torchvision {torchvision.__version__}")
          PY
      - name: Verify Doc-UFCN historical page-segmentation runtime
        if: ${{ matrix.detector == 'doc_ufcn_page_mask' || matrix.detector == 'amsre_doc_ufcn_fusion' || matrix.detector == 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import torch
          from doc_ufcn.main import DocUFCN
          print("Doc-UFCN runtime verified — HTH-pinned source: 0.2.0rc4")
          print(f"PyTorch: {torch.__version__}")
          PY
      - name: Verify dhSegment TensorFlow runtime
        if: ${{ matrix.detector == 'dhsegment_page_mask' || matrix.detector == 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from importlib import metadata
          from pip._vendor.packaging.specifiers import SpecifierSet

          version = metadata.version("tensorflow-cpu")
          required = SpecifierSet(">=2.18,<2.21")
          if version not in required:
              raise SystemExit(f"tensorflow-cpu {version} does not satisfy {required}")
          import tensorflow as tf
          print(f"dhSegment TensorFlow runtime verified — using managed runtime: {tf.__version__}")
          PY
      - name: Verify Orli historical-document segmentation runtime
        if: ${{ matrix.detector == 'orli_page_mask' || matrix.detector == 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from importlib import metadata
          from orli.pred import segment
          version = metadata.version("orli")
          if version != "0.0.2":
              raise SystemExit(f"Expected orli 0.0.2, found {version}")
          print(f"Orli runtime verified — using managed runtime: {version}")
          PY
      - name: Verify Kraken historical-document segmentation runtime
        if: ${{ matrix.detector == 'kraken_page_mask' || matrix.detector == 'all' }}
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python - <<'PY'
          from importlib import metadata
          import torch
          import torchvision
          from kraken.tasks.segmentation import SegmentationTaskModel

          version = metadata.version("kraken")
          if version != "7.0.2":
              raise SystemExit(f"Expected kraken 7.0.2, found {version}")
          print(f"Kraken runtime verified — using managed runtime: {version}")
          print(f"PyTorch: {torch.__version__}")
          print(f"Torchvision: {torchvision.__version__}")
          PY

          if [[ "${RUNNER_OS:-}" == "Linux" ]]; then
            python - <<'PY'
          import torch
          import torchvision
          if torch.cuda.is_available():
              raise SystemExit("HTH Kraken runtime unexpectedly reports CUDA available")
          if "+cpu" not in torch.__version__ or "+cpu" not in torchvision.__version__:
              raise SystemExit(
                  f"Expected CPU-only Torch/Torchvision, got "
                  f"torch={torch.__version__} torchvision={torchvision.__version__}"
              )
          print("Kraken PyTorch/Torchvision backend verified: CPU-only")
          PY
          fi
      - name: Verify Python dependency ABI
        shell: bash
        run: |
          set -euo pipefail

          python -m pip check
          python - <<'PY'
          import sys
          import cv2
          import numpy
          import skimage

          print(f"Python       : {sys.executable}")
          print(f"NumPy        : {numpy.__version__} ({numpy.__file__})")
          print(f"scikit-image : {skimage.__version__} ({skimage.__file__})")
          print(f"OpenCV       : {cv2.__version__} ({cv2.__file__})")
          PY

      - name: Show toolchain environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Toolchain Environment"
          echo "====================="
          echo "Runner name      : ${RUNNER_NAME:-unknown}"
          echo "Runner OS        : ${RUNNER_OS:-unknown}"
          echo "Runner arch      : ${RUNNER_ARCH:-unknown}"
          echo "Runner toolcache : ${RUNNER_TOOL_CACHE:-unknown}"
          echo "SHELL            : ${SHELL:-unset}"
          echo "MSYSTEM          : ${MSYSTEM:-unset}"
          echo "OSTYPE           : ${OSTYPE:-unset}"
          echo

          echo "Shell resolution"
          echo "----------------"
          echo "bash executable  : $(command -v bash)"
          echo "sh executable    : $(command -v sh)"
          type -a bash || true
          type -a sh || true
          bash --version | head -n 1
          echo

          echo "Tool resolution"
          echo "---------------"
          echo "git executable   : $(command -v git)"
          type -a git || true
          git --version
          echo "bootstrap Python : ${HTH_BOOTSTRAP_PYTHON:-unknown}"
          echo "virtual env      : ${HTH_VENV:-unknown}"
          echo "active Python    : $(command -v python)"
          type -a python || true
          python --version
          python -m pip --version
          
          python - <<'PY'
          import os
          import platform
          import sys
          import cv2
          import numpy

          print(f"OpenCV file      : {cv2.__file__}")
          print(f"NumPy file       : {numpy.__file__}")
          print(f"sys.executable   : {sys.executable}")
          print(f"sys.version      : {sys.version.splitlines()[0]}")
          print(f"platform         : {platform.platform()}")
          print(f"process arch     : {platform.machine()}")
          print(f"PYTHONPATH       : {os.environ.get('PYTHONPATH', 'unset')}")
          PY

          echo
          echo "Filesystem"
          echo "----------------------"
          pwd

          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            echo "Native Windows cwd : $(pwd -W)"
            echo "POSIX -> Windows   : $(cygpath -w .)"
            echo "Workspace -> POSIX : $(cygpath -u "${GITHUB_WORKSPACE:-.}")"

            echo
            echo "Windows executable resolution"
            echo "-----------------------------"
            where.exe bash || true
            where.exe sh || true
            where.exe git || true
            where.exe python || true
            where.exe py || true

            echo
            echo "Git Bash path translation"
            echo "-------------------------"
            echo "cygpath executable : $(command -v cygpath)"
            echo "POSIX root         : /"
            echo "Windows root       : $(cygpath -w /)"
          else
            echo "Native POSIX filesystem; MSYS path translation not applicable."
            echo "Workspace          : ${GITHUB_WORKSPACE:-unset}"
          fi

          echo
          echo "PATH entries"
          echo "------------"
          tr ':' '\n' <<< "$PATH"

      - name: Verify / Benchmark OpenCV runtime
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python - <<'EOF'
          import os
          import time

          import cv2
          import numpy as np

          print(f"OpenCV version: {cv2.__version__}")
          print()

          wanted = (
              "CPU/HW",
              "Baseline:",
              "Dispatched code generation:",
              "Parallel framework",
              "Intel IPP",
              "OpenCL",
              "AVX",
              "SSE",
              "TBB",
              "OpenMP",
          )

          for line in cv2.getBuildInformation().splitlines():
              if any(token in line for token in wanted):
                  print(line)

          print()
          image = np.random.default_rng(12345).integers(
              0, 256, size=(3000, 3000), dtype=np.uint8
          )

          for _ in range(5):
              cv2.GaussianBlur(image, (9, 9), 0)

          started = time.perf_counter()
          for _ in range(100):
              cv2.GaussianBlur(image, (9, 9), 0)
          elapsed = time.perf_counter() - started
          average = elapsed / 100

          print(f"GaussianBlur 100 iterations: {elapsed:.3f} seconds")
          print(f"Average per iteration: {average:.6f} seconds")

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as stream:
                  stream.write(f"HTH_OPENCV_BENCHMARK_SECONDS={elapsed:.9f}\n")
                  stream.write(f"HTH_OPENCV_BENCHMARK_AVERAGE_SECONDS={average:.9f}\n")
          EOF
      - name: Resolve regression execution shape
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          echo "Execution shape request: ${EXECUTION_SHAPE_MODE:-auto}"
          shape_args=()
          if [[ -n "${HTH_PRE_RESOLVED_PIPELINES:-}" && -n "${HTH_PRE_RESOLVED_THREADS:-}" ]]; then
            shape_args+=(--pre-resolved-pipelines "$HTH_PRE_RESOLVED_PIPELINES")
            shape_args+=(--pre-resolved-threads "$HTH_PRE_RESOLVED_THREADS")
            shape_args+=(--pre-resolved-source "${HTH_PRE_RESOLVED_SOURCE:-preferred-dispatch}")
          fi
          python -m hth.regression_shape workflow-resolve \
            --shape-mode "${EXECUTION_SHAPE_MODE:-auto}" \
            --regression-mode "$REGRESSION_MODE" \
            --strategy "$STRATEGY" \
            --limit "${LIMIT:-}" \
            --detector "$DETECTOR_ALGORITHM" \
            --manual-shape "${MANUAL_EXECUTION_SHAPE:-}" \
            --parallelism-index results-repo/indexes/parallelism-index.json \
            --predictions-index results-repo/indexes/optimizer-predictions.json \
            --multidetector-index results-repo/indexes/multidetector-index.json \
            --detector-config-root hth-pipeline/config/detectors \
            --golden-set "hth-pipeline/$GOLDEN_SET" \
            --max-dimension "$MAX_DIMENSION" \
            --runner-name "${HTH_RUNNER_NAME:-${RUNNER_NAME:-unknown}}" \
            --runner-label "${HTH_RUNNER_LABEL:-unknown}" \
            --runner-budget "${HTH_DISPATCH_RUNNER_BUDGET:-16}" \
            "${shape_args[@]}" \
            --prediction-out "$RUNNER_TEMP/hth-shape-prediction-${DETECTOR_ALGORITHM}.json" \
            --github-env "$GITHUB_ENV"

      - name: Reset regression output workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf regression-output
          rm -f regression-summary.md

      - name: Run detector regressions
        id: regression
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          bash hth-pipeline/tools/run-detector-regressions.sh

      - name: Persist calibration intelligence
        id: persistence
        if: ${{ steps.regression.outcome == 'success' && github.event_name != 'pull_request' }}
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          HTH_RESULTS_TOKEN: ${{ secrets.HTH_RESULTS_TOKEN }}
        run: |
          set -euo pipefail
          source hth-pipeline/tools/hardened-persistence.sh

          if [[ -z "${HTH_RESULTS_TOKEN:-}" ]]; then
            echo "::error::HTH_RESULTS_TOKEN is required to persist calibration intelligence"
            exit 1
          fi

          publish_args=()
          while IFS= read -r run_dir; do
            [[ -n "$run_dir" ]] || continue
            publish_args+=(--run-dir "$run_dir")
          done < "${{ steps.regression.outputs.run_dirs_file }}"

          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C results-repo remote set-url origin \
            "https://x-access-token:${HTH_RESULTS_TOKEN}@github.com/${RESULTS_REPOSITORY}.git"

          apply_calibration_intelligence() {
            hth_results_clean_owned results-repo \
              indexes/calibration-index.json indexes/parameter-provenance-index.json indexes/runtime-index.json \
              indexes/parallelism-index.json indexes/multidetector-index.json indexes/optimizer-predictions.json \
              source-documents/
            if [[ -d results-repo/learned-evidence/orli_page_mask ]]; then
              python -m hth.regression.learned_evidence rebuild-orli-index --results-root results-repo
            fi

            if [[ -n "${HTH_SHAPE_PREDICTION_FILE:-}" && -f "${HTH_SHAPE_PREDICTION_FILE}" ]]; then
              python -m hth.regression_shape record-prediction \
                --prediction-file "${HTH_SHAPE_PREDICTION_FILE}" \
                --predictions-index results-repo/indexes/optimizer-predictions.json
            fi

            python -m hth.calibration_store publish \
              "${publish_args[@]}" \
              --results-root results-repo \
              --mode "$REGRESSION_MODE" \
              --source-fallback "$RESULTS_REPOSITORY" \
              --workflow "${{ github.workflow }}" \
              --event "${{ github.event_name }}" \
              --repository "${{ github.repository }}" \
              --run-id "${{ github.run_id }}" \
              --run-number "${{ github.run_number }}" \
              --run-attempt "${{ github.run_attempt }}" \
              --ref "${{ github.ref }}" \
              --sha "${{ github.sha }}" \
              --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            if [[ -f regression-output/multidetector-execution.json ]]; then
              python -m hth.multidetector_store publish \
                --metadata regression-output/multidetector-execution.json \
                --results-root results-repo
            fi

            hth_results_remove_legacy_indexes results-repo

            hth_results_stage results-repo \
              indexes/calibration-index.json indexes/parameter-provenance-index.json indexes/runtime-index.json \
              indexes/parallelism-index.json indexes/multidetector-index.json source-documents/
            if [[ -f results-repo/indexes/optimizer-predictions.json ]]; then
              hth_results_stage results-repo indexes/optimizer-predictions.json
            fi
            if [[ -d results-repo/learned-evidence/orli_page_mask ]]; then
              hth_results_stage results-repo learned-evidence/orli_page_mask indexes/orli-evidence-index.json
            fi

            if git -C results-repo diff --cached --name-only | grep -E '(^|/)models/' >/dev/null; then
              echo "::error::Calibration persistence attempted to stage a model payload."
              git -C results-repo diff --cached --name-only
              return 1
            fi
          }

          hth_hardened_persist \
            results-repo main \
            "Update calibration intelligence from HTH run ${{ github.run_number }}" \
            apply_calibration_intelligence \
            "Calibration intelligence"

          echo "results_commit=$HTH_PERSIST_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Write Regression Manifest
        if: ${{ always() && steps.regression.outcome == 'success' }}
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          HTH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          summary_args=()
          while IFS= read -r run_dir; do
            [[ -n "$run_dir" ]] || continue
            summary_args+=(--run-dir "$run_dir")
          done < "${{ steps.regression.outputs.run_dirs_file }}"

          python hth-pipeline/hth/write_regression_summary.py \
            "${summary_args[@]}" \
            --pipeline-repository "${{ github.repository }}" \
            --results-repository "$RESULTS_REPOSITORY" \
            --results-commit "${{ steps.persistence.outputs.results_commit }}" \
            --calibration-index results-repo/indexes/calibration-index.json \
            --runtime-index results-repo/indexes/runtime-index.json \
            --output regression-summary.md

          python hth-pipeline/hth/write_action_summary.py regression-summary.md "$GITHUB_STEP_SUMMARY"

      - name: Upload regression run
        if: ${{ always() }}
        uses: ./hth-pipeline/.github/actions/hardened-upload-artifact
        with:
          name: detector-regression-${{ github.run_id }}-${{ matrix.detector }}
          path: |
            regression-output/
            regression-summary.md
          if-no-files-found: warn
          retention-days: 14
          durable-persistence-confirmed: ${{ steps.persistence.outcome == 'success' }}
