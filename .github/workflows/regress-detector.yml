name: HTH detector regression

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
      && 'Regress detectors against Golden Set'
      || 'Smoke test detectors against Golden Set' }}

on:
  push:
    branches:
      - main
    paths:
      - "hth/**"
      - "config/detectors/**"
      - "config/golden_set.json"
      - "requirements.txt"
      - ".github/workflows/regress-detector.yml"
  pull_request:
    branches:
      - main
    paths:
      - "hth/**"
      - "config/detectors/**"
      - "config/golden_set.json"
      - "requirements.txt"
      - ".github/workflows/regress-detector.yml"
  workflow_dispatch:
    inputs:
      algorithm:
        description: Detector algorithm to regress
        required: true
        default: all
        type: choice
        options:
          - all
          - contour
          - contour_quad
          - contour_components
          - contour_projection
          - contour_grabcut
          - grabcut_contour
          - consensus_quad
          - edge_contour
          - cross_edge_contour
          - gradient_vote
          - radial_edge
          - adaptive_radial_edge
          - border_energy
          - components
          - ransac
          - grabcut
          - hough
          - lsd
      golden_set:
        description: Golden Set configuration
        required: true
        default: config/golden_set.json
        type: string
      results_repository:
        description: Repository containing preprocessed images
        required: true
        default: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results
        type: string
      image_root:
        description: Image directory inside the results repository
        required: true
        default: test/latest/raw
        type: string
      strategy:
        description: Regression search strategy
        required: true
        default: exhaustive
        type: choice
        options:
          - exhaustive
          - non-dormant
          - low+
          - moderate+
          - important+
          - critical
          - binary-refine
      limit:
        description: Optional exhaustive parameter-set limit; blank means no limit
        required: false
        default: ""
        type: string
      max_dimension:
        description: Maximum analysis image dimension
        required: true
        default: "1800"
        type: string
      threads:
        description: Parallel regression threads per active pipeline; auto or any integer from 1 through 1024
        required: true
        default: auto
        type: string
      shards:
        description: Optional explicit shard count; blank uses wall-clock planning and explicit shards take precedence
        required: false
        default: ""
        type: string
      shard_target_minutes:
        description: Target maximum wall time for automatically planned regression shards
        required: true
        default: "30"
        type: string
      shard_lease_minutes:
        description: Expired shard-claim lease recovery interval
        required: true
        default: "5"
        type: string
      detector_pipelines:
        description: Maximum concurrent detector pipelines; any integer from 1 through 1024
        required: true
        default: "4"
        type: string
      detector_loading_strategy:
        description: Detector pipeline loading strategy used when Algorithm is all
        required: true
        default: lpt
        type: choice
        options:
          - lpt
          - fifo
          - ranked
      pipeline_stagger_minutes:
        description: Minutes between detector-pipeline starts; 0 starts all pipelines immediately
        required: false
        default: "0"
        type: string
      top:
        description: Number of ranked parameter sets in top20.csv
        required: true
        default: "20"
        type: string
      debug_level:
        description: Debug image detail for manual builds
        required: true
        default: none
        type: choice
        options:
          - none
          - basic
          - verbose
      mode:
        description: Regression mode
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
      runner:
        description: Execution runner
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted-hth
          - self-hosted-windows
          - self-hosted-rhel8
          - self-hosted-e7k
          - self-hosted-e9k
  
permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'workflow_dispatch'
      && inputs.runner
      || 'automatic'
    }}
  cancel-in-progress: false

jobs:
  regress:
    name: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
          && 'Regress detectors against Golden Set'
          || 'Smoke test detectors against Golden Set' }}
    runs-on: >-
      ${{    github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-windows' && fromJSON('["self-hosted","Windows","X64"]')
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-hth'     && fromJSON('["self-hosted","Linux","X64","hth"]')
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-rhel8'   && fromJSON('["self-hosted","Linux","X64","rhel8"]')
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-e7k'     && fromJSON('["self-hosted","Linux","X64","e7k"]')
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-e9k'     && fromJSON('["self-hosted","Linux","X64","e9k"]')
          || 'ubuntu-latest'}}
    # Automatic and manually dispatched smoke tests retain a 30-minute guard.
    # GitHub-hosted full regressions are limited to 6 hours by GitHub Actions.
    # Self-hosted full regressions may run for up to 5 days (7200 minutes),
    # while still protecting an outside runner from a permanently stalled job.
    timeout-minutes: >-
      ${{ github.event_name != 'workflow_dispatch' && 30
          || inputs.mode == 'smoke' && 30
          || inputs.runner == 'github-hosted' && 360
          || 7200 }}

    env:
      DETECTOR_ALGORITHM: ${{ github.event_name == 'workflow_dispatch' && inputs.algorithm || 'all' }}
      GOLDEN_SET: ${{ github.event_name == 'workflow_dispatch' && inputs.golden_set || 'config/golden_set.json' }}
      RESULTS_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.results_repository || 'dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results' }}
      IMAGE_ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.image_root || 'test/latest/raw' }}
      REGRESSION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'smoke' }}
      STRATEGY: ${{ github.event_name == 'workflow_dispatch' && inputs.strategy || 'exhaustive' }}
      LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '' }}
      MAX_DIMENSION: ${{ github.event_name == 'workflow_dispatch' && inputs.max_dimension || '1800' }}
      TOP_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.top || '10' }}
      THREADS: ${{ github.event_name == 'workflow_dispatch' && inputs.threads || 'auto' }}
      SHARDS: ${{ github.event_name == 'workflow_dispatch' && inputs.shards || '' }}
      SHARD_TARGET_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.shard_target_minutes || '30' }}
      SHARD_LEASE_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.shard_lease_minutes || '5' }}
      DETECTOR_PIPELINES: ${{ github.event_name == 'workflow_dispatch' && inputs.detector_pipelines || '4' }}
      DETECTOR_LOADING_STRATEGY: ${{ github.event_name == 'workflow_dispatch' && inputs.detector_loading_strategy || 'lpt' }}
      PIPELINE_STAGGER_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.pipeline_stagger_minutes || '0' }}
      DEBUG_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_level || 'none' }}
      PYTHONNOUSERSITE: "1"
      PYTHONUNBUFFERED: "1"
      HTH_RUNNER_LABELS: >-
        ${{  github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-hth' && 'self-hosted,linux,x64,hth'
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-rhel8' && 'self-hosted,linux,x64,rhel8'
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-e7k' && 'self-hosted,linux,x64,e7k'
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-e9k' && 'self-hosted,linux,x64,e9k'
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-windows' && 'self-hosted,windows,x64'
          || 'ubuntu-latest' }}
      HTH_RUNNER_LABEL: >-
        ${{  github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-hth' && 'hth'
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-rhel8' && 'rhel8'
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-e7k' && 'e7k'
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-e9k' && 'e9k'
          || github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted-windows' && 'windows'
          || 'github-hosted' }}

    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout results repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.RESULTS_REPOSITORY }}
          path: results-repo
          fetch-depth: 1
          persist-credentials: false
          token: ${{ github.event_name != 'pull_request' && secrets.HTH_RESULTS_TOKEN || github.token }}

      - name: Runner diagnostics
        shell: bash
        run: |
          set -euo pipefail

          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "runner.environment=${{ runner.environment }}"
          echo "runner.name=${{ runner.name }}"

          # Export runtime metadata for later reporting.
          echo "HTH_EXECUTION_ENVIRONMENT=${{ runner.environment }}" >> "$GITHUB_ENV"
          echo "HTH_RUNNER_NAME=${{ runner.name }}" >> "$GITHUB_ENV"
          echo "HTH_RUNNER_LABEL=${HTH_RUNNER_LABEL}" >> "$GITHUB_ENV"
          
      - name: Set up Python — GitHub-hosted Linux
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hth-pipeline/requirements.txt

      - name: Verify Python — self-hosted Linux
        if: ${{ runner.os == 'Linux' && runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "python: $(command -v python)"
          python --version
          python -m pip --version

          python - <<'PY'
          import sys

          if sys.version_info[:2] != (3, 12):
              raise SystemExit(
                  f"Expected Python 3.12, got {sys.version} "
                  f"from {sys.executable}"
              )

          print(f"Python executable: {sys.executable}")
          PY
          
      - name: Use repaired Python tool cache — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pythonVersion = "3.12.10"
          $pythonRoot = Join-Path `
            $env:RUNNER_TOOL_CACHE `
            "Python\$pythonVersion\x64"
          $pythonExe = Join-Path $pythonRoot "python.exe"
          $completeMarker = "$pythonRoot.complete"
          $scriptsDir = Join-Path $pythonRoot "Scripts"

          if (-not (Test-Path -LiteralPath $completeMarker)) {
            throw "Python tool-cache marker is missing: $completeMarker"
          }

          if (-not (Test-Path -LiteralPath $pythonExe)) {
            throw "Python executable is missing: $pythonExe"
          }

          # Make this interpreter canonical for this step and all later steps.
          $env:PATH = "$pythonRoot;$scriptsDir;$env:PATH"
          $pythonRoot | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append
          $scriptsDir | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

          $actualVersion = & $pythonExe -c `
            "import sys; print('.'.join(map(str, sys.version_info[:3])))"

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to execute $pythonExe"
          }

          if ($actualVersion.Trim() -ne $pythonVersion) {
            throw "Expected Python $pythonVersion; found $actualVersion"
          }

          & $pythonExe -m pip --version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "pip is missing; bootstrapping with ensurepip"
            & $pythonExe -m ensurepip --upgrade
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to bootstrap pip"
            }
          }

          Write-Host "Using Python: $pythonExe"
          & $pythonExe --version
          & $pythonExe -m pip --version

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail

          bootstrap_python="$(command -v python)"
          venv_dir="$RUNNER_TEMP/hth-python-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "Bootstrap Python: $bootstrap_python"
          "$bootstrap_python" --version
          "$bootstrap_python" -m pip --version

          rm -rf "$venv_dir"
          "$bootstrap_python" -m venv "$venv_dir"

          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            venv_bin="$venv_dir/Scripts"
            venv_python="$venv_bin/python.exe"
            github_path_entry="$(cygpath -w "$venv_bin")"
          else
            venv_bin="$venv_dir/bin"
            venv_python="$venv_bin/python"
            github_path_entry="$venv_bin"
          fi

          if [[ ! -x "$venv_python" ]]; then
            echo "::error::Virtual-environment Python is missing: $venv_python"
            exit 1
          fi

          echo "$github_path_entry" >> "$GITHUB_PATH"
          echo "HTH_VENV=$venv_dir" >> "$GITHUB_ENV"
          echo "HTH_BOOTSTRAP_PYTHON=$bootstrap_python" >> "$GITHUB_ENV"

          "$venv_python" -m pip install --upgrade pip

          "$venv_python" - <<'PY'
          import site
          import sys

          print(f"Venv executable : {sys.executable}")
          print(f"sys.prefix      : {sys.prefix}")
          print(f"sys.base_prefix : {sys.base_prefix}")
          print(f"User site       : {site.USER_SITE}")
          print(f"User site active: {site.ENABLE_USER_SITE}")

          if sys.prefix == sys.base_prefix:
              raise SystemExit("Virtual environment is not active")
          if site.ENABLE_USER_SITE:
              raise SystemExit("User site-packages unexpectedly enabled")
          PY

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "Active Python: $(command -v python)"
          python --version
          python -m pip --version
          python -m pip install --requirement hth-pipeline/requirements.txt
          python -m pip check

      - name: Verify Python dependency ABI
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import sys
          import cv2
          import numpy
          import skimage

          print(f"Python       : {sys.executable}")
          print(f"NumPy        : {numpy.__version__} ({numpy.__file__})")
          print(f"scikit-image : {skimage.__version__} ({skimage.__file__})")
          print(f"OpenCV       : {cv2.__version__} ({cv2.__file__})")
          PY

      - name: Show toolchain environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Toolchain Environment"
          echo "====================="
          echo "Runner name      : ${RUNNER_NAME:-unknown}"
          echo "Runner OS        : ${RUNNER_OS:-unknown}"
          echo "Runner arch      : ${RUNNER_ARCH:-unknown}"
          echo "Runner toolcache : ${RUNNER_TOOL_CACHE:-unknown}"
          echo "SHELL            : ${SHELL:-unset}"
          echo "MSYSTEM          : ${MSYSTEM:-unset}"
          echo "OSTYPE           : ${OSTYPE:-unset}"
          echo

          echo "Shell resolution"
          echo "----------------"
          echo "bash executable  : $(command -v bash)"
          echo "sh executable    : $(command -v sh)"
          type -a bash || true
          type -a sh || true
          bash --version | head -n 1
          echo

          echo "Tool resolution"
          echo "---------------"
          echo "git executable   : $(command -v git)"
          type -a git || true
          git --version
          echo "bootstrap Python : ${HTH_BOOTSTRAP_PYTHON:-unknown}"
          echo "virtual env      : ${HTH_VENV:-unknown}"
          echo "active Python    : $(command -v python)"
          type -a python || true
          python --version
          python -m pip --version
          
          python - <<'PY'
          import os
          import platform
          import sys
          import cv2
          import numpy

          print(f"OpenCV file      : {cv2.__file__}")
          print(f"NumPy file       : {numpy.__file__}")
          print(f"sys.executable   : {sys.executable}")
          print(f"sys.version      : {sys.version.splitlines()[0]}")
          print(f"platform         : {platform.platform()}")
          print(f"process arch     : {platform.machine()}")
          print(f"PYTHONPATH       : {os.environ.get('PYTHONPATH', 'unset')}")
          PY

          echo
          echo "Filesystem"
          echo "----------------------"
          pwd

          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            echo "Native Windows cwd : $(pwd -W)"
            echo "POSIX -> Windows   : $(cygpath -w .)"
            echo "Workspace -> POSIX : $(cygpath -u "${GITHUB_WORKSPACE:-.}")"

            echo
            echo "Windows executable resolution"
            echo "-----------------------------"
            where.exe bash || true
            where.exe sh || true
            where.exe git || true
            where.exe python || true
            where.exe py || true

            echo
            echo "Git Bash path translation"
            echo "-------------------------"
            echo "cygpath executable : $(command -v cygpath)"
            echo "POSIX root         : /"
            echo "Windows root       : $(cygpath -w /)"
          else
            echo "Native POSIX filesystem; MSYS path translation not applicable."
            echo "Workspace          : ${GITHUB_WORKSPACE:-unset}"
          fi

          echo
          echo "PATH entries"
          echo "------------"
          tr ':' '\n' <<< "$PATH"

      - name: Show OpenCV build
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          python - <<'EOF'
          import cv2

          print(f"OpenCV version: {cv2.__version__}")
          print()

          wanted = (
              "CPU/HW",
              "Baseline:",
              "Dispatched code generation:",
              "Parallel framework",
              "Intel IPP",
              "OpenCL",
              "AVX",
              "SSE",
              "TBB",
              "OpenMP",
          )

          for line in cv2.getBuildInformation().splitlines():
              if any(token in line for token in wanted):
                  print(line)
          EOF
 
      - name: Benchmark OpenCV
        shell: bash
        run: |
          python - <<'EOF'
          import os
          import time
          import cv2
          import numpy as np

          image = np.random.default_rng(12345).integers(
              0, 256, size=(3000, 3000), dtype=np.uint8
          )

          # Warm-up
          for _ in range(5):
              cv2.GaussianBlur(image, (9, 9), 0)

          started = time.perf_counter()
          for _ in range(100):
              cv2.GaussianBlur(image, (9, 9), 0)
          elapsed = time.perf_counter() - started

          average = elapsed / 100
          print(f"GaussianBlur 100 iterations: {elapsed:.3f} seconds")
          print(f"Average per iteration: {average:.6f} seconds")

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as stream:
                  stream.write(f"HTH_OPENCV_BENCHMARK_SECONDS={elapsed:.9f}\n")
                  stream.write(f"HTH_OPENCV_BENCHMARK_AVERAGE_SECONDS={average:.9f}\n")
          EOF
          
      - name: Run detector regressions
        id: regression
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail

          mkdir -p regression-output
          export HTH_SOURCE_COMMIT="$(git -C results-repo rev-parse HEAD)"

          effective_limit="${LIMIT:-}"
          if [[ -n "$effective_limit" ]]; then
            effective_limit_source="user specified"
          elif [[ "$REGRESSION_MODE" == "smoke" ]]; then
            effective_limit="10"
            effective_limit_source="smoke default"
          else
            effective_limit_source="unlimited"
          fi

          effective_strategy="$STRATEGY"
          if [[ -n "${effective_limit:-}" ]]; then
            effective_strategy="exhaustive"
          fi

          if [[ "${DETECTOR_ALGORITHM,,}" == "all" ]]; then
            mapfile -t detector_configs < <(
              find hth-pipeline/config/detectors \
                -maxdepth 1 \
                -type f \
                -name '*.json' \
                -print | sort
            )
          else
            detector_configs=("hth-pipeline/config/detectors/${DETECTOR_ALGORITHM,,}.json")
          fi

          if (( ${#detector_configs[@]} == 0 )); then
            echo "::error::No detector configurations were selected"
            exit 1
          fi

          if [[ ! "${PIPELINE_STAGGER_MINUTES:-0}" =~ ^[0-9]+$ ]]; then
            echo "::error::Pipeline stagger must be a non-negative whole number of minutes: ${PIPELINE_STAGGER_MINUTES:-}"
            exit 1
          fi
          if [[ ! "${DETECTOR_LOADING_STRATEGY:-lpt}" =~ ^(lpt|fifo|ranked)$ ]]; then
            echo "::error::Detector loading strategy must be lpt, fifo, or ranked: ${DETECTOR_LOADING_STRATEGY:-}"
            exit 1
          fi

          requested_pipelines="$DETECTOR_PIPELINES"
          runner_pipeline_max="$(python - "${HTH_RUNNER_LABEL:-}" <<'PYMAX'
          import sys
          from hth.regression.sharding import runner_max_threads
          print(runner_max_threads(sys.argv[1]))
          PYMAX
          )"
          if [[ ! "$requested_pipelines" =~ ^[0-9]+$ ]] || (( requested_pipelines < 1 || requested_pipelines > runner_pipeline_max )); then
            echo "::error::Detector pipelines must be an integer from 1 through runner budget $runner_pipeline_max: $requested_pipelines"
            exit 1
          fi
          if [[ "$THREADS" != "auto" ]] && { [[ ! "$THREADS" =~ ^[0-9]+$ ]] || (( THREADS < 1 || THREADS > 1024 )); }; then
            echo "::error::Threads must be auto or an integer from 1 through 1024: $THREADS"
            exit 1
          fi
          if [[ "${DETECTOR_ALGORITHM,,}" != "all" ]]; then
            effective_pipelines=1
          elif (( requested_pipelines > ${#detector_configs[@]} )); then
            effective_pipelines=${#detector_configs[@]}
          else
            effective_pipelines=$requested_pipelines
          fi

          golden_set_sha256="$(python - "hth-pipeline/$GOLDEN_SET" <<'PY'
          import hashlib
          import sys
          from pathlib import Path
          print(hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )"

          order_threads="$THREADS"
          [[ "$order_threads" == "auto" ]] && order_threads="1"
          declare -a ordered_configs=() detector_estimates=() detector_estimate_sources=() detector_quality=()
          if [[ "${DETECTOR_ALGORITHM,,}" == "all" ]]; then
            order_args=()
            for detector_config in "${detector_configs[@]}"; do
              order_args+=(--config "$detector_config")
            done
            while IFS=$'\t' read -r ordered_config estimate estimate_source quality; do
              [[ -n "$ordered_config" ]] || continue
              ordered_configs+=("$ordered_config")
              detector_estimates+=("$estimate")
              detector_estimate_sources+=("$estimate_source")
              detector_quality+=("$quality")
            done < <(python -m hth.runtime_store order \
              "${order_args[@]}" \
              --loading-strategy "$DETECTOR_LOADING_STRATEGY" \
              --runtime-index results-repo/runtime-index.json \
              --calibration-index results-repo/calibration-index.json \
              --mode "$REGRESSION_MODE" \
              --search-strategy "$effective_strategy" \
              --threads "$order_threads" \
              --max-dimension "$MAX_DIMENSION" \
              --golden-set-sha256 "$golden_set_sha256" \
              --runner-label "${HTH_RUNNER_LABEL:-}")
            detector_configs=("${ordered_configs[@]}")
          else
            detector_estimates=("unknown")
            detector_estimate_sources=("single-detector")
            detector_quality=("unknown")
          fi

          if [[ -n "${SHARDS:-}" && ! "${SHARDS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Shards must be a positive whole number or blank for wall-clock planning"
            exit 1
          fi
          if [[ ! "${SHARD_TARGET_MINUTES:-30}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Shard target must be a positive whole number of minutes"
            exit 1
          fi
          if [[ ! "${SHARD_LEASE_MINUTES:-5}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Shard lease must be a positive whole number of minutes"
            exit 1
          fi

          detector_count=${#detector_configs[@]}
          declare -a task_configs=() task_estimates=() task_estimate_sources=() task_quality=()
          declare -a task_shard_indexes=() task_shard_counts=() task_threads=() task_detectors=()
          for ((detector_index = 0; detector_index < ${#detector_configs[@]}; detector_index++)); do
            detector_config="${detector_configs[$detector_index]}"
            detector_name="$(python - "$detector_config" <<'PYPLAN'
          import json, sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["detector"])
          PYPLAN
            )"
            read -r planned_threads planned_shards serial_estimate plan_source < <(
              python - "$detector_config" "results-repo/runtime-index.json" "$detector_name" "${HTH_RUNNER_LABEL:-}" "$THREADS" "$SHARD_TARGET_MINUTES" "${SHARDS:-}" <<'PYPLAN'
          import json, sys
          from pathlib import Path
          from hth.regression.sharding import best_smoke_observation, estimate_serial_runtime, plan_shards
          from hth.regression.strategies.cartesian import generate
          config_path, index_path, detector, runner_label, requested_threads, target_minutes, requested_shards = sys.argv[1:]
          config = json.loads(Path(config_path).read_text(encoding="utf-8"))
          possible = len(generate(config))
          observation = best_smoke_observation(Path(index_path), detector)
          serial = estimate_serial_runtime(observation, possible) if observation else None
          plan = plan_shards(serial, runner_label=runner_label, requested_threads=requested_threads, target_shard_seconds=int(target_minutes) * 60, maximum_shards=possible, requested_shards=int(requested_shards) if requested_shards else None, possible_parameter_sets=possible, estimate_source="smoke-runtime-index" if observation else "no-smoke-history")
          print(plan.threads, plan.shard_count, "unknown" if serial is None else f"{serial:.3f}", plan.estimate_source)
          PYPLAN
            )
            # User limits and smoke runs are already bounded; do not shard them.
            if [[ "$REGRESSION_MODE" != "full" || -n "${effective_limit:-}" || "$effective_strategy" != "exhaustive" ]]; then
              planned_shards=1
            fi
            for ((shard_index = 0; shard_index < planned_shards; shard_index++)); do
              task_configs+=("$detector_config")
              task_estimates+=("${detector_estimates[$detector_index]:-$serial_estimate}")
              task_estimate_sources+=("${detector_estimate_sources[$detector_index]:-$plan_source}")
              task_quality+=("${detector_quality[$detector_index]:-unknown}")
              task_shard_indexes+=("$shard_index")
              task_shard_counts+=("$planned_shards")
              task_threads+=("$planned_threads")
              task_detectors+=("$detector_name")
            done
          done
          detector_configs=("${task_configs[@]}")
          detector_estimates=("${task_estimates[@]}")
          detector_estimate_sources=("${task_estimate_sources[@]}")
          detector_quality=("${task_quality[@]}")
          if (( requested_pipelines > ${#detector_configs[@]} )); then
            effective_pipelines=${#detector_configs[@]}
          else
            effective_pipelines=$requested_pipelines
          fi

          read -r runner_thread_budget effective_threads_per_pipeline allocated_threads unused_threads < <(
            python - "$THREADS" "${HTH_RUNNER_LABEL:-}" "$effective_pipelines" <<'PYBUDGET'
          import sys
          from hth.regression.sharding import plan_execution
          plan = plan_execution(
              sys.argv[1],
              runner_label=sys.argv[2],
              active_pipelines=int(sys.argv[3]),
          )
          print(
              plan.runner_thread_budget,
              plan.threads_per_pipeline,
              plan.allocated_threads,
              plan.unused_threads,
          )
          PYBUDGET
          )
          for ((task_index = 0; task_index < ${#task_threads[@]}; task_index++)); do
            task_threads[$task_index]="$effective_threads_per_pipeline"
          done

          echo "Regression mode    : $REGRESSION_MODE"
          echo "Algorithm          : '$DETECTOR_ALGORITHM'"
          echo "Effective limit    : '${effective_limit:-unlimited}' ($effective_limit_source)"
          echo "Detectors          : $detector_count"
          echo "Detector pipelines : $effective_pipelines (requested $requested_pipelines)"
          echo "Shards             : ${#detector_configs[@]}${SHARDS:+ (explicit request $SHARDS; capped at one parameter set per shard)}"
          echo "Thread budget      : $runner_thread_budget total; $effective_threads_per_pipeline per active pipeline; $allocated_threads allocated; $unused_threads free"
          echo "Loading strategy   : ${DETECTOR_LOADING_STRATEGY}"
          echo "Pipeline stagger   : ${PIPELINE_STAGGER_MINUTES} minute(s)"
          echo
          echo "Detector queue"
          echo "=============="
          for ((queue_index = 0; queue_index < ${#detector_configs[@]}; queue_index++)); do
            queue_detector="$(python - "${detector_configs[$queue_index]}" <<'PY'
          import json
          import sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")).get("detector", "unknown"))
          PY
            )"
            printf '%2d. %-24s shard=%s/%s threads=%s estimate=%-10s source=%s quality=%s\n' \
              "$((queue_index + 1))" "$queue_detector" \
              "$((task_shard_indexes[$queue_index] + 1))" "${task_shard_counts[$queue_index]}" "${task_threads[$queue_index]}" \
              "${detector_estimates[$queue_index]:-unknown}s" \
              "${detector_estimate_sources[$queue_index]:-unknown}" \
              "${detector_quality[$queue_index]:-unknown}"
          done

          queue_dir="regression-output/.detector-queue"
          rm -rf "$queue_dir"
          mkdir -p "$queue_dir/claims" "$queue_dir/done" "$queue_dir/failed" \
            "$queue_dir/run-dirs" "$queue_dir/logs"
          : > regression-output/run-directories.txt
          : > regression-output/runner-output.log

          run_detector_config() {
            local task_index="$1"
            local pipeline_number="$2"
            local start_delay_seconds="${3:-0}"
            local detector_config="${detector_configs[$task_index]}"

            if [[ ! -f "$detector_config" ]]; then
              echo "::error::Detector configuration not found: $detector_config"
              return 1
            fi

            local detector_name detector_estimate detector_estimate_source detector_ranked_quality
            local shard_index shard_count detector_threads shard_output
            shard_index="${task_shard_indexes[$task_index]}"
            shard_count="${task_shard_counts[$task_index]}"
            detector_threads="${task_threads[$task_index]}"
            detector_name="$(python - "$detector_config" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(payload.get("detector", "unknown"))
          PY
            )"
            shard_output="regression-output/.shards/$detector_name/shard-$(printf '%04d' "$shard_index")"
            mkdir -p "$shard_output"
            detector_estimate="${detector_estimates[$task_index]:-unknown}"
            detector_estimate_source="${detector_estimate_sources[$task_index]:-unknown}"
            detector_ranked_quality="${detector_quality[$task_index]:-unknown}"

            local -a args=(
              python -m hth.regress_detector
              --detector-config "$detector_config"
              --golden-set "hth-pipeline/$GOLDEN_SET"
              --image-root "results-repo/$IMAGE_ROOT"
              --output "$shard_output"
              --max-dimension "$MAX_DIMENSION"
              --top "$TOP_COUNT"
              --threads "$detector_threads"
              --shard-index "$shard_index"
              --shard-count "$shard_count"
              --debug-level "$DEBUG_LEVEL"
            )

            if [[ -n "${effective_limit:-}" ]]; then
              args+=(--strategy exhaustive --limit "$effective_limit")
            else
              args+=(--strategy "$STRATEGY")
              if [[ "$STRATEGY" =~ ^(non-dormant|low\+|moderate\+|important\+|critical)$ ]]; then
                local golden_set_sha256 detector_config_sha256 calibration_file
                golden_set_sha256="$(python - "hth-pipeline/$GOLDEN_SET" <<'PY'
          import hashlib
          import sys
          from pathlib import Path
          print(hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
                )"
                detector_config_sha256="$(python - "$detector_config" <<'PY'
          import hashlib
          import sys
          from pathlib import Path
          print(hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
                )"
                calibration_file=""
                if [[ -f results-repo/calibration-index.json ]]; then
                  calibration_file="$(python -m hth.calibration_store resolve \
                    --index results-repo/calibration-index.json \
                    --detector "$detector_name" \
                    --golden-set-sha256 "$golden_set_sha256" \
                    --detector-config-sha256 "$detector_config_sha256" 2>/dev/null || true)"
                fi
                if [[ -n "$calibration_file" && -f "$calibration_file" ]]; then
                  echo "[pipeline $pipeline_number][$detector_name] Using indexed calibration intelligence: $calibration_file"
                  args+=(--calibration-intelligence "$calibration_file")
                else
                  echo "[pipeline $pipeline_number][$detector_name] No compatible indexed calibration intelligence found; runner will fall back to exhaustive."
                fi
              fi
            fi

            local detector_loaded_epoch detector_started_epoch detector_finished_epoch detector_wall_seconds
            local lifecycle_time
            detector_loaded_epoch="$(date +%s)"
            lifecycle_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "======================================================================"
            echo "[pipeline $pipeline_number] LOAD detector=$detector_name shard=$((shard_index + 1))/$shard_count threads=$detector_threads time=$lifecycle_time"
            echo "[pipeline $pipeline_number] estimate=${detector_estimate}s source=${detector_estimate_source}"
            echo "[pipeline $pipeline_number] ranked_quality=${detector_ranked_quality}"
            if (( start_delay_seconds > 0 )); then
              echo "[pipeline $pipeline_number] WAIT detector=$detector_name shard=$((shard_index + 1))/$shard_count stagger=${start_delay_seconds}s"
              sleep "$start_delay_seconds"
            fi
            detector_started_epoch="$(date +%s)"
            lifecycle_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "[pipeline $pipeline_number] START detector=$detector_name shard=$((shard_index + 1))/$shard_count threads=$detector_threads time=$lifecycle_time"
            echo "======================================================================"
            echo "[pipeline $pipeline_number][$detector_name] Regression command:"
            printf '[pipeline %s][%s]' "$pipeline_number" "$detector_name"
            printf ' %q' "${args[@]}"
            printf '\n'

            echo "[pipeline $pipeline_number][$detector_name] Regression Invocation"
            printf '[pipeline %s][%s] %-22s: %s\n' "$pipeline_number" "$detector_name" "Mode" "$REGRESSION_MODE"
            printf '[pipeline %s][%s] %-22s: %s\n' "$pipeline_number" "$detector_name" "Detector" "$detector_name"
            printf '[pipeline %s][%s] %-22s: %s\n' "$pipeline_number" "$detector_name" "Detector config" "$detector_config"
            printf '[pipeline %s][%s] %-22s: %s\n' "$pipeline_number" "$detector_name" "Strategy" "$effective_strategy"
            printf '[pipeline %s][%s] %-22s: %s\n' "$pipeline_number" "$detector_name" "Threads" "$detector_threads"
            printf '[pipeline %s][%s] %-22s: %s\n' "$pipeline_number" "$detector_name" "Debug level" "$DEBUG_LEVEL"
            printf '[pipeline %s][%s] %-22s: %s\n' "$pipeline_number" "$detector_name" "Detector pipeline" "$pipeline_number of $effective_pipelines"
            if [[ -n "$effective_limit" ]]; then
              printf '[pipeline %s][%s] %-22s: %s (%s)\n' \
                "$pipeline_number" "$detector_name" "Parameter-set limit" "$effective_limit" "$effective_limit_source"
            else
              printf '[pipeline %s][%s] %-22s: %s\n' "$pipeline_number" "$detector_name" "Parameter-set limit" "unlimited"
            fi

            local before_runs task_log run_dir lease_file lease_pid
            before_runs="$(find "$shard_output/$detector_name" -mindepth 1 -maxdepth 1 -type d -name 'run-*' 2>/dev/null | sort || true)"
            task_log="$queue_dir/logs/$(printf '%04d' "$task_index")-$detector_name-shard-$shard_index.log"
            lease_file="$queue_dir/claims/$task_index/lease.json"
            renew_lease() {
              while true; do
                python - "$lease_file" "$pipeline_number" "$SHARD_LEASE_MINUTES" "$shard_index/$shard_count" <<'PYLEASE'
          from pathlib import Path
          import sys
          from hth.regression.sharding import write_lease
          write_lease(Path(sys.argv[1]), owner=f"pipeline-{sys.argv[2]}", ttl_seconds=int(sys.argv[3]) * 60, shard=sys.argv[4])
          PYLEASE
                sleep 60
              done
            }
            renew_lease &
            lease_pid=$!

            if ! HTH_DETECTOR_PIPELINES="$effective_pipelines" \
              HTH_DETECTOR_PIPELINE_NUMBER="$pipeline_number" \
              HTH_PIPELINE_STAGGER_MINUTES="$PIPELINE_STAGGER_MINUTES" \
              HTH_DETECTOR_LOADING_STRATEGY="$DETECTOR_LOADING_STRATEGY" \
              HTH_DETECTOR_RUNTIME_ESTIMATE_SECONDS="$detector_estimate" \
              HTH_DETECTOR_RUNTIME_ESTIMATE_SOURCE="$detector_estimate_source" \
              HTH_DETECTOR_QUEUE_POSITION="$((task_index + 1))" \
              HTH_DETECTOR_RANKED_QUALITY="$detector_ranked_quality" \
              "${args[@]}" 2>&1 \
                | sed -u -E 's/^(Machine[[:space:]]*:).*/\1 [obfuscated]/' \
                | sed -u "s/^/[pipeline $pipeline_number][$detector_name] /" \
                | tee "$task_log"; then
              kill "$lease_pid" 2>/dev/null || true
              wait "$lease_pid" 2>/dev/null || true
              detector_finished_epoch="$(date +%s)"
              detector_wall_seconds="$((detector_finished_epoch - detector_started_epoch))"
              lifecycle_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo "[pipeline $pipeline_number] UNLOAD detector=$detector_name shard=$((shard_index + 1))/$shard_count status=failed wall=${detector_wall_seconds}s time=$lifecycle_time"
              echo "::error::$detector_name regression command failed in pipeline $pipeline_number"
              return 1
            fi
            kill "$lease_pid" 2>/dev/null || true
            wait "$lease_pid" 2>/dev/null || true

            run_dir="$(
              comm -13 \
                <(printf '%s\n' "$before_runs" | sed '/^$/d' | sort) \
                <(find "$shard_output/$detector_name" -mindepth 1 -maxdepth 1 -type d -name 'run-*' | sort) \
              | tail -n 1
            )"

            if [[ -z "$run_dir" ]]; then
              echo "::error::$detector_name regression did not create a canonical run directory"
              return 1
            fi

            printf '%s\n' "$run_dir" > "$queue_dir/run-dirs/$(printf '%04d' "$task_index")"
            detector_finished_epoch="$(date +%s)"
            detector_wall_seconds="$((detector_finished_epoch - detector_started_epoch))"
            lifecycle_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "======================================================================"
            echo "[pipeline $pipeline_number] UNLOAD detector=$detector_name shard=$((shard_index + 1))/$shard_count status=complete wall=${detector_wall_seconds}s time=$lifecycle_time"
            echo "[pipeline $pipeline_number] Completed; pipeline is taking the next queued detector."
            echo "======================================================================"
          }

          detector_worker() {
            local pipeline_index="$1"
            local pipeline_number=$((pipeline_index + 1))
            local delay_seconds=$((pipeline_index * PIPELINE_STAGGER_MINUTES * 60))
            local task_index claimed task_start_delay

            local first_task=1
            echo "[pipeline $pipeline_number] Started."

            while true; do
              claimed=""
              for ((task_index = 0; task_index < ${#detector_configs[@]}; task_index++)); do
                [[ -f "$queue_dir/done/$task_index" ]] && continue
                claim_dir="$queue_dir/claims/$task_index"
                if mkdir "$claim_dir" 2>/dev/null; then
                  claimed="$task_index"
                  break
                fi
                if [[ -f "$claim_dir/lease.json" ]] && python - "$claim_dir/lease.json" <<'PYLEASE'
          from pathlib import Path
          import sys
          from hth.regression.sharding import lease_expired
          raise SystemExit(0 if lease_expired(Path(sys.argv[1])) else 1)
          PYLEASE
                then
                  echo "[pipeline $pipeline_number] Reclaiming expired shard lease $task_index."
                  rm -rf "$claim_dir"
                  if mkdir "$claim_dir" 2>/dev/null; then
                    claimed="$task_index"
                    break
                  fi
                fi
              done

              if [[ -z "$claimed" ]]; then
                echo "[pipeline $pipeline_number] Detector queue empty."
                return 0
              fi

              task_start_delay=0
              if (( first_task == 1 )); then
                task_start_delay="$delay_seconds"
                first_task=0
              fi
              if run_detector_config "$claimed" "$pipeline_number" "$task_start_delay"; then
                : > "$queue_dir/done/$claimed"
              else
                : > "$queue_dir/failed/$claimed"
                echo "::error::Pipeline $pipeline_number failed detector config ${detector_configs[$claimed]}"
                return 1
              fi
            done
          }

          worker_pids=()
          for ((pipeline_index = 0; pipeline_index < effective_pipelines; pipeline_index++)); do
            detector_worker "$pipeline_index" &
            worker_pids+=("$!")
          done

          queue_failed=0
          for worker_pid in "${worker_pids[@]}"; do
            if ! wait "$worker_pid"; then
              queue_failed=1
            fi
          done

          : > regression-output/run-directories.txt
          mapfile -t unique_detectors < <(printf '%s\n' "${task_detectors[@]}" | sort -u)
          for detector_name in "${unique_detectors[@]}"; do
            mapfile -t detector_task_indexes < <(
              for ((task_index = 0; task_index < ${#task_detectors[@]}; task_index++)); do
                [[ "${task_detectors[$task_index]}" == "$detector_name" ]] && printf '%s\n' "$task_index"
              done
            )
            first_detector_task_index="${detector_task_indexes[0]}"
            expected_detector_shards="${task_shard_counts[$first_detector_task_index]}"
            detector_shard_dirs=()
            for ((shard_index = 0; shard_index < expected_detector_shards; shard_index++)); do
              shard_root="regression-output/.shards/$detector_name/shard-$(printf '%04d' "$shard_index")/$detector_name"
              shard_run_dir="$(find "$shard_root" -mindepth 1 -maxdepth 1 -type d -name 'run-*' | sort | tail -n 1)"
              if [[ -z "$shard_run_dir" ]]; then
                echo "::error::Missing completed shard $((shard_index + 1))/$expected_detector_shards for $detector_name"
                exit 1
              fi
              detector_shard_dirs+=("$shard_run_dir")
            done
            detector_config="hth-pipeline/config/detectors/$detector_name.json"
            if (( ${#detector_shard_dirs[@]} == 1 )); then
              source_dir="${detector_shard_dirs[0]}"
              mkdir -p "regression-output/$detector_name"
              target_dir="regression-output/$detector_name/$(basename "$source_dir")"
              rm -rf "$target_dir"
              mv "$source_dir" "$target_dir"
              printf '%s\n' "$target_dir" >> regression-output/run-directories.txt
            else
              merge_args=()
              for shard_dir in "${detector_shard_dirs[@]}"; do merge_args+=(--shard-dir "$shard_dir"); done
              merged_dir="$(python -m hth.regression.merge_shards "${merge_args[@]}" --expected-shard-count "$expected_detector_shards" --output regression-output --detector-config "$detector_config" --golden-set "hth-pipeline/$GOLDEN_SET" --image-root "results-repo/$IMAGE_ROOT" --max-dimension "$MAX_DIMENSION" --debug-level "$DEBUG_LEVEL" --top "$TOP_COUNT")"
              printf '%s\n' "$merged_dir" >> regression-output/run-directories.txt
            fi
          done
          while IFS= read -r queue_file; do
            cat "$queue_file"
          done < <(find "$queue_dir/logs" -maxdepth 1 -type f -name '*.log' | sort) \
            > regression-output/runner-output.log

          completed_count="$(find "$queue_dir/done" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          failed_count="$(find "$queue_dir/failed" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          echo "Detector queue complete: $completed_count completed, $failed_count failed."

          if (( queue_failed != 0 || failed_count != 0 || completed_count != ${#detector_configs[@]} )); then
            echo "::error::Detector pipeline queue did not complete successfully"
            exit 1
          fi

          rm -rf "$queue_dir"
          echo "run_dirs_file=regression-output/run-directories.txt" >> "$GITHUB_OUTPUT"

      - name: Persist calibration intelligence
        id: persistence
        if: ${{ steps.regression.outcome == 'success' && github.event_name != 'pull_request' }}
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          HTH_RESULTS_TOKEN: ${{ secrets.HTH_RESULTS_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${HTH_RESULTS_TOKEN:-}" ]]; then
            echo "::error::HTH_RESULTS_TOKEN is required to persist calibration intelligence"
            exit 1
          fi

          publish_args=()
          while IFS= read -r run_dir; do
            [[ -n "$run_dir" ]] || continue
            publish_args+=(--run-dir "$run_dir")
          done < "${{ steps.regression.outputs.run_dirs_file }}"

          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C results-repo remote set-url origin \
            "https://x-access-token:${HTH_RESULTS_TOKEN}@github.com/${RESULTS_REPOSITORY}.git"

          published=0
          max_publish_attempts=5
          for attempt in $(seq 1 "$max_publish_attempts"); do
            if (( attempt > 1 )); then
              retry_delay=$((5 * (attempt - 1)))
              echo "Publish collision detected; waiting ${retry_delay}s for calibration intelligence to free up before retrying..."
              sleep "$retry_delay"
            fi

            git -C results-repo fetch origin main
            git -C results-repo reset --hard origin/main
            git -C results-repo clean -fd -- calibration-index.json runtime-index.json parallelism-index.json source-documents/

            python -m hth.calibration_store publish \
              "${publish_args[@]}" \
              --results-root results-repo \
              --mode "$REGRESSION_MODE" \
              --source-fallback "$RESULTS_REPOSITORY" \
              --workflow "${{ github.workflow }}" \
              --event "${{ github.event_name }}" \
              --repository "${{ github.repository }}" \
              --run-id "${{ github.run_id }}" \
              --run-number "${{ github.run_number }}" \
              --run-attempt "${{ github.run_attempt }}" \
              --ref "${{ github.ref }}" \
              --sha "${{ github.sha }}" \
              --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            git -C results-repo add calibration-index.json runtime-index.json parallelism-index.json source-documents/

            if git -C results-repo diff --cached --quiet; then
              echo "Calibration intelligence store already current."
              published=1
              break
            fi

            git -C results-repo commit -m \
              "Update calibration intelligence from HTH run ${{ github.run_number }}"
            if git -C results-repo push origin HEAD:main; then
              published=1
              break
            fi
          done

          if (( published == 0 )); then
            echo "::error::Unable to publish calibration intelligence after ${max_publish_attempts} attempts"
            exit 1
          fi

          RESULTS_COMMIT="$(git -C results-repo rev-parse HEAD)"
          echo "results_commit=$RESULTS_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Write Regression Manifest
        if: ${{ always() && steps.regression.outcome == 'success' }}
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          HTH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          summary_args=()
          while IFS= read -r run_dir; do
            [[ -n "$run_dir" ]] || continue
            summary_args+=(--run-dir "$run_dir")
          done < "${{ steps.regression.outputs.run_dirs_file }}"

          python hth-pipeline/hth/write_regression_summary.py \
            "${summary_args[@]}" \
            --pipeline-repository "${{ github.repository }}" \
            --results-repository "$RESULTS_REPOSITORY" \
            --results-commit "${{ steps.persistence.outputs.results_commit }}" \
            --calibration-index results-repo/calibration-index.json \
            --output regression-summary.md

          cat regression-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload regression run
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
