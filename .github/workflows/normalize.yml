    secrets: inherit

  audit-resource-lifecycle:
    name: Record build resource utilization and cleanup eligibility
    needs: integrate-binarization
    if: ${{ always() && !cancelled() && needs.integrate-binarization.result == 'success' }}
    runs-on: >-
      ${{ inputs.runner_target == 'self-hosted-linux' && fromJSON('["self-hosted","Linux","X64"]')
        || inputs.runner_target == 'self-hosted-windows' && fromJSON('["self-hosted","Windows","X64"]')
        || inputs.runner_target == 'hth' && fromJSON('["self-hosted","Linux","X64","hth"]')
        || inputs.runner_target == 'rhel8' && fromJSON('["self-hosted","Linux","X64","rhel8"]')
        || inputs.runner_target == 'e7k' && fromJSON('["self-hosted","Linux","X64","e7k"]')
        || inputs.runner_target == 'e9k' && fromJSON('["self-hosted","Linux","X64","e9k"]')
        || inputs.runner_target == '192vcpu' && fromJSON('["self-hosted","Linux","X64","192vcpu"]')
        || inputs.runner_target == '96vcpu' && fromJSON('["self-hosted","Linux","X64","96vcpu"]')
        || inputs.runner_target == '32vcpu' && fromJSON('["self-hosted","Linux","X64","32vcpu"]')
        || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical normalization evidence
        uses: ./hth-pipeline/.github/actions/checkout-results
        with:
          repository: ${{ env.RESULTS_REPOSITORY }}
          path: results-repo
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            /metadata/canonical-build-evidence.json
            /metadata/resource-lifecycle.json
            /normalization/
            /reports/full-normalization-summary.md
          sparse-checkout-cone-mode: false
          persist-credentials: true
          token: ${{ secrets.HTH_RESULTS_TOKEN || github.token }}

      - name: Set up canonical HTH Python runtime
        uses: ./hth-pipeline/.github/actions/setup-hth-python
        with:
          pipeline-path: hth-pipeline

      - name: Inventory durable result releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HTH_RESULTS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$RESULTS_REPOSITORY" --limit 1000 \
            --json tagName,isDraft,isImmutable,isLatest,isPrerelease,createdAt,publishedAt > "$RUNNER_TEMP/result-releases.json"
          gh release list --repo "$MIRROR_REPOSITORY" --limit 1000 \
            --json tagName,isDraft,isImmutable,isLatest,isPrerelease,createdAt,publishedAt > "$RUNNER_TEMP/mirror-releases.json"
          gh release list --repo "$EVIDENCE_CACHE_REPOSITORY" --limit 1000 \
            --json tagName,isDraft,isImmutable,isLatest,isPrerelease,createdAt,publishedAt > "$RUNNER_TEMP/evidence-cache-releases.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          rows = []
          for repository, filename in (
              (os.environ["RESULTS_REPOSITORY"], "result-releases.json"),
              (os.environ["MIRROR_REPOSITORY"], "mirror-releases.json"),
              (os.environ["EVIDENCE_CACHE_REPOSITORY"], "evidence-cache-releases.json"),
          ):
              for row in json.loads((root / filename).read_text(encoding="utf-8")):
                  rows.append({**row, "repository": repository})
          (root / "release-inventory.json").write_text(
              json.dumps(rows, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Build conservative cache and release liveness report
        shell: bash
        env: {PYTHONPATH: hth-pipeline}
        run: |
          set -euo pipefail
          python -m hth.resource_lifecycle \
            --results-root results-repo \
            --release-inventory "$RUNNER_TEMP/release-inventory.json" \
            --default-release-repository "$RESULTS_REPOSITORY" \
            --repository-root hth-pipeline \
            --output "$RUNNER_TEMP/resource-lifecycle.json"

      - name: Persist resource utilization and cleanup eligibility
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          HTH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          source hth-pipeline/tools/hardened-persistence.sh
          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          apply_resource_lifecycle() {
            mkdir -p results-repo/metadata
            mkdir -p results-repo/reports
            python -m hth.resource_lifecycle \
              --results-root results-repo \
              --release-inventory "$RUNNER_TEMP/release-inventory.json" \
              --default-release-repository "$RESULTS_REPOSITORY" \
              --repository-root hth-pipeline \
              --output results-repo/metadata/resource-lifecycle.json
            results_commit="$(git -C results-repo rev-parse HEAD)"
            python -m hth.report_generator full-normalization-summary \
              --results-root results-repo \
              --output results-repo/reports/full-normalization-summary.md \
              --results-repository "$RESULTS_REPOSITORY" \
              --results-commit "$results_commit" \
              --pipeline-repository "${{ github.repository }}" \
              --pipeline-commit "${{ github.sha }}" \
              --run-url "$HTH_RUN_URL"
            hth_results_stage results-repo \
              metadata/resource-lifecycle.json \
              reports/full-normalization-summary.md
          }
          hth_hardened_persist results-repo main \
            "Record normalization resource lifecycle $GITHUB_RUN_ID" \
            apply_resource_lifecycle \
            "Normalization resource lifecycle publication"

      - name: Publish canonical full normalization summary
        shell: bash
        run: |
          set -euo pipefail
          python hth-pipeline/hth/write_action_summary.py \
            results-repo/reports/full-normalization-summary.md \
            "$GITHUB_STEP_SUMMARY"
