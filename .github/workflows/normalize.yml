name: HTH normalize collection

run-name: Normalize complete collection with canonical preprocess evidence

on:
  workflow_dispatch:
    inputs:
      results_repository:
        description: "Canonical collection results repository"
        required: true
        default: "dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results"
        type: string
      # BEGIN GENERATED RUNNER TARGET INPUT
      runner_target:
        description: "Execution runner target"
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted-linux
          - self-hosted-windows
          - hth
          - rhel8
          - e7k
          - e9k
          - 192vcpu
          - 96vcpu
          - 32vcpu
      # END GENERATED RUNNER TARGET INPUT
      start_stage:
        description: "Start the normalization regression at this stage"
        required: true
        default: full
        type: choice
        options:
          - full
          - crop-framing
          - orientation-deskew
          - canonical-normalization
          - perspective
          - photometric-assessment
          - photometric-method-assessment
          - photometric-validation
          - photometric-integration
          - tonal-assessment
          - tonal-method-assessment
          - tonal-validation
          - tonal-integration
          - chromatic-assessment
          - chromatic-method-assessment
          - chromatic-validation
          - chromatic-integration
          - denoising-assessment
          - denoising-method-assessment
          - denoising-validation
          - denoising-integration
          - sharpening-assessment
          - sharpening-method-assessment
          - sharpening-validation
          - sharpening-integration
          - binarization-assessment
          - binarization-method-assessment
          - binarization-validation
          - binarization-integration
      upload_full_artifact:
        description: "Request an ephemeral full normalized-image artifact (forces canonical normalization execution)"
        required: true
        default: false
        type: boolean
      normalization_recipe:
        description: "Apply the prepared recommendation, or crop only without resampling"
        required: true
        default: prepared-recommendation
        type: choice
        options:
          - prepared-recommendation
          - axis-aligned-only
      canonical_normalization_policy:
        description: "Canonical Build Evidence policy for every normalization stage"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - audit
          - force-verify
          - rebuild
      artifact_retention_days:
        description: Days to retain the complete normalized collection artifact
        required: true
        default: 14
        type: number

permissions:
  contents: read

concurrency:
  group: normalize-collection-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  RESULTS_REPOSITORY: ${{ inputs.results_repository }}
  MIRROR_REPOSITORY: dlstupka/hth-mirror
  EVIDENCE_CACHE_REPOSITORY: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-cache

jobs:
  assess-crop-framing:
    name: Assess crop and framing
    if: ${{ contains(fromJSON('["full","crop-framing"]'), inputs.start_stage) }}
    uses: ./.github/workflows/assess-crop-framing.yml
    with:
      results_repository: ${{ inputs.results_repository }}
      runner_target: ${{ inputs.runner_target }}
      artifact_retention_days: ${{ fromJSON(format('{0}', inputs.artifact_retention_days)) }}
      canonical_build_policy: ${{ inputs.canonical_normalization_policy }}
    secrets: inherit

  assess-orientation-deskew:
    name: Reassess orientation and deskew recommendation
    needs: assess-crop-framing
    if: >-
      ${{ always() && !cancelled()
        && (needs.assess-crop-framing.result == 'success' || (inputs.start_stage == 'orientation-deskew' && needs.assess-crop-framing.result == 'skipped'))
        && contains(fromJSON('["full","crop-framing","orientation-deskew"]'), inputs.start_stage) }}
    uses: ./.github/workflows/assess-orientation-deskew.yml
    with:
      results_repository: ${{ inputs.results_repository }}
      runner_target: ${{ inputs.runner_target }}
      artifact_retention_days: ${{ fromJSON(format('{0}', inputs.artifact_retention_days)) }}
      canonical_build_policy: ${{ inputs.canonical_normalization_policy }}
    secrets: inherit

  normalize:
    name: Crop and Deskew normalization
    needs: assess-orientation-deskew
    if: >-
      ${{ always() && !cancelled()
        && (needs.assess-orientation-deskew.result == 'success' || (inputs.start_stage == 'canonical-normalization' && needs.assess-orientation-deskew.result == 'skipped'))
        && contains(fromJSON('["full","crop-framing","orientation-deskew","canonical-normalization"]'), inputs.start_stage) }}
    # BEGIN GENERATED RUNNER TARGET ROUTING
    runs-on: >-
      ${{ inputs.runner_target == 'self-hosted-linux' && fromJSON('["self-hosted","Linux","X64"]')
        || inputs.runner_target == 'self-hosted-windows' && fromJSON('["self-hosted","Windows","X64"]')
        || inputs.runner_target == 'hth' && fromJSON('["self-hosted","Linux","X64","hth"]')
        || inputs.runner_target == 'rhel8' && fromJSON('["self-hosted","Linux","X64","rhel8"]')
        || inputs.runner_target == 'e7k' && fromJSON('["self-hosted","Linux","X64","e7k"]')
        || inputs.runner_target == 'e9k' && fromJSON('["self-hosted","Linux","X64","e9k"]')
        || inputs.runner_target == '192vcpu' && fromJSON('["self-hosted","Linux","X64","192vcpu"]')
        || inputs.runner_target == '96vcpu' && fromJSON('["self-hosted","Linux","X64","96vcpu"]')
        || inputs.runner_target == '32vcpu' && fromJSON('["self-hosted","Linux","X64","32vcpu"]')
        || 'ubuntu-latest' }}
    # END GENERATED RUNNER TARGET ROUTING
    timeout-minutes: 90
    env:
      # BEGIN GENERATED RUNNER SETUP LABEL
      HTH_SELECTED_RUNNER_LABEL: >-
        ${{ inputs.runner_target == 'self-hosted-linux' && 'linux'
          || inputs.runner_target == 'self-hosted-windows' && 'windows'
          || inputs.runner_target == 'hth' && 'hth'
          || inputs.runner_target == 'rhel8' && 'rhel8'
          || inputs.runner_target == 'e7k' && 'e7k'
          || inputs.runner_target == 'e9k' && 'e9k'
          || inputs.runner_target == '192vcpu' && '192vcpu'
          || inputs.runner_target == '96vcpu' && '96vcpu'
          || inputs.runner_target == '32vcpu' && '32vcpu'
          || 'github-hosted' }}
      # END GENERATED RUNNER SETUP LABEL
    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical collection evidence
        uses: ./hth-pipeline/.github/actions/checkout-results
        with:
          repository: ${{ env.RESULTS_REPOSITORY }}
          path: results-repo
          ref: main
          token: ${{ secrets.HTH_RESULTS_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            /metadata/canonical-build-evidence.json
            /metadata/image_manifest.json
            /metadata/exact_duplicates.json
            /reports/preprocess-summary.json
            /analysis/page-analysis.json
            /analysis/analysis-summary.json
            /normalization/
          sparse-checkout-cone-mode: false
          persist-credentials: true

      - name: Set up canonical HTH Python runtime
        uses: ./hth-pipeline/.github/actions/setup-hth-python
        with:
          pipeline-path: hth-pipeline
          runner-label: ${{ env.HTH_SELECTED_RUNNER_LABEL }}

      - name: Resolve authoritative preprocess identity
        id: preprocess
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          import os
          from pathlib import Path

          store = json.loads(Path("results-repo/metadata/canonical-build-evidence.json").read_text(encoding="utf-8"))
          identity = str(store.get("authoritative_identity") or "")
          record = (store.get("records") or {}).get(identity)
          if not identity or not isinstance(record, dict):
              raise SystemExit("Canonical preprocess evidence has no authoritative record")
          result = str((record.get("canonical_result") or {}).get("identity") or "")
          source = (record.get("effective_inputs") or {}).get("source") or {}
          if len(result) != 64:
              raise SystemExit("Canonical preprocess evidence has no valid result identity")
          if not source.get("repository") or not source.get("release") or len(str(source.get("release_manifest_sha256") or "")) != 64:
              raise SystemExit("Canonical preprocess evidence has incomplete source-release provenance")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"effective_build_identity={identity}\n")
              handle.write(f"canonical_result_identity={result}\n")
              handle.write(f"source_repository={source['repository']}\n")
              handle.write(f"source_release={source['release']}\n")
              handle.write(f"source_manifest_sha256={source['release_manifest_sha256']}\n")
          PY

      - name: Assemble canonical normalization inputs
        shell: bash
        run: |
          set -euo pipefail
          effective="$RUNNER_TEMP/normalization-effective-source"
          rm -rf "$effective"
          mkdir -p "$effective/metadata" "$effective/analysis" "$effective/reports"
          cp results-repo/metadata/image_manifest.json "$effective/metadata/"
          cp results-repo/metadata/exact_duplicates.json "$effective/metadata/"
          cp results-repo/analysis/page-analysis.json "$effective/analysis/"
          cp results-repo/analysis/analysis-summary.json "$effective/analysis/"
          cp results-repo/reports/preprocess-summary.json "$effective/reports/"

      - name: Resolve researcher-selected normalization recipe
        id: recipe
        shell: bash
        env:
          NORMALIZATION_RECIPE: ${{ inputs.normalization_recipe }}
        run: |
          set -euo pipefail
          if [[ "$NORMALIZATION_RECIPE" == "prepared-recommendation" ]]; then
            policy="results-repo/normalization/orientation-deskew-policy.json"
            if [[ ! -f "$policy" ]]; then
              echo "::error::No prepared normalization recommendation exists. Run 'HTH normalize prepare recommendation' first, or choose axis-aligned-only."
              exit 1
            fi
            echo "transform_policy=$policy" >> "$GITHUB_OUTPUT"
            printf '## Normalization recipe\n\nUsing the prepared, evidence-backed recommendation. Gross page orientation remains unchanged; only pages passing every deskew safety gate may be resampled.\n\n' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "transform_policy=" >> "$GITHUB_OUTPUT"
            printf '## Normalization recipe\n\nUsing axis-aligned framing only. No page will be rotated or resampled.\n\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Evaluate canonical normalization evidence
        id: normalization_plan
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          NORMALIZATION_POLICY: ${{ inputs.canonical_normalization_policy }}
          FULL_ARTIFACT: ${{ inputs.upload_full_artifact }}
          TRANSFORM_POLICY: ${{ steps.recipe.outputs.transform_policy }}
        run: |
          set -euo pipefail
          artifact_args=()
          transform_args=()
          if [[ "$FULL_ARTIFACT" == "true" ]]; then
            artifact_args+=(--artifact-required)
          fi
          if [[ -n "$TRANSFORM_POLICY" ]]; then
            transform_args+=(--config "$TRANSFORM_POLICY")
            transform_args+=(--implementation hth-pipeline/hth/orientation_deskew.py)
            transform_args+=(--operation preserve-gross-page-orientation)
            transform_args+=(--operation gated-conservative-hough-deskew)
          fi
          results_ref="$(git -C results-repo rev-parse HEAD)"
          python -m hth.canonical_build_evidence prepare \
            --scope hth-normalization \
            --contract-version 1 \
            --policy "$NORMALIZATION_POLICY" \
            --mode production \
            --operation canonical-source-reconstruction \
            --operation axis-aligned-document-crop \
            --operation lossless-png-encoding \
            --operation pixel-roundtrip-verification \
            --repository-root hth-pipeline \
            --source-root "$RUNNER_TEMP/normalization-effective-source" \
            --source-input ".=$RUNNER_TEMP/normalization-effective-source" \
            --source-repository "$RESULTS_REPOSITORY" \
            --source-release "${{ steps.preprocess.outputs.effective_build_identity }}" \
            --source-manifest-sha256 "${{ steps.preprocess.outputs.canonical_result_identity }}" \
            --source-commit "${{ steps.preprocess.outputs.canonical_result_identity }}" \
            --config hth-pipeline/config/normalization.json \
            --implementation hth-pipeline/hth/normalize_document_images.py \
            --implementation hth-pipeline/hth/preprocess.py \
            --runtime-contract hth-pipeline/requirements.txt \
            --runtime-contract hth-pipeline/.github/actions/setup-hth-python/action.yml \
            --runtime-package Pillow \
            --runtime-package opencv-python-headless \
            --runtime-package numpy \
            --results-root results-repo \
            --evidence results-repo/normalization/canonical-build-evidence.json \
            --plan "$RUNNER_TEMP/hth-normalization-plan.json" \
            --pipeline-repository "${{ github.repository }}" \
            --pipeline-commit "${{ github.sha }}" \
            --results-repository "$RESULTS_REPOSITORY" \
            --results-ref "$results_ref" \
            --workflow-run-id "${{ github.run_id }}" \
            --runner-name "${{ runner.name }}" \
            --runner-environment "${{ runner.environment }}" \
            --runner-os "${{ runner.os }}" \
            --runner-arch "${{ runner.arch }}" \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            "${artifact_args[@]}" \
            "${transform_args[@]}"

      - name: Download immutable source release
        id: source_release
        if: ${{ steps.normalization_plan.outputs.decision == 'execute' }}
        shell: bash
        env:
          HTH_SOURCE_TOKEN: ${{ secrets.HTH_SOURCE_TOKEN || github.token }}
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          rm -rf source-repo
          python -m hth.source_release \
            --repository "${{ steps.preprocess.outputs.source_repository }}" \
            --tag "${{ steps.preprocess.outputs.source_release }}" \
            --destination source-repo \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify immutable source release against canonical preprocess evidence
        if: ${{ steps.normalization_plan.outputs.decision == 'execute' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.source_release.outputs.manifest_sha256 }}" != "${{ steps.preprocess.outputs.source_manifest_sha256 }}" ]]; then
            echo "::error::Downloaded source release manifest does not match canonical preprocess evidence"
            exit 1
          fi

      - name: Normalize complete collection
        if: ${{ steps.normalization_plan.outputs.decision == 'execute' }}
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          TRANSFORM_POLICY: ${{ steps.recipe.outputs.transform_policy }}
        run: |
          set -euo pipefail
          # Self-hosted workspaces and runner temp directories may retain a
          # prior attempt. These paths are owned exclusively by this job; the
          # normalization engine itself remains fail-closed for every caller.
          rm -rf normalized-collection "$RUNNER_TEMP/canonical-collection-images"
          transform_args=()
          if [[ -n "$TRANSFORM_POLICY" ]]; then
            transform_args+=(--transform-policy "$TRANSFORM_POLICY")
          fi
          python -m hth.normalize_document_images \
            --source-root source-repo/images \
            --materialized-image-root "$RUNNER_TEMP/canonical-collection-images" \
            --results-root results-repo \
            --output normalized-collection \
            --status complete \
            --contact-sheet-every 25 \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            "${transform_args[@]}"

      - name: Finalize canonical normalization evidence
        id: normalization_finalize
        if: ${{ steps.normalization_plan.outputs.decision == 'execute' }}
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.canonical_build_evidence finalize \
            --plan "$RUNNER_TEMP/hth-normalization-plan.json" \
            --output-root normalized-collection \
            --evidence-store results-repo/normalization/canonical-build-evidence.json \
            --evidence-output normalized-collection/canonical-build-evidence.json \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Publish canonical normalization evidence
        id: publish
        if: ${{ steps.normalization_plan.outputs.decision == 'execute' }}
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          source hth-pipeline/tools/hardened-persistence.sh
          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          payload="$RUNNER_TEMP/hth-normalization-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar"
          staging="$RUNNER_TEMP/hth-normalization-publication"
          rm -rf "$staging"
          mkdir -p "$staging/normalization"
          if [[ -d results-repo/normalization ]]; then
            cp -a results-repo/normalization/. "$staging/normalization/"
          fi
          cp normalized-collection/normalization-manifest.json "$staging/normalization/"
          cp normalized-collection/normalization-manifest.csv "$staging/normalization/"
          cp normalized-collection/summary.md "$staging/normalization/"
          cp normalized-collection/canonical-build-evidence.json "$staging/normalization/"
          rm -f "$staging/normalization/applied-normalization-policy.json"
          if [[ -f normalized-collection/normalization-policy.json ]]; then
            cp normalized-collection/normalization-policy.json "$staging/normalization/applied-normalization-policy.json"
          fi
          tar -C "$staging" -cf "$payload" normalization

          apply_normalization_publication() {
            remote_store="$RUNNER_TEMP/hth-remote-normalization-cbe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${HTH_PERSIST_ATTEMPTS}.json"
            rm -f "$remote_store"
            if [[ -f results-repo/normalization/canonical-build-evidence.json ]]; then
              cp results-repo/normalization/canonical-build-evidence.json "$remote_store"
            fi
            rm -rf results-repo/normalization
            tar -C results-repo -xf "$payload"
            if [[ -f "$remote_store" ]]; then
              python -m hth.canonical_build_evidence merge \
                --scope hth-normalization \
                --base "$remote_store" \
                --incoming results-repo/normalization/canonical-build-evidence.json \
                --output results-repo/normalization/canonical-build-evidence.json
            fi
            hth_results_stage results-repo normalization
          }

          hth_hardened_persist \
            results-repo main \
            "Publish canonical normalization evidence ${{ steps.normalization_finalize.outputs.canonical_result_identity }}" \
            apply_normalization_publication \
            "Canonical normalization publication"
          echo "results_commit=$HTH_PERSIST_COMMIT" >> "$GITHUB_OUTPUT"
          echo "- Results commit: [\`$HTH_PERSIST_COMMIT\`](${GITHUB_SERVER_URL}/${RESULTS_REPOSITORY}/commit/${HTH_PERSIST_COMMIT})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete normalized collection
        if: ${{ steps.normalization_plan.outputs.decision == 'execute' && inputs.upload_full_artifact }}
        uses: ./hth-pipeline/.github/actions/hardened-upload-artifact
        with:
          name: hth-normalized-collection-${{ github.run_number }}
          path: normalized-collection
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
          compression-level: 0

  assess-perspective:
    name: Assess residual perspective distortion
    needs: normalize
    if: >-
      ${{ always() && !cancelled() && (needs.normalize.result == 'success' || (inputs.start_stage == 'perspective' && needs.normalize.result == 'skipped'))
        && contains(fromJSON('["full","crop-framing","orientation-deskew","canonical-normalization","perspective"]'), inputs.start_stage) }}
    uses: ./.github/workflows/assess-perspective.yml
    with:
      results_repository: ${{ inputs.results_repository }}
      runner_target: ${{ inputs.runner_target }}
      artifact_retention_days: ${{ fromJSON(format('{0}', inputs.artifact_retention_days)) }}
      canonical_build_policy: ${{ inputs.canonical_normalization_policy }}
    secrets: inherit

  assess-photometric:
    name: Assess photometric correction
    needs: assess-perspective
    if: >-
      ${{ always() && !cancelled() && (needs.assess-perspective.result == 'success' || (inputs.start_stage == 'photometric-assessment' && needs.assess-perspective.result == 'skipped'))
        && contains(fromJSON('["full","crop-framing","orientation-deskew","canonical-normalization","perspective","photometric-assessment"]'), inputs.start_stage) }}
    uses: ./.github/workflows/assess-photometric.yml
    with:
      results_repository: ${{ inputs.results_repository }}
      runner_target: ${{ inputs.runner_target }}
      artifact_retention_days: ${{ fromJSON(format('{0}', inputs.artifact_retention_days)) }}
      canonical_build_policy: ${{ inputs.canonical_normalization_policy }}
    secrets: inherit

  assess-photometric-methods:
    name: Compare bounded photometric methods
    needs: assess-photometric
    if: >-
      ${{ always() && !cancelled() && (needs.assess-photometric.result == 'success' || (inputs.start_stage == 'photometric-method-assessment' && needs.assess-photometric.result == 'skipped'))
        && contains(fromJSON('["full","crop-framing","orientation-deskew","canonical-normalization","perspective","photometric-assessment","photometric-method-assessment"]'), inputs.start_stage) }}
    uses: ./.github/workflows/assess-photometric-methods.yml
    with:
      results_repository: ${{ inputs.results_repository }}
      runner_target: ${{ inputs.runner_target }}
      artifact_retention_days: ${{ fromJSON(format('{0}', inputs.artifact_retention_days)) }}
      canonical_build_policy: ${{ inputs.canonical_normalization_policy }}
    secrets: inherit

  validate-photometric-method:
    name: Validate photometric method on held-out pages
    needs: assess-photometric-methods
    if: >-
      ${{ always() && !cancelled() && (needs.assess-photometric-methods.result == 'success' || (inputs.start_stage == 'photometric-validation' && needs.assess-photometric-methods.result == 'skipped'))
        && contains(fromJSON('["full","crop-framing","orientation-deskew","canonical-normalization","perspective","photometric-assessment","photometric-method-assessment","photometric-validation"]'), inputs.start_stage) }}
    uses: ./.github/workflows/validate-photometric-method.yml
    with:
      results_repository: ${{ inputs.results_repository }}
      runner_target: ${{ inputs.runner_target }}
      artifact_retention_days: ${{ fromJSON(format('{0}', inputs.artifact_retention_days)) }}
      canonical_build_policy: ${{ inputs.canonical_normalization_policy }}
    secrets: inherit

  integrate-photometric:
    name: Integrate photometric normalization with CBE
    needs: validate-photometric-method
    if: >-
      ${{ always() && !cancelled() && (needs.validate-photometric-method.result == 'success' || (inputs.start_stage == 'photometric-integration' && needs.validate-photometric-method.result == 'skipped'))
        && contains(fromJSON('["full","crop-framing","orientation-deskew","canonical-normalization","perspective","photometric-assessment","photometric-method-assessment","photometric-validation","photometric-integration"]'), inputs.start_stage) }}
    uses: ./.github/workflows/integrate-photometric.yml
    with:
      results_repository: ${{ inputs.results_repository }}
      runner_target: ${{ inputs.runner_target }}
      review_artifact_retention_days: ${{ fromJSON(format('{0}', inputs.artifact_retention_days)) }}
      canonical_build_policy: ${{ inputs.canonical_normalization_policy }}
    secrets: inherit

  assess-tonal:
    name: Assess contrast and tonal range
    needs: integrate-photometric
    if: >-
      ${{ always() && !cancelled() && (needs.integrate-photometric.result == 'success' || (inputs.start_stage == 'tonal-assessment' && needs.integrate-photometric.result == 'skipped'))
        && contains(fromJSON('["full","crop-framing","orientation-deskew","canonical-normalization","perspective","photometric-assessment","photometric-method-assessment","photometric-validation","photometric-integration","tonal-assessment"]'), inputs.start_stage) }}
    uses: ./.github/workflows/_core-normalization-evidence.yml
    with:
      results_repository: ${{ inputs.results_repository }}
      domain: tonal
      stage: assess
      runner_target: ${{ inputs.runner_target }}
      artifact_retention_days: ${{ fromJSON(format('{0}', inputs.artifact_retention_days)) }}
      canonical_build_policy: ${{ inputs.canonical_normalization_policy }}
    secrets: inherit

  assess-tonal-methods:
    name: Compare bounded tonal methods
    needs: assess-tonal
    if: >-
      ${{ always() && !cancelled() && (needs.assess-tonal.result == 'success' || (inputs.start_stage == 'tonal-method-assessment' && needs.assess-tonal.result == 'skipped'))
        && contains(fromJSON('["full","crop-framing","orientation-deskew","canonical-normalization","perspective","photometric-assessment","photometric-method-assessment","photometric-validation","photometric-integration","tonal-assessment","tonal-method-assessment"]'), inputs.start_stage) }}
    uses: ./.github/workflows/_core-normalization-evidence.yml
    with:
      results_repository: ${{ inputs.results_repository }}
      domain: tonal
      stage: compare
      runner_target: ${{ inputs.runner_target }}
      artifact_retention_days: ${{ fromJSON(format('{0}', inputs.artifact_retention_days)) }}
      canonical_build_policy: ${{ inputs.canonical_normalization_policy }}
    secrets: inherit

  validate-tonal-method:
    name: Validate tonal method on held-out pages
    needs: assess-tonal-methods
    if: >-
