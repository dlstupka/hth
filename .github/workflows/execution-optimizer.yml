name: HTH execution optimizer

run-name: >-
  Optimize ${{ inputs.algorithm }} execution on ${{ inputs.runner }}

on:
  workflow_dispatch:
    inputs:
      algorithm:
        description: Detector algorithm(s) to benchmark
        required: true
        default: all-without-preference
        type: choice
        options:
          - all-without-preference
          - all
          - adaptive_multi_scale_radial_edge
          - adaptive_radial_edge
          - amsre_bfq_spbv_pbg
          - amsre_doc_ufcn_fusion
          - border_energy
          - border_fusion_quad
          - components
          - consensus_quad
          - contour
          - contour_components
          - contour_grabcut
          - contour_projection
          - contour_quad
          - convex_hull
          - cross_edge_contour
          - dhsegment_page_mask
          - distance_transform
          - distance_transform_rect
          - doc_ufcn_page_mask
          - docextractor_page_mask
          - edge_contour
          - eynollah_page_mask
          - grabcut
          - grabcut_contour
          - gradient_vote
          - hough
          - joint_rectangle_vote
          - kraken_page_mask
          - learned_page_mask
          - lsd
          - mask_rcnn_page_mask
          - msre_bfq_spbv_pbg
          - multi_scale_radial_edge
          - orli_page_mask
          - page_background
          - pagenet_page_mask
          - polar_boundary_vote
          - projective_gradient_vote
          - radial_edge
          - radon_boundary
          - ransac
          - scantailor_page_frame
          - segment_supported_polar_vote
          - signed_polar_boundary_vote
          - star_convex
          - text_flow
          - whitespace_frame
      runner:
        description: Execution runner
        required: true
        default: self-hosted-e7k
        type: choice
        options:
          - self-hosted-e7k
          - self-hosted-e9k
      specific_runner:
        description: "Specific self-hosted runner; any keeps the selected runner class"
        required: true
        default: any
        type: choice
        options:
          - any
          - custom
      custom_runner_label:
        description: "Custom self-hosted runner label; used only when Specific self-hosted runner is custom"
        required: false
        default: ""
        type: string
      clean_runner:
        description: "Advanced — Wipe runner workspace and rebuild from scratch"
        required: true
        default: false
        type: boolean
      pipeline_enumeration:
        description: Pipeline shape enumeration
        required: true
        default: adaptive
        type: choice
        options:
          - exhaustive
          - powers-of-2
          - adaptive
      pipeline_min:
        description: "Optional minimum detector pipelines; blank lets adaptive use the legal minimum (1)"
        required: false
        default: ""
        type: string
      pipeline_max:
        description: "Optional maximum detector pipelines; blank lets adaptive use runner vCPU"
        required: false
        default: ""
        type: string
      thread_min:
        description: Minimum threads per active pipeline
        required: true
        default: "1"
        type: string
      thread_max:
        description: "Optional maximum threads per active pipeline; blank lets optimizer use 2× runner vCPU"
        required: false
        default: ""
        type: string
      allow_thread_oversubscription:
        description: Manual exception — allow requested shapes to exceed the detected runner thread budget
        required: true
        default: false
        type: boolean
      early_stop:
        description: Stop once the perceived peak/plateau is bracketed by >2% throughput degradation on both available sides
        required: true
        default: true
        type: boolean
      sharding:
        description: "Sharding: auto uses runtime-based planning; a positive integer assigns that many shards per active pipeline"
        required: true
        default: "1"
        type: string
      resume:
        description: Resume completed shapes from the latest compatible local checkpoint; use no to force a fresh run, or enter a prior optimizer run ID
        required: true
        default: auto
        type: string
      results_repository:
        description: Repository containing preprocessed images and intelligence indexes
        required: true
        default: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results
        type: string
      golden_set:
        description: "Override Golden Set configuration; blank selects it from the release tag"
        required: false
        default: ""
        type: string
      image_root:
        description: Image directory inside the results repository
        required: true
        default: test/latest/raw
        type: string
      golden_release_repository:
        description: Source repository containing the immutable Golden Set image bundle
        required: false
        default: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898
        type: string
      golden_release_tag:
        description: Immutable Golden Set release tag
        required: true
        default: HTH-GOLDEN-0001
        type: choice
        options:
          - HTH-GOLDEN-0001
          - HTH-GOLDEN-0002
      golden_release_freeze:
        description: "Override freeze manifest; blank selects it from the release tag"
        required: false
        default: ""
        type: string
      max_dimension:
        description: Maximum analysis image dimension
        required: true
        default: "1800"
        type: string
      strategy:
        description: Regression search strategy
        required: true
        default: critical
        type: choice
        options:
          - exhaustive
          - exhaustive-with-zombies
          - non-dormant
          - low+
          - moderate+
          - important+
          - critical
      benchmark_parameter_sets:
        description: Canonical bounded parameter-set workload evaluated at each execution shape
        required: true
        default: "256"
        type: string
      debug_level:
        description: Debug image detail
        required: true
        default: none
        type: choice
        options:
          - none
          - basic
          - verbose

permissions:
  contents: read
  actions: write

# Apply the branch convention to every git process, including actions/checkout's
# internal git init before any shell step can run.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: execution-optimizer-${{ github.ref }}-${{ inputs.runner }}-${{ inputs.algorithm }}
  cancel-in-progress: false

jobs:
  dispatch-detectors:
    if: ${{ inputs.algorithm == 'all' || inputs.algorithm == 'all-without-preference' }}
    name: Dispatch detector optimizer runs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout results repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.results_repository }}
          path: results-repo
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.HTH_RESULTS_TOKEN }}
          # Dispatcher only needs the persisted optimizer preference index.
          # Avoid materializing the large results worktree just to decide which
          # detector optimizers still need to run.
          sparse-checkout: |
            /indexes/optimizer-index.json
            /optimizer-index.json
          sparse-checkout-cone-mode: false
          show-progress: false

      - name: Dispatch selected detector optimizer runs
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m hth.optimizer_dispatch \
            --mode "${{ inputs.algorithm }}" \
            --detector-dir hth-pipeline/config/detectors \
            --optimizer-index results-repo/indexes/optimizer-index.json \
            --repository "$GITHUB_REPOSITORY" \
            --ref "${{ github.ref_name }}" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --runner "${{ inputs.runner }}" \
            --specific-runner "${{ inputs.specific_runner }}" \
            --custom-runner-label "${{ inputs.custom_runner_label }}" \
            --pipeline-enumeration "${{ inputs.pipeline_enumeration }}" \
            --pipeline-min "${{ inputs.pipeline_min }}" \
            --pipeline-max "${{ inputs.pipeline_max }}" \
            --thread-min "${{ inputs.thread_min }}" \
            --thread-max "${{ inputs.thread_max }}" \
            --allow-thread-oversubscription "${{ inputs.allow_thread_oversubscription }}" \
            --early-stop "${{ inputs.early_stop }}" \
            --sharding "${{ inputs.sharding }}" \
            --resume "${{ inputs.resume }}" \
            --results-repository "${{ inputs.results_repository }}" \
            --golden-set "${{ inputs.golden_set }}" \
            --image-root "${{ inputs.image_root }}" \
            --golden-release-repository "${{ inputs.golden_release_repository }}" \
            --golden-release-tag "${{ inputs.golden_release_tag }}" \
            --golden-release-freeze "${{ inputs.golden_release_freeze }}" \
            --max-dimension "${{ inputs.max_dimension }}" \
            --strategy "${{ inputs.strategy }}" \
            --debug-level "${{ inputs.debug_level }}"

  optimize:
    if: ${{ inputs.algorithm != 'all' && inputs.algorithm != 'all-without-preference' }}
    name: Optimize detector execution shapes
    runs-on: >-
      ${{    inputs.specific_runner == 'custom' && inputs.custom_runner_label != '' && fromJSON(format('["self-hosted","{0}"]', inputs.custom_runner_label))
          || inputs.runner == 'self-hosted-windows' && fromJSON('["self-hosted","Windows","X64"]')
          || inputs.runner == 'self-hosted-hth'     && fromJSON('["self-hosted","Linux","X64","hth"]')
          || inputs.runner == 'self-hosted-rhel8'   && fromJSON('["self-hosted","Linux","X64","rhel8"]')
          || inputs.runner == 'self-hosted-e7k'     && fromJSON('["self-hosted","Linux","X64","e7k"]')
          || inputs.runner == 'self-hosted-e9k'     && fromJSON('["self-hosted","Linux","X64","e9k"]')
          || 'ubuntu-latest' }}
    timeout-minutes: 10080

    env:
      DETECTOR_ALGORITHM: ${{ inputs.algorithm }}
      GOLDEN_SET: ${{ inputs.golden_set || (inputs.golden_release_tag == 'HTH-GOLDEN-0002' && 'config/golden_sets/HTH-GOLDEN-0002.golden-set.json' || 'config/golden_set.json') }}
      RESULTS_REPOSITORY: ${{ inputs.results_repository }}
      IMAGE_ROOT: ${{ inputs.image_root }}
      GOLDEN_RELEASE_REPOSITORY: ${{ inputs.golden_release_repository }}
      GOLDEN_RELEASE_TAG: ${{ inputs.golden_release_tag }}
      GOLDEN_RELEASE_FREEZE: ${{ inputs.golden_release_freeze || (inputs.golden_release_tag == 'HTH-GOLDEN-0002' && 'config/golden_sets/HTH-GOLDEN-0002.freeze.json' || 'config/golden_sets/HTH-0001.freeze.json') }}
      REGRESSION_MODE: full
      STRATEGY: ${{ inputs.strategy }}
      LIMIT: ${{ inputs.benchmark_parameter_sets }}
      HTH_BOUNDED_WORKLOAD: "1"
      HTH_OPTIMIZER_BENCHMARK_PARAMETER_SETS: ${{ inputs.benchmark_parameter_sets }}
      MAX_DIMENSION: ${{ inputs.max_dimension }}
      TOP_COUNT: "20"
      THREADS: auto
      SHARDING: ${{ inputs.sharding }}
      SHARD_TARGET_MINUTES: "30"
      SHARD_LEASE_MINUTES: "5"
      DETECTOR_PIPELINES: "1"
      DETECTOR_LOADING_STRATEGY: lpt
      PIPELINE_STAGGER_MINUTES: "0"
      DEBUG_LEVEL: ${{ inputs.debug_level }}
      PYTHONNOUSERSITE: "1"
      PYTHONUNBUFFERED: "1"
      HTH_RUNNER_LABELS: >-
        ${{  inputs.specific_runner == 'custom' && inputs.custom_runner_label != '' && format('self-hosted,{0}', inputs.custom_runner_label)
          || inputs.runner == 'self-hosted-hth' && 'self-hosted,linux,x64,hth'
          || inputs.runner == 'self-hosted-rhel8' && 'self-hosted,linux,x64,rhel8'
          || inputs.runner == 'self-hosted-e7k' && 'self-hosted,linux,x64,e7k'
          || inputs.runner == 'self-hosted-e9k' && 'self-hosted,linux,x64,e9k'
          || inputs.runner == 'self-hosted-windows' && 'self-hosted,windows,x64'
          || 'ubuntu-latest' }}
      HTH_RUNNER_LABEL: >-
        ${{  inputs.specific_runner == 'custom' && inputs.custom_runner_label != '' && inputs.custom_runner_label
          || inputs.runner == 'self-hosted-hth' && 'hth'
          || inputs.runner == 'self-hosted-rhel8' && 'rhel8'
          || inputs.runner == 'self-hosted-e7k' && 'e7k'
          || inputs.runner == 'self-hosted-e9k' && 'e9k'
          || inputs.runner == 'self-hosted-windows' && 'windows'
          || 'github-hosted' }}
      HTH_SPECIFIC_RUNNER_BUDGET: ""

    steps:
      - name: Wipe runner workspace
        if: ${{ runner.environment == 'self-hosted' && inputs.clean_runner }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Wiping self-hosted runner workspace: $GITHUB_WORKSPACE"
          # Preserve the workspace directory itself because the runner owns it,
          # but remove every checked-out repo, reusable runtime, artifact, cache,
          # dotfile, and other HTH state beneath it. Subsequent checkout/setup
          # steps rebuild the job from scratch.
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          echo "Removing reusable HTH runtime: /tmp/.ar/.hth-runtime"
          rm -rf "/tmp/.ar/.hth-runtime"
          echo "Runner workspace and reusable HTH runtime wiped; continuing with fresh checkouts."

      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout results repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.RESULTS_REPOSITORY }}
          path: results-repo
          # Bounded history supports one-time recovery of pre-run-history optimizer
          # summaries; current optimizer runs remain durable under runs/<id>/.
          fetch-depth: 100
          persist-credentials: false
          token: ${{ github.event_name != 'pull_request' && secrets.HTH_RESULTS_TOKEN || github.token }}
          # Optimizer runs need the current image set, model/evidence caches,
          # optimizer history, and root intelligence indexes, but not tens of
          # thousands of historical regression/debug files. Keep the shallow
          # checkout and materialize only the paths the optimizer can read or
          # publish. Publish retries fetch/reset this same sparse worktree.
          sparse-checkout: |
            /indexes/calibration-index.json
            /calibration-index.json
            /indexes/parameter-provenance-index.json
            /parameter-provenance-index.json
            /indexes/runtime-index.json
            /runtime-index.json
            /indexes/parallelism-index.json
            /parallelism-index.json
            /indexes/optimizer-index.json
            /optimizer-index.json
            /indexes/optimizer-predictions.json
            /optimizer-predictions.json
            /indexes/multidetector-index.json
            /multidetector-index.json
            /indexes/orli-evidence-index.json
            /orli-evidence-index.json
            ${{ env.GOLDEN_RELEASE_TAG == '' && format('/{0}/', env.IMAGE_ROOT) || '' }}
            /models/
            /learned-evidence/
            /execution-optimizer/
          sparse-checkout-cone-mode: false
          show-progress: false

      - name: Materialize immutable Golden Set images
        if: ${{ env.GOLDEN_RELEASE_TAG != '' }}
        shell: bash
        env:
          HTH_SOURCE_TOKEN: ${{ secrets.HTH_SOURCE_TOKEN || github.token }}
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          if [[ -z "$GOLDEN_RELEASE_REPOSITORY" || -z "$GOLDEN_RELEASE_FREEZE" ]]; then
            echo "::error::golden_release_repository and golden_release_freeze are required with golden_release_tag"
            exit 1
          fi
          python -m hth.golden_set_release \
            --repository "$GOLDEN_RELEASE_REPOSITORY" \
            --tag "$GOLDEN_RELEASE_TAG" \
            --freeze "hth-pipeline/$GOLDEN_RELEASE_FREEZE" \
            --destination "$RUNNER_TEMP/golden-set-images"
          echo "IMAGE_ROOT=$RUNNER_TEMP/golden-set-images/raw" >> "$GITHUB_ENV"

      - name: Set up canonical HTH Python runtime
        uses: ./hth-pipeline/.github/actions/setup-hth-python
        with:
          pipeline-path: hth-pipeline
          runner-label: ${{ env.HTH_RUNNER_LABEL }}

      - name: Set up canonical HTH managed runtime
        uses: ./hth-pipeline/.github/actions/setup-hth-managed-runtime
        with:
          pipeline-path: hth-pipeline
          need-dhsegment: ${{ inputs.algorithm == 'dhsegment_page_mask' || inputs.algorithm == 'all' }}
          need-eynollah: ${{ inputs.algorithm == 'eynollah_page_mask' || inputs.algorithm == 'all' }}
          need-docextractor: ${{ inputs.algorithm == 'docextractor_page_mask' || inputs.algorithm == 'all' }}
          need-doc-ufcn: ${{ inputs.algorithm == 'doc_ufcn_page_mask' || inputs.algorithm == 'amsre_doc_ufcn_fusion' || inputs.algorithm == 'all' }}
          need-mask-rcnn: ${{ inputs.algorithm == 'mask_rcnn_page_mask' || inputs.algorithm == 'all' }}
          need-kraken: ${{ inputs.algorithm == 'kraken_page_mask' || inputs.algorithm == 'all' }}
          need-orli: ${{ inputs.algorithm == 'orli_page_mask' || inputs.algorithm == 'all' }}
          verify-abi: "true"
          show-toolchain: "true"
          benchmark-opencv: "true"

      - name: Start execution optimizer heartbeat
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          state_file="$RUNNER_TEMP/hth-execution-optimizer-state.json"
          pid_file="$RUNNER_TEMP/hth-execution-optimizer-heartbeat.pid"
          metrics_log="$RUNNER_TEMP/hth-execution-optimizer-runner-metrics.jsonl"
          cpu_state_file="$RUNNER_TEMP/hth-execution-optimizer-proc-stat.json"
          rm -f "$metrics_log" "$cpu_state_file"
          python - "$state_file" "$GITHUB_RUN_ID" <<'PYSTATE'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({"phase": "setup", "optimizer_run_id": sys.argv[2]}) + "\n", encoding="utf-8")
          PYSTATE
          (
            while true; do
              state="$(python - "$state_file" <<'PYSTATE'
          import json, sys
          from pathlib import Path
          try:
              data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except Exception:
              data = {"phase": "unknown"}
          fields = [f"phase={data.get('phase', 'unknown')}"]
          for key in ("shape_sequence", "shape_total", "pipelines", "sharding", "shards", "threads_per_pipeline"):
              if data.get(key) is not None:
                  fields.append(f"{key}={data[key]}")
          print(" ".join(fields))
          PYSTATE
              )"
              echo "[execution optimizer heartbeat] time=$(date -u +%Y-%m-%dT%H:%M:%SZ) ${state}"
              python -m hth.runner_metrics \
                --runner-label "$HTH_RUNNER_LABEL" \
                --runner-name "${HTH_RUNNER_NAME:-unknown}" \
                --optimizer-run-id "$GITHUB_RUN_ID" \
                --state-file "$state_file" \
                --output-log "$metrics_log" \
                --cpu-state-file "$cpu_state_file"
              sleep 60
            done
          ) &
          echo "$!" > "$pid_file"
          echo "HTH_OPTIMIZER_STATE_FILE=$state_file" >> "$GITHUB_ENV"
          echo "HTH_OPTIMIZER_RUNNER_METRICS_LOG=$metrics_log" >> "$GITHUB_ENV"

      - name: Build execution shape plan
        id: plan
        shell: bash
        env:
          ENUMERATION: ${{ inputs.pipeline_enumeration }}
          PIPELINE_MIN: ${{ inputs.pipeline_min }}
          PIPELINE_MAX: ${{ inputs.pipeline_max }}
          THREAD_MIN: ${{ inputs.thread_min }}
          THREAD_MAX: ${{ inputs.thread_max }}
          ALLOW_THREAD_OVERSUBSCRIPTION: ${{ inputs.allow_thread_oversubscription }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.specific_runner }}" == "custom" ]]; then
            if [[ -z "${{ inputs.custom_runner_label }}" ]]; then
              echo "::error::custom_runner_label is required when specific_runner=custom"
              exit 1
            fi
            budget="$(( $(nproc) * 2 ))"
          elif [[ -n "${HTH_SPECIFIC_RUNNER_BUDGET:-}" ]]; then
            budget="$HTH_SPECIFIC_RUNNER_BUDGET"
          else
            budget="$(PYTHONPATH=hth-pipeline python - "$HTH_RUNNER_LABEL" <<'PYPLAN'
          import sys
          from hth.regression.sharding import runner_max_threads
          print(runner_max_threads(sys.argv[1]))
          PYPLAN
            )"
          fi

          logical_cpus="$(nproc)"
          pipeline_min_override="$PIPELINE_MIN"
          pipeline_max_override="$PIPELINE_MAX"
          thread_max_override="$THREAD_MAX"

          [[ -n "$PIPELINE_MIN" ]] || PIPELINE_MIN="1"
          [[ -n "$PIPELINE_MAX" ]] || PIPELINE_MAX="$logical_cpus"
          [[ -n "$THREAD_MAX" ]] || THREAD_MAX="$((logical_cpus * 2))"

          for name in PIPELINE_MIN PIPELINE_MAX THREAD_MIN THREAD_MAX; do
            value="${!name}"
            if [[ ! "$value" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::$name must be a positive whole number: $value"
              exit 1
            fi
          done
          if (( PIPELINE_MIN > PIPELINE_MAX )); then
            echo "::error::Pipeline minimum cannot exceed pipeline maximum"
            exit 1
          fi
          if (( THREAD_MIN > THREAD_MAX )); then
            echo "::error::Thread minimum cannot exceed thread maximum"
            exit 1
          fi
          if (( THREAD_MAX > 1024 )); then
            echo "::error::Thread maximum cannot exceed detector CLI maximum 1024"
            exit 1
          fi

          adaptive_start_pipeline=""
          adaptive_start_source="none"
          if [[ "$ENUMERATION" == "adaptive" ]]; then
            start_json="$(PYTHONPATH=hth-pipeline python - "$DETECTOR_ALGORITHM" "$GOLDEN_SET" "$MAX_DIMENSION" <<'PYSTART'
          import json, os, sys
          from pathlib import Path
          from hth.optimizer_intelligence import resolve_optimizer_start_hint
          from hth.regression_shape import current_runner_profile

          detector = sys.argv[1]
          golden_set = Path("hth-pipeline") / sys.argv[2]
          max_dimension = int(sys.argv[3])
          parallelism = Path("results-repo/indexes/parallelism-index.json")
          if not parallelism.is_file():
              parallelism = Path("results-repo/parallelism-index.json")
          profile = current_runner_profile()
          try:
              hint = resolve_optimizer_start_hint(
                  parallelism_index=parallelism,
                  detector_config=Path("hth-pipeline/config/detectors") / f"{detector}.json",
                  golden_set=golden_set,
                  max_dimension=max_dimension,
                  target_runner_name=profile.name,
                  target_runner_label=profile.label,
                  target_cpu_model=profile.cpu_model,
                  target_physical_cores=profile.physical_cores,
                  target_logical_cpus=profile.logical_cpus,
              )
          except (OSError, ValueError, json.JSONDecodeError):
              hint = None
          print(json.dumps(hint or {}))
          PYSTART
            )"
            adaptive_start_pipeline="$(python - "$start_json" <<'PYSTARTVAL'
          import json, sys
          payload = json.loads(sys.argv[1])
          print(payload.get("pipelines") or "")
          PYSTARTVAL
            )"
            adaptive_start_source="$(python - "$start_json" <<'PYSTARTSRC'
          import json, sys
          payload = json.loads(sys.argv[1])
          relation = payload.get("relation") or "none"
          provenance = payload.get("provenance") or "none"
          confidence = payload.get("confidence") or "none"
          print(f"{provenance}:{relation}:{confidence}" if payload else "none")
          PYSTARTSRC
            )"
          fi

          if [[ "$ALLOW_THREAD_OVERSUBSCRIPTION" != "true" ]]; then
            feasible_pipeline_max=$((budget / THREAD_MIN))
            if (( PIPELINE_MIN > feasible_pipeline_max )); then
              echo "::error::No legal execution shape: pipeline minimum $PIPELINE_MIN with thread minimum $THREAD_MIN exceeds runner budget $budget"
              exit 1
            fi
          else
            echo "::warning::Thread-budget enforcement is disabled by explicit manual allow_thread_oversubscription=true override."
          fi

          pipelines="$(PYTHONPATH=hth-pipeline python -m hth.optimizer_search \
            --mode "$ENUMERATION" \
            --pipeline-min "$PIPELINE_MIN" \
            --pipeline-max "$PIPELINE_MAX" \
            --runner-budget "$budget" \
            --thread-min "$THREAD_MIN" \
            $([[ "$ALLOW_THREAD_OVERSUBSCRIPTION" == "true" ]] && printf '%s' '--allow-oversubscription'))"
          if [[ "$ENUMERATION" == "adaptive" ]]; then
            pipelines="adaptive"
          fi

          echo "runner_budget=$budget" >> "$GITHUB_OUTPUT"
          echo "pipeline_min=$PIPELINE_MIN" >> "$GITHUB_OUTPUT"
          echo "pipeline_max=$PIPELINE_MAX" >> "$GITHUB_OUTPUT"
          echo "pipelines=$pipelines" >> "$GITHUB_OUTPUT"
          echo "thread_min=$THREAD_MIN" >> "$GITHUB_OUTPUT"
          echo "thread_max=$THREAD_MAX" >> "$GITHUB_OUTPUT"
          echo "adaptive_start_pipeline=$adaptive_start_pipeline" >> "$GITHUB_OUTPUT"
          echo "adaptive_start_source=$adaptive_start_source" >> "$GITHUB_OUTPUT"
          echo "allow_thread_oversubscription=$ALLOW_THREAD_OVERSUBSCRIPTION" >> "$GITHUB_OUTPUT"
          echo "Execution Optimizer"
          echo "==================="
          echo "Detector             : $DETECTOR_ALGORITHM"
          echo "Runner               : $HTH_RUNNER_LABEL"
          echo "Runner thread budget : $budget"
          echo "Pipeline enumeration : $ENUMERATION"
          echo "Pipeline range       : $PIPELINE_MIN-$PIPELINE_MAX ($([[ -n "$pipeline_min_override$pipeline_max_override" ]] && echo manual/derived || echo optimizer-owned))"
          echo "Thread range         : $THREAD_MIN-$THREAD_MAX per pipeline ($([[ -n "$thread_max_override" ]] && echo manual max || echo optimizer-owned max))"
          if [[ "$ENUMERATION" == "adaptive" ]]; then
            echo "Adaptive start       : ${adaptive_start_pipeline:-none} (${adaptive_start_source})"
          fi
          echo "Shapes               : $pipelines"
          echo "Oversubscription     : $ALLOW_THREAD_OVERSUBSCRIPTION"
          if [[ "$ALLOW_THREAD_OVERSUBSCRIPTION" == "true" ]]; then
            echo "Model                : sharding=${{ inputs.sharding }}; threads = max(thread min, min(thread max, floor(runner budget / pipelines))); runner budget may be exceeded"
          else
            echo "Model                : sharding=${{ inputs.sharding }}; threads = min(thread max, floor(runner budget / pipelines))"
          fi
          echo "Benchmark workload   : ${{ inputs.benchmark_parameter_sets }} parameter sets/shape (baseline + historic best retained)"
          echo "Benchmark domain     : ${{ inputs.strategy }}"
          echo "Early stop           : ${{ inputs.early_stop }} (3 consecutive shapes >2% below the perceived peak on each available side)"

      - name: Optimize detector execution shapes
        id: optimizer
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          PIPELINES: ${{ steps.plan.outputs.pipelines }}
          PIPELINE_MIN: ${{ steps.plan.outputs.pipeline_min }}
          PIPELINE_MAX: ${{ steps.plan.outputs.pipeline_max }}
          RUNNER_BUDGET: ${{ steps.plan.outputs.runner_budget }}
          THREAD_MIN: ${{ steps.plan.outputs.thread_min }}
          THREAD_MAX: ${{ steps.plan.outputs.thread_max }}
          ADAPTIVE_START_PIPELINE: ${{ steps.plan.outputs.adaptive_start_pipeline }}
          ADAPTIVE_START_SOURCE: ${{ steps.plan.outputs.adaptive_start_source }}
          EARLY_STOP: ${{ inputs.early_stop }}
          ENUMERATION: ${{ inputs.pipeline_enumeration }}
          RESUME: ${{ inputs.resume }}
          ALLOW_THREAD_OVERSUBSCRIPTION: ${{ steps.plan.outputs.allow_thread_oversubscription }}
        run: |
          set -euo pipefail
          optimization_started_epoch="$(date +%s)"
          resume_stage="$RUNNER_TEMP/hth-optimizer-resume-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$resume_stage"
          resume_json="$(python -m hth.optimizer_resume prepare \
            --source-dir optimizer-work \
            --destination-dir "$resume_stage" \
            --results-root results-repo \
            --mode "$RESUME" \
            --current-run-id "$GITHUB_RUN_ID" \
            --detector "$DETECTOR_ALGORITHM" \
            --runner-label "$HTH_RUNNER_LABEL" \
            --runner-budget "$RUNNER_BUDGET" \
            --thread-min "$THREAD_MIN" \
            --thread-max "$THREAD_MAX" \
            --enumeration "$ENUMERATION" \
            --sharding "${{ inputs.sharding }}" \
            --allow-thread-oversubscription "$ALLOW_THREAD_OVERSUBSCRIPTION" \
            --pipeline-min "$PIPELINE_MIN" \
            --pipeline-max "$PIPELINE_MAX")"
          echo "Optimizer resume: $resume_json"

          rm -rf optimizer-work
          mkdir -p optimizer-work
          if [[ -f "$resume_stage/observations.jsonl" ]]; then
            cp "$resume_stage/observations.jsonl" optimizer-work/observations.jsonl
            cp "$resume_stage/shards.jsonl" optimizer-work/shards.jsonl
          else
            : > optimizer-work/observations.jsonl
            : > optimizer-work/shards.jsonl
          fi
          run_metadata="$GITHUB_WORKSPACE/optimizer-work/run-metadata.json"
          observation_log="$GITHUB_WORKSPACE/optimizer-work/observations.jsonl"
          shard_log="$GITHUB_WORKSPACE/optimizer-work/shards.jsonl"

          resumed_from="$(python - "$resume_json" <<'PYRESUME'
          import json, sys
          payload = json.loads(sys.argv[1])
          print(payload.get("resumed_from_optimizer_run_id") or "")
          PYRESUME
          )"
          resumed_shapes="$(python - "$resume_json" <<'PYRESUME'
          import json, sys
          payload = json.loads(sys.argv[1])
          print(int(payload.get("completed_shapes") or 0))
          PYRESUME
          )"

          if [[ "$ENUMERATION" == "adaptive" ]]; then
            candidates=()
            total=$((PIPELINE_MAX - PIPELINE_MIN + 1))
          else
            IFS=',' read -r -a candidates <<< "$PIPELINES"
            total="${#candidates[@]}"
          fi
          shape_number="$resumed_shapes"
          stop_reason="shape_range_complete"

          python - "$run_metadata" "$GITHUB_RUN_ID" "$DETECTOR_ALGORITHM" "$HTH_RUNNER_LABEL" "$RUNNER_BUDGET" "$THREAD_MIN" "$THREAD_MAX" "$ENUMERATION" "${{ inputs.sharding }}" "$EARLY_STOP" "$PIPELINE_MIN" "$PIPELINE_MAX" "$resumed_from" "$resumed_shapes" "$ALLOW_THREAD_OVERSUBSCRIPTION" "${{ inputs.benchmark_parameter_sets }}" "${{ inputs.strategy }}" "$optimization_started_epoch" <<'PYMETA'
          import json, os, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          path.write_text(json.dumps({
              "optimizer_run_id": sys.argv[2],
              "detector_id": sys.argv[3],
              "pipeline_commit": os.environ.get("GITHUB_SHA"),
              "valid": True,
              "runner_label": sys.argv[4],
              "runner_thread_budget": int(sys.argv[5]),
              "thread_min": int(sys.argv[6]),
              "thread_max": int(sys.argv[7]),
              "pipeline_enumeration": sys.argv[8],
              "sharding": sys.argv[9],
              "early_stop_enabled": sys.argv[10].lower() == "true",
              "pipeline_min": int(sys.argv[11]),
              "pipeline_max": int(sys.argv[12]),
              "adaptive_start_pipeline": int(os.environ["ADAPTIVE_START_PIPELINE"]) if os.environ.get("ADAPTIVE_START_PIPELINE") else None,
              "adaptive_start_source": os.environ.get("ADAPTIVE_START_SOURCE") or None,
              "resumed_from_optimizer_run_id": sys.argv[13] or None,
              "resumed_shape_count": int(sys.argv[14]),
              "allow_thread_oversubscription": sys.argv[15].lower() == "true",
              "benchmark_parameter_sets": int(sys.argv[16]),
              "benchmark_strategy": sys.argv[17],
              "optimization_started_epoch": int(sys.argv[18]),
              "early_stop": {"threshold_pct": 2.0, "required_consecutive_shapes": 3, "rule": "confirm_perceived_peak"},
              "completed_shapes": int(sys.argv[14]),
              "stop_reason": None,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PYMETA

          candidate_index=0
          while true; do
            if [[ "$ENUMERATION" == "adaptive" ]]; then
              start_args=()
              [[ -z "${ADAPTIVE_START_PIPELINE:-}" ]] || start_args+=(--start-pipeline "$ADAPTIVE_START_PIPELINE")
              pipelines="$(python -m hth.optimizer_search \
                --mode adaptive \
                --pipeline-min "$PIPELINE_MIN" \
                --pipeline-max "$PIPELINE_MAX" \
                --runner-budget "$RUNNER_BUDGET" \
                --thread-min "$THREAD_MIN" \
                --observation-log "$observation_log" \
                "${start_args[@]}" \
                $([[ "$ALLOW_THREAD_OVERSUBSCRIPTION" == "true" ]] && printf '%s' '--allow-oversubscription'))"
              if [[ -z "$pipelines" ]]; then
                stop_reason="adaptive_search_complete"
                echo "Adaptive optimizer search has bracketed/refined the preferred near-best region; no further informative shape remains."
                break
              fi
            else
              if (( candidate_index >= ${#candidates[@]} )); then
                break
              fi
              pipelines="${candidates[$candidate_index]}"
              candidate_index=$((candidate_index + 1))
            fi

            effective_threads=$((RUNNER_BUDGET / pipelines))
            (( effective_threads > THREAD_MAX )) && effective_threads="$THREAD_MAX"
            if (( effective_threads < THREAD_MIN )); then
              if [[ "$ALLOW_THREAD_OVERSUBSCRIPTION" == "true" ]]; then
                effective_threads="$THREAD_MIN"
              else
                echo "Skipping pipelines=$pipelines because computed threads=$effective_threads is below thread minimum $THREAD_MIN"
                continue
              fi
            fi
            allocated_threads=$((pipelines * effective_threads))
            if (( allocated_threads > RUNNER_BUDGET )); then
              over_threads=$((allocated_threads - RUNNER_BUDGET))
              over_pct="$(python - "$over_threads" "$RUNNER_BUDGET" <<'PYOVER'
          import sys
          print(f"{(int(sys.argv[1]) / int(sys.argv[2])) * 100:.1f}")
          PYOVER
          )"
              echo "::warning::OVERSUBSCRIBED execution shape: ${pipelines}p/${effective_threads}t allocates ${allocated_threads} threads against runner budget ${RUNNER_BUDGET} (+${over_threads}, +${over_pct}%) — explicit manual override."
            fi
            if python -m hth.optimizer_resume shape-completed \
              --observation-log "$observation_log" \
              --pipelines "$pipelines" \
              --threads "$effective_threads"; then
              echo "Resuming optimizer: completed shape pipelines=$pipelines threads=$effective_threads is already checkpointed; skipping execution."
              continue
            fi

            shape_number=$((shape_number + 1))
            export DETECTOR_PIPELINES="$pipelines"
            export THREADS="$effective_threads"
            export HTH_REGRESSION_OUTPUT="optimizer-work/${pipelines}p-${effective_threads}t"
            export HTH_OPTIMIZER_RUN_ID="$GITHUB_RUN_ID"
            export HTH_OPTIMIZER_SHAPE_SEQUENCE="$shape_number"
            export HTH_OPTIMIZER_SHARD_LOG="$shard_log"
            export HTH_OPTIMIZER_RUNNER_METRICS_LOG
            # The optimizer owns the execution shape. The regression driver must
            # execute these exact pipeline/thread values rather than applying its
            # normal standalone regression budget heuristics a second time.
            export HTH_EXACT_EXECUTION_SHAPE=1
            export HTH_EXECUTION_THREAD_BUDGET="$RUNNER_BUDGET"
            export HTH_ALLOW_THREAD_OVERSUBSCRIPTION="$ALLOW_THREAD_OVERSUBSCRIPTION"
            rm -rf "$HTH_REGRESSION_OUTPUT"

            python - "$HTH_OPTIMIZER_STATE_FILE" "$GITHUB_RUN_ID" "$shape_number" "$total" "$DETECTOR_ALGORITHM" "$pipelines" "$effective_threads" <<'PYSTATE'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              "phase": "running",
              "optimizer_run_id": sys.argv[2],
              "shape_sequence": int(sys.argv[3]),
              "shape_total": int(sys.argv[4]),
              "detector_id": sys.argv[5],
              "pipelines": int(sys.argv[6]),
              "sharding": "${{ inputs.sharding }}",
              "threads_per_pipeline": int(sys.argv[7]),
          }) + "\n", encoding="utf-8")
          PYSTATE

            echo
            echo "########################################################################"
            echo "Execution optimizer shape $shape_number/$total"
            echo "Detector          : $DETECTOR_ALGORITHM"
            echo "Pipelines         : $pipelines"
            echo "Sharding          : ${{ inputs.sharding }}"
            echo "Threads / pipeline: $effective_threads"
            echo "Allocated threads : $((pipelines * effective_threads)) / $RUNNER_BUDGET budget"
            echo "########################################################################"

            shape_started="$(date +%s)"
            bash hth-pipeline/tools/run-detector-regressions.sh

            # Shard workers checkpoint independently to JSONL so high-pipeline
            # shapes never contend on the shared parallelism index.  Coalesce
            # the completed shape once from the parent before continuing.
            python -m hth.optimizer_capture \
              --results-root results-repo \
              --replay-shard-log "$shard_log"

            shape_finished="$(date +%s)"
            shape_wall=$((shape_finished - shape_started))
            startup_overhead="$(python - "$HTH_REGRESSION_OUTPUT/optimizer-overhead.json" <<'PYSTARTUP'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if not path.is_file():
              print("0")
          else:
              payload = json.loads(path.read_text(encoding="utf-8"))
              print(payload.get("executor_startup_overhead_seconds") or 0)
          PYSTARTUP
            )"

            run_dir="$(tail -n 1 "$HTH_REGRESSION_OUTPUT/run-directories.txt")"
            [[ -d "$run_dir" ]] || {
              echo "::error::Optimizer run directory missing for pipelines=$pipelines: $run_dir"
              exit 1
            }

            python -m hth.optimizer_capture \
              --results-root results-repo \
              --run-dir "$run_dir" \
              --wall-clock-seconds "$shape_wall" \
              --runner-label "$HTH_RUNNER_LABEL" \
              --github-run-id "$GITHUB_RUN_ID" \
              --shape-sequence "$shape_number" \
              --startup-overhead-seconds "$startup_overhead" \
              --observation-log "$observation_log" \
              --runner-metrics-log "$HTH_OPTIMIZER_RUNNER_METRICS_LOG" \
              --observation-log "$observation_log" \
              --shard-log "$shard_log" \
              --observation-json optimizer-work/latest-shape.json

            assessment_pipeline_max="$PIPELINE_MAX"
            if [[ "$ALLOW_THREAD_OVERSUBSCRIPTION" != "true" ]]; then
              feasible_pipeline_max=$((RUNNER_BUDGET / THREAD_MIN))
              (( assessment_pipeline_max > feasible_pipeline_max )) && assessment_pipeline_max="$feasible_pipeline_max"
            fi
            assessment="$(python -m hth.optimizer_capture \
              --results-root results-repo \
              --assess-log "$observation_log" \
              --threshold-pct 2.0 \
              --pipeline-min "$PIPELINE_MIN" \
              --pipeline-max "$assessment_pipeline_max")"
            python - "$run_metadata" "$assessment" "$shape_number" <<'PYMETA'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          assessment = json.loads(sys.argv[2])
          data["completed_shapes"] = int(sys.argv[3])
          data["early_stop"] = assessment
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PYMETA

            rate="$(python - <<'PYRATE'
          import json
          from pathlib import Path
          row = json.loads(Path("optimizer-work/latest-shape.json").read_text(encoding="utf-8"))
          print(row.get("parameter_sets_per_second") or "unknown")
          PYRATE
            )"
            echo "Execution optimizer shape $shape_number/$total complete: pipelines=$pipelines threads=$effective_threads wall=${shape_wall}s startup=${startup_overhead}s sets/s=$rate"
            rm -rf "$HTH_REGRESSION_OUTPUT"

            should_stop="$(python - "$assessment" <<'PYSTOP'
          import json, sys
          print("true" if json.loads(sys.argv[1]).get("should_stop") else "false")
          PYSTOP
            )"
            if [[ "$ENUMERATION" != "adaptive" && "$EARLY_STOP" == "true" && "$should_stop" == "true" ]]; then
              stop_reason="throughput_peak_bracketed"
              echo "Optimizer early stop: perceived peak confirmed by 3 consecutive shapes >2% lower on each available side."
              break
            elif [[ "$ENUMERATION" == "adaptive" && "$EARLY_STOP" == "true" && "$should_stop" == "true" ]]; then
              echo "Adaptive optimizer: peak bracketing is resolved by adaptive local refinement before search completion."
            fi
          done

          optimization_finished_epoch="$(date +%s)"
          python - "$run_metadata" "$stop_reason" "$optimization_finished_epoch" <<'PYMETA'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          data["stop_reason"] = sys.argv[2]
          finished = int(sys.argv[3])
          started = int(data.get("optimization_started_epoch") or finished)
          data["optimization_finished_epoch"] = finished
          data["optimization_wall_seconds"] = max(0, finished - started)
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PYMETA
          python - "$HTH_OPTIMIZER_STATE_FILE" "$GITHUB_RUN_ID" <<'PYSTATE'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({"phase": "reporting", "optimizer_run_id": sys.argv[2]}) + "\n", encoding="utf-8")
          PYSTATE

          # Replay the complete local execution checkpoint before rendering the
          # run-local report. This is idempotent for newly captured shapes and
          # makes resumed/reused shapes visible in Section 3 before publish.
          python -m hth.optimizer_capture \
            --results-root results-repo \
            --replay-log "$observation_log" \
            --replay-shard-log "$shard_log"

          python -m hth.optimizer_store \
            --results-root results-repo \
            --detector "$DETECTOR_ALGORITHM" \
            --optimizer-run-id "$GITHUB_RUN_ID" \
            --run-metadata "$run_metadata" \
            --runner-metrics-log "$HTH_OPTIMIZER_RUNNER_METRICS_LOG" \
            --observation-log "$observation_log" \
            --shard-log "$shard_log"

      - name: Publish execution optimizer intelligence
        if: ${{ steps.optimizer.outcome == 'success' }}
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          HTH_RESULTS_TOKEN: ${{ secrets.HTH_RESULTS_TOKEN }}
        run: |
          set -euo pipefail
          source hth-pipeline/tools/hardened-persistence.sh
          [[ -n "${HTH_RESULTS_TOKEN:-}" ]] || {
            echo "::error::HTH_RESULTS_TOKEN is required to publish optimizer intelligence"
            exit 1
          }

          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C results-repo remote set-url origin \
            "https://x-access-token:${HTH_RESULTS_TOKEN}@github.com/${RESULTS_REPOSITORY}.git"

          observation_log="$GITHUB_WORKSPACE/optimizer-work/observations.jsonl"
          shard_log="$GITHUB_WORKSPACE/optimizer-work/shards.jsonl"
          run_metadata="$GITHUB_WORKSPACE/optimizer-work/run-metadata.json"

          apply_optimizer_intelligence() {
            hth_results_clean_owned results-repo \
              indexes/optimizer-index.json indexes/optimizer-predictions.json execution-optimizer/
            if [[ -d results-repo/learned-evidence/orli_page_mask ]]; then
              python -m hth.regression.learned_evidence rebuild-orli-index --results-root results-repo
            fi
            python -m hth.optimizer_capture \
              --results-root results-repo \
              --replay-log "$observation_log" \
              --replay-shard-log "$shard_log"
            python -m hth.optimizer_store \
              --results-root results-repo \
              --detector "$DETECTOR_ALGORITHM" \
              --optimizer-run-id "$GITHUB_RUN_ID" \
              --run-metadata "$run_metadata" \
              --runner-metrics-log "$HTH_OPTIMIZER_RUNNER_METRICS_LOG" \
              --observation-log "$observation_log" \
              --shard-log "$shard_log"

            hth_results_remove_legacy_indexes results-repo

            hth_results_stage results-repo \
              indexes/parallelism-index.json indexes/optimizer-index.json \
              "execution-optimizer/$DETECTOR_ALGORITHM/summary.md" \
              "execution-optimizer/$DETECTOR_ALGORITHM/heatmap.svg" \
              "execution-optimizer/$DETECTOR_ALGORITHM/runs/"
            if [[ -d results-repo/models ]]; then
              hth_results_stage results-repo models/
            fi
            if [[ -d results-repo/learned-evidence/orli_page_mask ]]; then
              hth_results_stage results-repo learned-evidence/orli_page_mask indexes/orli-evidence-index.json
            fi
            if [[ -f results-repo/indexes/optimizer-predictions.json ]]; then
              hth_results_stage results-repo indexes/optimizer-predictions.json
            fi
          }

          hth_hardened_persist \
            results-repo main \
            "Update $DETECTOR_ALGORITHM execution optimizer intelligence" \
            apply_optimizer_intelligence \
            "Execution optimizer intelligence"

          # Render the Actions summary only after persistence succeeds.  Using
          # the branch URL before publish lets GitHub cache the previous run's
          # SVG under this run's cache-busting query string, permanently
          # mismatching the current-run table and plot in the job summary.
          results_commit="$(git -C results-repo rev-parse HEAD)"
          python - "$GITHUB_STEP_SUMMARY" "results-repo/execution-optimizer/$DETECTOR_ALGORITHM/summary.md" "$RESULTS_REPOSITORY" "$DETECTOR_ALGORITHM" "$results_commit" <<'PYSUMMARY'
          import sys
          from pathlib import Path
          destination, source, repository, detector, results_commit = sys.argv[1:]
          text = Path(source).read_text(encoding="utf-8")
          raw = f"https://raw.githubusercontent.com/{repository}/{results_commit}/execution-optimizer/{detector}/heatmap.svg"
          text = text.replace("(heatmap.svg)", f"({raw})")
          with Path(destination).open("a", encoding="utf-8") as handle:
              handle.write(text)
              if not text.endswith("\n"):
                  handle.write("\n")
          PYSUMMARY

      - name: Stop execution optimizer heartbeat
        if: always()
        shell: bash
        run: |
          pid_file="$RUNNER_TEMP/hth-execution-optimizer-heartbeat.pid"
          if [[ -f "$pid_file" ]]; then
            kill "$(cat "$pid_file")" 2>/dev/null || true
            rm -f "$pid_file"
          fi
