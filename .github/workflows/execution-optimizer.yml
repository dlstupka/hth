name: HTH execution optimizer

run-name: >-
  Optimize ${{ inputs.algorithm }} execution on ${{ inputs.runner }}

on:
  workflow_dispatch:
    inputs:
      algorithm:
        description: Single detector algorithm to benchmark
        required: true
        default: adaptive_radial_edge
        type: choice
        options:
          - contour
          - contour_quad
          - contour_components
          - contour_projection
          - contour_grabcut
          - grabcut_contour
          - consensus_quad
          - edge_contour
          - cross_edge_contour
          - gradient_vote
          - radial_edge
          - adaptive_radial_edge
          - border_energy
          - components
          - ransac
          - grabcut
          - hough
          - lsd
      runner:
        description: Execution runner
        required: true
        default: self-hosted-e7k
        type: choice
        options:
          - self-hosted-e7k
          - self-hosted-e9k
          - self-hosted-hth
          - self-hosted-rhel8
          - self-hosted-windows
          - github-hosted
      pipeline_range:
        description: Pipeline enumeration mode
        required: true
        default: auto
        type: choice
        options:
          - auto
          - manual
      pipeline_min:
        description: Manual minimum pipelines, inclusive
        required: false
        default: "1"
        type: string
      pipeline_max:
        description: Manual maximum pipelines, inclusive
        required: false
        default: "16"
        type: string
      results_repository:
        description: Repository containing preprocessed images and intelligence indexes
        required: true
        default: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results
        type: string
      golden_set:
        description: Golden Set configuration
        required: true
        default: config/golden_set.json
        type: string
      image_root:
        description: Image directory inside the results repository
        required: true
        default: test/latest/raw
        type: string
      max_dimension:
        description: Maximum analysis image dimension
        required: true
        default: "1800"
        type: string
      strategy:
        description: Regression search strategy
        required: true
        default: exhaustive
        type: choice
        options:
          - exhaustive
          - non-dormant
          - low+
          - moderate+
          - important+
          - critical
      debug_level:
        description: Debug image detail
        required: true
        default: none
        type: choice
        options:
          - none
          - basic
          - verbose

permissions:
  contents: read

concurrency:
  group: execution-optimizer-${{ github.ref }}-${{ inputs.runner }}-${{ inputs.algorithm }}
  cancel-in-progress: false

jobs:
  optimize:
    name: Optimize execution shapes serially
    uses: ./.github/workflows/_core-hth.yml
    with:
      mode: execution-optimizer
      results_repository: ${{ inputs.results_repository }}
      optimizer_algorithm: ${{ inputs.algorithm }}
      optimizer_runner: ${{ inputs.runner }}
      optimizer_pipeline_range: ${{ inputs.pipeline_range }}
      optimizer_pipeline_min: ${{ inputs.pipeline_min }}
      optimizer_pipeline_max: ${{ inputs.pipeline_max }}
      optimizer_golden_set: ${{ inputs.golden_set }}
      optimizer_image_root: ${{ inputs.image_root }}
      optimizer_max_dimension: ${{ inputs.max_dimension }}
      optimizer_strategy: ${{ inputs.strategy }}
      optimizer_debug_level: ${{ inputs.debug_level }}
    secrets: inherit
