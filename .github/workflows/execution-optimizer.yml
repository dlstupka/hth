name: HTH execution optimizer

run-name: >-
  Optimize ${{ inputs.algorithm }} execution on ${{ inputs.runner }}

on:
  workflow_dispatch:
    inputs:
      algorithm:
        description: Single detector algorithm to benchmark
        required: true
        default: adaptive_radial_edge
        type: choice
        options:
          - contour
          - contour_quad
          - contour_components
          - contour_projection
          - contour_grabcut
          - grabcut_contour
          - consensus_quad
          - edge_contour
          - cross_edge_contour
          - gradient_vote
          - radial_edge
          - adaptive_radial_edge
          - border_energy
          - components
          - ransac
          - grabcut
          - hough
          - lsd
      runner:
        description: Execution runner
        required: true
        default: self-hosted-e7k
        type: choice
        options:
          - self-hosted-e7k
          - self-hosted-e9k
          - self-hosted-hth
          - self-hosted-rhel8
          - self-hosted-windows
          - github-hosted
      pipeline_enumeration:
        description: Pipeline shape enumeration
        required: true
        default: exhaustive
        type: choice
        options:
          - exhaustive
          - powers-of-2
          - adaptive
      pipeline_min:
        description: Minimum detector pipelines, inclusive
        required: true
        default: "1"
        type: string
      pipeline_max:
        description: Maximum detector pipelines, inclusive
        required: true
        default: "192"
        type: string
      thread_min:
        description: Minimum threads per active pipeline
        required: true
        default: "1"
        type: string
      thread_max:
        description: Maximum threads per active pipeline
        required: true
        default: "96"
        type: string
      early_stop:
        description: Stop after 3 consecutive shapes improve sets/s by less than 1% from the perceived maximum
        required: true
        default: true
        type: boolean
      results_repository:
        description: Repository containing preprocessed images and intelligence indexes
        required: true
        default: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results
        type: string
      golden_set:
        description: Golden Set configuration
        required: true
        default: config/golden_set.json
        type: string
      image_root:
        description: Image directory inside the results repository
        required: true
        default: test/latest/raw
        type: string
      max_dimension:
        description: Maximum analysis image dimension
        required: true
        default: "1800"
        type: string
      strategy:
        description: Regression search strategy
        required: true
        default: exhaustive
        type: choice
        options:
          - exhaustive
          - non-dormant
          - low+
          - moderate+
          - important+
          - critical
      debug_level:
        description: Debug image detail
        required: true
        default: none
        type: choice
        options:
          - none
          - basic
          - verbose

permissions:
  contents: read

concurrency:
  group: execution-optimizer-${{ github.ref }}-${{ inputs.runner }}-${{ inputs.algorithm }}
  cancel-in-progress: false

jobs:
  optimize:
    name: Optimize detector execution shapes
    runs-on: >-
      ${{    inputs.runner == 'self-hosted-windows' && fromJSON('["self-hosted","Windows","X64"]')
          || inputs.runner == 'self-hosted-hth'     && fromJSON('["self-hosted","Linux","X64","hth"]')
          || inputs.runner == 'self-hosted-rhel8'   && fromJSON('["self-hosted","Linux","X64","rhel8"]')
          || inputs.runner == 'self-hosted-e7k'     && fromJSON('["self-hosted","Linux","X64","e7k"]')
          || inputs.runner == 'self-hosted-e9k'     && fromJSON('["self-hosted","Linux","X64","e9k"]')
          || 'ubuntu-latest' }}
    timeout-minutes: 10080

    env:
      DETECTOR_ALGORITHM: ${{ inputs.algorithm }}
      GOLDEN_SET: ${{ inputs.golden_set }}
      RESULTS_REPOSITORY: ${{ inputs.results_repository }}
      IMAGE_ROOT: ${{ inputs.image_root }}
      REGRESSION_MODE: full
      STRATEGY: ${{ inputs.strategy }}
      LIMIT: ""
      MAX_DIMENSION: ${{ inputs.max_dimension }}
      TOP_COUNT: "20"
      THREADS: auto
      SHARDS: ""
      SHARD_TARGET_MINUTES: "30"
      SHARD_LEASE_MINUTES: "5"
      DETECTOR_PIPELINES: "1"
      DETECTOR_LOADING_STRATEGY: lpt
      PIPELINE_STAGGER_MINUTES: "0"
      DEBUG_LEVEL: ${{ inputs.debug_level }}
      PYTHONNOUSERSITE: "1"
      PYTHONUNBUFFERED: "1"
      HTH_RUNNER_LABELS: >-
        ${{  inputs.runner == 'self-hosted-hth' && 'self-hosted,linux,x64,hth'
          || inputs.runner == 'self-hosted-rhel8' && 'self-hosted,linux,x64,rhel8'
          || inputs.runner == 'self-hosted-e7k' && 'self-hosted,linux,x64,e7k'
          || inputs.runner == 'self-hosted-e9k' && 'self-hosted,linux,x64,e9k'
          || inputs.runner == 'self-hosted-windows' && 'self-hosted,windows,x64'
          || 'ubuntu-latest' }}
      HTH_RUNNER_LABEL: >-
        ${{  inputs.runner == 'self-hosted-hth' && 'hth'
          || inputs.runner == 'self-hosted-rhel8' && 'rhel8'
          || inputs.runner == 'self-hosted-e7k' && 'e7k'
          || inputs.runner == 'self-hosted-e9k' && 'e9k'
          || inputs.runner == 'self-hosted-windows' && 'windows'
          || 'github-hosted' }}

    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout results repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.RESULTS_REPOSITORY }}
          path: results-repo
          fetch-depth: 1
          persist-credentials: false
          token: ${{ github.event_name != 'pull_request' && secrets.HTH_RESULTS_TOKEN || github.token }}

      - name: Runner diagnostics
        shell: bash
        run: |
          set -euo pipefail

          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "runner.environment=${{ runner.environment }}"
          echo "runner.name=${{ runner.name }}"

          # Export runtime metadata for later reporting.
          echo "HTH_EXECUTION_ENVIRONMENT=${{ runner.environment }}" >> "$GITHUB_ENV"
          echo "HTH_RUNNER_NAME=${{ runner.name }}" >> "$GITHUB_ENV"
          echo "HTH_RUNNER_LABEL=${HTH_RUNNER_LABEL}" >> "$GITHUB_ENV"
          
      - name: Set up Python — GitHub-hosted Linux
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hth-pipeline/requirements.txt

      - name: Verify Python — self-hosted Linux
        if: ${{ runner.os == 'Linux' && runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "python: $(command -v python)"
          python --version
          python -m pip --version

          python - <<'PY'
          import sys

          if sys.version_info[:2] != (3, 12):
              raise SystemExit(
                  f"Expected Python 3.12, got {sys.version} "
                  f"from {sys.executable}"
              )

          print(f"Python executable: {sys.executable}")
          PY
          
      - name: Use repaired Python tool cache — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pythonVersion = "3.12.10"
          $pythonRoot = Join-Path `
            $env:RUNNER_TOOL_CACHE `
            "Python\$pythonVersion\x64"
          $pythonExe = Join-Path $pythonRoot "python.exe"
          $completeMarker = "$pythonRoot.complete"
          $scriptsDir = Join-Path $pythonRoot "Scripts"

          if (-not (Test-Path -LiteralPath $completeMarker)) {
            throw "Python tool-cache marker is missing: $completeMarker"
          }

          if (-not (Test-Path -LiteralPath $pythonExe)) {
            throw "Python executable is missing: $pythonExe"
          }

          # Make this interpreter canonical for this step and all later steps.
          $env:PATH = "$pythonRoot;$scriptsDir;$env:PATH"
          $pythonRoot | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append
          $scriptsDir | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

          $actualVersion = & $pythonExe -c `
            "import sys; print('.'.join(map(str, sys.version_info[:3])))"

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to execute $pythonExe"
          }

          if ($actualVersion.Trim() -ne $pythonVersion) {
            throw "Expected Python $pythonVersion; found $actualVersion"
          }

          & $pythonExe -m pip --version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "pip is missing; bootstrapping with ensurepip"
            & $pythonExe -m ensurepip --upgrade
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to bootstrap pip"
            }
          }

          Write-Host "Using Python: $pythonExe"
          & $pythonExe --version
          & $pythonExe -m pip --version

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail

          bootstrap_python="$(command -v python)"
          venv_dir="$RUNNER_TEMP/hth-python-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "Bootstrap Python: $bootstrap_python"
          "$bootstrap_python" --version
          "$bootstrap_python" -m pip --version

          rm -rf "$venv_dir"
          "$bootstrap_python" -m venv "$venv_dir"

          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            venv_bin="$venv_dir/Scripts"
            venv_python="$venv_bin/python.exe"
            github_path_entry="$(cygpath -w "$venv_bin")"
          else
            venv_bin="$venv_dir/bin"
            venv_python="$venv_bin/python"
            github_path_entry="$venv_bin"
          fi

          if [[ ! -x "$venv_python" ]]; then
            echo "::error::Virtual-environment Python is missing: $venv_python"
            exit 1
          fi

          echo "$github_path_entry" >> "$GITHUB_PATH"
          echo "HTH_VENV=$venv_dir" >> "$GITHUB_ENV"
          echo "HTH_BOOTSTRAP_PYTHON=$bootstrap_python" >> "$GITHUB_ENV"

          "$venv_python" -m pip install --upgrade pip

          "$venv_python" - <<'PY'
          import site
          import sys

          print(f"Venv executable : {sys.executable}")
          print(f"sys.prefix      : {sys.prefix}")
          print(f"sys.base_prefix : {sys.base_prefix}")
          print(f"User site       : {site.USER_SITE}")
          print(f"User site active: {site.ENABLE_USER_SITE}")

          if sys.prefix == sys.base_prefix:
              raise SystemExit("Virtual environment is not active")
          if site.ENABLE_USER_SITE:
              raise SystemExit("User site-packages unexpectedly enabled")
          PY

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "Active Python: $(command -v python)"
          python --version
          python -m pip --version
          python -m pip install --requirement hth-pipeline/requirements.txt
          python -m pip check

      - name: Verify Python dependency ABI
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import sys
          import cv2
          import numpy
          import skimage

          print(f"Python       : {sys.executable}")
          print(f"NumPy        : {numpy.__version__} ({numpy.__file__})")
          print(f"scikit-image : {skimage.__version__} ({skimage.__file__})")
          print(f"OpenCV       : {cv2.__version__} ({cv2.__file__})")
          PY

      - name: Show toolchain environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Toolchain Environment"
          echo "====================="
          echo "Runner name      : ${RUNNER_NAME:-unknown}"
          echo "Runner OS        : ${RUNNER_OS:-unknown}"
          echo "Runner arch      : ${RUNNER_ARCH:-unknown}"
          echo "Runner toolcache : ${RUNNER_TOOL_CACHE:-unknown}"
          echo "SHELL            : ${SHELL:-unset}"
          echo "MSYSTEM          : ${MSYSTEM:-unset}"
          echo "OSTYPE           : ${OSTYPE:-unset}"
          echo

          echo "Shell resolution"
          echo "----------------"
          echo "bash executable  : $(command -v bash)"
          echo "sh executable    : $(command -v sh)"
          type -a bash || true
          type -a sh || true
          bash --version | head -n 1
          echo

          echo "Tool resolution"
          echo "---------------"
          echo "git executable   : $(command -v git)"
          type -a git || true
          git --version
          echo "bootstrap Python : ${HTH_BOOTSTRAP_PYTHON:-unknown}"
          echo "virtual env      : ${HTH_VENV:-unknown}"
          echo "active Python    : $(command -v python)"
          type -a python || true
          python --version
          python -m pip --version
          
          python - <<'PY'
          import os
          import platform
          import sys
          import cv2
          import numpy

          print(f"OpenCV file      : {cv2.__file__}")
          print(f"NumPy file       : {numpy.__file__}")
          print(f"sys.executable   : {sys.executable}")
          print(f"sys.version      : {sys.version.splitlines()[0]}")
          print(f"platform         : {platform.platform()}")
          print(f"process arch     : {platform.machine()}")
          print(f"PYTHONPATH       : {os.environ.get('PYTHONPATH', 'unset')}")
          PY

          echo
          echo "Filesystem"
          echo "----------------------"
          pwd

          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            echo "Native Windows cwd : $(pwd -W)"
            echo "POSIX -> Windows   : $(cygpath -w .)"
            echo "Workspace -> POSIX : $(cygpath -u "${GITHUB_WORKSPACE:-.}")"

            echo
            echo "Windows executable resolution"
            echo "-----------------------------"
            where.exe bash || true
            where.exe sh || true
            where.exe git || true
            where.exe python || true
            where.exe py || true

            echo
            echo "Git Bash path translation"
            echo "-------------------------"
            echo "cygpath executable : $(command -v cygpath)"
            echo "POSIX root         : /"
            echo "Windows root       : $(cygpath -w /)"
          else
            echo "Native POSIX filesystem; MSYS path translation not applicable."
            echo "Workspace          : ${GITHUB_WORKSPACE:-unset}"
          fi

          echo
          echo "PATH entries"
          echo "------------"
          tr ':' '\n' <<< "$PATH"

      - name: Show OpenCV build
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          python - <<'EOF'
          import cv2

          print(f"OpenCV version: {cv2.__version__}")
          print()

          wanted = (
              "CPU/HW",
              "Baseline:",
              "Dispatched code generation:",
              "Parallel framework",
              "Intel IPP",
              "OpenCL",
              "AVX",
              "SSE",
              "TBB",
              "OpenMP",
          )

          for line in cv2.getBuildInformation().splitlines():
              if any(token in line for token in wanted):
                  print(line)
          EOF
 
      - name: Benchmark OpenCV
        shell: bash
        run: |
          python - <<'EOF'
          import os
          import time
          import cv2
          import numpy as np

          image = np.random.default_rng(12345).integers(
              0, 256, size=(3000, 3000), dtype=np.uint8
          )

          # Warm-up
          for _ in range(5):
              cv2.GaussianBlur(image, (9, 9), 0)

          started = time.perf_counter()
          for _ in range(100):
              cv2.GaussianBlur(image, (9, 9), 0)
          elapsed = time.perf_counter() - started

          average = elapsed / 100
          print(f"GaussianBlur 100 iterations: {elapsed:.3f} seconds")
          print(f"Average per iteration: {average:.6f} seconds")

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as stream:
                  stream.write(f"HTH_OPENCV_BENCHMARK_SECONDS={elapsed:.9f}\n")
                  stream.write(f"HTH_OPENCV_BENCHMARK_AVERAGE_SECONDS={average:.9f}\n")
          EOF
          

      - name: Start execution optimizer heartbeat
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          state_file="$RUNNER_TEMP/hth-execution-optimizer-state.json"
          pid_file="$RUNNER_TEMP/hth-execution-optimizer-heartbeat.pid"
          metrics_log="$RUNNER_TEMP/hth-execution-optimizer-runner-metrics.jsonl"
          cpu_state_file="$RUNNER_TEMP/hth-execution-optimizer-proc-stat.json"
          rm -f "$metrics_log" "$cpu_state_file"
          python - "$state_file" "$GITHUB_RUN_ID" <<'PYSTATE'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({"phase": "setup", "optimizer_run_id": sys.argv[2]}) + "\n", encoding="utf-8")
          PYSTATE
          (
            while true; do
              state="$(python - "$state_file" <<'PYSTATE'
          import json, sys
          from pathlib import Path
          try:
              data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except Exception:
              data = {"phase": "unknown"}
          fields = [f"phase={data.get('phase', 'unknown')}"]
          for key in ("shape_sequence", "shape_total", "pipelines", "shards", "threads_per_pipeline"):
              if data.get(key) is not None:
                  fields.append(f"{key}={data[key]}")
          print(" ".join(fields))
          PYSTATE
              )"
              echo "[execution optimizer heartbeat] time=$(date -u +%Y-%m-%dT%H:%M:%SZ) ${state}"
              python -m hth.runner_metrics \
                --runner-label "$HTH_RUNNER_LABEL" \
                --runner-name "${HTH_RUNNER_NAME:-unknown}" \
                --optimizer-run-id "$GITHUB_RUN_ID" \
                --state-file "$state_file" \
                --output-log "$metrics_log" \
                --cpu-state-file "$cpu_state_file"
              sleep 60
            done
          ) &
          echo "$!" > "$pid_file"
          echo "HTH_OPTIMIZER_STATE_FILE=$state_file" >> "$GITHUB_ENV"
          echo "HTH_OPTIMIZER_RUNNER_METRICS_LOG=$metrics_log" >> "$GITHUB_ENV"

      - name: Build execution shape plan
        id: plan
        shell: bash
        env:
          ENUMERATION: ${{ inputs.pipeline_enumeration }}
          PIPELINE_MIN: ${{ inputs.pipeline_min }}
          PIPELINE_MAX: ${{ inputs.pipeline_max }}
          THREAD_MIN: ${{ inputs.thread_min }}
          THREAD_MAX: ${{ inputs.thread_max }}
        run: |
          set -euo pipefail
          budget="$(PYTHONPATH=hth-pipeline python - "$HTH_RUNNER_LABEL" <<'PYPLAN'
          import sys
          from hth.regression.sharding import runner_max_threads
          print(runner_max_threads(sys.argv[1]))
          PYPLAN
          )"

          for name in PIPELINE_MIN PIPELINE_MAX THREAD_MIN THREAD_MAX; do
            value="${!name}"
            if [[ ! "$value" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::$name must be a positive whole number: $value"
              exit 1
            fi
          done
          if (( PIPELINE_MIN > PIPELINE_MAX )); then
            echo "::error::Pipeline minimum cannot exceed pipeline maximum"
            exit 1
          fi
          if (( THREAD_MIN > THREAD_MAX )); then
            echo "::error::Thread minimum cannot exceed thread maximum"
            exit 1
          fi
          if (( THREAD_MAX > 1024 )); then
            echo "::error::Thread maximum cannot exceed detector CLI maximum 1024"
            exit 1
          fi

          effective_thread_max="$THREAD_MAX"
          (( effective_thread_max > budget )) && effective_thread_max="$budget"
          feasible_pipeline_max=$((budget / THREAD_MIN))
          effective_pipeline_max="$PIPELINE_MAX"
          (( effective_pipeline_max > feasible_pipeline_max )) && effective_pipeline_max="$feasible_pipeline_max"
          if (( PIPELINE_MIN > effective_pipeline_max )); then
            echo "::error::No legal execution shape: pipeline minimum $PIPELINE_MIN with thread minimum $THREAD_MIN exceeds runner budget $budget"
            exit 1
          fi

          pipelines="$(PYTHONPATH=hth-pipeline python -m hth.optimizer_search \
            --mode "$ENUMERATION" \
            --pipeline-min "$PIPELINE_MIN" \
            --pipeline-max "$effective_pipeline_max" \
            --runner-budget "$budget" \
            --thread-min "$THREAD_MIN")"
          if [[ "$ENUMERATION" == "adaptive" ]]; then
            pipelines="adaptive"
          fi

          echo "runner_budget=$budget" >> "$GITHUB_OUTPUT"
          echo "pipeline_min=$PIPELINE_MIN" >> "$GITHUB_OUTPUT"
          echo "pipeline_max=$effective_pipeline_max" >> "$GITHUB_OUTPUT"
          echo "pipelines=$pipelines" >> "$GITHUB_OUTPUT"
          echo "thread_min=$THREAD_MIN" >> "$GITHUB_OUTPUT"
          echo "thread_max=$effective_thread_max" >> "$GITHUB_OUTPUT"
          echo "Execution Optimizer"
          echo "==================="
          echo "Detector             : $DETECTOR_ALGORITHM"
          echo "Runner               : $HTH_RUNNER_LABEL"
          echo "Runner thread budget : $budget"
          echo "Pipeline enumeration : $ENUMERATION"
          echo "Pipeline range       : $PIPELINE_MIN-$effective_pipeline_max"
          echo "Thread range         : $THREAD_MIN-$effective_thread_max per pipeline"
          echo "Shapes               : $pipelines"
          echo "Model                : shards = pipelines; threads = min(thread max, floor(runner budget / pipelines))"
          echo "Early stop           : ${{ inputs.early_stop }} (3 consecutive completed shapes <1% improvement from perceived max)"

      - name: Optimize detector execution shapes
        id: optimizer
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          PIPELINES: ${{ steps.plan.outputs.pipelines }}
          PIPELINE_MIN: ${{ steps.plan.outputs.pipeline_min }}
          PIPELINE_MAX: ${{ steps.plan.outputs.pipeline_max }}
          RUNNER_BUDGET: ${{ steps.plan.outputs.runner_budget }}
          THREAD_MIN: ${{ steps.plan.outputs.thread_min }}
          THREAD_MAX: ${{ steps.plan.outputs.thread_max }}
          EARLY_STOP: ${{ inputs.early_stop }}
          ENUMERATION: ${{ inputs.pipeline_enumeration }}
        run: |
          set -euo pipefail
          rm -rf optimizer-work
          mkdir -p optimizer-work
          : > optimizer-work/observations.jsonl
          : > optimizer-work/shards.jsonl
          run_metadata="$GITHUB_WORKSPACE/optimizer-work/run-metadata.json"
          observation_log="$GITHUB_WORKSPACE/optimizer-work/observations.jsonl"
          shard_log="$GITHUB_WORKSPACE/optimizer-work/shards.jsonl"

          if [[ "$ENUMERATION" == "adaptive" ]]; then
            candidates=()
            total=$((PIPELINE_MAX - PIPELINE_MIN + 1))
          else
            IFS=',' read -r -a candidates <<< "$PIPELINES"
            total="${#candidates[@]}"
          fi
          shape_number=0
          stop_reason="shape_range_complete"

          python - "$run_metadata" "$GITHUB_RUN_ID" "$DETECTOR_ALGORITHM" "$HTH_RUNNER_LABEL" "$RUNNER_BUDGET" "$THREAD_MIN" "$THREAD_MAX" "$ENUMERATION" "$EARLY_STOP" <<'PYMETA'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          path.write_text(json.dumps({
              "optimizer_run_id": sys.argv[2],
              "detector_id": sys.argv[3],
              "runner_label": sys.argv[4],
              "runner_thread_budget": int(sys.argv[5]),
              "thread_min": int(sys.argv[6]),
              "thread_max": int(sys.argv[7]),
              "pipeline_enumeration": sys.argv[8],
              "early_stop_enabled": sys.argv[9].lower() == "true",
              "early_stop": {"threshold_pct": 1.0, "required_consecutive_shapes": 3},
              "completed_shapes": 0,
              "stop_reason": None,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PYMETA

          candidate_index=0
          while true; do
            if [[ "$ENUMERATION" == "adaptive" ]]; then
              pipelines="$(python -m hth.optimizer_search \
                --mode adaptive \
                --pipeline-min "$PIPELINE_MIN" \
                --pipeline-max "$PIPELINE_MAX" \
                --runner-budget "$RUNNER_BUDGET" \
                --thread-min "$THREAD_MIN" \
                --observation-log "$observation_log")"
              if [[ -z "$pipelines" ]]; then
                stop_reason="adaptive_search_complete"
                echo "Adaptive optimizer search has bracketed/refined the preferred near-best region; no further informative shape remains."
                break
              fi
            else
              if (( candidate_index >= ${#candidates[@]} )); then
                break
              fi
              pipelines="${candidates[$candidate_index]}"
              candidate_index=$((candidate_index + 1))
            fi

            effective_threads=$((RUNNER_BUDGET / pipelines))
            (( effective_threads > THREAD_MAX )) && effective_threads="$THREAD_MAX"
            if (( effective_threads < THREAD_MIN )); then
              echo "Skipping pipelines=$pipelines because computed threads=$effective_threads is below thread minimum $THREAD_MIN"
              continue
            fi

            shape_number=$((shape_number + 1))
            export DETECTOR_PIPELINES="$pipelines"
            export SHARDS="$pipelines"
            export THREADS="$effective_threads"
            export HTH_REGRESSION_OUTPUT="optimizer-work/${pipelines}p-${effective_threads}t"
            export HTH_OPTIMIZER_RUN_ID="$GITHUB_RUN_ID"
            export HTH_OPTIMIZER_SHAPE_SEQUENCE="$shape_number"
            export HTH_OPTIMIZER_SHARD_LOG="$shard_log"
            export HTH_OPTIMIZER_RUNNER_METRICS_LOG
            rm -rf "$HTH_REGRESSION_OUTPUT"

            python - "$HTH_OPTIMIZER_STATE_FILE" "$GITHUB_RUN_ID" "$shape_number" "$total" "$DETECTOR_ALGORITHM" "$pipelines" "$effective_threads" <<'PYSTATE'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              "phase": "running",
              "optimizer_run_id": sys.argv[2],
              "shape_sequence": int(sys.argv[3]),
              "shape_total": int(sys.argv[4]),
              "detector_id": sys.argv[5],
              "pipelines": int(sys.argv[6]),
              "shards": int(sys.argv[6]),
              "threads_per_pipeline": int(sys.argv[7]),
          }) + "\n", encoding="utf-8")
          PYSTATE

            echo
            echo "########################################################################"
            echo "Execution optimizer shape $shape_number/$total"
            echo "Detector          : $DETECTOR_ALGORITHM"
            echo "Pipelines         : $pipelines"
            echo "Shards            : $pipelines"
            echo "Threads / pipeline: $effective_threads"
            echo "Allocated threads : $((pipelines * effective_threads)) / $RUNNER_BUDGET budget"
            echo "########################################################################"

            shape_started="$(date +%s)"
            bash hth-pipeline/tools/run-detector-regressions.sh
            shape_finished="$(date +%s)"
            shape_wall=$((shape_finished - shape_started))

            run_dir="$(tail -n 1 "$HTH_REGRESSION_OUTPUT/run-directories.txt")"
            [[ -d "$run_dir" ]] || {
              echo "::error::Optimizer run directory missing for pipelines=$pipelines: $run_dir"
              exit 1
            }

            python -m hth.optimizer_capture \
              --results-root results-repo \
              --run-dir "$run_dir" \
              --wall-clock-seconds "$shape_wall" \
              --runner-label "$HTH_RUNNER_LABEL" \
              --github-run-id "$GITHUB_RUN_ID" \
              --shape-sequence "$shape_number" \
              --observation-log "$observation_log" \
              --runner-metrics-log "$HTH_OPTIMIZER_RUNNER_METRICS_LOG" \
              --observation-json optimizer-work/latest-shape.json

            assessment="$(python -m hth.optimizer_capture \
              --results-root results-repo \
              --assess-log "$observation_log" \
              --threshold-pct 1.0 \
              --consecutive 3)"
            python - "$run_metadata" "$assessment" "$shape_number" <<'PYMETA'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          assessment = json.loads(sys.argv[2])
          data["completed_shapes"] = int(sys.argv[3])
          data["early_stop"] = assessment
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PYMETA

            rate="$(python - <<'PYRATE'
          import json
          from pathlib import Path
          row = json.loads(Path("optimizer-work/latest-shape.json").read_text(encoding="utf-8"))
          print(row.get("parameter_sets_per_second") or "unknown")
          PYRATE
            )"
            echo "Execution optimizer shape $shape_number/$total complete: pipelines=$pipelines threads=$effective_threads wall=${shape_wall}s sets/s=$rate"
            rm -rf "$HTH_REGRESSION_OUTPUT"

            should_stop="$(python - "$assessment" <<'PYSTOP'
          import json, sys
          print("true" if json.loads(sys.argv[1]).get("should_stop") else "false")
          PYSTOP
            )"
            if [[ "$EARLY_STOP" == "true" && "$should_stop" == "true" ]]; then
              stop_reason="throughput_plateau"
              echo "Optimizer early stop: 3 consecutive completed shapes improved throughput by <1% from the perceived maximum."
              break
            fi
          done

          python - "$run_metadata" "$stop_reason" <<'PYMETA'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          data["stop_reason"] = sys.argv[2]
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PYMETA
          python - "$HTH_OPTIMIZER_STATE_FILE" "$GITHUB_RUN_ID" <<'PYSTATE'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({"phase": "reporting", "optimizer_run_id": sys.argv[2]}) + "\n", encoding="utf-8")
          PYSTATE

          python -m hth.optimizer_store \
            --results-root results-repo \
            --detector "$DETECTOR_ALGORITHM" \
            --optimizer-run-id "$GITHUB_RUN_ID" \
            --run-metadata "$run_metadata" \
            --runner-metrics-log "$HTH_OPTIMIZER_RUNNER_METRICS_LOG"

          python - "$GITHUB_STEP_SUMMARY" "results-repo/execution-optimizer/$DETECTOR_ALGORITHM/summary.md" "$RESULTS_REPOSITORY" "$DETECTOR_ALGORITHM" "$GITHUB_RUN_ID" <<'PYSUMMARY'
          import sys
          from pathlib import Path
          destination, source, repository, detector, run_id = sys.argv[1:]
          text = Path(source).read_text(encoding="utf-8")
          raw = f"https://raw.githubusercontent.com/{repository}/main/execution-optimizer/{detector}/heatmap.svg?run={run_id}"
          text = text.replace("(heatmap.svg)", f"({raw})")
          with Path(destination).open("a", encoding="utf-8") as handle:
              handle.write(text)
              if not text.endswith("\n"):
                  handle.write("\n")
          PYSUMMARY

      - name: Publish execution optimizer intelligence
        if: ${{ steps.optimizer.outcome == 'success' }}
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          HTH_RESULTS_TOKEN: ${{ secrets.HTH_RESULTS_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${HTH_RESULTS_TOKEN:-}" ]] || {
            echo "::error::HTH_RESULTS_TOKEN is required to publish optimizer intelligence"
            exit 1
          }

          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C results-repo remote set-url origin \
            "https://x-access-token:${HTH_RESULTS_TOKEN}@github.com/${RESULTS_REPOSITORY}.git"

          observation_log="$GITHUB_WORKSPACE/optimizer-work/observations.jsonl"
          shard_log="$GITHUB_WORKSPACE/optimizer-work/shards.jsonl"
          run_metadata="$GITHUB_WORKSPACE/optimizer-work/run-metadata.json"
          max_publish_attempts=5
          for attempt in $(seq 1 "$max_publish_attempts"); do
            git -C results-repo fetch origin main
            git -C results-repo reset --hard origin/main
            git -C results-repo clean -fd -- optimizer-index.json execution-optimizer/
            python -m hth.optimizer_capture \
              --results-root results-repo \
              --replay-log "$observation_log" \
              --replay-shard-log "$shard_log"
            python -m hth.optimizer_store \
              --results-root results-repo \
              --detector "$DETECTOR_ALGORITHM" \
              --optimizer-run-id "$GITHUB_RUN_ID" \
              --run-metadata "$run_metadata" \
              --runner-metrics-log "$HTH_OPTIMIZER_RUNNER_METRICS_LOG"

            git -C results-repo add \
              parallelism-index.json \
              optimizer-index.json \
              "execution-optimizer/$DETECTOR_ALGORITHM/summary.md" \
              "execution-optimizer/$DETECTOR_ALGORITHM/heatmap.svg"

            if git -C results-repo diff --cached --quiet; then
              echo "Execution optimizer intelligence is already current."
              break
            fi

            git -C results-repo commit -m \
              "Update $DETECTOR_ALGORITHM execution optimizer intelligence"
            if git -C results-repo push origin HEAD:main; then
              break
            fi
            if (( attempt == max_publish_attempts )); then
              echo "::error::Unable to publish optimizer intelligence after $max_publish_attempts attempts"
              exit 1
            fi
            sleep $((5 * attempt))
          done

      - name: Stop execution optimizer heartbeat
        if: always()
        shell: bash
        run: |
          pid_file="$RUNNER_TEMP/hth-execution-optimizer-heartbeat.pid"
          if [[ -f "$pid_file" ]]; then
            kill "$(cat "$pid_file")" 2>/dev/null || true
            rm -f "$pid_file"
          fi
