name: HTH execution optimizer

run-name: >-
  Optimize ${{ inputs.algorithm }} execution on ${{ inputs.runner }}

on:
  workflow_dispatch:
    inputs:
      algorithm:
        description: Detector algorithm(s) to benchmark
        required: true
        default: all-without-preference
        type: choice
        options:
          - all-without-preference
          - all
          - adaptive_multi_scale_radial_edge
          - adaptive_radial_edge
          - amsre_bfq_spbv_pbg
          - border_energy
          - border_fusion_quad
          - components
          - consensus_quad
          - contour
          - contour_components
          - contour_grabcut
          - contour_projection
          - contour_quad
          - convex_hull
          - cross_edge_contour
          - dhsegment_page_mask
          - distance_transform
          - distance_transform_rect
          - edge_contour
          - grabcut
          - grabcut_contour
          - gradient_vote
          - hough
          - joint_rectangle_vote
          - kraken_page_mask
          - learned_page_mask
          - lsd
          - msre_bfq_spbv_pbg
          - multi_scale_radial_edge
          - page_background
          - polar_boundary_vote
          - projective_gradient_vote
          - radial_edge
          - radon_boundary
          - ransac
          - segment_supported_polar_vote
          - signed_polar_boundary_vote
          - star_convex
          - text_flow
          - whitespace_frame
      runner:
        description: Execution runner
        required: true
        default: self-hosted-e7k
        type: choice
        options:
          - self-hosted-e7k
          - self-hosted-e9k
      specific_runner:
        description: "Specific self-hosted runner; any keeps the selected runner class"
        required: true
        default: any
        type: choice
        options:
          - any
          - custom
      custom_runner_label:
        description: "Custom self-hosted runner label; used only when Specific self-hosted runner is custom"
        required: false
        default: ""
        type: string
      clean_runner:
        description: "Advanced — Wipe runner workspace and rebuild from scratch"
        required: true
        default: false
        type: boolean
      pipeline_enumeration:
        description: Pipeline shape enumeration
        required: true
        default: adaptive
        type: choice
        options:
          - exhaustive
          - powers-of-2
          - adaptive
      pipeline_min:
        description: Minimum detector pipelines, inclusive
        required: true
        default: "1"
        type: string
      pipeline_max:
        description: Maximum detector pipelines, inclusive
        required: true
        default: "192"
        type: string
      thread_min:
        description: Minimum threads per active pipeline
        required: true
        default: "1"
        type: string
      thread_max:
        description: Maximum threads per active pipeline
        required: true
        default: "96"
        type: string
      allow_thread_oversubscription:
        description: Manual exception — allow requested shapes to exceed the detected runner thread budget
        required: true
        default: false
        type: boolean
      early_stop:
        description: Stop after 3 consecutive shapes improve sets/s by no more than 2% from the perceived maximum
        required: true
        default: true
        type: boolean
      resume:
        description: Resume completed shapes from the latest compatible local checkpoint; use no to force a fresh run, or enter a prior optimizer run ID
        required: true
        default: auto
        type: string
      results_repository:
        description: Repository containing preprocessed images and intelligence indexes
        required: true
        default: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results
        type: string
      golden_set:
        description: Golden Set configuration
        required: true
        default: config/golden_set.json
        type: string
      image_root:
        description: Image directory inside the results repository
        required: true
        default: test/latest/raw
        type: string
      max_dimension:
        description: Maximum analysis image dimension
        required: true
        default: "1800"
        type: string
      strategy:
        description: Regression search strategy
        required: true
        default: exhaustive
        type: choice
        options:
          - exhaustive
          - non-dormant
          - low+
          - moderate+
          - important+
          - critical
      debug_level:
        description: Debug image detail
        required: true
        default: none
        type: choice
        options:
          - none
          - basic
          - verbose

permissions:
  contents: read
  actions: write

concurrency:
  group: execution-optimizer-${{ github.ref }}-${{ inputs.runner }}-${{ inputs.algorithm }}
  cancel-in-progress: false

jobs:
  dispatch-detectors:
    if: ${{ inputs.algorithm == 'all' || inputs.algorithm == 'all-without-preference' }}
    name: Dispatch detector optimizer runs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout results repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.results_repository }}
          path: results-repo
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.HTH_RESULTS_TOKEN }}

      - name: Dispatch selected detector optimizer runs
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m hth.optimizer_dispatch \
            --mode "${{ inputs.algorithm }}" \
            --detector-dir hth-pipeline/config/detectors \
            --optimizer-index results-repo/optimizer-index.json \
            --repository "$GITHUB_REPOSITORY" \
            --ref "${{ github.ref_name }}" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --runner "${{ inputs.runner }}" \
            --specific-runner "${{ inputs.specific_runner }}" \
            --custom-runner-label "${{ inputs.custom_runner_label }}" \
            --pipeline-enumeration "${{ inputs.pipeline_enumeration }}" \
            --pipeline-min "${{ inputs.pipeline_min }}" \
            --pipeline-max "${{ inputs.pipeline_max }}" \
            --thread-min "${{ inputs.thread_min }}" \
            --thread-max "${{ inputs.thread_max }}" \
            --allow-thread-oversubscription "${{ inputs.allow_thread_oversubscription }}" \
            --early-stop "${{ inputs.early_stop }}" \
            --resume "${{ inputs.resume }}" \
            --results-repository "${{ inputs.results_repository }}" \
            --golden-set "${{ inputs.golden_set }}" \
            --image-root "${{ inputs.image_root }}" \
            --max-dimension "${{ inputs.max_dimension }}" \
            --strategy "${{ inputs.strategy }}" \
            --debug-level "${{ inputs.debug_level }}"

  optimize:
    if: ${{ inputs.algorithm != 'all' && inputs.algorithm != 'all-without-preference' }}
    name: Optimize detector execution shapes
    runs-on: >-
      ${{    inputs.specific_runner == 'custom' && inputs.custom_runner_label != '' && fromJSON(format('["self-hosted","{0}"]', inputs.custom_runner_label))
          || inputs.runner == 'self-hosted-windows' && fromJSON('["self-hosted","Windows","X64"]')
          || inputs.runner == 'self-hosted-hth'     && fromJSON('["self-hosted","Linux","X64","hth"]')
          || inputs.runner == 'self-hosted-rhel8'   && fromJSON('["self-hosted","Linux","X64","rhel8"]')
          || inputs.runner == 'self-hosted-e7k'     && fromJSON('["self-hosted","Linux","X64","e7k"]')
          || inputs.runner == 'self-hosted-e9k'     && fromJSON('["self-hosted","Linux","X64","e9k"]')
          || 'ubuntu-latest' }}
    timeout-minutes: 10080

    env:
      DETECTOR_ALGORITHM: ${{ inputs.algorithm }}
      GOLDEN_SET: ${{ inputs.golden_set }}
      RESULTS_REPOSITORY: ${{ inputs.results_repository }}
      IMAGE_ROOT: ${{ inputs.image_root }}
      REGRESSION_MODE: full
      STRATEGY: ${{ inputs.strategy }}
      LIMIT: ""
      MAX_DIMENSION: ${{ inputs.max_dimension }}
      TOP_COUNT: "20"
      THREADS: auto
      SHARDS: ""
      SHARD_TARGET_MINUTES: "30"
      SHARD_LEASE_MINUTES: "5"
      DETECTOR_PIPELINES: "1"
      DETECTOR_LOADING_STRATEGY: lpt
      PIPELINE_STAGGER_MINUTES: "0"
      DEBUG_LEVEL: ${{ inputs.debug_level }}
      PYTHONNOUSERSITE: "1"
      PYTHONUNBUFFERED: "1"
      HTH_RUNNER_LABELS: >-
        ${{  inputs.specific_runner == 'custom' && inputs.custom_runner_label != '' && format('self-hosted,{0}', inputs.custom_runner_label)
          || inputs.runner == 'self-hosted-hth' && 'self-hosted,linux,x64,hth'
          || inputs.runner == 'self-hosted-rhel8' && 'self-hosted,linux,x64,rhel8'
          || inputs.runner == 'self-hosted-e7k' && 'self-hosted,linux,x64,e7k'
          || inputs.runner == 'self-hosted-e9k' && 'self-hosted,linux,x64,e9k'
          || inputs.runner == 'self-hosted-windows' && 'self-hosted,windows,x64'
          || 'ubuntu-latest' }}
      HTH_RUNNER_LABEL: >-
        ${{  inputs.specific_runner == 'custom' && inputs.custom_runner_label != '' && inputs.custom_runner_label
          || inputs.runner == 'self-hosted-hth' && 'hth'
          || inputs.runner == 'self-hosted-rhel8' && 'rhel8'
          || inputs.runner == 'self-hosted-e7k' && 'e7k'
          || inputs.runner == 'self-hosted-e9k' && 'e9k'
          || inputs.runner == 'self-hosted-windows' && 'windows'
          || 'github-hosted' }}
      HTH_SPECIFIC_RUNNER_BUDGET: ""

    steps:
      - name: Wipe runner workspace
        if: ${{ runner.environment == 'self-hosted' && inputs.clean_runner }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Wiping self-hosted runner workspace: $GITHUB_WORKSPACE"
          # Preserve the workspace directory itself because the runner owns it,
          # but remove every checked-out repo, reusable runtime, artifact, cache,
          # dotfile, and other HTH state beneath it. Subsequent checkout/setup
          # steps rebuild the job from scratch.
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          echo "Removing reusable HTH runtime: /tmp/.ar/.hth-runtime"
          rm -rf "/tmp/.ar/.hth-runtime"
          echo "Runner workspace and reusable HTH runtime wiped; continuing with fresh checkouts."

      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout results repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.RESULTS_REPOSITORY }}
          path: results-repo
          fetch-depth: 1
          persist-credentials: false
          token: ${{ github.event_name != 'pull_request' && secrets.HTH_RESULTS_TOKEN || github.token }}

      - name: Runner diagnostics
        shell: bash
        run: |
          set -euo pipefail

          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "runner.environment=${{ runner.environment }}"
          echo "runner.name=${{ runner.name }}"

          # Export runtime metadata for later reporting.
          echo "HTH_EXECUTION_ENVIRONMENT=${{ runner.environment }}" >> "$GITHUB_ENV"
          echo "HTH_RUNNER_NAME=${{ runner.name }}" >> "$GITHUB_ENV"
          echo "HTH_RUNNER_LABEL=${HTH_RUNNER_LABEL}" >> "$GITHUB_ENV"
          
      - name: Set up Python — GitHub-hosted Linux
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hth-pipeline/requirements.txt

      - name: Verify Python — self-hosted Linux
        if: ${{ runner.os == 'Linux' && runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "python: $(command -v python)"
          python --version
          python -m pip --version

          python - <<'PY'
          import sys

          if sys.version_info[:2] != (3, 12):
              raise SystemExit(
                  f"Expected Python 3.12, got {sys.version} "
                  f"from {sys.executable}"
              )

          print(f"Python executable: {sys.executable}")
          PY
          
      - name: Use repaired Python tool cache — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pythonVersion = "3.12.10"
          $pythonRoot = Join-Path `
            $env:RUNNER_TOOL_CACHE `
            "Python\$pythonVersion\x64"
          $pythonExe = Join-Path $pythonRoot "python.exe"
          $completeMarker = "$pythonRoot.complete"
          $scriptsDir = Join-Path $pythonRoot "Scripts"

          if (-not (Test-Path -LiteralPath $completeMarker)) {
            throw "Python tool-cache marker is missing: $completeMarker"
          }

          if (-not (Test-Path -LiteralPath $pythonExe)) {
            throw "Python executable is missing: $pythonExe"
          }

          # Make this interpreter canonical for this step and all later steps.
          $env:PATH = "$pythonRoot;$scriptsDir;$env:PATH"
          $pythonRoot | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append
          $scriptsDir | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

          $actualVersion = & $pythonExe -c `
            "import sys; print('.'.join(map(str, sys.version_info[:3])))"

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to execute $pythonExe"
          }

          if ($actualVersion.Trim() -ne $pythonVersion) {
            throw "Expected Python $pythonVersion; found $actualVersion"
          }

          & $pythonExe -m pip --version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "pip is missing; bootstrapping with ensurepip"
            & $pythonExe -m ensurepip --upgrade
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to bootstrap pip"
            }
          }

          Write-Host "Using Python: $pythonExe"
          & $pythonExe --version
          & $pythonExe -m pip --version

      - name: Verify / Create reusable Python environment
        shell: bash
        run: |
          set -euo pipefail

          bootstrap_python="$(command -v python)"
          echo "Bootstrap Python: $bootstrap_python"
          "$bootstrap_python" --version
          "$bootstrap_python" -m pip --version

          if [[ "${{ runner.environment }}" == "self-hosted" ]]; then
            runtime_root="/tmp/.ar/.hth-runtime"
            venv_dir="$runtime_root/python-3.12-${RUNNER_OS:-unknown}-${RUNNER_ARCH:-unknown}"

          else
            venv_dir="$RUNNER_TEMP/hth-python-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            rm -rf "$venv_dir"
          fi

          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            venv_bin="$venv_dir/Scripts"
            venv_python="$venv_bin/python.exe"
            github_path_entry="$(cygpath -w "$venv_bin")"
          else
            venv_bin="$venv_dir/bin"
            venv_python="$venv_bin/python"
            github_path_entry="$venv_bin"
          fi

          reuse=0
          if [[ -x "$venv_python" ]]; then
            if "$venv_python" - <<'PY'
          import site
          import sys
          if sys.version_info[:2] != (3, 12):
              raise SystemExit(1)
          if sys.prefix == sys.base_prefix:
              raise SystemExit(1)
          if site.ENABLE_USER_SITE:
              raise SystemExit(1)
          PY
            then
              reuse=1
            else
              echo "Existing reusable environment failed verification; rebuilding."
              rm -rf "$venv_dir"
            fi
          fi

          if (( reuse == 0 )); then
            echo "Creating Python environment: $venv_dir"
            mkdir -p "$(dirname "$venv_dir")"
            "$bootstrap_python" -m venv "$venv_dir"
          else
            echo "Reusing verified Python environment: $venv_dir"
          fi

          if [[ ! -x "$venv_python" ]]; then
            echo "::error::Virtual-environment Python is missing: $venv_python"
            exit 1
          fi

          echo "$github_path_entry" >> "$GITHUB_PATH"
          echo "HTH_VENV=$venv_dir" >> "$GITHUB_ENV"
          echo "HTH_BOOTSTRAP_PYTHON=$bootstrap_python" >> "$GITHUB_ENV"
          echo "HTH_VENV_REUSED=$reuse" >> "$GITHUB_ENV"
          echo "PIP_DISABLE_PIP_VERSION_CHECK=1" >> "$GITHUB_ENV"

          "$venv_python" - <<'PY'
          import site
          import sys
          print(f"Venv executable : {sys.executable}")
          print(f"sys.prefix      : {sys.prefix}")
          print(f"sys.base_prefix : {sys.base_prefix}")
          print(f"User site       : {site.USER_SITE}")
          print(f"User site active: {site.ENABLE_USER_SITE}")
          if sys.version_info[:2] != (3, 12):
              raise SystemExit(f"Expected Python 3.12, got {sys.version}")
          if sys.prefix == sys.base_prefix:
              raise SystemExit("Virtual environment is not active")
          if site.ENABLE_USER_SITE:
              raise SystemExit("User site-packages unexpectedly enabled")
          PY

      - name: Verify / Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "Active Python: $(command -v python)"
          python --version
          python -m pip --version

          verify_requirements() {
            python - <<'PY'
          from importlib import metadata
          from pathlib import Path
          from pip._vendor.packaging.requirements import Requirement

          failures = []
          for raw in Path("hth-pipeline/requirements.txt").read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or line.startswith(("-", "http:", "https:", "git+")):
                  continue
              try:
                  req = Requirement(line)
              except Exception as exc:
                  failures.append(f"{line}: cannot verify ({exc})")
                  continue
              if req.marker is not None and not req.marker.evaluate():
                  continue
              try:
                  installed = metadata.version(req.name)
              except metadata.PackageNotFoundError:
                  failures.append(f"{req.name}: not installed")
                  continue
              if req.specifier and installed not in req.specifier:
                  failures.append(f"{req.name}: installed {installed}, requires {req.specifier}")
          if failures:
              print("Dependency verification failed:")
              for failure in failures:
                  print(f"  - {failure}")
              raise SystemExit(1)
          print("Declared dependency versions satisfy requirements.txt")
          PY
          }

          if verify_requirements; then
            echo "Base dependencies verified — using previous install; no install required."
          else
            echo "Base dependency verification failed; installing current requirements."
            python -m pip install --upgrade pip
            python -m pip install --requirement hth-pipeline/requirements.txt
            verify_requirements
            python -m pip check
          fi

      - name: Verify / Install dhSegment TensorFlow runtime
        if: ${{ inputs.algorithm == 'dhsegment_page_mask' || inputs.algorithm == 'all' }}
        shell: bash
        run: |
          set -euo pipefail

          verify_dhsegment_runtime() {
            python - <<'PY'
          from importlib import metadata
          from pip._vendor.packaging.specifiers import SpecifierSet

          try:
              version = metadata.version("tensorflow-cpu")
          except metadata.PackageNotFoundError:
              print("dhSegment TensorFlow runtime not present; install required.")
              raise SystemExit(1)

          required = SpecifierSet(">=2.18,<2.21")
          if version not in required:
              print(f"dhSegment TensorFlow runtime version mismatch: tensorflow-cpu {version} does not satisfy {required}")
              raise SystemExit(1)

          try:
              import tensorflow as tf
          except Exception as exc:
              print(f"dhSegment TensorFlow runtime import failed: {type(exc).__name__}: {exc}")
              raise SystemExit(1)

          print(f"TensorFlow verified: {tf.__version__}")
          PY
          }

          if verify_dhsegment_runtime; then
            echo "dhSegment TensorFlow runtime verified — using previous install; no install required."
          else
            echo "dhSegment TensorFlow runtime verification failed; installing."
            python -m pip install "tensorflow-cpu>=2.18,<2.21"
            verify_dhsegment_runtime
            python -m pip check
          fi

      - name: Verify / Install Kraken historical-document segmentation runtime
        if: ${{ inputs.algorithm == 'kraken_page_mask' || inputs.algorithm == 'all' }}
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail

          verify_kraken_runtime() {
            python - <<'PY'
          from importlib import metadata

          try:
              version = metadata.version("kraken")
          except metadata.PackageNotFoundError:
              print("Kraken runtime not present; install required.")
              raise SystemExit(1)

          if version != "7.0.2":
              print(f"Kraken runtime version mismatch: expected 7.0.2, found {version}")
              raise SystemExit(1)

          try:
              from kraken.tasks.segmentation import SegmentationTaskModel
          except Exception as exc:
              print(f"Kraken runtime import failed: {type(exc).__name__}: {exc}")
              raise SystemExit(1)

          print(f"Kraken verified: {version}; SegmentationTaskModel import OK")
          PY
          }

          if verify_kraken_runtime; then
            echo "Kraken runtime verified — using previous install; no install required."
          else
            echo "Kraken runtime verification failed; installing."

            # HTH runs Kraken page-mask inference on CPU. Install the CPU wheel
            # first so Kraken's unconstrained torch dependency cannot pull the
            # multi-gigabyte CUDA/NVIDIA runtime stack into the reusable venv.
            if [[ "${RUNNER_OS:-}" == "Linux" ]]; then
              echo "Ensuring CPU-only PyTorch runtime before Kraken."
              python -m pip install                 --index-url https://download.pytorch.org/whl/cpu                 "torch==2.10.0"
            fi

            python -m pip install "kraken==7.0.2"
            verify_kraken_runtime

            python - <<'PY'
          import torch
          print(f"PyTorch verified: {torch.__version__}")
          if torch.cuda.is_available():
              raise SystemExit("HTH Kraken runtime unexpectedly reports CUDA available")
          print("PyTorch backend: CPU-only")
          PY

            python -m pip check
          fi

      - name: Verify Python dependency ABI
        shell: bash
        run: |
          set -euo pipefail

          python -m pip check
          python - <<'PY'
          import sys
          import cv2
          import numpy
          import skimage

          print(f"Python       : {sys.executable}")
          print(f"NumPy        : {numpy.__version__} ({numpy.__file__})")
          print(f"scikit-image : {skimage.__version__} ({skimage.__file__})")
          print(f"OpenCV       : {cv2.__version__} ({cv2.__file__})")
          PY

      - name: Show toolchain environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Toolchain Environment"
          echo "====================="
          echo "Runner name      : ${RUNNER_NAME:-unknown}"
          echo "Runner OS        : ${RUNNER_OS:-unknown}"
          echo "Runner arch      : ${RUNNER_ARCH:-unknown}"
          echo "Runner toolcache : ${RUNNER_TOOL_CACHE:-unknown}"
          echo "SHELL            : ${SHELL:-unset}"
          echo "MSYSTEM          : ${MSYSTEM:-unset}"
          echo "OSTYPE           : ${OSTYPE:-unset}"
          echo

          echo "Shell resolution"
          echo "----------------"
          echo "bash executable  : $(command -v bash)"
          echo "sh executable    : $(command -v sh)"
          type -a bash || true
          type -a sh || true
          bash --version | head -n 1
          echo

          echo "Tool resolution"
          echo "---------------"
          echo "git executable   : $(command -v git)"
          type -a git || true
          git --version
          echo "bootstrap Python : ${HTH_BOOTSTRAP_PYTHON:-unknown}"
          echo "virtual env      : ${HTH_VENV:-unknown}"
          echo "active Python    : $(command -v python)"
          type -a python || true
          python --version
          python -m pip --version
          
          python - <<'PY'
          import os
          import platform
          import sys
          import cv2
          import numpy

          print(f"OpenCV file      : {cv2.__file__}")
          print(f"NumPy file       : {numpy.__file__}")
          print(f"sys.executable   : {sys.executable}")
          print(f"sys.version      : {sys.version.splitlines()[0]}")
          print(f"platform         : {platform.platform()}")
          print(f"process arch     : {platform.machine()}")
          print(f"PYTHONPATH       : {os.environ.get('PYTHONPATH', 'unset')}")
          PY

          echo
          echo "Filesystem"
          echo "----------------------"
          pwd

          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            echo "Native Windows cwd : $(pwd -W)"
            echo "POSIX -> Windows   : $(cygpath -w .)"
            echo "Workspace -> POSIX : $(cygpath -u "${GITHUB_WORKSPACE:-.}")"

            echo
            echo "Windows executable resolution"
            echo "-----------------------------"
            where.exe bash || true
            where.exe sh || true
            where.exe git || true
            where.exe python || true
            where.exe py || true

            echo
            echo "Git Bash path translation"
            echo "-------------------------"
            echo "cygpath executable : $(command -v cygpath)"
            echo "POSIX root         : /"
            echo "Windows root       : $(cygpath -w /)"
          else
            echo "Native POSIX filesystem; MSYS path translation not applicable."
            echo "Workspace          : ${GITHUB_WORKSPACE:-unset}"
          fi

          echo
          echo "PATH entries"
          echo "------------"
          tr ':' '\n' <<< "$PATH"

      - name: Show OpenCV build
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          python - <<'EOF'
          import cv2

          print(f"OpenCV version: {cv2.__version__}")
          print()

          wanted = (
              "CPU/HW",
              "Baseline:",
              "Dispatched code generation:",
              "Parallel framework",
              "Intel IPP",
              "OpenCL",
              "AVX",
              "SSE",
              "TBB",
              "OpenMP",
          )

          for line in cv2.getBuildInformation().splitlines():
              if any(token in line for token in wanted):
                  print(line)
          EOF
 
      - name: Benchmark OpenCV
        shell: bash
        run: |
          python - <<'EOF'
          import os
          import time
          import cv2
          import numpy as np

          image = np.random.default_rng(12345).integers(
              0, 256, size=(3000, 3000), dtype=np.uint8
          )

          # Warm-up
          for _ in range(5):
              cv2.GaussianBlur(image, (9, 9), 0)

          started = time.perf_counter()
          for _ in range(100):
              cv2.GaussianBlur(image, (9, 9), 0)
          elapsed = time.perf_counter() - started

          average = elapsed / 100
          print(f"GaussianBlur 100 iterations: {elapsed:.3f} seconds")
          print(f"Average per iteration: {average:.6f} seconds")

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as stream:
                  stream.write(f"HTH_OPENCV_BENCHMARK_SECONDS={elapsed:.9f}\n")
                  stream.write(f"HTH_OPENCV_BENCHMARK_AVERAGE_SECONDS={average:.9f}\n")
          EOF
          

      - name: Start execution optimizer heartbeat
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          state_file="$RUNNER_TEMP/hth-execution-optimizer-state.json"
          pid_file="$RUNNER_TEMP/hth-execution-optimizer-heartbeat.pid"
          metrics_log="$RUNNER_TEMP/hth-execution-optimizer-runner-metrics.jsonl"
          cpu_state_file="$RUNNER_TEMP/hth-execution-optimizer-proc-stat.json"
          rm -f "$metrics_log" "$cpu_state_file"
          python - "$state_file" "$GITHUB_RUN_ID" <<'PYSTATE'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({"phase": "setup", "optimizer_run_id": sys.argv[2]}) + "\n", encoding="utf-8")
          PYSTATE
          (
            while true; do
              state="$(python - "$state_file" <<'PYSTATE'
          import json, sys
          from pathlib import Path
          try:
              data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except Exception:
              data = {"phase": "unknown"}
          fields = [f"phase={data.get('phase', 'unknown')}"]
          for key in ("shape_sequence", "shape_total", "pipelines", "shards", "threads_per_pipeline"):
              if data.get(key) is not None:
                  fields.append(f"{key}={data[key]}")
          print(" ".join(fields))
          PYSTATE
              )"
              echo "[execution optimizer heartbeat] time=$(date -u +%Y-%m-%dT%H:%M:%SZ) ${state}"
              python -m hth.runner_metrics \
                --runner-label "$HTH_RUNNER_LABEL" \
                --runner-name "${HTH_RUNNER_NAME:-unknown}" \
                --optimizer-run-id "$GITHUB_RUN_ID" \
                --state-file "$state_file" \
                --output-log "$metrics_log" \
                --cpu-state-file "$cpu_state_file"
              sleep 60
            done
          ) &
          echo "$!" > "$pid_file"
          echo "HTH_OPTIMIZER_STATE_FILE=$state_file" >> "$GITHUB_ENV"
          echo "HTH_OPTIMIZER_RUNNER_METRICS_LOG=$metrics_log" >> "$GITHUB_ENV"

      - name: Build execution shape plan
        id: plan
        shell: bash
        env:
          ENUMERATION: ${{ inputs.pipeline_enumeration }}
          PIPELINE_MIN: ${{ inputs.pipeline_min }}
          PIPELINE_MAX: ${{ inputs.pipeline_max }}
          THREAD_MIN: ${{ inputs.thread_min }}
          THREAD_MAX: ${{ inputs.thread_max }}
          ALLOW_THREAD_OVERSUBSCRIPTION: ${{ inputs.allow_thread_oversubscription }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.specific_runner }}" == "custom" ]]; then
            if [[ -z "${{ inputs.custom_runner_label }}" ]]; then
              echo "::error::custom_runner_label is required when specific_runner=custom"
              exit 1
            fi
            budget="$(( $(nproc) * 2 ))"
          elif [[ -n "${HTH_SPECIFIC_RUNNER_BUDGET:-}" ]]; then
            budget="$HTH_SPECIFIC_RUNNER_BUDGET"
          else
            budget="$(PYTHONPATH=hth-pipeline python - "$HTH_RUNNER_LABEL" <<'PYPLAN'
          import sys
          from hth.regression.sharding import runner_max_threads
          print(runner_max_threads(sys.argv[1]))
          PYPLAN
            )"
          fi

          for name in PIPELINE_MIN PIPELINE_MAX THREAD_MIN THREAD_MAX; do
            value="${!name}"
            if [[ ! "$value" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::$name must be a positive whole number: $value"
              exit 1
            fi
          done
          if (( PIPELINE_MIN > PIPELINE_MAX )); then
            echo "::error::Pipeline minimum cannot exceed pipeline maximum"
            exit 1
          fi
          if (( THREAD_MIN > THREAD_MAX )); then
            echo "::error::Thread minimum cannot exceed thread maximum"
            exit 1
          fi
          if (( THREAD_MAX > 1024 )); then
            echo "::error::Thread maximum cannot exceed detector CLI maximum 1024"
            exit 1
          fi

          if [[ "$ALLOW_THREAD_OVERSUBSCRIPTION" != "true" ]]; then
            feasible_pipeline_max=$((budget / THREAD_MIN))
            if (( PIPELINE_MIN > feasible_pipeline_max )); then
              echo "::error::No legal execution shape: pipeline minimum $PIPELINE_MIN with thread minimum $THREAD_MIN exceeds runner budget $budget"
              exit 1
            fi
          else
            echo "::warning::Thread-budget enforcement is disabled by explicit manual allow_thread_oversubscription=true override."
          fi

          pipelines="$(PYTHONPATH=hth-pipeline python -m hth.optimizer_search \
            --mode "$ENUMERATION" \
            --pipeline-min "$PIPELINE_MIN" \
            --pipeline-max "$PIPELINE_MAX" \
            --runner-budget "$budget" \
            --thread-min "$THREAD_MIN" \
            $([[ "$ALLOW_THREAD_OVERSUBSCRIPTION" == "true" ]] && printf '%s' '--allow-oversubscription'))"
          if [[ "$ENUMERATION" == "adaptive" ]]; then
            pipelines="adaptive"
          fi

          echo "runner_budget=$budget" >> "$GITHUB_OUTPUT"
          echo "pipeline_min=$PIPELINE_MIN" >> "$GITHUB_OUTPUT"
          echo "pipeline_max=$PIPELINE_MAX" >> "$GITHUB_OUTPUT"
          echo "pipelines=$pipelines" >> "$GITHUB_OUTPUT"
          echo "thread_min=$THREAD_MIN" >> "$GITHUB_OUTPUT"
          echo "thread_max=$THREAD_MAX" >> "$GITHUB_OUTPUT"
          echo "allow_thread_oversubscription=$ALLOW_THREAD_OVERSUBSCRIPTION" >> "$GITHUB_OUTPUT"
          echo "Execution Optimizer"
          echo "==================="
          echo "Detector             : $DETECTOR_ALGORITHM"
          echo "Runner               : $HTH_RUNNER_LABEL"
          echo "Runner thread budget : $budget"
          echo "Pipeline enumeration : $ENUMERATION"
          echo "Pipeline range       : $PIPELINE_MIN-$PIPELINE_MAX requested"
          echo "Thread range         : $THREAD_MIN-$THREAD_MAX per pipeline requested"
          echo "Shapes               : $pipelines"
          echo "Oversubscription     : $ALLOW_THREAD_OVERSUBSCRIPTION"
          if [[ "$ALLOW_THREAD_OVERSUBSCRIPTION" == "true" ]]; then
            echo "Model                : shards = pipelines; threads = max(thread min, min(thread max, floor(runner budget / pipelines))); runner budget may be exceeded"
          else
            echo "Model                : shards = pipelines; threads = min(thread max, floor(runner budget / pipelines))"
          fi
          echo "Early stop           : ${{ inputs.early_stop }} (3 consecutive completed shapes <=2% improvement from perceived max)"

      - name: Optimize detector execution shapes
        id: optimizer
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          PIPELINES: ${{ steps.plan.outputs.pipelines }}
          PIPELINE_MIN: ${{ steps.plan.outputs.pipeline_min }}
          PIPELINE_MAX: ${{ steps.plan.outputs.pipeline_max }}
          RUNNER_BUDGET: ${{ steps.plan.outputs.runner_budget }}
          THREAD_MIN: ${{ steps.plan.outputs.thread_min }}
          THREAD_MAX: ${{ steps.plan.outputs.thread_max }}
          EARLY_STOP: ${{ inputs.early_stop }}
          ENUMERATION: ${{ inputs.pipeline_enumeration }}
          RESUME: ${{ inputs.resume }}
          ALLOW_THREAD_OVERSUBSCRIPTION: ${{ steps.plan.outputs.allow_thread_oversubscription }}
        run: |
          set -euo pipefail
          optimization_started_epoch="$(date +%s)"
          resume_stage="$RUNNER_TEMP/hth-optimizer-resume-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$resume_stage"
          resume_json="$(python -m hth.optimizer_resume prepare \
            --source-dir optimizer-work \
            --destination-dir "$resume_stage" \
            --results-root results-repo \
            --mode "$RESUME" \
            --current-run-id "$GITHUB_RUN_ID" \
            --detector "$DETECTOR_ALGORITHM" \
            --runner-label "$HTH_RUNNER_LABEL" \
            --runner-budget "$RUNNER_BUDGET" \
            --thread-min "$THREAD_MIN" \
            --thread-max "$THREAD_MAX" \
            --enumeration "$ENUMERATION" \
            --allow-thread-oversubscription "$ALLOW_THREAD_OVERSUBSCRIPTION" \
            --pipeline-min "$PIPELINE_MIN" \
            --pipeline-max "$PIPELINE_MAX")"
          echo "Optimizer resume: $resume_json"

          rm -rf optimizer-work
          mkdir -p optimizer-work
          if [[ -f "$resume_stage/observations.jsonl" ]]; then
            cp "$resume_stage/observations.jsonl" optimizer-work/observations.jsonl
            cp "$resume_stage/shards.jsonl" optimizer-work/shards.jsonl
          else
            : > optimizer-work/observations.jsonl
            : > optimizer-work/shards.jsonl
          fi
          run_metadata="$GITHUB_WORKSPACE/optimizer-work/run-metadata.json"
          observation_log="$GITHUB_WORKSPACE/optimizer-work/observations.jsonl"
          shard_log="$GITHUB_WORKSPACE/optimizer-work/shards.jsonl"

          resumed_from="$(python - "$resume_json" <<'PYRESUME'
          import json, sys
          payload = json.loads(sys.argv[1])
          print(payload.get("resumed_from_optimizer_run_id") or "")
          PYRESUME
          )"
          resumed_shapes="$(python - "$resume_json" <<'PYRESUME'
          import json, sys
          payload = json.loads(sys.argv[1])
          print(int(payload.get("completed_shapes") or 0))
          PYRESUME
          )"

          if [[ "$ENUMERATION" == "adaptive" ]]; then
            candidates=()
            total=$((PIPELINE_MAX - PIPELINE_MIN + 1))
          else
            IFS=',' read -r -a candidates <<< "$PIPELINES"
            total="${#candidates[@]}"
          fi
          shape_number="$resumed_shapes"
          stop_reason="shape_range_complete"

          python - "$run_metadata" "$GITHUB_RUN_ID" "$DETECTOR_ALGORITHM" "$HTH_RUNNER_LABEL" "$RUNNER_BUDGET" "$THREAD_MIN" "$THREAD_MAX" "$ENUMERATION" "$EARLY_STOP" "$PIPELINE_MIN" "$PIPELINE_MAX" "$resumed_from" "$resumed_shapes" "$ALLOW_THREAD_OVERSUBSCRIPTION" "$optimization_started_epoch" <<'PYMETA'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          path.write_text(json.dumps({
              "optimizer_run_id": sys.argv[2],
              "detector_id": sys.argv[3],
              "runner_label": sys.argv[4],
              "runner_thread_budget": int(sys.argv[5]),
              "thread_min": int(sys.argv[6]),
              "thread_max": int(sys.argv[7]),
              "pipeline_enumeration": sys.argv[8],
              "early_stop_enabled": sys.argv[9].lower() == "true",
              "pipeline_min": int(sys.argv[10]),
              "pipeline_max": int(sys.argv[11]),
              "resumed_from_optimizer_run_id": sys.argv[12] or None,
              "resumed_shape_count": int(sys.argv[13]),
              "allow_thread_oversubscription": sys.argv[14].lower() == "true",
              "optimization_started_epoch": int(sys.argv[15]),
              "early_stop": {"threshold_pct": 2.0, "required_consecutive_shapes": 3},
              "completed_shapes": int(sys.argv[13]),
              "stop_reason": None,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PYMETA

          candidate_index=0
          while true; do
            if [[ "$ENUMERATION" == "adaptive" ]]; then
              pipelines="$(python -m hth.optimizer_search \
                --mode adaptive \
                --pipeline-min "$PIPELINE_MIN" \
                --pipeline-max "$PIPELINE_MAX" \
                --runner-budget "$RUNNER_BUDGET" \
                --thread-min "$THREAD_MIN" \
                --observation-log "$observation_log" \
                $([[ "$ALLOW_THREAD_OVERSUBSCRIPTION" == "true" ]] && printf '%s' '--allow-oversubscription'))"
              if [[ -z "$pipelines" ]]; then
                stop_reason="adaptive_search_complete"
                echo "Adaptive optimizer search has bracketed/refined the preferred near-best region; no further informative shape remains."
                break
              fi
            else
              if (( candidate_index >= ${#candidates[@]} )); then
                break
              fi
              pipelines="${candidates[$candidate_index]}"
              candidate_index=$((candidate_index + 1))
            fi

            effective_threads=$((RUNNER_BUDGET / pipelines))
            (( effective_threads > THREAD_MAX )) && effective_threads="$THREAD_MAX"
            if (( effective_threads < THREAD_MIN )); then
              if [[ "$ALLOW_THREAD_OVERSUBSCRIPTION" == "true" ]]; then
                effective_threads="$THREAD_MIN"
              else
                echo "Skipping pipelines=$pipelines because computed threads=$effective_threads is below thread minimum $THREAD_MIN"
                continue
              fi
            fi
            allocated_threads=$((pipelines * effective_threads))
            if (( allocated_threads > RUNNER_BUDGET )); then
              over_threads=$((allocated_threads - RUNNER_BUDGET))
              over_pct="$(python - "$over_threads" "$RUNNER_BUDGET" <<'PYOVER'
          import sys
          print(f"{(int(sys.argv[1]) / int(sys.argv[2])) * 100:.1f}")
          PYOVER
          )"
              echo "::warning::OVERSUBSCRIBED execution shape: ${pipelines}p/${effective_threads}t allocates ${allocated_threads} threads against runner budget ${RUNNER_BUDGET} (+${over_threads}, +${over_pct}%) — explicit manual override."
            fi
            if python -m hth.optimizer_resume shape-completed \
              --observation-log "$observation_log" \
              --pipelines "$pipelines" \
              --threads "$effective_threads"; then
              echo "Resuming optimizer: completed shape pipelines=$pipelines threads=$effective_threads is already checkpointed; skipping execution."
              continue
            fi

            shape_number=$((shape_number + 1))
            export DETECTOR_PIPELINES="$pipelines"
            export SHARDS="$pipelines"
            export THREADS="$effective_threads"
            export HTH_REGRESSION_OUTPUT="optimizer-work/${pipelines}p-${effective_threads}t"
            export HTH_OPTIMIZER_RUN_ID="$GITHUB_RUN_ID"
            export HTH_OPTIMIZER_SHAPE_SEQUENCE="$shape_number"
            export HTH_OPTIMIZER_SHARD_LOG="$shard_log"
            export HTH_OPTIMIZER_RUNNER_METRICS_LOG
            # The optimizer owns the execution shape. The regression driver must
            # execute these exact pipeline/thread values rather than applying its
            # normal standalone regression budget heuristics a second time.
            export HTH_EXACT_EXECUTION_SHAPE=1
            export HTH_EXECUTION_THREAD_BUDGET="$RUNNER_BUDGET"
            export HTH_ALLOW_THREAD_OVERSUBSCRIPTION="$ALLOW_THREAD_OVERSUBSCRIPTION"
            rm -rf "$HTH_REGRESSION_OUTPUT"

            python - "$HTH_OPTIMIZER_STATE_FILE" "$GITHUB_RUN_ID" "$shape_number" "$total" "$DETECTOR_ALGORITHM" "$pipelines" "$effective_threads" <<'PYSTATE'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              "phase": "running",
              "optimizer_run_id": sys.argv[2],
              "shape_sequence": int(sys.argv[3]),
              "shape_total": int(sys.argv[4]),
              "detector_id": sys.argv[5],
              "pipelines": int(sys.argv[6]),
              "shards": int(sys.argv[6]),
              "threads_per_pipeline": int(sys.argv[7]),
          }) + "\n", encoding="utf-8")
          PYSTATE

            echo
            echo "########################################################################"
            echo "Execution optimizer shape $shape_number/$total"
            echo "Detector          : $DETECTOR_ALGORITHM"
            echo "Pipelines         : $pipelines"
            echo "Shards            : $pipelines"
            echo "Threads / pipeline: $effective_threads"
            echo "Allocated threads : $((pipelines * effective_threads)) / $RUNNER_BUDGET budget"
            echo "########################################################################"

            shape_started="$(date +%s)"
            bash hth-pipeline/tools/run-detector-regressions.sh
            shape_finished="$(date +%s)"
            shape_wall=$((shape_finished - shape_started))

            run_dir="$(tail -n 1 "$HTH_REGRESSION_OUTPUT/run-directories.txt")"
            [[ -d "$run_dir" ]] || {
              echo "::error::Optimizer run directory missing for pipelines=$pipelines: $run_dir"
              exit 1
            }

            python -m hth.optimizer_capture \
              --results-root results-repo \
              --run-dir "$run_dir" \
              --wall-clock-seconds "$shape_wall" \
              --runner-label "$HTH_RUNNER_LABEL" \
              --github-run-id "$GITHUB_RUN_ID" \
              --shape-sequence "$shape_number" \
              --observation-log "$observation_log" \
              --runner-metrics-log "$HTH_OPTIMIZER_RUNNER_METRICS_LOG" \
              --observation-json optimizer-work/latest-shape.json

            assessment="$(python -m hth.optimizer_capture \
              --results-root results-repo \
              --assess-log "$observation_log" \
              --threshold-pct 2.0 \
              --consecutive 3)"
            python - "$run_metadata" "$assessment" "$shape_number" <<'PYMETA'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          assessment = json.loads(sys.argv[2])
          data["completed_shapes"] = int(sys.argv[3])
          data["early_stop"] = assessment
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PYMETA

            rate="$(python - <<'PYRATE'
          import json
          from pathlib import Path
          row = json.loads(Path("optimizer-work/latest-shape.json").read_text(encoding="utf-8"))
          print(row.get("parameter_sets_per_second") or "unknown")
          PYRATE
            )"
            echo "Execution optimizer shape $shape_number/$total complete: pipelines=$pipelines threads=$effective_threads wall=${shape_wall}s sets/s=$rate"
            rm -rf "$HTH_REGRESSION_OUTPUT"

            should_stop="$(python - "$assessment" <<'PYSTOP'
          import json, sys
          print("true" if json.loads(sys.argv[1]).get("should_stop") else "false")
          PYSTOP
            )"
            if [[ "$ENUMERATION" != "adaptive" && "$EARLY_STOP" == "true" && "$should_stop" == "true" ]]; then
              stop_reason="throughput_plateau"
              echo "Optimizer early stop: 3 consecutive completed shapes improved throughput by <=2% from the perceived maximum."
              break
            elif [[ "$ENUMERATION" == "adaptive" && "$EARLY_STOP" == "true" && "$should_stop" == "true" ]]; then
              echo "Adaptive optimizer: generic <=2% plateau stop deferred until the <=2% preferred-shape boundaries are resolved."
            fi
          done

          optimization_finished_epoch="$(date +%s)"
          python - "$run_metadata" "$stop_reason" "$optimization_finished_epoch" <<'PYMETA'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          data["stop_reason"] = sys.argv[2]
          finished = int(sys.argv[3])
          started = int(data.get("optimization_started_epoch") or finished)
          data["optimization_finished_epoch"] = finished
          data["optimization_wall_seconds"] = max(0, finished - started)
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PYMETA
          python - "$HTH_OPTIMIZER_STATE_FILE" "$GITHUB_RUN_ID" <<'PYSTATE'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({"phase": "reporting", "optimizer_run_id": sys.argv[2]}) + "\n", encoding="utf-8")
          PYSTATE

          # Replay the complete local execution checkpoint before rendering the
          # run-local report. This is idempotent for newly captured shapes and
          # makes resumed/reused shapes visible in Section 3 before publish.
          python -m hth.optimizer_capture \
            --results-root results-repo \
            --replay-log "$observation_log" \
            --replay-shard-log "$shard_log"

          python -m hth.optimizer_store \
            --results-root results-repo \
            --detector "$DETECTOR_ALGORITHM" \
            --optimizer-run-id "$GITHUB_RUN_ID" \
            --run-metadata "$run_metadata" \
            --runner-metrics-log "$HTH_OPTIMIZER_RUNNER_METRICS_LOG"

          python - "$GITHUB_STEP_SUMMARY" "results-repo/execution-optimizer/$DETECTOR_ALGORITHM/summary.md" "$RESULTS_REPOSITORY" "$DETECTOR_ALGORITHM" "$GITHUB_RUN_ID" <<'PYSUMMARY'
          import sys
          from pathlib import Path
          destination, source, repository, detector, run_id = sys.argv[1:]
          text = Path(source).read_text(encoding="utf-8")
          raw = f"https://raw.githubusercontent.com/{repository}/main/execution-optimizer/{detector}/heatmap.svg?run={run_id}"
          text = text.replace("(heatmap.svg)", f"({raw})")
          with Path(destination).open("a", encoding="utf-8") as handle:
              handle.write(text)
              if not text.endswith("\n"):
                  handle.write("\n")
          PYSUMMARY

      - name: Publish execution optimizer intelligence
        if: ${{ steps.optimizer.outcome == 'success' }}
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          HTH_RESULTS_TOKEN: ${{ secrets.HTH_RESULTS_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${HTH_RESULTS_TOKEN:-}" ]] || {
            echo "::error::HTH_RESULTS_TOKEN is required to publish optimizer intelligence"
            exit 1
          }

          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C results-repo remote set-url origin \
            "https://x-access-token:${HTH_RESULTS_TOKEN}@github.com/${RESULTS_REPOSITORY}.git"

          observation_log="$GITHUB_WORKSPACE/optimizer-work/observations.jsonl"
          shard_log="$GITHUB_WORKSPACE/optimizer-work/shards.jsonl"
          run_metadata="$GITHUB_WORKSPACE/optimizer-work/run-metadata.json"
          max_publish_attempts=5
          for attempt in $(seq 1 "$max_publish_attempts"); do
            git -C results-repo fetch origin main
            git -C results-repo reset --hard origin/main
            git -C results-repo clean -fd -- optimizer-index.json optimizer-predictions.json execution-optimizer/
            python -m hth.optimizer_capture \
              --results-root results-repo \
              --replay-log "$observation_log" \
              --replay-shard-log "$shard_log"
            python -m hth.optimizer_store \
              --results-root results-repo \
              --detector "$DETECTOR_ALGORITHM" \
              --optimizer-run-id "$GITHUB_RUN_ID" \
              --run-metadata "$run_metadata" \
              --runner-metrics-log "$HTH_OPTIMIZER_RUNNER_METRICS_LOG"

            git -C results-repo add \
              parallelism-index.json \
              optimizer-index.json \
              "execution-optimizer/$DETECTOR_ALGORITHM/summary.md" \
              "execution-optimizer/$DETECTOR_ALGORITHM/heatmap.svg"
            if [[ -d results-repo/models ]]; then
              git -C results-repo add models/
            fi
            if [[ -f results-repo/optimizer-predictions.json ]]; then
              git -C results-repo add optimizer-predictions.json
            fi

            if git -C results-repo diff --cached --quiet; then
              echo "Execution optimizer intelligence is already current."
              break
            fi

            git -C results-repo commit -m \
              "Update $DETECTOR_ALGORITHM execution optimizer intelligence"
            if git -C results-repo push origin HEAD:main; then
              break
            fi
            if (( attempt == max_publish_attempts )); then
              echo "::error::Unable to publish optimizer intelligence after $max_publish_attempts attempts"
              exit 1
            fi
            sleep $((5 * attempt))
          done

      - name: Stop execution optimizer heartbeat
        if: always()
        shell: bash
        run: |
          pid_file="$RUNNER_TEMP/hth-execution-optimizer-heartbeat.pid"
