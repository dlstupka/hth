name: HTH normalize prepare recommendation

run-name: Prepare a safe normalization recommendation for HTH-0001

on:
  workflow_dispatch:
    inputs:
      results_repository: {description: "Canonical collection results repository", required: true, default: "dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results", type: string}
      # BEGIN GENERATED RUNNER TARGET INPUT
      runner_target:
        description: "Execution runner target"
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted-linux
          - self-hosted-windows
          - hth
          - rhel8
          - e7k
          - e9k
          - 192t
          - 96t
          - 32t
      # END GENERATED RUNNER TARGET INPUT
      artifact_retention_days:
        description: Days to retain the diagnostic comparison artifact
        required: true
        default: 14
        type: number
  workflow_call:
    inputs:
      results_repository: {required: true, type: string}
      runner_target: {required: true, type: string}
      artifact_retention_days: {required: true, type: number}
      canonical_build_policy: {required: false, type: string, default: auto}
    secrets:
      HTH_RESULTS_TOKEN: {required: true}
      HTH_SOURCE_TOKEN: {required: false}

permissions:
  contents: read

concurrency:
  group: assess-orientation-deskew-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  RESULTS_REPOSITORY: ${{ inputs.results_repository }}
  GOLDEN_SET_CONFIG: hth-pipeline/config/golden_sets/HTH-GOLDEN-0002.golden-set.json
  ASSESSMENT_CONFIG: hth-pipeline/config/orientation-deskew-assessment.json

jobs:
  assess-orientation-deskew:
    name: Compare orientation and conservative deskew candidates
    # BEGIN GENERATED RUNNER TARGET ROUTING
    runs-on: >-
      ${{ inputs.runner_target == 'self-hosted-linux' && fromJSON('["self-hosted","Linux","X64"]')
        || inputs.runner_target == 'self-hosted-windows' && fromJSON('["self-hosted","Windows","X64"]')
        || inputs.runner_target == 'hth' && fromJSON('["self-hosted","Linux","X64","hth"]')
        || inputs.runner_target == 'rhel8' && fromJSON('["self-hosted","Linux","X64","rhel8"]')
        || inputs.runner_target == 'e7k' && fromJSON('["self-hosted","Linux","X64","e7k"]')
        || inputs.runner_target == 'e9k' && fromJSON('["self-hosted","Linux","X64","e9k"]')
        || inputs.runner_target == '192t' && fromJSON('["self-hosted","Linux","X64","192t"]')
        || inputs.runner_target == '96t' && fromJSON('["self-hosted","Linux","X64","96t"]')
        || inputs.runner_target == '32t' && fromJSON('["self-hosted","Linux","X64","32t"]')
        || 'ubuntu-latest' }}
    # END GENERATED RUNNER TARGET ROUTING
    timeout-minutes: 45
    env:
      # BEGIN GENERATED RUNNER SETUP LABEL
      HTH_SELECTED_RUNNER_LABEL: >-
        ${{ inputs.runner_target == 'self-hosted-linux' && 'linux'
          || inputs.runner_target == 'self-hosted-windows' && 'windows'
          || inputs.runner_target == 'hth' && 'hth'
          || inputs.runner_target == 'rhel8' && 'rhel8'
          || inputs.runner_target == 'e7k' && 'e7k'
          || inputs.runner_target == 'e9k' && 'e9k'
          || inputs.runner_target == '192t' && '192t'
          || inputs.runner_target == '96t' && '96t'
          || inputs.runner_target == '32t' && '32t'
          || 'github-hosted' }}
      # END GENERATED RUNNER SETUP LABEL
    steps:
      - name: Resolve run-scoped output path
        id: paths
        shell: bash
        run: echo "assessment_output=$RUNNER_TEMP/orientation-deskew-assessment-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical normalization evidence
        uses: ./hth-pipeline/.github/actions/checkout-results
        with:
          repository: ${{ env.RESULTS_REPOSITORY }}
          path: results-repo
          ref: main
          token: ${{ secrets.HTH_RESULTS_TOKEN || github.token }}
          fetch-depth: 1
          sparse-checkout: |
            /metadata/canonical-build-evidence.json
            /metadata/image_manifest.json
            /normalization/canonical-build-evidence.json
            /normalization/normalization-manifest.json
            /normalization/orientation-deskew/
            /normalization/orientation-deskew-policy.json
          sparse-checkout-cone-mode: false
          persist-credentials: true

      - name: Set up canonical HTH Python runtime
        uses: ./hth-pipeline/.github/actions/setup-hth-python
        with:
          pipeline-path: hth-pipeline
          runner-label: ${{ env.HTH_SELECTED_RUNNER_LABEL }}

      - name: Validate canonical normalization and resolve source provenance
        id: provenance
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          import os
          from pathlib import Path

          from hth.canonical_build_evidence import (
              NORMALIZATION_SCOPE,
              load_evidence_store,
              validate_published_results,
          )

          results = Path("results-repo")
          normalization_store = load_evidence_store(
              results / "normalization/canonical-build-evidence.json",
              scope=NORMALIZATION_SCOPE,
          )
          normalization_identity = str(normalization_store.get("authoritative_identity") or "")
          normalization = (normalization_store.get("records") or {}).get(normalization_identity)
          if not normalization_identity or not isinstance(normalization, dict):
              raise SystemExit("Canonical normalization evidence has no authoritative record")
          validate_published_results(normalization, results)

          preprocess_store = json.loads(
              (results / "metadata/canonical-build-evidence.json").read_text(encoding="utf-8")
          )
          preprocess_identity = str(preprocess_store.get("authoritative_identity") or "")
          preprocess = (preprocess_store.get("records") or {}).get(preprocess_identity)
          if not preprocess_identity or not isinstance(preprocess, dict):
              raise SystemExit("Canonical preprocess evidence has no authoritative record")
          source = (preprocess.get("effective_inputs") or {}).get("source") or {}
          if not source.get("repository") or not source.get("release"):
              raise SystemExit("Canonical preprocess evidence has incomplete source provenance")
          if len(str(source.get("release_manifest_sha256") or "")) != 64:
              raise SystemExit("Canonical preprocess evidence has no source manifest identity")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"normalization_effective_identity={normalization_identity}\n")
              handle.write(f"normalization_result_identity={normalization['canonical_result']['identity']}\n")
              handle.write(f"source_repository={source['repository']}\n")
              handle.write(f"source_release={source['release']}\n")
              handle.write(f"source_manifest_sha256={source['release_manifest_sha256']}\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## Canonical input\n\n")
              handle.write(f"- Normalization evidence: `{normalization_identity}`\n")
              handle.write(f"- Canonical result: `{normalization['canonical_result']['identity']}`\n")
          PY

      - name: Select stratified orientation and deskew sample
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.assess_orientation_deskew prepare \
            --normalization-manifest results-repo/normalization/normalization-manifest.json \
            --config "$ASSESSMENT_CONFIG" \
            --golden-set "$GOLDEN_SET_CONFIG" \
            --output "$RUNNER_TEMP/orientation-deskew-sample.json"

      - name: Assemble orientation/deskew effective-input contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/orientation-deskew-effective-inputs"
          rm -rf "$source_root"
          mkdir -p "$source_root"
          cp results-repo/normalization/normalization-manifest.json "$source_root/"
          cp results-repo/metadata/image_manifest.json "$source_root/"
          cp "$RUNNER_TEMP/orientation-deskew-sample.json" "$source_root/sample-plan.json"
          echo "source_root=$source_root" >> "$GITHUB_OUTPUT"
          echo "results_ref=$(git -C results-repo rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Evaluate orientation/deskew Canonical Build Evidence
        id: cbe
        shell: bash
        env: {PYTHONPATH: hth-pipeline}
        run: |
          set -euo pipefail
          python -m hth.canonical_build_evidence prepare \
            --scope hth-orientation-deskew-assessment \
            --policy "${{ inputs.canonical_build_policy || 'auto' }}" \
            --contract-version 1 \
            --mode diagnostic-evidence \
            --operation orientation-and-conservative-deskew-assessment \
            --repository-root hth-pipeline \
            --source-root "${{ steps.contract.outputs.source_root }}" \
            --source-input ".=${{ steps.contract.outputs.source_root }}" \
            --source-repository "$RESULTS_REPOSITORY" \
            --source-release "${{ steps.provenance.outputs.normalization_effective_identity }}" \
            --source-manifest-sha256 "${{ steps.provenance.outputs.normalization_result_identity }}" \
            --source-commit "${{ steps.provenance.outputs.normalization_result_identity }}" \
            --config "$ASSESSMENT_CONFIG" \
            --config "$GOLDEN_SET_CONFIG" \
            --implementation hth-pipeline/hth/assess_orientation_deskew.py \
            --runtime-contract hth-pipeline/requirements.txt \
            --runtime-contract hth-pipeline/.github/actions/setup-hth-python/action.yml \
            --runtime-package numpy \
            --runtime-package opencv-python-headless \
            --results-root results-repo \
            --evidence results-repo/normalization/orientation-deskew/canonical-build-evidence.json \
            --plan "$RUNNER_TEMP/orientation-deskew-cbe-plan.json" \
            --pipeline-repository "$GITHUB_REPOSITORY" \
            --pipeline-commit "$GITHUB_SHA" \
            --results-repository "$RESULTS_REPOSITORY" \
            --results-ref "${{ steps.contract.outputs.results_ref }}" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --runner-name "$RUNNER_NAME" \
            --runner-environment "${{ runner.environment }}" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Download immutable source release
        id: source_release
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env:
          HTH_SOURCE_TOKEN: ${{ secrets.HTH_SOURCE_TOKEN || github.token }}
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.source_release \
            --repository "${{ steps.provenance.outputs.source_repository }}" \
            --tag "${{ steps.provenance.outputs.source_release }}" \
            --destination source-repo \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify immutable source release
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.source_release.outputs.manifest_sha256 }}" != "${{ steps.provenance.outputs.source_manifest_sha256 }}" ]]; then
            echo "::error::Downloaded source release manifest does not match canonical preprocess evidence"
            exit 1
          fi

      - name: Reconstruct and prove sampled canonical crops
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.assess_orientation_deskew materialize \
            --source-root source-repo/images \
            --canonical-image-manifest results-repo/metadata/image_manifest.json \
            --normalization-manifest results-repo/normalization/normalization-manifest.json \
            --sample-plan "$RUNNER_TEMP/orientation-deskew-sample.json" \
            --output "$RUNNER_TEMP/orientation-deskew-materialized"

      - name: Generate orientation and deskew assessment
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.assess_orientation_deskew evaluate \
            --image-root "$RUNNER_TEMP/orientation-deskew-materialized/normalized" \
            --normalization-manifest results-repo/normalization/normalization-manifest.json \
            --sample-plan "$RUNNER_TEMP/orientation-deskew-sample.json" \
            --config "$ASSESSMENT_CONFIG" \
            --output "${{ steps.paths.outputs.assessment_output }}" \
            --github-summary "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/orientation-deskew-sample.json" "${{ steps.paths.outputs.assessment_output }}/sample-plan.json"
          cp "$RUNNER_TEMP/orientation-deskew-materialized/materialization-evidence.json" "${{ steps.paths.outputs.assessment_output }}/materialization-evidence.json"

      - name: Prepare plain-language normalization recommendation
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.assess_orientation_deskew recommend \
            --assessment "${{ steps.paths.outputs.assessment_output }}/assessment.json" \
            --output "${{ steps.paths.outputs.assessment_output }}/normalization-policy.json" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Finalize orientation/deskew Canonical Build Evidence
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env: {PYTHONPATH: hth-pipeline}
        run: |
          set -euo pipefail
          python -m hth.canonical_build_evidence finalize \
            --plan "$RUNNER_TEMP/orientation-deskew-cbe-plan.json" \
            --output-root "${{ steps.paths.outputs.assessment_output }}" \
            --evidence-store results-repo/normalization/orientation-deskew/canonical-build-evidence.json \
            --evidence-output "${{ steps.paths.outputs.assessment_output }}/canonical-build-evidence.json" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Preserve recommendation and compact assessment evidence
        id: publish_recommendation
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env: {PYTHONPATH: hth-pipeline}
        run: |
          set -euo pipefail
          source hth-pipeline/tools/hardened-persistence.sh
          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          payload="$RUNNER_TEMP/hth-normalization-recommendation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$payload"
          mkdir -p "$payload"
          cp "${{ steps.paths.outputs.assessment_output }}/assessment.json" "$payload/"
          cp "${{ steps.paths.outputs.assessment_output }}/sample-plan.json" "$payload/"
          cp "${{ steps.paths.outputs.assessment_output }}/materialization-evidence.json" "$payload/"
          cp "${{ steps.paths.outputs.assessment_output }}/recommendation.md" "$payload/"
          cp "${{ steps.paths.outputs.assessment_output }}/normalization-policy.json" "$payload/"
          cp "${{ steps.paths.outputs.assessment_output }}/canonical-build-evidence.json" "$RUNNER_TEMP/orientation-deskew-cbe-incoming.json"

          apply_normalization_recommendation() {
            python -m hth.canonical_build_evidence merge \
              --scope hth-orientation-deskew-assessment \
              --base results-repo/normalization/orientation-deskew/canonical-build-evidence.json \
              --incoming "$RUNNER_TEMP/orientation-deskew-cbe-incoming.json" \
              --output "$payload/canonical-build-evidence.json"
            mkdir -p results-repo/normalization/orientation-deskew
            cp "$payload/assessment.json" results-repo/normalization/orientation-deskew/
            cp "$payload/sample-plan.json" results-repo/normalization/orientation-deskew/
            cp "$payload/materialization-evidence.json" results-repo/normalization/orientation-deskew/
            cp "$payload/recommendation.md" results-repo/normalization/orientation-deskew/
            cp "$payload/normalization-policy.json" results-repo/normalization/orientation-deskew/
            cp "$payload/canonical-build-evidence.json" results-repo/normalization/orientation-deskew/
            cp "$payload/normalization-policy.json" results-repo/normalization/orientation-deskew-policy.json
            hth_results_stage results-repo \
              normalization/orientation-deskew \
              normalization/orientation-deskew-policy.json
          }

          hth_hardened_persist \
            results-repo main \
            "Publish normalization assessment recommendation ${{ github.run_id }}" \
            apply_normalization_recommendation \
            "Normalization recommendation publication"
          echo "results_commit=$HTH_PERSIST_COMMIT" >> "$GITHUB_OUTPUT"
          echo "- Recommendation evidence: [results commit \`$HTH_PERSIST_COMMIT\`](${GITHUB_SERVER_URL}/${RESULTS_REPOSITORY}/commit/${HTH_PERSIST_COMMIT})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload orientation and deskew assessment
        if: steps.cbe.outputs.decision == 'execute'
        uses: ./hth-pipeline/.github/actions/hardened-upload-artifact
        with:
          name: hth-orientation-deskew-${{ github.run_number }}
          path: ${{ steps.paths.outputs.assessment_output }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
          compression-level: 6
