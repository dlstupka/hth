name: _HTH reusable report core (internal)

# Internal reusable workflow for persisted-evidence report generation.
on:
  workflow_call:
    inputs:
      results_repository:
        description: "Results repository"
        required: true
        type: string
      report_type:
        description: "Report to regenerate: detector calibration, execution optimizer, or full normalization audit summary"
        required: false
        type: string
        default: "detector-calibration-manifest"
      report_algorithm:
        description: "Detector used by execution-optimizer report, or all for the accumulated summary"
        required: false
        type: string
        default: "all"
      report_golden_set:
        description: "Immutable Golden Set release tag used to select compatible detector calibrations"
        required: false
        type: string
        default: "HTH-GOLDEN-0002"
      artifact_retention_days:
        description: "Temporary artifact retention period"
        required: false
        type: number
        default: 7
      # BEGIN GENERATED RUNNER TARGET INPUT
      runner_target:
        description: "Canonical execution runner target"
        required: false
        type: string
        default: "github-hosted"
      # END GENERATED RUNNER TARGET INPUT
    secrets:
      HTH_RESULTS_TOKEN:
        required: false

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # BEGIN GENERATED RUNNER SETUP LABEL
  HTH_RUNNER_LABEL: >-
    ${{ inputs.runner_target == 'self-hosted-linux' && 'linux'
      || inputs.runner_target == 'self-hosted-windows' && 'windows'
      || inputs.runner_target == 'hth' && 'hth'
      || inputs.runner_target == 'rhel8' && 'rhel8'
      || inputs.runner_target == 'e7k' && 'e7k'
      || inputs.runner_target == 'e9k' && 'e9k'
      || inputs.runner_target == '192vcpu' && '192vcpu'
      || inputs.runner_target == '96vcpu' && '96vcpu'
      || inputs.runner_target == '32vcpu' && '32vcpu'
      || 'github-hosted' }}
  # END GENERATED RUNNER SETUP LABEL

jobs:
  generate-report:
    name: Generate HTH report
    # BEGIN GENERATED RUNNER TARGET ROUTING
    runs-on: >-
      ${{ inputs.runner_target == 'self-hosted-linux' && fromJSON('["self-hosted","Linux","X64"]')
        || inputs.runner_target == 'self-hosted-windows' && fromJSON('["self-hosted","Windows","X64"]')
        || inputs.runner_target == 'hth' && fromJSON('["self-hosted","Linux","X64","hth"]')
        || inputs.runner_target == 'rhel8' && fromJSON('["self-hosted","Linux","X64","rhel8"]')
        || inputs.runner_target == 'e7k' && fromJSON('["self-hosted","Linux","X64","e7k"]')
        || inputs.runner_target == 'e9k' && fromJSON('["self-hosted","Linux","X64","e9k"]')
        || inputs.runner_target == '192vcpu' && fromJSON('["self-hosted","Linux","X64","192vcpu"]')
        || inputs.runner_target == '96vcpu' && fromJSON('["self-hosted","Linux","X64","96vcpu"]')
        || inputs.runner_target == '32vcpu' && fromJSON('["self-hosted","Linux","X64","32vcpu"]')
        || 'ubuntu-latest' }}
    # END GENERATED RUNNER TARGET ROUTING
    timeout-minutes: 30
    env:
      RESULTS_REPOSITORY: ${{ inputs.results_repository }}
      PYTHONNOUSERSITE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout compact normalization audit evidence
        if: ${{ inputs.report_type == 'full-normalization-summary' }}
        uses: ./hth-pipeline/.github/actions/checkout-results
        with:
          repository: ${{ inputs.results_repository }}
          path: results-repo
          ref: main
          token: ${{ secrets.HTH_RESULTS_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            /metadata/resource-lifecycle.json
            /normalization/
            /reports/full-normalization-summary.md
          sparse-checkout-cone-mode: false
          persist-credentials: true

      - name: Checkout detector calibration report evidence
        if: ${{ inputs.report_type == 'detector-calibration-manifest' }}
        uses: ./hth-pipeline/.github/actions/checkout-results
        with:
          repository: ${{ inputs.results_repository }}
          path: results-repo
          ref: main
          token: ${{ secrets.HTH_RESULTS_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            /indexes/calibration-index.json
            /calibration-index.json
            /indexes/runtime-index.json
            /runtime-index.json
            /reports/
          sparse-checkout-cone-mode: false
          persist-credentials: true

      - name: Checkout execution optimizer report evidence
        if: ${{ inputs.report_type == 'execution-optimizer' }}
        uses: ./hth-pipeline/.github/actions/checkout-results
        with:
          repository: ${{ inputs.results_repository }}
          path: results-repo
          ref: main
          token: ${{ secrets.HTH_RESULTS_TOKEN }}
          # Legacy optimizer summaries predate immutable per-run history. Keep a
          # bounded results history so Report Writer can migrate those published
          # profiles into canonical evidence while modern runs use durable records.
          fetch-depth: 100
          sparse-checkout: |
            /indexes/parallelism-index.json
            /parallelism-index.json
            /indexes/optimizer-index.json
            /optimizer-index.json
            /indexes/optimizer-predictions.json
            /optimizer-predictions.json
            /execution-optimizer/
          sparse-checkout-cone-mode: false
          persist-credentials: true

      - name: Set up canonical HTH Python runtime
        uses: ./hth-pipeline/.github/actions/setup-hth-python
        with:
          pipeline-path: hth-pipeline
          runner-label: ${{ env.HTH_RUNNER_LABEL }}
          diagnostics: "false"

      - name: Resolve report Golden Set release
        id: report_golden_set
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.golden_set_catalog \
            --freeze-root hth-pipeline/config/golden_sets \
            --repository-root hth-pipeline \
            --release-tag "${{ inputs.report_golden_set }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Hydrate selected detector calibration records
        if: ${{ inputs.report_type == 'detector-calibration-manifest' }}
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          mapfile -t record_paths < <(
            python -m hth.report_generator detector-calibration-records \
              --results-root results-repo \
              --golden-set "${{ steps.report_golden_set.outputs.golden_set_path }}"
          )
          ((${#record_paths[@]} > 0)) || {
            echo "::error::No indexed detector calibration records match the selected Golden Set"
            exit 1
          }
          git -C results-repo sparse-checkout add "${record_paths[@]}"

      - name: Generate selected report
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          HTH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          RESULTS_COMMIT="$(git -C results-repo rev-parse HEAD)"
          mkdir -p generated-report

          if [[ "${{ inputs.report_type }}" == "detector-calibration-manifest" ]]; then
            python -m hth.report_generator detector-calibration-manifest \
              --results-root results-repo \
              --golden-set "${{ steps.report_golden_set.outputs.golden_set_path }}" \
              --output generated-report/detector-calibration-manifest.md \
              --pipeline-repository "${{ github.repository }}" \
              --results-repository "$RESULTS_REPOSITORY" \
              --results-commit "$RESULTS_COMMIT" \
              --run-url "$HTH_RUN_URL"
          elif [[ "${{ inputs.report_type }}" == "execution-optimizer" ]]; then
            python -m hth.report_generator execution-optimizer \
              --results-root results-repo \
              --detector "${{ inputs.report_algorithm }}" \
              --output-dir "generated-report/execution-optimizer/${{ inputs.report_algorithm }}"
          elif [[ "${{ inputs.report_type }}" == "full-normalization-summary" ]]; then
            python -m hth.report_generator full-normalization-summary \
              --results-root results-repo \
              --output generated-report/full-normalization-summary.md \
              --results-repository "$RESULTS_REPOSITORY" \
              --results-commit "$RESULTS_COMMIT" \
              --pipeline-repository "${{ github.repository }}" \
              --pipeline-commit "${{ github.sha }}" \
              --run-url "$HTH_RUN_URL"
          else
            echo "::error::Unsupported report type: ${{ inputs.report_type }}"
            exit 1
          fi

      - name: Publish regenerated report
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          HTH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HTH_RESULTS_TOKEN: ${{ secrets.HTH_RESULTS_TOKEN }}
        run: |
          set -euo pipefail
          source hth-pipeline/tools/hardened-persistence.sh
          [[ -n "${HTH_RESULTS_TOKEN:-}" ]] || {
            echo "::error::HTH_RESULTS_TOKEN is required to publish generated reports"
            exit 1
          }

          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C results-repo remote set-url origin \
            "https://x-access-token:${HTH_RESULTS_TOKEN}@github.com/${RESULTS_REPOSITORY}.git"

          regenerate_and_stage() {
            local results_commit
            results_commit="$(git -C results-repo rev-parse HEAD)"
            rm -rf generated-report
            mkdir -p generated-report

            if [[ "${{ inputs.report_type }}" == "detector-calibration-manifest" ]]; then
              mapfile -t record_paths < <(
                python -m hth.report_generator detector-calibration-records \
                  --results-root results-repo \
                  --golden-set "${{ steps.report_golden_set.outputs.golden_set_path }}"
              )
              ((${#record_paths[@]} > 0)) || return 1
              git -C results-repo sparse-checkout add "${record_paths[@]}"
              python -m hth.report_generator detector-calibration-manifest \
                --results-root results-repo \
                --golden-set "${{ steps.report_golden_set.outputs.golden_set_path }}" \
                --output generated-report/detector-calibration-manifest.md \
                --pipeline-repository "${{ github.repository }}" \
                --results-repository "$RESULTS_REPOSITORY" \
                --results-commit "$results_commit" \
                --run-url "$HTH_RUN_URL"
              mkdir -p results-repo/reports
              cp generated-report/detector-calibration-manifest.md results-repo/reports/detector-calibration-manifest.md
              hth_results_stage results-repo reports/detector-calibration-manifest.md
            elif [[ "${{ inputs.report_type }}" == "execution-optimizer" ]]; then
              python -m hth.report_generator execution-optimizer \
                --results-root results-repo \
                --detector "${{ inputs.report_algorithm }}" \
                --output-dir "generated-report/execution-optimizer/${{ inputs.report_algorithm }}"
              rm -rf "results-repo/execution-optimizer/${{ inputs.report_algorithm }}"
              mkdir -p "results-repo/execution-optimizer/${{ inputs.report_algorithm }}"
              cp -a "generated-report/execution-optimizer/${{ inputs.report_algorithm }}/." \
                "results-repo/execution-optimizer/${{ inputs.report_algorithm }}/"
              hth_results_stage results-repo "execution-optimizer/${{ inputs.report_algorithm }}"
            elif [[ "${{ inputs.report_type }}" == "full-normalization-summary" ]]; then
              python -m hth.report_generator full-normalization-summary \
                --results-root results-repo \
                --output generated-report/full-normalization-summary.md \
                --results-repository "$RESULTS_REPOSITORY" \
                --results-commit "$results_commit" \
                --pipeline-repository "${{ github.repository }}" \
                --pipeline-commit "${{ github.sha }}" \
                --run-url "$HTH_RUN_URL"
              mkdir -p results-repo/reports
              cp generated-report/full-normalization-summary.md results-repo/reports/full-normalization-summary.md
              hth_results_stage results-repo reports/full-normalization-summary.md
            else
              echo "::error::Unsupported report type: ${{ inputs.report_type }}"
              return 1
            fi
          }

          hth_hardened_persist \
            results-repo main \
            "Regenerate ${{ inputs.report_type }} report" \
            regenerate_and_stage \
            "Report publication"

      - name: Publish regenerated report summary
        shell: bash
        env:
          RESULTS_REPOSITORY: ${{ inputs.results_repository }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.report_type }}" == "detector-calibration-manifest" ]]; then
            python hth-pipeline/hth/write_action_summary.py generated-report/detector-calibration-manifest.md "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ inputs.report_type }}" == "execution-optimizer" ]]; then
            # Pin optimizer profile images to the exact results commit that was
            # just published. raw.githubusercontent.com branch refs can lag the
            # push briefly; the first branch-URL fetch may therefore cache the
            # previous SVG beside an otherwise current report summary.
            RESULTS_COMMIT="$(git -C results-repo rev-parse HEAD)"
            python -c 'import re, sys; from pathlib import Path; destination, source, repository, detector, results_commit = sys.argv[1:]; text = Path(source).read_text(encoding="utf-8"); base = f"https://raw.githubusercontent.com/{repository}/{results_commit}/execution-optimizer/{detector}/"; text = re.sub(r"\(([^)]+\.svg)\)", lambda m: f"({base}{m.group(1)})", text); Path(destination).open("a", encoding="utf-8").write(text + ("" if text.endswith("\n") else "\n"))' \
              "$GITHUB_STEP_SUMMARY" \
              "generated-report/execution-optimizer/${{ inputs.report_algorithm }}/summary.md" \
              "$RESULTS_REPOSITORY" \
              "${{ inputs.report_algorithm }}" \
              "$RESULTS_COMMIT"
          elif [[ "${{ inputs.report_type }}" == "full-normalization-summary" ]]; then
            python hth-pipeline/hth/write_action_summary.py generated-report/full-normalization-summary.md "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Unsupported report type: ${{ inputs.report_type }}"
            exit 1
          fi

      - name: Assemble report research artifact
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf report-research-artifact
          mkdir -p report-research-artifact/generated-report
          mkdir -p report-research-artifact/intelligence
          mkdir -p report-research-artifact/golden-set

          cp -a generated-report/. report-research-artifact/generated-report/
          GOLDEN_SOURCE="${{ steps.report_golden_set.outputs.golden_set_path }}"
          cp "$GOLDEN_SOURCE" report-research-artifact/golden-set/selected-golden-set.json
          GOLDEN_ID="${{ steps.report_golden_set.outputs.golden_set_id }}"
          FREEZE_SOURCE="${{ steps.report_golden_set.outputs.freeze_path }}"
          cp "$FREEZE_SOURCE" "report-research-artifact/golden-set/${GOLDEN_ID}.freeze.json"

          if [[ "${{ inputs.report_type }}" == "full-normalization-summary" ]]; then
            # A normalization audit is fully reconstructable from its persisted
            # CBE/manifests and lifecycle ledger. Historical detector calibration
            # trees are unrelated and can be several gigabytes.
            mkdir -p report-research-artifact/intelligence/metadata
            cp results-repo/metadata/resource-lifecycle.json \
              report-research-artifact/intelligence/metadata/resource-lifecycle.json
            cp -a results-repo/normalization \
              report-research-artifact/intelligence/normalization
            if [[ -f results-repo/reports/full-normalization-summary.md ]]; then
              mkdir -p report-research-artifact/intelligence/reports
              cp results-repo/reports/full-normalization-summary.md \
                report-research-artifact/intelligence/reports/full-normalization-summary.md
            fi
          else
            # Persisted research intelligence: calibration identity/quality,
            # runtime, optimizer, provenance, scheduling, and source metadata.
            # Detector regression/debug/verbose trees are deliberately excluded.
            shopt -s nullglob
            if [[ -d results-repo/indexes ]]; then
              cp -a results-repo/indexes report-research-artifact/intelligence/indexes
            fi
            for index in results-repo/*-index.json; do
              cp "$index" report-research-artifact/intelligence/
            done
            for directory in reports execution-optimizer; do
              if [[ -d "results-repo/$directory" ]]; then
                cp -a "results-repo/$directory" "report-research-artifact/intelligence/$directory"
              fi
            done
          fi

          cat > report-research-artifact/README.md <<'EOF'
          # HTH report research artifact

          This artifact accompanies the GitHub Actions report summary. It contains the
          generated report, the frozen Golden Set identity/provenance, and the persisted
          evidence needed to reproduce and research the selected report. Normalization
          artifacts contain the canonical normalization evidence and lifecycle ledger;
          detector reports contain calibration/execution intelligence.

          Individual detector regression/debug/verbose logging is intentionally excluded;
          durable calibration records and raw evidence remain linked at their exact results
          commit instead of being duplicated into every Report Writer artifact.
          EOF

      - name: Upload report research artifact
        if: ${{ success() }}
        uses: ./hth-pipeline/.github/actions/hardened-upload-artifact
        with:
          name: hth-report-${{ inputs.report_type }}-${{ github.run_number }}
          path: report-research-artifact
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
          compression-level: 6

