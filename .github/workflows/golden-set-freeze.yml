name: HTH Golden Set freeze guard

on:
  push:
    branches:
      - main
    paths:
      - "config/golden_set.json"
      - "config/golden_sets/**"
      - "hth/validate_golden_set_freeze.py"
      - ".github/workflows/golden-set-freeze.yml"
  pull_request:
    branches:
      - main
    paths:
      - "config/golden_set.json"
      - "config/golden_sets/**"
      - "hth/validate_golden_set_freeze.py"
      - ".github/workflows/golden-set-freeze.yml"
  workflow_dispatch:

permissions:
  contents: read

# Must apply before actions/checkout performs its internal git init.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  verify-frozen-golden-sets:
    name: Verify frozen Golden Sets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify every frozen Golden Set
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          freezes=(config/golden_sets/*.freeze.json)
          test "${#freezes[@]}" -gt 0
          for freeze in "${freezes[@]}"; do
            python hth/validate_golden_set_freeze.py \
              --freeze "$freeze" \
              --repository-root .
          done
