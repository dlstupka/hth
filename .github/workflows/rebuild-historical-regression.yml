name: HTH rebuild historical regression metrics

run-name: >-
  Rebuild historical regression metrics — ${{ inputs.scope == 'single-build' && format('build #{0}', inputs.run_number) || 'all available artifacts' }}

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Historical regression scope
        required: true
        default: single-build
        type: choice
        options:
          - single-build
          - all-available-artifacts
      run_number:
        description: "Regression workflow build number; required for single-build (for example 300)"
        required: false
        default: ""
        type: string
      results_repository:
        description: Results repository containing calibration intelligence
        required: true
        default: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results
        type: string
      top:
        description: Ranked result count regenerated per run
        required: true
        default: "20"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-regression-rerank-${{ inputs.results_repository }}
  cancel-in-progress: false

jobs:
  rerank:
    name: Rebuild historical regression metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout results repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.results_repository }}
          path: results-repo
          ref: main
          token: ${{ secrets.HTH_RESULTS_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hth-pipeline/requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --requirement hth-pipeline/requirements.txt

      - name: Resolve historical workflow runs
        id: runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
          REQUESTED_RUN_NUMBER: ${{ inputs.run_number }}
          CALIBRATION_INTELLIGENCE_FLOOR: ddbd063fdfd72319d42266cd1b2e02f078d9e7c3
        run: |
          set -euo pipefail
          mkdir -p historical-artifacts
          run_ids="$RUNNER_TEMP/hth-historical-run-ids.txt"
          : > "$run_ids"

          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[]
              | select(.path == ".github/workflows/regress-detector.yml")
              | select(.status == "completed" and .conclusion == "success")
              | [.id, .run_number, .head_sha] | @tsv' > "$RUNNER_TEMP/hth-regression-runs.tsv"

          eligible_runs="$RUNNER_TEMP/hth-regression-runs-eligible.tsv"
          : > "$eligible_runs"
          while IFS=$'\t' read -r run_id run_number head_sha; do
            [[ -n "$run_id" && -n "$head_sha" ]] || continue
            if git -C hth-pipeline merge-base --is-ancestor \
              "$CALIBRATION_INTELLIGENCE_FLOOR" "$head_sha" 2>/dev/null; then
              printf '%s\t%s\t%s\n' "$run_id" "$run_number" "$head_sha" >> "$eligible_runs"
            else
              echo "Skipping pre-calibration-intelligence regression build #$run_number ($head_sha)"
            fi
          done < "$RUNNER_TEMP/hth-regression-runs.tsv"

          if [[ "$REQUESTED_SCOPE" == "single-build" ]]; then
            if [[ -z "$REQUESTED_RUN_NUMBER" ]]; then
              echo "::error::run_number is required for single-build scope"
              exit 1
            fi
            awk -v n="$REQUESTED_RUN_NUMBER" '$2 == n {print $1}' \
              "$eligible_runs" > "$run_ids"
            if [[ ! -s "$run_ids" ]]; then
              if awk -v n="$REQUESTED_RUN_NUMBER" '$2 == n {found=1} END {exit !found}' \
                "$RUNNER_TEMP/hth-regression-runs.tsv"; then
                echo "::error::Regression build #$REQUESTED_RUN_NUMBER predates calibration intelligence ($CALIBRATION_INTELLIGENCE_FLOOR) and cannot be historically reranked."
              else
                echo "::error::No successful regress-detector workflow run found for build #$REQUESTED_RUN_NUMBER"
              fi
              exit 1
            fi
          else
            cut -f1 "$eligible_runs" > "$run_ids"
          fi

          eligible_count="$(wc -l < "$run_ids" | tr -d ' ')"
          echo "Historical rerank evidence floor: $CALIBRATION_INTELLIGENCE_FLOOR"
          echo "Eligible workflow runs selected: $eligible_count"
          echo "run_ids_file=$run_ids" >> "$GITHUB_OUTPUT"

      - name: Stream retained artifacts through canonical reranking
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS_FILE: ${{ steps.runs.outputs.run_ids_file }}
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          master_summary="historical-rerank-summary.md"
          printf '%s\n\n' "## Historical regression rerank — streamed rebuild" > "$master_summary"

          downloaded=0
          processed_workflows=0
          skipped_downloads=0
          rerank_invocations=0

          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue

            target="$RUNNER_TEMP/hth-historical-artifact-$run_id"
            log="$RUNNER_TEMP/hth-historical-download-$run_id.log"
            rm -rf "$target"
            mkdir -p "$target"

            echo "::group::Historical workflow run $run_id"
            set +e
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$target" 2>&1 | tee "$log"
            download_rc=${PIPESTATUS[0]}
            set -e

            if (( download_rc != 0 )); then
              if grep -qi "no space left on device" "$log"; then
                echo "::error::Runner disk exhausted while downloading workflow run $run_id. Aborting instead of misclassifying this as an expired artifact."
                df -h
                exit 1
              fi
              echo "::warning::Could not download artifacts for workflow run $run_id from $GITHUB_REPOSITORY; artifact may be expired or unavailable. Skipping."
              skipped_downloads=$((skipped_downloads + 1))
              rm -rf "$target"
              echo "::endgroup::"
              continue
            fi

            downloaded=$((downloaded + 1))
            invocation_args=()
            while IFS= read -r raw; do
              run_dir="${raw%/raw/results.csv}"
              manifest="$run_dir/manifest.json"
              summary="$run_dir/reports/summary.json"
              if [[ ! -f "$manifest" || ! -f "$summary" ]]; then
                echo "::warning::Skipping incomplete historical artifact: $run_dir"
                continue
              fi

              strategy="$(python -c 'import json,sys; p=json.load(open(sys.argv[1])); print(p.get("strategy") or p.get("requested_strategy") or "")' "$summary")"
              if [[ "$strategy" != "exhaustive" && "$strategy" != "cartesian" ]]; then
                echo "Skipping non-exhaustive historical run: $run_dir ($strategy)"
                continue
              fi
              invocation_args+=(--run-dir "$run_dir")
            done < <(find "$target" -type f -path '*/raw/results.csv' | sort)

            if (( ${#invocation_args[@]} > 0 )); then
              part_summary="$RUNNER_TEMP/hth-historical-summary-$run_id.md"
              python -m hth.historical_rerank \
                "${invocation_args[@]}" \
                --results-root results-repo \
                --top "${{ inputs.top }}" \
                --summary "$part_summary"

              {
                printf '\n### Workflow run `%s`\n\n' "$run_id"
                sed '1{/^## Historical regression rerank$/d;}' "$part_summary"
              } >> "$master_summary"
              rerank_invocations=$((rerank_invocations + 1))
            else
              echo "No completed exhaustive historical runs with raw evidence in workflow run $run_id."
            fi

            processed_workflows=$((processed_workflows + 1))

            # Critical invariant: never accumulate historical artifacts on disk.
            rm -rf "$target"
            rm -f "$log"
            echo "Disk after workflow run $run_id:"
            df -h .
            echo "::endgroup::"
          done < "$RUN_IDS_FILE"

          {
            printf '\n## Streamed rebuild totals\n\n'
            printf -- '- Downloaded workflow artifacts: **%d**\n' "$downloaded"
            printf -- '- Processed downloaded workflows: **%d**\n' "$processed_workflows"
            printf -- '- Rerank invocations: **%d**\n' "$rerank_invocations"
            printf -- '- Unavailable/expired downloads skipped: **%d**\n' "$skipped_downloads"
          } >> "$master_summary"

          cat "$master_summary" >> "$GITHUB_STEP_SUMMARY"

          if (( downloaded == 0 )); then
            echo "::error::No retained regression artifacts were available for reranking."
            exit 1
          fi

      - name: Publish rebuilt derived intelligence
        shell: bash
        env:
          HTH_RESULTS_TOKEN: ${{ secrets.HTH_RESULTS_TOKEN }}
        run: |
          set -euo pipefail
          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C results-repo remote set-url origin \
            "https://x-access-token:${HTH_RESULTS_TOKEN}@github.com/${{ inputs.results_repository }}.git"

          git -C results-repo add calibration-index.json source-documents/
          if git -C results-repo diff --cached --quiet; then
            echo "Historical derived intelligence already matches canonical metrics."
            exit 0
          fi

          git -C results-repo commit -m \
            "Rebuild historical regression metrics from HTH run ${{ github.run_number }}"
          git -C results-repo push origin HEAD:main

      - name: Upload rerank summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: historical-regression-rerank-${{ github.run_id }}
          path: historical-rerank-summary.md
          if-no-files-found: ignore
          retention-days: 14
