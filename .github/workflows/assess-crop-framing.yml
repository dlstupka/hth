name: HTH normalize crop and framing assess

run-name: Assess crop / framing against HTH-GOLDEN-0002

on:
  workflow_dispatch:
    inputs:
      results_repository: {description: "Canonical collection results repository", required: true, default: "dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results", type: string}
      # BEGIN GENERATED RUNNER TARGET INPUT
      runner_target:
        description: "Execution runner target"
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted-linux
          - self-hosted-windows
          - hth
          - rhel8
          - e7k
          - e9k
          - 192t
          - 96t
          - 32t
      # END GENERATED RUNNER TARGET INPUT
      artifact_retention_days:
        description: Days to retain the diagnostic comparison artifact
        required: true
        default: 14
        type: number
  workflow_call:
    inputs:
      results_repository: {required: true, type: string}
      runner_target: {required: true, type: string}
      artifact_retention_days: {required: true, type: number}
      canonical_build_policy: {required: false, type: string, default: auto}
    secrets:
      HTH_RESULTS_TOKEN: {required: true}

permissions:
  contents: read

concurrency:
  group: assess-crop-framing-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GOLDEN_SET_ID: HTH-GOLDEN-0002
  GOLDEN_SET_CONFIG: hth-pipeline/config/golden_sets/HTH-GOLDEN-0002.golden-set.json
  GOLDEN_SET_FREEZE: hth-pipeline/config/golden_sets/HTH-GOLDEN-0002.freeze.json
  GOLDEN_SET_REPOSITORY: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898
  GOLDEN_SET_RELEASE: HTH-GOLDEN-0002
  RESULTS_REPOSITORY: ${{ inputs.results_repository }}

jobs:
  assess-crop-framing:
    name: Compare crop and framing transforms on GS0002
    # BEGIN GENERATED RUNNER TARGET ROUTING
    runs-on: >-
      ${{ inputs.runner_target == 'self-hosted-linux' && fromJSON('["self-hosted","Linux","X64"]')
        || inputs.runner_target == 'self-hosted-windows' && fromJSON('["self-hosted","Windows","X64"]')
        || inputs.runner_target == 'hth' && fromJSON('["self-hosted","Linux","X64","hth"]')
        || inputs.runner_target == 'rhel8' && fromJSON('["self-hosted","Linux","X64","rhel8"]')
        || inputs.runner_target == 'e7k' && fromJSON('["self-hosted","Linux","X64","e7k"]')
        || inputs.runner_target == 'e9k' && fromJSON('["self-hosted","Linux","X64","e9k"]')
        || inputs.runner_target == '192t' && fromJSON('["self-hosted","Linux","X64","192t"]')
        || inputs.runner_target == '96t' && fromJSON('["self-hosted","Linux","X64","96t"]')
        || inputs.runner_target == '32t' && fromJSON('["self-hosted","Linux","X64","32t"]')
        || 'ubuntu-latest' }}
    # END GENERATED RUNNER TARGET ROUTING
    timeout-minutes: 45
    env:
      # BEGIN GENERATED RUNNER SETUP LABEL
      HTH_SELECTED_RUNNER_LABEL: >-
        ${{ inputs.runner_target == 'self-hosted-linux' && 'linux'
          || inputs.runner_target == 'self-hosted-windows' && 'windows'
          || inputs.runner_target == 'hth' && 'hth'
          || inputs.runner_target == 'rhel8' && 'rhel8'
          || inputs.runner_target == 'e7k' && 'e7k'
          || inputs.runner_target == 'e9k' && 'e9k'
          || inputs.runner_target == '192t' && '192t'
          || inputs.runner_target == '96t' && '96t'
          || inputs.runner_target == '32t' && '32t'
          || 'github-hosted' }}
      # END GENERATED RUNNER SETUP LABEL
    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout compact calibration and prior crop/framing evidence
        uses: actions/checkout@v6
        with:
          repository: ${{ env.RESULTS_REPOSITORY }}
          path: results-repo
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            indexes/calibration-index.json
            calibration-index.json
            indexes/parameter-provenance-index.json
            parameter-provenance-index.json
            /source-documents/*/golden-sets/*/*/calibrations/*/*/parameter-provenance.json
            /normalization/crop-framing/
          sparse-checkout-cone-mode: false
          persist-credentials: true
          token: ${{ secrets.HTH_RESULTS_TOKEN || github.token }}

      - name: Set up canonical HTH Python runtime
        uses: ./hth-pipeline/.github/actions/setup-hth-python
        with:
          pipeline-path: hth-pipeline
          runner-label: ${{ env.HTH_SELECTED_RUNNER_LABEL }}

      - name: Resolve Rank #1 approved GS0002 detector
        id: detector
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          calibration_index="results-repo/indexes/calibration-index.json"
          if [[ ! -f "$calibration_index" && -f results-repo/calibration-index.json ]]; then
            calibration_index="results-repo/calibration-index.json"
          fi
          results_ref="$(git -C results-repo rev-parse HEAD)"
          python -m hth.resolve_document_detector \
            --index-only \
            --index "$calibration_index" \
            --golden-set-id "$GOLDEN_SET_ID" \
            --golden-set-freeze-root hth-pipeline/config/golden_sets \
            --catalog hth-pipeline/config/document-detectors.json \
            --pipeline-repository "${{ github.repository }}" \
            --pipeline-commit "${{ github.sha }}" \
            --results-repository "$RESULTS_REPOSITORY" \
            --results-ref "$results_ref" \
            --github-server-url "${{ github.server_url }}" \
            --output "$RUNNER_TEMP/preferred-document-detector.json" \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Assemble crop/framing effective-input contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/crop-framing-effective-inputs"
          rm -rf "$source_root"
          mkdir -p "$source_root"
          cp "$RUNNER_TEMP/preferred-document-detector.json" "$source_root/detector-selection.json"
          cp "$GOLDEN_SET_CONFIG" "$source_root/golden-set.json"
          cp "$GOLDEN_SET_FREEZE" "$source_root/golden-set-freeze.json"
          results_ref="$(git -C results-repo rev-parse HEAD)"
          {
            echo "source_root=$source_root"
            echo "results_ref=$results_ref"
            echo "evidence=results-repo/normalization/crop-framing/canonical-build-evidence.json"
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate crop/framing Canonical Build Evidence
        id: cbe
        shell: bash
        env: {PYTHONPATH: hth-pipeline}
        run: |
          set -euo pipefail
          python -m hth.canonical_build_evidence prepare \
            --scope hth-crop-framing-assessment \
            --policy "${{ inputs.canonical_build_policy || 'auto' }}" \
            --contract-version 1 \
            --mode diagnostic-evidence \
            --operation approved-detector-crop-framing-assessment \
            --repository-root hth-pipeline \
            --source-root "${{ steps.contract.outputs.source_root }}" \
            --source-input ".=${{ steps.contract.outputs.source_root }}" \
            --source-repository "$GOLDEN_SET_REPOSITORY" \
            --source-release "$GOLDEN_SET_RELEASE" \
            --source-manifest-sha256 "${{ steps.detector.outputs.golden_set_sha256 }}" \
            --source-commit "${{ steps.detector.outputs.parameter_identity_sha256 }}" \
            --config "$GOLDEN_SET_CONFIG" \
            --config "$GOLDEN_SET_FREEZE" \
            --implementation hth-pipeline/hth/assess_crop_framing.py \
            --implementation hth-pipeline/hth/resolve_document_detector.py \
            --implementation hth-pipeline/hth/run_document_detector.py \
            --selection "$RUNNER_TEMP/preferred-document-detector.json" \
            --detector-implementation-root hth-pipeline/hth/geometry \
            --runtime-contract hth-pipeline/requirements.txt \
            --runtime-contract hth-pipeline/.github/actions/setup-hth-python/action.yml \
            --runtime-package numpy \
            --runtime-package opencv-python-headless \
            --results-root results-repo \
            --evidence "${{ steps.contract.outputs.evidence }}" \
            --plan "$RUNNER_TEMP/crop-framing-cbe-plan.json" \
            --pipeline-repository "$GITHUB_REPOSITORY" \
            --pipeline-commit "$GITHUB_SHA" \
            --results-repository "$RESULTS_REPOSITORY" \
            --results-ref "${{ steps.contract.outputs.results_ref }}" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --runner-name "$RUNNER_NAME" \
            --runner-environment "${{ runner.environment }}" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Set up approved detector runtime
        if: steps.cbe.outputs.decision == 'execute'
        uses: ./hth-pipeline/.github/actions/setup-hth-managed-runtime
        with:
          pipeline-path: hth-pipeline
          need-doc-ufcn: ${{ steps.detector.outputs.needs_doc_ufcn }}
          verify-abi: "true"

      - name: Materialize immutable GS0002 images
        id: golden_images
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env:
          HTH_SOURCE_TOKEN: ${{ secrets.HTH_SOURCE_TOKEN || github.token }}
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.golden_set_release \
            --repository "$GOLDEN_SET_REPOSITORY" \
            --tag "$GOLDEN_SET_RELEASE" \
            --freeze "$GOLDEN_SET_FREEZE" \
            --destination "$RUNNER_TEMP/golden-set-images" \
            --github-output "$GITHUB_OUTPUT"

      - name: Prepare GS0002 detector inputs
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.assess_crop_framing prepare \
            --golden-set "$GOLDEN_SET_CONFIG" \
            --image-root "${{ steps.golden_images.outputs.image_root }}" \
            --manifest "$RUNNER_TEMP/gs0002-manifest.json" \
            --analysis "$RUNNER_TEMP/gs0002-analysis.json"

      - name: Run approved detector over GS0002
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python hth-pipeline/hth/run_document_detector.py \
            --manifest "$RUNNER_TEMP/gs0002-manifest.json" \
            --analysis "$RUNNER_TEMP/gs0002-analysis.json" \
            --image-root "${{ steps.golden_images.outputs.image_root }}" \
            --output "$RUNNER_TEMP/gs0002-analysis-with-detector.json" \
            --selection "$RUNNER_TEMP/preferred-document-detector.json" \
            --lifecycle-root results-repo \
            --overwrite

      - name: Generate crop and framing assessment
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.assess_crop_framing evaluate \
            --golden-set "$GOLDEN_SET_CONFIG" \
            --image-root "${{ steps.golden_images.outputs.image_root }}" \
            --analysis "$RUNNER_TEMP/gs0002-analysis-with-detector.json" \
            --output crop-framing-assessment \
            --github-summary "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/preferred-document-detector.json" crop-framing-assessment/detector-selection.json
          cp "$RUNNER_TEMP/gs0002-analysis-with-detector.json" crop-framing-assessment/geometry-evidence.json

      - name: Finalize crop/framing Canonical Build Evidence
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env: {PYTHONPATH: hth-pipeline}
        run: |
          set -euo pipefail
          python -m hth.canonical_build_evidence finalize \
            --plan "$RUNNER_TEMP/crop-framing-cbe-plan.json" \
            --output-root crop-framing-assessment \
            --evidence-store "${{ steps.contract.outputs.evidence }}" \
            --evidence-output crop-framing-assessment/canonical-build-evidence.json \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Publish compact crop/framing evidence
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env: {PYTHONPATH: hth-pipeline}
        run: |
          set -euo pipefail
          source hth-pipeline/tools/hardened-persistence.sh
          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          payload="$RUNNER_TEMP/crop-framing-publication"
          incoming="$RUNNER_TEMP/crop-framing-cbe-incoming.json"
          rm -rf "$payload"
          mkdir -p "$payload"
          cp crop-framing-assessment/{assessment.json,detector-selection.json,geometry-evidence.json} "$payload/"
          cp crop-framing-assessment/canonical-build-evidence.json "$incoming"
          apply_crop_framing_evidence() {
            python -m hth.canonical_build_evidence merge \
              --scope hth-crop-framing-assessment \
              --base results-repo/normalization/crop-framing/canonical-build-evidence.json \
              --incoming "$incoming" \
              --output "$payload/canonical-build-evidence.json"
            rm -rf results-repo/normalization/crop-framing
            mkdir -p results-repo/normalization/crop-framing
            cp "$payload"/* results-repo/normalization/crop-framing/
            hth_results_stage results-repo normalization/crop-framing
          }
          hth_hardened_persist results-repo main \
            "Publish crop/framing canonical evidence $GITHUB_RUN_ID" \
            apply_crop_framing_evidence \
            "Crop/framing evidence publication"

      - name: Upload crop and framing assessment
        if: steps.cbe.outputs.decision == 'execute'
        uses: ./hth-pipeline/.github/actions/hardened-upload-artifact
        with:
          name: hth-gs0002-crop-framing-${{ github.run_number }}
          path: crop-framing-assessment
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
          compression-level: 0
