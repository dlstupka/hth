name: HTH preprocess test

on:
  push:
    branches:
      - main
    paths:
      - "hth/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/preprocess-test.yml"
      - ".github/workflows/_core-hth.yml"
      - ".github/actions/setup-hth-python/**"
      - ".github/actions/restore-immutable-release/**"
  pull_request:
    branches:
      - main
    paths:
      - "hth/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/preprocess-test.yml"
      - ".github/workflows/_core-hth.yml"
      - ".github/actions/setup-hth-python/**"
      - ".github/actions/restore-immutable-release/**"
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Source repository owning immutable source Releases"
        required: true
        type: string
        default: "dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898"
      source_release_tag:
        description: "Immutable source Release tag"
        required: true
        type: string
        default: "HTH-SOURCE-0001"
      # BEGIN GENERATED RUNNER TARGET INPUT
      runner_target:
        description: "Execution runner target"
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted-linux
          - self-hosted-windows
          - hth
          - rhel8
          - e7k
          - e9k
          - 192vcpu
          - 96vcpu
          - 32vcpu
      # END GENERATED RUNNER TARGET INPUT
      test_file:
        description: "DOCX filename to process"
        required: true
        type: string
        default: "Baptisms-San-Antonio-Baptism-Records-1788-1824--1858-1898_p91-100.docx"
      image_limit:
        description: "Maximum images to process from the selected DOCX"
        required: true
        type: string
        default: "10"

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'workflow_dispatch'
      && format('manual-{0}', github.run_id)
      || 'automatic'
    }}
  cancel-in-progress: false

jobs:
  preprocess-test:
    uses: ./.github/workflows/_core-hth.yml
    with:
      mode: test
      runner_target: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_target || 'github-hosted' }}
      source_repository: ${{ github.event_name == 'workflow_dispatch' && inputs.source_repository || 'dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898' }}
      source_release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.source_release_tag || 'HTH-SOURCE-0001' }}
      results_repository: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results
      test_file: ${{ inputs.test_file || 'Baptisms-San-Antonio-Baptism-Records-1788-1824--1858-1898_p91-100.docx' }}
      image_limit: ${{ github.event_name == 'workflow_dispatch' && inputs.image_limit || '10' }}
      output_directory: hth-pipeline/build/preprocessed-test
      publish_results: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      upload_full_artifact: true
      artifact_retention_days: 7
      geometry_fail_on: never
      document_detector: preferred
    secrets: inherit
