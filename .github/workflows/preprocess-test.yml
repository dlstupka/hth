name: HTH preprocess test

on:
  push:
    branches:
      - main
    paths:
      - "hth/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "hth/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      runner:
        description: "Execution runner"
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted-hth
          - self-hosted-windows
          - self-hosted-rhel8
          - self-hosted-e7k
          - self-hosted-e9k
      specific_runner:
        description: "Specific self-hosted runner; any keeps the selected runner class"
        required: true
        default: any
        type: choice
        options:
          - any
          - custom
      custom_runner_label:
        description: "Custom self-hosted runner label; used only when Specific self-hosted runner is custom"
        required: false
        default: ""
        type: string
      test_file:
        description: "DOCX filename to process"
        required: true
        type: string
        default: "Baptisms-San-Antonio-Baptism-Records-1788-1824--1858-1898_p91-100.docx"

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'workflow_dispatch'
      && format('manual-{0}', github.run_id)
      || 'automatic'
    }}
  cancel-in-progress: false

jobs:
  preprocess-test:
    uses: ./.github/workflows/_core-hth.yml
    with:
      mode: test
      runner: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'github-hosted' }}
      specific_runner: ${{ github.event_name == 'workflow_dispatch' && inputs.specific_runner || 'any' }}
      custom_runner_label: ${{ github.event_name == 'workflow_dispatch' && inputs.custom_runner_label || '' }}
      source_repository: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898
      source_release_tag: HTH-SOURCE-0001
      results_repository: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results
      test_file: ${{ inputs.test_file || 'Baptisms-San-Antonio-Baptism-Records-1788-1824--1858-1898_p91-100.docx' }}
      output_directory: hth-pipeline/build/preprocessed-test
      publish_results: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      upload_full_artifact: true
      artifact_retention_days: 7
      geometry_fail_on: never
      document_detector: preferred
    secrets: inherit
