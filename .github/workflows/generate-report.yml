name: HTH report

run-name: >-
  Generate ${{ inputs.report }} report for ${{ inputs.golden_release_tag }} on ${{ inputs.runner_target }}

on:
  workflow_dispatch:
    inputs:
      report:
        description: Report to regenerate
        required: true
        default: detector-calibration-manifest
        type: choice
        options:
          - detector-calibration-manifest
          - execution-optimizer
          - full-normalization-summary
      algorithm:
        description: Detector for execution-optimizer report; choose all for the accumulated optimizer summary; ignored by calibration and normalization reports
        required: true
        default: all
        type: choice
        options:
          - all
          - contour
          - contour_quad
          - contour_components
          - contour_projection
          - contour_grabcut
          - grabcut_contour
          - consensus_quad
          - edge_contour
          - cross_edge_contour
          - gradient_vote
          - radial_edge
          - adaptive_radial_edge
          - border_energy
          - components
          - ransac
          - grabcut
          - hough
          - lsd
      results_repository:
        description: Results repository containing persisted intelligence
        required: true
        default: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results
        type: string
      golden_release_tag:
        description: Immutable Golden Set release tag
        required: true
        default: HTH-GOLDEN-0002
        type: choice
        options:
          - HTH-GOLDEN-0001
          - HTH-GOLDEN-0002
      # BEGIN GENERATED RUNNER TARGET INPUT
      runner_target:
        description: "Execution runner target"
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted-linux
          - self-hosted-windows
          - hth
          - rhel8
          - e7k
          - e9k
          - 192t
          - 96t
          - 32t
      # END GENERATED RUNNER TARGET INPUT
permissions:
  contents: read

concurrency:
  group: generate-report-${{ github.ref }}-${{ inputs.report }}-${{ inputs.algorithm }}
  cancel-in-progress: false

jobs:
  report:
    uses: ./.github/workflows/_core-report.yml
    with:
      runner_target: ${{ inputs.runner_target }}
      results_repository: ${{ inputs.results_repository }}
      report_type: ${{ inputs.report }}
      report_algorithm: ${{ inputs.algorithm }}
      report_golden_set: ${{ inputs.golden_release_tag }}
    secrets: inherit
