name: HTH preprocess collection

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Source repository"
        required: true
        type: string
        default: "dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898"
      source_release_tag:
        description: "Immutable source Release tag"
        required: true
        default: HTH-SOURCE-0002
        type: choice
        options:
          - HTH-SOURCE-0001
          - HTH-SOURCE-0002
      results_repository:
        description: "Results repository"
        required: true
        type: string
        default: "dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results"
      # BEGIN GENERATED RUNNER TARGET INPUT
      runner_target:
        description: "Execution runner target"
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted-linux
          - self-hosted-windows
          - hth
          - rhel8
          - e7k
          - e9k
          - 192t
          - 96t
          - 32t
      # END GENERATED RUNNER TARGET INPUT
      upload_full_artifact:
        description: "Upload the complete generated build as a temporary artifact"
        required: true
        type: boolean
        default: false
      canonical_build_policy:
        description: "Canonical Build Evidence policy"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - audit
          - force-verify
          - rebuild

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'workflow_dispatch'
      && format('manual-{0}', github.run_id)
      || 'automatic'
    }}
  cancel-in-progress: false

jobs:
  preprocess:
    uses: ./.github/workflows/_core-hth.yml
    with:
      mode: production
      runner_target: ${{ inputs.runner_target }}
      source_repository: ${{ inputs.source_repository }}
      source_release_tag: ${{ inputs.source_release_tag }}
      results_repository: ${{ inputs.results_repository }}
      output_directory: hth-pipeline/build/preprocessed
      publish_results: true
      upload_full_artifact: ${{ inputs.upload_full_artifact }}
      canonical_build_policy: ${{ inputs.canonical_build_policy }}
      artifact_retention_days: 14
      document_detector: preferred
    secrets: inherit
