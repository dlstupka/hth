name: HTH preprocess collection

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Source repository"
        required: true
        type: string
        default: "dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898"
      results_repository:
        description: "Results repository"
        required: true
        type: string
        default: "dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results"
      runner:
        description: "Execution runner"
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted-hth
          - self-hosted-windows
          - self-hosted-rhel8
          - self-hosted-e7k
          - self-hosted-e9k
      specific_runner:
        description: "Specific self-hosted runner; any keeps the selected runner class"
        required: true
        default: any
        type: choice
        options:
          - any
          - custom
      custom_runner_label:
        description: "Custom self-hosted runner label; used only when Specific self-hosted runner is custom"
        required: false
        default: ""
        type: string
      upload_full_artifact:
        description: "Upload the complete generated build as a temporary artifact"
        required: true
        type: boolean
        default: true
      document_detector:
        description: "Run approved detector over every page for corpus review"
        required: true
        type: choice
        default: none
        options:
          - none
          - amsre_doc_ufcn_fusion

permissions:
  contents: read

concurrency:
  group: preprocess-${{ inputs.source_repository }}
  cancel-in-progress: false

jobs:
  preprocess:
    uses: ./.github/workflows/_core-hth.yml
    with:
      mode: production
      runner: ${{ inputs.runner }}
      specific_runner: ${{ inputs.specific_runner }}
      custom_runner_label: ${{ inputs.custom_runner_label }}
      source_repository: ${{ inputs.source_repository }}
      results_repository: ${{ inputs.results_repository }}
      output_directory: hth-pipeline/build/preprocessed
      publish_results: true
      upload_full_artifact: ${{ inputs.upload_full_artifact }}
      artifact_retention_days: 14
      document_detector: ${{ inputs.document_detector }}
    secrets: inherit
