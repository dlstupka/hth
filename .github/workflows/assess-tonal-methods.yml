name: HTH normalize tonal method assessment
run-name: Compare bounded contrast and tonal normalization methods
on:
  workflow_dispatch:
    inputs:
      # BEGIN GENERATED RUNNER TARGET INPUT
      runner_target:
        description: "Execution runner target"
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted-linux
          - self-hosted-windows
          - hth
          - rhel8
          - e7k
          - e9k
          - 192t
          - 96t
          - 32t
      # END GENERATED RUNNER TARGET INPUT
      artifact_retention_days: {description: "Days to retain compact evidence", required: true, default: 14, type: number}
jobs:
  compare:
    uses: ./.github/workflows/_core-tonal-evidence.yml
    with:
      stage: compare
      runner_target: ${{ inputs.runner_target }}
      artifact_retention_days: ${{ fromJSON(format('{0}', inputs.artifact_retention_days)) }}
    secrets: inherit
