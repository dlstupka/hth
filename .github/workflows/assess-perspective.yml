name: _HTH normalize perspective assess (internal)

run-name: Assess perspective correction against canonical HTH-0001 normalization

on:
  workflow_call:
    inputs:
      results_repository: {required: true, type: string}
      runner_target: {required: true, type: string}
      artifact_retention_days: {required: true, type: number}
      canonical_build_policy: {required: false, type: string, default: auto}
    secrets:
      HTH_RESULTS_TOKEN: {required: true}
      HTH_SOURCE_TOKEN: {required: false}

permissions:
  contents: read

concurrency:
  group: assess-perspective-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  RESULTS_REPOSITORY: ${{ inputs.results_repository }}
  GOLDEN_SET_CONFIG: hth-pipeline/config/golden_sets/HTH-GOLDEN-0002.golden-set.json
  ASSESSMENT_CONFIG: hth-pipeline/config/perspective-assessment.json

jobs:
  assess-perspective:
    name: Measure projective convergence and prepare a skip/apply recommendation
    # BEGIN GENERATED RUNNER TARGET ROUTING
    runs-on: >-
      ${{ inputs.runner_target == 'self-hosted-linux' && fromJSON('["self-hosted","Linux","X64"]')
        || inputs.runner_target == 'self-hosted-windows' && fromJSON('["self-hosted","Windows","X64"]')
        || inputs.runner_target == 'hth' && fromJSON('["self-hosted","Linux","X64","hth"]')
        || inputs.runner_target == 'rhel8' && fromJSON('["self-hosted","Linux","X64","rhel8"]')
        || inputs.runner_target == 'e7k' && fromJSON('["self-hosted","Linux","X64","e7k"]')
        || inputs.runner_target == 'e9k' && fromJSON('["self-hosted","Linux","X64","e9k"]')
        || inputs.runner_target == '192vcpu' && fromJSON('["self-hosted","Linux","X64","192vcpu"]')
        || inputs.runner_target == '96vcpu' && fromJSON('["self-hosted","Linux","X64","96vcpu"]')
        || inputs.runner_target == '32vcpu' && fromJSON('["self-hosted","Linux","X64","32vcpu"]')
        || 'ubuntu-latest' }}
    # END GENERATED RUNNER TARGET ROUTING
    timeout-minutes: 45
    env:
      # BEGIN GENERATED RUNNER SETUP LABEL
      HTH_SELECTED_RUNNER_LABEL: >-
        ${{ inputs.runner_target == 'self-hosted-linux' && 'linux'
          || inputs.runner_target == 'self-hosted-windows' && 'windows'
          || inputs.runner_target == 'hth' && 'hth'
          || inputs.runner_target == 'rhel8' && 'rhel8'
          || inputs.runner_target == 'e7k' && 'e7k'
          || inputs.runner_target == 'e9k' && 'e9k'
          || inputs.runner_target == '192vcpu' && '192vcpu'
          || inputs.runner_target == '96vcpu' && '96vcpu'
          || inputs.runner_target == '32vcpu' && '32vcpu'
          || 'github-hosted' }}
      # END GENERATED RUNNER SETUP LABEL
    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical normalization evidence
        uses: ./hth-pipeline/.github/actions/checkout-results
        with:
          repository: ${{ env.RESULTS_REPOSITORY }}
          path: results-repo
          ref: main
          token: ${{ secrets.HTH_RESULTS_TOKEN || github.token }}
          fetch-depth: 1
          sparse-checkout: |
            /metadata/canonical-build-evidence.json
            /metadata/image_manifest.json
            /normalization/canonical-build-evidence.json
            /normalization/normalization-manifest.json
            /normalization/perspective/
            /cbe-cache/hth-perspective-assessment/
            /normalization/perspective-policy.json
          sparse-checkout-cone-mode: false
          persist-credentials: true

      - name: Set up canonical HTH Python runtime
        uses: ./hth-pipeline/.github/actions/setup-hth-python
        with:
          pipeline-path: hth-pipeline
          runner-label: ${{ env.HTH_SELECTED_RUNNER_LABEL }}

      - name: Validate canonical normalization and resolve source provenance
        id: provenance
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          import os
          from pathlib import Path
          from hth.canonical_build_evidence import NORMALIZATION_SCOPE, load_evidence_store, validate_published_results

          results = Path("results-repo")
          store = load_evidence_store(results / "normalization/canonical-build-evidence.json", scope=NORMALIZATION_SCOPE)
          identity = str(store.get("authoritative_identity") or "")
          record = (store.get("records") or {}).get(identity)
          if not identity or not isinstance(record, dict):
              raise SystemExit("Canonical normalization evidence has no authoritative record")
          validate_published_results(record, results)
          preprocess_store = json.loads((results / "metadata/canonical-build-evidence.json").read_text(encoding="utf-8"))
          preprocess = (preprocess_store.get("records") or {}).get(preprocess_store.get("authoritative_identity"))
          if not isinstance(preprocess, dict):
              raise SystemExit("Canonical preprocess evidence has no authoritative record")
          source = (preprocess.get("effective_inputs") or {}).get("source") or {}
          if not source.get("repository") or not source.get("release") or len(str(source.get("release_manifest_sha256") or "")) != 64:
              raise SystemExit("Canonical preprocess evidence has incomplete source provenance")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"normalization_effective_identity={identity}\n")
              handle.write(f"normalization_result_identity={record['canonical_result']['identity']}\n")
              handle.write(f"source_repository={source['repository']}\n")
              handle.write(f"source_release={source['release']}\n")
              handle.write(f"source_manifest_sha256={source['release_manifest_sha256']}\n")
          PY

      - name: Select stratified perspective sample
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.assess_orientation_deskew prepare \
            --normalization-manifest results-repo/normalization/normalization-manifest.json \
            --config "$ASSESSMENT_CONFIG" \
            --golden-set "$GOLDEN_SET_CONFIG" \
            --output "$RUNNER_TEMP/perspective-sample.json"

      - name: Assemble perspective effective-input contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/perspective-effective-inputs"
          rm -rf "$source_root"
          mkdir -p "$source_root"
          cp results-repo/normalization/normalization-manifest.json "$source_root/"
          cp results-repo/metadata/image_manifest.json "$source_root/"
          cp "$RUNNER_TEMP/perspective-sample.json" "$source_root/sample-plan.json"
          echo "source_root=$source_root" >> "$GITHUB_OUTPUT"
          echo "results_ref=$(git -C results-repo rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Evaluate perspective Canonical Build Evidence
        id: cbe
        shell: bash
        env: {PYTHONPATH: hth-pipeline}
        run: |
          set -euo pipefail
          python -m hth.canonical_build_evidence prepare \
            --scope hth-perspective-assessment \
            --policy "${{ inputs.canonical_build_policy || 'auto' }}" \
            --contract-version 1 \
            --mode diagnostic-evidence \
            --operation residual-perspective-assessment \
            --repository-root hth-pipeline \
            --source-root "${{ steps.contract.outputs.source_root }}" \
            --source-input ".=${{ steps.contract.outputs.source_root }}" \
            --source-repository "$RESULTS_REPOSITORY" \
            --source-release "${{ steps.provenance.outputs.normalization_effective_identity }}" \
            --source-manifest-sha256 "${{ steps.provenance.outputs.normalization_result_identity }}" \
            --source-commit "${{ steps.provenance.outputs.normalization_result_identity }}" \
            --config "$ASSESSMENT_CONFIG" \
            --config "$GOLDEN_SET_CONFIG" \
            --implementation hth-pipeline/hth/assess_perspective.py \
            --implementation hth-pipeline/hth/assess_orientation_deskew.py \
            --runtime-contract hth-pipeline/requirements.txt \
            --runtime-contract hth-pipeline/.github/actions/setup-hth-python/action.yml \
            --runtime-package numpy \
            --runtime-package opencv-python-headless \
            --results-root results-repo \
            --evidence results-repo/normalization/perspective/canonical-build-evidence.json \
            --plan "$RUNNER_TEMP/perspective-cbe-plan.json" \
            --pipeline-repository "$GITHUB_REPOSITORY" \
            --pipeline-commit "$GITHUB_SHA" \
            --results-repository "$RESULTS_REPOSITORY" \
            --results-ref "${{ steps.contract.outputs.results_ref }}" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --runner-name "$RUNNER_NAME" \
            --runner-environment "${{ runner.environment }}" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Restore verified perspective variant
        if: steps.cbe.outputs.decision == 'restore'
        shell: bash
        env: {PYTHONPATH: hth-pipeline}
        run: |
          set -euo pipefail; source hth-pipeline/tools/hardened-persistence.sh
          git -C results-repo config user.name "github-actions[bot]"; git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          restore_variant() {
            python -m hth.canonical_build_evidence snapshot --scope hth-perspective-assessment --source-root results-repo --cache-root results-repo --evidence results-repo/normalization/perspective/canonical-build-evidence.json
            python -m hth.canonical_build_evidence restore --plan "$RUNNER_TEMP/perspective-cbe-plan.json" --results-root results-repo --github-summary "$GITHUB_STEP_SUMMARY"
            hth_results_stage results-repo normalization/perspective normalization/perspective-policy.json cbe-cache/hth-perspective-assessment
          }
          hth_hardened_persist results-repo main "Restore perspective variant" restore_variant "Perspective variant restore"

      - name: Download immutable source release
        id: source_release
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env:
          HTH_SOURCE_TOKEN: ${{ secrets.HTH_SOURCE_TOKEN || github.token }}
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          rm -rf source-repo
          python -m hth.source_release \
            --repository "${{ steps.provenance.outputs.source_repository }}" \
            --tag "${{ steps.provenance.outputs.source_release }}" \
            --destination source-repo \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify immutable source release
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.source_release.outputs.manifest_sha256 }}" == "${{ steps.provenance.outputs.source_manifest_sha256 }}" ]]

      - name: Reconstruct and prove sampled canonical normalized pages
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/perspective-materialized"
          python -m hth.assess_orientation_deskew materialize \
            --source-root source-repo/images \
            --canonical-image-manifest results-repo/metadata/image_manifest.json \
            --normalization-manifest results-repo/normalization/normalization-manifest.json \
            --sample-plan "$RUNNER_TEMP/perspective-sample.json" \
            --output "$RUNNER_TEMP/perspective-materialized"

      - name: Measure independent perspective evidence
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          rm -rf perspective-assessment
          python -m hth.assess_perspective evaluate \
            --image-root "$RUNNER_TEMP/perspective-materialized/normalized" \
            --normalization-manifest results-repo/normalization/normalization-manifest.json \
            --sample-plan "$RUNNER_TEMP/perspective-sample.json" \
            --config "$ASSESSMENT_CONFIG" \
            --output perspective-assessment \
            --github-summary "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/perspective-sample.json" perspective-assessment/sample-plan.json
          cp "$RUNNER_TEMP/perspective-materialized/materialization-evidence.json" perspective-assessment/materialization-evidence.json

      - name: Prepare perspective skip/apply recommendation
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.assess_perspective recommend \
            --assessment perspective-assessment/assessment.json \
            --output perspective-assessment/perspective-policy.json \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Finalize perspective Canonical Build Evidence
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env: {PYTHONPATH: hth-pipeline}
        run: |
          set -euo pipefail
          python -m hth.canonical_build_evidence finalize \
            --plan "$RUNNER_TEMP/perspective-cbe-plan.json" \
            --output-root perspective-assessment \
            --evidence-store results-repo/normalization/perspective/canonical-build-evidence.json \
            --evidence-output perspective-assessment/canonical-build-evidence.json \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Preserve compact perspective evidence
        id: publish
        if: steps.cbe.outputs.decision == 'execute'
        shell: bash
        env: {PYTHONPATH: hth-pipeline}
        run: |
          set -euo pipefail
          source hth-pipeline/tools/hardened-persistence.sh
          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          payload="$RUNNER_TEMP/hth-perspective-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$payload"
          mkdir -p "$payload"
          cp perspective-assessment/{assessment.json,sample-plan.json,materialization-evidence.json,recommendation.md,perspective-policy.json} "$payload/"
          cp perspective-assessment/canonical-build-evidence.json "$RUNNER_TEMP/perspective-cbe-incoming.json"

          apply_perspective_assessment() {
            python -m hth.canonical_build_evidence snapshot --scope hth-perspective-assessment --source-root results-repo --cache-root results-repo --evidence results-repo/normalization/perspective/canonical-build-evidence.json
            python -m hth.canonical_build_evidence merge \
              --scope hth-perspective-assessment \
              --base results-repo/normalization/perspective/canonical-build-evidence.json \
              --incoming "$RUNNER_TEMP/perspective-cbe-incoming.json" \
              --output "$payload/canonical-build-evidence.json"
            rm -rf results-repo/normalization/perspective
            mkdir -p results-repo/normalization/perspective
            cp "$payload"/* results-repo/normalization/perspective/
            cp "$payload/perspective-policy.json" results-repo/normalization/perspective-policy.json
            python -m hth.canonical_build_evidence snapshot --scope hth-perspective-assessment --source-root results-repo --cache-root results-repo --evidence results-repo/normalization/perspective/canonical-build-evidence.json
            hth_results_stage results-repo normalization/perspective normalization/perspective-policy.json cbe-cache/hth-perspective-assessment
          }
          hth_hardened_persist results-repo main \
            "Publish perspective assessment ${{ github.run_id }}" \
            apply_perspective_assessment \
            "Perspective assessment publication"
          echo "results_commit=$HTH_PERSIST_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Upload perspective assessment
        if: steps.cbe.outputs.decision == 'execute'
        uses: ./hth-pipeline/.github/actions/hardened-upload-artifact
        with:
          name: hth-perspective-assessment-${{ github.run_number }}
          path: perspective-assessment
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
          compression-level: 6
