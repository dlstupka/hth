name: HTH normalize GS0002

run-name: Normalize HTH-GOLDEN-0002 with canonical preprocess evidence

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Execution runner
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted-hth
          - self-hosted-windows
          - self-hosted-rhel8
          - self-hosted-e7k
          - self-hosted-e9k
      specific_runner:
        description: "Specific self-hosted runner; any keeps the selected runner class"
        required: true
        default: any
        type: choice
        options:
          - any
          - custom
      custom_runner_label:
        description: "Custom self-hosted runner label; used only when Specific self-hosted runner is custom"
        required: false
        default: ""
        type: string
      artifact_retention_days:
        description: Days to retain the normalized GS0002 review artifact
        required: true
        default: 14
        type: number
      normalization_recipe:
        description: "Apply the prepared recommendation, or crop only without resampling"
        required: true
        default: prepared-recommendation
        type: choice
        options:
          - prepared-recommendation
          - axis-aligned-only

permissions:
  contents: read

concurrency:
  group: normalize-gs0002-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GOLDEN_SET_CONFIG: hth-pipeline/config/golden_sets/HTH-GOLDEN-0002.golden-set.json
  GOLDEN_SET_FREEZE: hth-pipeline/config/golden_sets/HTH-GOLDEN-0002.freeze.json
  GOLDEN_SET_REPOSITORY: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898
  GOLDEN_SET_RELEASE: HTH-GOLDEN-0002
  RESULTS_REPOSITORY: dlstupka/hth-baptisms-san-antonio-1788-1824--1858-1898-results

jobs:
  normalize:
    name: Normalize GS0002 from canonical preprocess evidence
    runs-on: >-
      ${{    inputs.specific_runner == 'custom' && inputs.custom_runner_label != '' && fromJSON(format('["self-hosted","{0}"]', inputs.custom_runner_label))
          || inputs.runner == 'self-hosted-windows' && fromJSON('["self-hosted","Windows","X64"]')
          || inputs.runner == 'self-hosted-hth'     && fromJSON('["self-hosted","Linux","X64","hth"]')
          || inputs.runner == 'self-hosted-rhel8'   && fromJSON('["self-hosted","Linux","X64","rhel8"]')
          || inputs.runner == 'self-hosted-e7k'     && fromJSON('["self-hosted","Linux","X64","e7k"]')
          || inputs.runner == 'self-hosted-e9k'     && fromJSON('["self-hosted","Linux","X64","e9k"]')
          || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      HTH_SELECTED_RUNNER_LABEL: >-
        ${{  inputs.specific_runner == 'custom' && inputs.custom_runner_label != '' && inputs.custom_runner_label
          || inputs.runner == 'self-hosted-hth' && 'hth'
          || inputs.runner == 'self-hosted-rhel8' && 'rhel8'
          || inputs.runner == 'self-hosted-e7k' && 'e7k'
          || inputs.runner == 'self-hosted-e9k' && 'e9k'
          || inputs.runner == 'self-hosted-windows' && 'windows'
          || 'github-hosted' }}
    steps:
      - name: Checkout HTH pipeline
        uses: actions/checkout@v6
        with:
          path: hth-pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical preprocess evidence
        uses: actions/checkout@v6
        with:
          repository: ${{ env.RESULTS_REPOSITORY }}
          path: results-repo
          fetch-depth: 1
          sparse-checkout: |
            metadata/canonical-build-evidence.json
            metadata/image_manifest.json
            metadata/exact_duplicates.json
            reports/preprocess-summary.json
            analysis/page-analysis.json
            analysis/analysis-summary.json
            normalization/orientation-deskew-policy.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
          token: ${{ secrets.HTH_RESULTS_TOKEN || github.token }}

      - name: Set up canonical HTH Python runtime
        uses: ./hth-pipeline/.github/actions/setup-hth-python
        with:
          pipeline-path: hth-pipeline
          runner-label: ${{ env.HTH_SELECTED_RUNNER_LABEL }}

      - name: Materialize immutable GS0002 images
        id: golden_images
        shell: bash
        env:
          HTH_SOURCE_TOKEN: ${{ secrets.HTH_SOURCE_TOKEN || github.token }}
          PYTHONPATH: hth-pipeline
        run: |
          set -euo pipefail
          python -m hth.golden_set_release \
            --repository "$GOLDEN_SET_REPOSITORY" \
            --tag "$GOLDEN_SET_RELEASE" \
            --freeze "$GOLDEN_SET_FREEZE" \
            --destination "$RUNNER_TEMP/golden-set-images" \
            --github-output "$GITHUB_OUTPUT"

      - name: Normalize GS0002 with the selected recipe
        shell: bash
        env:
          PYTHONPATH: hth-pipeline
          NORMALIZATION_RECIPE: ${{ inputs.normalization_recipe }}
        run: |
          set -euo pipefail
          transform_args=()
          if [[ "$NORMALIZATION_RECIPE" == "prepared-recommendation" ]]; then
            policy="results-repo/normalization/orientation-deskew-policy.json"
            if [[ ! -f "$policy" ]]; then
              echo "::error::No prepared normalization recommendation exists. Run 'HTH prepare normalization recommendation' first, or choose axis-aligned-only."
              exit 1
            fi
            transform_args+=(--transform-policy "$policy")
            printf '## Normalization recipe\n\nValidating the prepared recommendation on the approved Golden Set pages.\n\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Normalization recipe\n\nValidating axis-aligned framing only; no page will be resampled.\n\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          python -m hth.normalize_document_images \
            --golden-set "$GOLDEN_SET_CONFIG" \
            --image-root "${{ steps.golden_images.outputs.image_root }}" \
            --results-root results-repo \
            --output normalized-gs0002 \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            "${transform_args[@]}"

      - name: Upload normalized GS0002 review artifact
        uses: ./hth-pipeline/.github/actions/hardened-upload-artifact
        with:
          name: hth-gs0002-normalized-${{ github.run_number }}
          path: normalized-gs0002
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
          compression-level: 0
