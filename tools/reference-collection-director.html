<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTH Reference Collection Director</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#101318;color:#e7edf5}*{box-sizing:border-box}body{margin:0}header{padding:12px 16px;border-bottom:1px solid #394653;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:19px;margin:0}.sub{color:#aab7c5;font-size:12px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,.file{color:#e7edf5;background:#202731;border:1px solid #465362;border-radius:6px;padding:8px 11px;cursor:pointer}.file input{display:none}.tabs{display:flex;gap:8px;padding:8px 12px;background:#171d25;border-bottom:1px solid #394653}.tabs button[aria-selected=true]{background:#1260a8;border-color:#58a6ff}.frame{width:100%;height:calc(100vh - 132px);border:0;display:block}.frame[hidden]{display:none}.note{padding:6px 12px;background:#1d2630;color:#c5d0dc;font-size:12px}
</style>
</head>
<body>
<header>
  <div><h1>HTH Reference Collection Director</h1><div class="sub">Detector geometry and layout truth are reviewed separately. GS0002 loads as the default in both tabs.</div></div>
  <div class="tools"><label class="file">Open shared image workspace<input id="workspace" type="file" webkitdirectory multiple></label><span id="workspaceStatus" class="sub">Images not selected</span></div>
</header>
<div class="tabs" role="tablist" aria-label="Reference editors">
  <button id="detectorTab" role="tab" aria-selected="true" aria-controls="detectorFrame">Detector Golden Set</button>
  <button id="layoutTab" role="tab" aria-selected="false" aria-controls="layoutFrame">Layout Golden Set</button>
</div>
<div class="note">Select a source-image folder once here, or use either editor directly. Each tab has its own Golden Set selector, review state, and export.</div>
<iframe id="detectorFrame" class="frame" title="Detector Golden Set editor" src="reference-collection-editor.html"></iframe>
<iframe id="layoutFrame" class="frame" title="Layout Golden Set editor" src="reference-collection-layout.html" hidden></iframe>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let files=[];
function send(frame){if(files.length&&frame.contentWindow)frame.contentWindow.postMessage({type:'HTH_REFERENCE_WORKSPACE',files},'*')}
function tab(which){const detector=which==='detector';$('detectorFrame').hidden=!detector;$('layoutFrame').hidden=detector;$('detectorTab').setAttribute('aria-selected',String(detector));$('layoutTab').setAttribute('aria-selected',String(!detector))}
$('detectorTab').onclick=()=>tab('detector');$('layoutTab').onclick=()=>tab('layout');
$('workspace').onchange=e=>{files=[...e.target.files];$('workspaceStatus').textContent=`${files.length} files selected`;send($('detectorFrame'));send($('layoutFrame'))};
$('detectorFrame').onload=()=>send($('detectorFrame'));$('layoutFrame').onload=()=>send($('layoutFrame'));
})();
</script>
</body>
</html>
